<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blind Spec Review</title>
<style>
  :root { --bg:#f7f7f5; --panel:#fff; --text:#1d1d1b; --muted:#6b6b66; --line:#e2e1dc; --accent:#3b5bdb; --done:#2f9e44; --chip:#eef0f7; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161615; --panel:#1f1f1d; --text:#ececea; --muted:#9a9a94; --line:#33332f; --accent:#7b93ff; --done:#51cf66; --chip:#2a2c36; } }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.55 system-ui, sans-serif; background:var(--bg); color:var(--text); }
  .app { display:grid; grid-template-columns: 200px 1fr; min-height:100vh; }
  nav { border-right:1px solid var(--line); padding:16px; background:var(--panel); overflow-y:auto; }
  nav h1 { font-size:15px; margin:0 0 4px; }
  nav p { color:var(--muted); font-size:13px; margin:0 0 16px; }
  nav h2 { font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:16px 0 6px; }
  nav button { display:flex; justify-content:space-between; width:100%; padding:6px 10px; margin:2px 0; border:1px solid transparent; border-radius:6px; background:none; color:inherit; font:inherit; cursor:pointer; text-align:left; }
  nav button:hover { border-color:var(--line); }
  nav button.active { border-color:var(--accent); }
  nav .tick { color:var(--done); font-weight:600; }
  main { padding:24px; min-width:0; display:grid; grid-template-columns: minmax(0, 1fr) 320px; gap:24px; align-items:start; }
  .idea { color:var(--muted); margin:4px 0 16px; }
  .spec { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:20px 24px; }
  .spec h2 { margin:0 0 2px; font-size:22px; }
  .spec .oneliner { color:var(--muted); margin:0 0 12px; font-size:16px; }
  .spec h3 { font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:20px 0 6px; }
  .spec p { margin:0; }
  .chips span { display:inline-block; background:var(--chip); border-radius:999px; padding:2px 10px; margin:0 6px 6px 0; font-size:13px; }
  .spec ol, .spec ul { margin:0; padding-left:22px; }
  .spec li { margin:3px 0; }
  .screen { border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin:8px 0; }
  .screen strong { display:block; }
  pre.raw { white-space:pre-wrap; margin:0; }
  aside { position:sticky; top:24px; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px 18px; }
  aside h2 { font-size:15px; margin:0 0 12px; }
  fieldset { border:0; padding:0; margin:0 0 16px; }
  legend { font-weight:600; margin-bottom:6px; padding:0; }
  .opts label { display:inline-flex; align-items:center; gap:4px; margin-right:12px; cursor:pointer; }
  textarea { width:100%; min-height:90px; padding:8px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:inherit; font:inherit; }
  .row { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .btn { padding:6px 14px; border-radius:6px; border:1px solid var(--line); background:var(--panel); color:inherit; font:inherit; cursor:pointer; }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn:disabled { opacity:.5; cursor:default; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } aside { position:static; } }
  @media (max-width: 640px) { .app { grid-template-columns: 1fr; } nav { border-right:0; border-bottom:1px solid var(--line); } main { padding:16px; } .spec { padding:16px; } }
</style>
</head>
<body>
<div class="app">
  <nav>
    <h1>Blind spec review</h1>
    <p id="progress"></p>
    <div id="list"></div>
    <div class="row"><button class="btn" id="export">Export rubric CSV</button></div>
  </nav>
  <main>
    <section>
      <h1 id="title" style="margin:0"></h1>
      <p class="idea" id="idea"></p>
      <article class="spec" id="spec"></article>
    </section>
    <aside>
      <h2>Rubric</h2>
      <fieldset><legend>Are the screens specific to the idea?</legend><div class="opts" data-q="screens"></div></fieldset>
      <fieldset><legend>Does the out-of-scope list make sense?</legend><div class="opts" data-q="outOfScope"></div></fieldset>
      <fieldset><legend>Would you approve it without major edits?</legend><div class="opts" data-q="approve"></div></fieldset>
      <textarea id="notes" placeholder="Notes"></textarea>
      <div class="row">
        <button class="btn" id="prev">Previous</button>
        <button class="btn primary" id="next">Next</button>
      </div>
    </aside>
  </main>
</div>
<script id="specs" type="application/json">[{"label":"A","ideaId":1,"idea":"A dashboard that helps PMs re-orient when switching between projects, showing the last decision made, blockers, and who's waiting on what.","spec":{"productName":"Context","oneLiner":"A dashboard that helps PMs re-orient when switching between projects, showing the last decision made, blockers, and who's waiting on what.","problem":"PMs lose critical context when juggling multiple projects, wasting time on re-onboarding themselves to each project's status, decisions, and dependencies.","targetUser":"Product managers managing 2+ concurrent projects","tone":"clear, efficient, focused","platform":"web","coreFlow":["User logs in and sees dashboard with all active projects","User selects a project to view its context snapshot","User reviews last decision, current blockers, and pending dependencies","User navigates back to dashboard or drills into deeper project details"],"screens":[{"name":"Dashboard","purpose":"Show all active projects with quick-glance status indicators and last updated timestamps"},{"name":"Project Context View","purpose":"Display the last major decision, active blockers, and list of people/teams waiting on this PM"},{"name":"Blocker Details","purpose":"Deep dive into a specific blocker with owner, timeline, and resolution path"},{"name":"Dependency Map","purpose":"Visualize who is waiting on what decisions or deliverables from this project"}],"outOfScope":["Project planning or roadmap management","Real-time collaboration or commenting","Time tracking or project accounting","Integration with every project management tool (initial launch supports 2-3 platforms)"]}},{"label":"B","ideaId":1,"idea":"A dashboard that helps PMs re-orient when switching between projects, showing the last decision made, blockers, and who's waiting on what.","spec":{"productName":"Resume","oneLiner":"A re-entry dashboard that tells PMs exactly where each project stands the moment they switch back to it .g. Jira, Asana) for auto-pulling status data","Automated scheduling or sending of updates on a recurring basis","Support for languages other than English at launch"]}},{"label":"F","ideaId":2,"idea":"A tool that turns rough status bullets into a clean update, one version for execs and one for the team.","spec":{"productName":"TwoTakes","oneLiner":"Turns messy status bullets into two polished updates—one for execs, one for the team.","problem":"People writing status updates either send the same raw, jargon-heavy bullets to everyone or waste time manually rewriting the same update twice for different audiences with different needs for detail and tone.","targetUser":"Project managers, team leads, and individual contributors who regularly report progress to both leadership and their immediate team.","tone":"professional, crisp, trustworthy","platform":"web","coreFlow":["User pastes or types rough status bullets into a single input box","User optionally adds context (project name, audience notes, key highlights)","Tool generates two versions: a concise exec summary and a detailed team update","User reviews both versions side-by-side and edits inline as needed","User copies, exports, or downloads the finalized versions"],"screens":[{"name":"Input","purpose":"Capture rough bullets and optional context before generation"},{"name":"Generating","purpose":"Show progress while the two versions are being created"},{"name":"Dual Editor","purpose":"Display exec and team versions side-by-side for review and editing"},{"name":"History","purpose":"Browse and reuse past status updates"},{"name":"Settings","purpose":"Adjust default tone, length, and export preferences"}],"outOfScope":["Real-time multi-user collaborative editing","Direct send integrations with Slack, email, or Teams","Automated data pulls from Jira, Asana, or other PM tools","Native mobile app","Recurring update scheduling and reminders"]}},{"label":"G","ideaId":2,"idea":"A tool that turns rough status bullets into a clean update, one version for execs and one for the team.","spec":{"productName":"StatusDual","oneLiner":"Transform rough status bullets into polished updates—automatically generate executive and team versions.","problem":"Team leads waste time rewriting status updates in different voices and detail levels for different audiences, leading to inconsistent messaging or context loss.","targetUser":"Engineering managers, product managers, and team leads who report to both executives and individual contributors.","tone":"clear, efficient, professional","platform":"web","coreFlow":["Paste rough status bullets into editor","AI analyzes and segments content by audience relevance","System generates executive summary (high-level, metrics-focused)","System generates team version (detailed, context-rich, action-oriented)","User reviews, edits, and approves both versions","Export or copy to clipboard"],"screens":[{"name":"Input Editor","purpose":"Paste raw status bullets and optional context (project name, dates, priorities)"},{"name":"Dual Preview","purpose":"Side-by-side view of executive and team versions with real-time generation"},{"name":"Edit & Refine","purpose":"Tone sliders and manual editing controls for each version independently"},{"name":"Export","purpose":"Copy, download, or send versions to email/Slack"},{"name":"History","purpose":"Save and retrieve past status updates for reuse or reference"}],"outOfScope":["Direct Slack/Teams integration for sending","Multi-language support","Calendar-based scheduling of updates","Team collaboration or commenting on drafts","Analytics on update performance or engagement"]}},{"label":"H","ideaId":2,"idea":"A tool that turns rough status bullets into a clean update, one version for execs and one for the team.","spec":{"productName":"StatusSplit","oneLiner":"Transform raw status bullets into polished updates tailored for executives and teams","problem":"Professionals waste time rewriting status updates in different tones and detail  leads, and project coordinators who need to maintain institutional memory of decisions across their teams.","tone":"Clear, professional, methodical","platform":"web","coreFlow":["User creates a new decision entry with title and context","User documents the decision rationale and key factors considered","User logs the decision date and stakeholders involved","User can view all decisions in a chronological or searchable log","User can reference past decisions to understand historical context"],"screens":[{"name":"Decision List","purpose":"Display all logged decisions chronologically with filters by date, status, or topic for quick reference"},{"name":"Create Decision","purpose":"Form to capture decision title, rationale, alternatives considered, stakeholders, and decision date"},{"name":"Decision Detail","purpose":"Full view of a single decision showing all context, outcomes, and related decisions"},{"name":"Search & Filter","purpose":"Allow users to find decisions by keyword, date range, or decision owner"},{"name":"Dashboard","purpose":"High-level overview showing recent decisions, decision trends, and quick stats"}],"outOfScope":["Real-time collaboration or live editing","Integration with external tools (Slack, Jira, etc.)","AI-powered decision suggestions or analysis","Permission management and role-based access control","Mobile app"]}},{"label":"J","ideaId":3,"idea":"A decision log that tracks what was decided, why, and when.","spec":{"productName":"Decidely","oneLiner":"A shared log for capturing what was decided, why, and when—so teams stop relitigating the past.","problem":"Teams make important decisions in scattered Slack threads, meetings, and docs, then forget the reasoning behind them. This leads to repeated debates, lost context when people leave or join, and no clear record of accountability or timing for key choices.","targetUser":"Team leads, product managers, and founders at startups or fast-moving teams who need a lightweight system of record for de "Display who owes whom and simplified payment instructions to settle debts"},{"name":"Participant Management","purpose":"Add, remove, or manage trip participants and their contact info"}],"outOfScope":["Payment processing or money transfers","Mobile app version","Integration with banking systems","Multi-currency conversion","Recurring or subscription expenses","Complex tax calculations"]}}]</script>
<script>
const specs = JSON.parse(document.getElementById("specs").textContent);
const STORE = "blind-spec-review";
const OPTIONS = { screens: ["Yes", "Partly", "No"], outOfScope: ["Yes", "Partly", "No"], approve: ["Yes", "No"] };
const QUESTIONS = Object.keys(OPTIONS);
let answers = {};
try { answers = JSON.parse(localStorage.getItem(STORE)) || {}; } catch (e) {}
let index = 0;

function save() { try { localStorage.setItem(STORE, JSON.stringify(answers)); } catch (e) {} }
function done(label) { const a = answers[label] || {}; return QUESTIONS.every((q) => a[q]); }
function el(tag, attrs, children) {
  const node = document.createElement(tag);
  Object.assign(node, attrs || {});
  for (const child of [].concat(children || [])) node.append(child);
  return node;
}
function section(title, body) { return [el("h3", { textContent: title }), body]; }
function text(value) { return value === undefined || value === null || value === "" ? "(not given)" : String(value); }
function list(tag, items) { return el(tag, {}, (Array.isArray(items) ? items : []).map((item) => el("li", { textContent: text(item) }))); }

function renderSpec(entry) {
  const box = document.getElementById("spec");
  box.replaceChildren();
  if (entry.raw !== undefined) {
    box.append(el("p", { textContent: "This spec didn't parse as JSON. Raw output:" }), el("pre", { className: "raw", textContent: entry.raw }));
    return;
  }
  const s = entry.spec;
  const chips = el("div", { className: "chips" }, [
    el("span", { textContent: "Tone: " + text(s.tone) }),
    el("span", { textContent: "Platform: " + text(s.platform) }),
  ]);
  const screens = el("div", {}, (Array.isArray(s.screens) ? s.screens : []).map((sc) =>
    el("div", { className: "screen" }, [el("strong", { textContent: text(sc && sc.name) }), el("span", { textContent: text(sc && sc.purpose) })])));
  box.append(
    el("h2", { textContent: text(s.productName) }),
    el("p", { className: "oneliner", textContent: text(s.oneLiner) }),
    chips,
    ...section("Problem", el("p", { textContent: text(s.problem) })),
    ...section("Target user", el("p", { textContent: text(s.targetUser) })),
    ...section("Core flow", list("ol", s.coreFlow)),
    ...section("Screens", screens),
    ...section("Out of scope", list("ul", s.outOfScope)),
  );
}

function renderRubric(entry) {
  const a = answers[entry.label] || {};
  for (const box of document.querySelectorAll(".opts")) {
    const q = box.dataset.q;
    box.replaceChildren(...OPTIONS[q].map((opt) => {
      const input = el("input", { type: "radio", name: q, checked: a[q] === opt });
      input.addEventListener("change", () => { update(entry.label, { [q]: opt }); });
      return el("label", {}, [input, opt]);
    }));
  }
  document.getElementById("notes").value = a.notes || "";
}

function update(label, patch) {
  answers[label] = Object.assign({}, answers[label], patch);
  save();
  renderNav();
}

function renderNav() {
  const listBox = document.getElementById("list");
  listBox.replaceChildren();
  let lastIdea = null;
  specs.forEach((entry, i) => {
    if (entry.ideaId !== lastIdea) { listBox.append(el("h2", { textContent: "Idea " + entry.ideaId })); lastIdea = entry.ideaId; }
    const button = el("button", { className: i === index ? "active" : "" }, [
      "Spec " + entry.label, el("span", { className: "tick", textContent: done(entry.label) ? "✓" : "" })]);
    button.addEventListener("click", () => go(i));
    listBox.append(button);
  });
  document.getElementById("progress").textContent = specs.filter((s) => done(s.label)).length + " of " + specs.length + " reviewed";
}

function go(i) {
  index = i;
  const entry = specs[index];
  document.getElementById("title").textContent = "Spec " + entry.label;
  document.getElementById("idea").textContent = "Idea " + entry.ideaId + ": " + entry.idea;
  renderSpec(entry);
  renderRubric(entry);
  renderNav();
  document.getElementById("prev").disabled = index === 0;
  document.getElementById("next").disabled = index === specs.length - 1;
  window.scrollTo(0, 0);
}

document.getElementById("notes").addEventListener("input", (e) => update(specs[index].label, { notes: e.target.value }));
document.getElementById("prev").addEventListener("click", () => go(index - 1));
document.getElementById("next").addEventListener("click", () => go(index + 1));
document.getElementById("export").addEventListener("click", () => {
  const esc = (v) => { const s = v === undefined ? "" : String(v); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const rows = ["label,idea_id,screens_specific,out_of_scope_sensible,approve_without_major_edits,notes"].concat(specs.map((entry) => {
    const a = answers[entry.label] || {};
    return [entry.label, entry.ideaId, a.screens, a.outOfScope, a.approve, a.notes].map(esc).join(",");
  }));
  const link = el("a", { download: "spec-review-scores.csv", href: URL.createObjectURL(new Blob([rows.join("\n") + "\n"], { type: "text/csv" })) });
  link.click();
});

go(0);
</script>
</body>
</html>
