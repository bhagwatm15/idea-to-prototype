ng API workaround, load test at 3x peak on Jun 12.\nRisks: vendor deprecation Jun 14 (T. Nguyen to confirm fallback).\nOwners: Priya — cutover runbook; Marcus — rollback drill.\nDecisions needed: approve 4h maintenance window Jun 17, 02:00 UTC.`;\n\nconst HISTORY = [\n  { t: 'Atlas Migration — Week 6', d: 'Jun 5, 2025 · 2 versions' },\n  { t: 'Q2 Billing Redesign — Week 3', d: 'May 29, 2025 · Exec + team' },\n  { t: 'Mobile 4.2 Release — Week 1', d: 'May 22, 2025 · 2 versions' },\n  { t: 'Data Platform Refresh — Week 9', d: 'May 15, 2025 · Exec only' },\n];\n\nexport default function App() {\n  const [screen, setScreen] = useState('input');\n  const [raw, setRaw] = useState('on track 78% migrated\\nblocker: billing api deprecation jun 14\\nneed 2 eng for cutover jun 17-21');\n  const [project, setProject] = useState('Atlas Migration');\n  const [audience, setAudience] = useState('Leadership');\n  const [urgency, setUrgency] = useState('Normal');\n  const [exec, setExec] = useState(EXEC);\n  const [team, setTeam] = useState(TEAM);\n  const [copied, setCopied] = useState('');\n\n  const tabs = [['input', 'Input'], ['output', 'Versions'], ['refine', 'Refine'], ['export', 'Export'], ['history', 'History']];\n\n  const copy = (which) => {\n    setCopied(which);\n    setTimeout(() => setCopied(''), 1200);\n  };\n\n  return (\n    \u003cdiv style={S.page}>\n      \u003cdiv style={S.nav}>\n        \u003cspan style={S.logo}>Brieflio\u003c/span>\n        {tabs.map(([k, label]) => (\n          \u003cbutton key={k} style={S.tab(screen === k)} onClick={() => setScreen(k)}>{label}\u003c/button>\n        ))}\n      \u003c/div>\n\n      \u003cdiv style={S.body}>\n        {screen === 'input' && (\n          \u003c>\n            \u003ch1 style={S.h1}>New status update\u003c/h1>\n            \u003cp style={S.sub}>Paste rough bullets — Brieflio shapes them into an exec summary and a team update.\u003c/p>\n            \u003cdiv style={S.card}>\n              \u003clabel style={S.label}>Raw bullets\u003c/label>\n              \u003ctextarea style={{ ...S.input, minHeight: 120 }} value={raw} onChange={(e) => setRaw(e.target.value)} />\n              \u003cdiv style={{ ...S.row, marginTop: 16 }}>\n                \u003cdiv style={{ flex: 1, minWidth: 200 }}>\n                  \u003clabel style={S.label}>Project\u003c/label>\n                  \u003cinput style={S.input} value={project} onChange={(e) => setProject(e.target.value)} />\n                \u003c/div>\n                \u003cdiv style={{ flex: 1, minWidth: 200 }}>\n                  \u003clabel style={S.label}>Audience emphasis\u003c/label>\n                  \u003cdiv style={S.row}>\n                    {['Leadership', 'Cross-team', 'Exec briefing'].map((a) => (\n                      \u003cspan key={a} style={S.pill(audience === a)} onClick={() => setAudience(a)}>{a}\u003c/span>\n                    ))}\n                  \u003c/div>\n                \u003c/div>\n                \u003cdiv style={{ flex: 1, minWidth: 200 }}>\n                  \u003clabel style={S.label}>Urgency\u003c/label>\n                  \u003cdiv style={S.row}>\n                    {['Normal', 'Watch', 'Urgent'].map((u) => (\n                      \u003cspan key={u} style={S.pill(urgency === u)} onClick={() => setUrgency(u)}>{u}\u003c/span>\n                    ))}\n                  \u003c/div>\n                \u003c/div>\n              \u003c/div>\n              \u003cdiv style={{ ...S.row, marginTop: 18 }}>\n                \u003cbutton style={S.btn} onClick={() => setScreen('output')}>Generate two versions\u003c/button>\n                \u003cspan style={{ ...S.small, alignSelf: 'center' }}>Context: {project} · {audience} · {urgency}\u003c/span>\n              \u003c/div>\n            \u003c/div>\n          \u003c/>\n        )}\n\n        {screen === 'output' && (\n          \u003c>\n            \u003ch1 style={S.h1}>Two versions ready\u003c/h1>\n            \u003cp style={S.sub}>{project} · {audience} emphasis · {urgency} urgency\u003c/p>\n            \u003cdiv style={S.twoCol}>\n              \u003cdiv style={S.card}>\n                \u003cdiv style={S.colHead}>\u003cspan style={S.colTitle}>Exec summary\u003c/span>\u003cspan style={S.badge(C.accent)}>Concise\u003c/span>\u003c/div>\n                \u003cdiv style={S.output}>{exec}\u003c/div>\n              \u003c/div>\n              \u003cdiv style={S.card}>\n                \u003cdiv style={S.colHead}>\u003cspan style={S.colTitle}>Team update\u003c/span>\u003cspan style={S.badge(C.green)}>Detailed\u003c/span>\u003c/div>\n                \u003cdiv style={S.output}>{team}\u003c/div>\n              \u003c/div>\n            \u003c/div>\n            \u003cdiv style={{ ...S.row, marginTop: 16 }}>\n              \u003cbutton style={S.btn} onClick={() => setScreen('refine')}>Review &amp; refine\u003c/button>\n              \u003cbutton style={S.btnGhost} onClick={() => setScreen('export')}>Jump to export\u003c/button>\n            \u003c/div>\n          \u003c/>\n        )}\n\n        {screen === 'refine' && (\n          \u003c>\n            \u003ch1 style={S.h1}>Refine in place\u003c/h1>\n            \u003cp style={S.sub}>Edit either version, or regenerate one without touching the other.\u003c/p>\n            \u003cdiv style={S.twoCol}>\n              \u003cdiv style={S.card}>\n                \u003cdiv style={S.colHead}>\u003cspan style={S.colTitle}>Exec summary\u003c/span>\u003cspan style={S.badge(C.accent)}>Concise\u003c/span>\u003c/div>\n                \u003ctextarea style={{ ...S.output, minHeight: 200 }} value={exec} onChange={(e) => setExec(e.target.value)} />\n                \u003cdiv style={S.tool}>\n                  \u003cbutton style={S.btnGhost} onClick={() => setExec(EXEC)}>Regenerate\u003c/button>\n                  \u003cbutton style={S.btnGhost} onClick={() => setExec(exec.split('\\n').slice(0, 3).join('\\n'))}>Tighten tone\u003c/button>\n                \u003c/div>\n              \u003c/div>\n              \u003cdiv style={S.card}>\n                \u003cdiv style={S.colHead}>\u003cspan style={S.colTitle}>Team update\u003c/span>\u003cspan style={S.badge(C.green)}>Detailed\u003c/span>\u003c/div>\n                \u003ctextarea style={{ ...S.output, minHeight: 200 }} value={team} onChange={(e) => setTeam(e.target.value)} />\n                \u003cdiv style={S.tool}>\n                  \u003cbutton style={S.btnGhost} onClick={() => setTeam(TEAM)}>Regenerate\u003c/button>\n                  \u003cbutton style={S.btnGhost} onClick={() => setTeam(team + '\\nNext sync: Fri 10:00 UTC.')}>Add sync note\u003c/button>\n                \u003c/div>\n              \u003c/div>\n            \u003c/div>\n          \u003c/>\n        )}\n\n        {screen === 'export' && (\n          \u003c>\n            \u003ch1 style={S.h1}>Export &amp; share\u003c/h1>\n            \u003cp style={S.sub}>Send both versions or just one, formatted for the destination.\u003c/p>\n            \u003cdiv style={S.card}>\n              \u003cdiv style={S.row}>\n                \u003cbutton style={S.btn} onClick={() => copy('both')}>{copied === 'both' ? 'Copied ✓' : 'Copy both to clipboard'}\u003c/button>\n                \u003cbutton style={S.btnGhost} onClick={() => copy('slack')}>{copied === 'slack' ? 'Copied ✓' : 'Copy for Slack'}\u003c/button>\n                \u003cbutton style={S.btnGhost} onClick={() => copy('email')}>{copied === 'email' ? 'Copied ✓' : 'Copy for email'}\u003c/button>\n                \u003cbutton style={S.btnGhost}>Download .md\u003c/button>\n              \u003c/div>\n              \u003cdiv style={{ ...S.row, marginTop: 16 }}>\n                {['Send via Gmail', 'Post to #atlas-migration', 'Save to Notion doc'].map((i) => (\n                  \u003cspan key={i} style={S.pill(false)}>{i}\u003c/span>\n                ))}\n              \u003c/div>\n              \u003cp style={{ ...S.small, marginTop: 16, marginBottom: 0 }}>Longest version: 96 words · fits Slack and email previews.\u003c/p>\n            \u003c/div>\n          \u003c/>\n        )}\n\n        {screen === 'history' && (\n          \u003c>\n            \u003ch1 style={S.h1}>History\u003c/h1>\n            \u003cp style={S.sub}>Reuse a past update as the starting point for this week's.\u003c/p>\n            {HISTORY.map((h) => (\n              \u003cdiv key={h.t} style={S.item}>\n                \u003cdiv>\n                  \u003cdiv style={{ fontSize: 14, fontWeight: 600 }}>{h.t}\u003c/div>\n                  \u003cdiv style={S.small}>{h.d}\u003c/div>\n                \u003c/div>\n                \u003cbutton style={S.btnGhost} onClick={() => { setProject(h.t); setScreen('input'); }}>Reuse\u003c/button>\n              \u003c/div>\n            ))}\n          \u003c/>\n        )}\n      \u003c/div>\n    \u003c/div>\n  );\n}\n"},{"label":"J","ideaId":2,"idea":"A tool that turns rough status bullets into a clean update, one version for execs and one for the team.","code":"import React, {useState} from \"react\";\n\nconst colors = {primary:\"#2C3E50\",secondary:\"#34495E\",accent:\"#1ABC9C\",bg:\"#F5F7FA\",text:\"#212529\"};\nconst spacing = {xs:4,sm:8,md:16,lg:24};\nconst font = {family:\"Arial,Helvetica,sans-serif\",size:\"14px\"};\n\nexport default function App(){\n  const [screen,setScreen]=useState(\"input\");\n  const [bullets,setBullets]=useState(\"- Completed API v2\\n- QA testing 70%\\n- Client demo scheduled\");\n  const [project,setProject]=useState(\"Project Alpha\");\n  const [tone,setTone]=useState(\"Professional\");\n  const [exec,setExec]=useState(\"\");\n  const [team,setTeam]=useState(\"\");\n  const [editTarget,setEditTarget]=useState(\"exec\");\n  const [history,setHistory]=useState([\n    {date:\"2024-09-20\",project:\"Beta Release\",exec:\"Beta on track, 60% complete.\",team:\"Team, finish UI work.\"},\n    {date:\"2024-09-18\",project:\"Data Migration\",exec:\"Migration 90% done.\",team:\"Ops, verify integrity.\"}\n  ]);\n\n  const generate =()=>{\n    setExec(`${project}: On schedule, 85% complete. Next milestone 09/30.`);\n    setTeam(`Team,\\n- API v2 done\\n- QA 70% done\\n- Demo 09/28`);\n    setScreen(\"dual\");\n    setHistory(prev=>[{date:new Date().toISOString().slice(0,10),project,exec,team},...prev].slice(0,10));\n  };\n  const copyToClipboard=(text)=>navigator.clipboard.writeText(text);\n  const download = (name,content)=>{\n    const blob=new Blob([content],{type:\"text/plain\"});\n    const a=document.createElement(\"a\");\n    a.href=URL.createObjectURL(blob);\n    a.download=name;\n    a.click();\n  };\n  const container={fontFamily:font.family,fontSize:font.size,color:colors.text,backgroundColor:colors.bg,minHeight:\"100vh\",padding:spacing.lg};\n  const nav={display:\"flex\",gap:spacing.sm,marginBottom:spacing.md};\n  const btn={padding:`${spacing.xs}px ${spacing.sm}px`,border:`1px solid ${colors.secondary}`,backgroundColor:colors.primary,color:\"#fff\",cursor:\"pointer\"};\n  const activeBtn={...btn,backgroundColor:colors.accent};\n\n  const renderScreen=()=>{\n    if(screen===\"input\"){\n      return (\n        \u003cdiv>\n          \u003ch2 style={{marginBottom:spacing.sm}}>New Status Update\u003c/h2>\n          \u003clabel>Project name\u003c/label>\u003cbr/>\n          \u003cinput value={project} onChange={e=>setProject(e.target.value)} style={{width:\"100%\",marginBottom:spacing.sm}}/>\n          \u003clabel>Context / Tone\u003c/label>\u003cbr/>\n          \u003cselect value={tone} onChange={e=>setTone(e.target.value)} style={{width:\"100%\",marginBottom:spacing.sm}}>\n            \u003coption>Professional\u003c/option>\n            \u003coption>Friendly\u003c/option>\n            \u003coption>Urgent\u003c/option>\n          \u003c/select>\n          \u003clabel>Raw bullet points\u003c/label>\u003cbr/>\n          \u003ctextarea value={bullets} onChange={e=>setBullets(e.target.value)} rows={6}\n            style={{width:\"100%\",fontFamily:\"monospace\",marginBottom:spacing.sm}}/>\n          \u003cbutton onClick={generate} style={btn}>Generate Updates\u003c/button>\n        \u003c/div>\n      );\n    }\n    if(screen===\"dual\"){\n      return (\n        \u003cdiv>\n          \u003ch2 style={{marginBottom:spacing.sm}}>Generated Updates\u003c/h2>\n          \u003cdiv style={{display:\"flex\",gap:spacing.md}}>\n            \u003cdiv style={{flex:1}}>\n              \u003ch4>Executive Summary\u003c/h4>\n              \u003ctextarea value={exec} onChange={e=>setExec(e.target.value)} rows={8}\n                style={{width:\"100%\",fontFamily:\"monospace\"}}/>\n            \u003c/div>\n            \u003cdiv style={{flex:1}}>\n              \u003ch4>Team Update\u003c/h4>\n              \u003ctextarea value={team} onChange={e=>setTeam(e.target.value)} rows={8}\n                style={{width:\"100%\",fontFamily:\"monospace\"}}/>\n            \u003c/div>\n          \u003c/div>\n          \u003cdiv style={{marginTop:spacing.md}}>\n            \u003cbutton onClick={()=>setScreen(\"edit\")} style={btn}>Edit / Refine\u003c/button>\n            \u003cbutton onClick={()=>setScreen(\"export\")} style={{...btn,marginLeft:spacing.sm}}>Export / Share\u003c/button>\n          \u003c/div>\n        \u003c/div>\n      );\n    }\n    if(screen===\"edit\"){\n      return (\n        \u003cdiv>\n          \u003ch2 style={{marginBottom:spacing.sm}}>Edit & Refine\u003c/h2>\n          \u003cselect value={editTarget} onChange={e=>setEditTarget(e.target.value)} style={{marginBottom:spacing.sm}}>\n            \u003coption value=\"exec\">Executive Summary\u003c/option>\n            \u003coption value=\"team\">Team Update\u003c/option>\n          \u003c/select>\n          \u003ctextarea\n            value={editTarget===\"exec\"?exec:team}\n            onChange={e=>editTarget===\"exec\"?setExec(e.target.value):setTeam(e.target.value)}\n            rows={10}\n            style={{width:\"100%\",fontFamily:\"monospace\",marginBottom:spacing.sm}}/>\n          \u003cdiv>\n            \u003cbutton onClick={()=>setScreen(\"dual\")} style={btn}>Back\u003c/button>\n          \u003c/div>\n        \u003c/div>\n      );\n    }\n    if(screen===\"export\"){\n      return (\n        \u003cdiv>\n          \u003ch2 style={{marginBottom:spacing.sm}}>Export / Share\u003c/h2>\n          \u003cdiv style={{marginBottom:spacing.sm}}>\n            \u003cstrong>Executive Summary\u003c/strong>\n            \u003cpre style={{backgroundColor:\"#fff\",padding:spacing.sm,whiteSpace:\"pre-wrap\"}}>{exec}\u003c/pre>\n          \u003c/div>\n          \u003cdiv style={{marginBottom:spacing.sm}}>\n            \u003cstrong>Team Update\u003c/strong>\n            \u003cpre style={{backgroundColor:\"#fff\",padding:spacing.sm,whiteSpace:\"pre-wrap\"}}>{team}\u003c/pre>\n          \u003c/div>\n          \u003cbutton onClick={()=>copyToClipboard(exec+\"\\n\\n\"+team)} style={btn}>Copy All\u003c/button>\n          \u003cbutton onClick={()=>download(`${project}_Update.txt`,exec+\"\\n\\n\"+team)} style={{...btn,marginLeft:spacing.sm}}>Download\u003c/button>\n          \u003cbutton onClick={()=>alert(\"Sent to Slack (mock)\")} style={{...btn,marginLeft:spacing.sm}}>Send to Slack\u003c/button>\n        \u003c/div>\n      );\n    }\n    if(screen===\"history\"){\n      return (\n        \u003cdiv>\n          \u003ch2 style={{marginBottom:spacing.sm}}>Past Updates\u003c/h2>\n          {history.map((h,i)=>(\n            \u003cdiv key={i} style={{border:`1px solid ${colors.secondary}`,padding:spacing.sm,marginBottom:spacing.xs}}>\n              \u003cdiv>\u003cstrong>{h.project}\u003c/strong> – {h.date}\u003c/div>\n              \u003cbutton onClick={()=>{setExec(h.exec);setTeam(h.team);setProject(h.project);setScreen(\"dual\");}} style={btn}>Load\u003c/button>\n            \u003c/div>\n          ))}\n        \u003c/div>\n      );\n    }\n    return null;\n  };\n\n  return (\n    \u003cdiv style={container}>\n      \u003cdiv style={nav}>\n        {[\"input\",\"dual\",\"edit\",\"export\",\"history\"].map(s=>(\n          \u003cbutton key={s} onClick={()=>setScreen(s)} style={screen===s?activeBtn:btn}>{s.charAt(0).toUpperCase()+s.slice(1)}\u003c/button>\n        ))}\n      \u003c/div>\n      {renderScreen()}\n    \u003c/div>\n  );\n}\n"},{"label":"K","ideaId":2,"idea":"A tool that turns rough status bullets into a clean update, one version for execs and one for the team.","code":"import React, { useState } from \"react\";\n\nconst colors = {\n  bg: \"#f7f8fa\",\n  panel: \"#ffffff\",\n  border: \"#e0e3e8\",\n  primary: \"#1f4e79\",\n  accent: \"#2f80ed\",\n  text: \"#2b2f36\",\n  muted: \"#6b7280\",\n};\n\nconst font = \"'Segoe UI', Helvetica, Arial, sans-serif\";\n\nconst styles = {\n  app: { fontFamily: font, background: colors.bg, minHeight: \"100vh\", color: colors.text },\n  nav: { display: \"flex\", gap: 4, background: colors.primary, padding: \"0 16px\" },\n  tab: (active) => ({\n    padding: \"14px 18px\",\n    cursor: \"pointer\",\n    color: active ? \"#fff\" : \"#cdd8e6\",\n    borderBottom: active ? \"3px solid #fff\" : \"3px solid transparent\",\n    fontSize: 14,\n    fontWeight: 600,\n  }),\n  main: { padding: 28, maxWidth: 1100, margin: \"0 auto\" },\n  h1: { fontSize: 22, fontWeight: 700, marginBottom: 6, color: colors.primary },\n  sub: { fontSize: 13, color: colors.muted, marginBottom: 20 },\n  panel: { background: colors.panel, border: `1px solid ${colors.border}`, borderRadius: 8, padding: 20 },\n  label: { fontSize: 12, fontWeight: 600, color: colors.muted, marginBottom: 6, display: \"block\", textTransform: \"uppercase\", letterSpacing: 0.4 },\n  input: { width: \"100%\", padding: \"10px 12px\", border: `1px solid ${colors.border}`, borderRadius: 6, fontSize: 14, marginBottom: 16, boxSizing: \"border-box\", fontFamily: font },\n  textarea: { width: \"100%\", minHeight: 160, padding: 12, border: `1px solid ${colors.border}`, borderRadius: 6, fontSize: 14, marginBottom: 16, boxSizing: \"border-box\", fontFamily: font, resize: \"vertical\" },\n  btn: { background: colors.accent, color: \"#fff\", border: \"none\", padding: \"10px 18px\", borderRadius: 6, fontSize: 14, fontWeight: 600, cursor: \"pointer\" },\n  btnGhost: { background: \"transparent\", color: colors.primary, border: `1px solid ${colors.primary}`, padding: \"9px 16px\", borderRadius: 6, fontSize: 13, fontWeight: 600, cursor: \"pointer\" },\n  row: { display: \"flex\", gap: 20 },\n  col: { flex: 1 },\n  cardTitle: { fontSize: 15, fontWeight: 700, marginBottom: 10, color: colors.primary },\n  historyItem: { padding: \"12px 14px\", border: `1px solid ${colors.border}`, borderRadius: 6, marginBottom: 10, background: colors.panel, display: \"flex\", justifyContent: \"space-between\", alignItems: \"center\" },\n};\n\nexport default function App() {\n  const [screen, setScreen] = useState(\"Input\");\n  const [bullets, setBullets] = useState(\n    \"- Migrated billing service to new infra, cut latency 30%\\n- QA found 4 regressions in checkout flow, 2 fixed\\n- Vendor contract renewal delayed, blocks Q3 rollout\\n- Hired 1 new backend engineer, starts Monday\"\n  );\n  const [project, setProject] = useState(\"Atlas Billing Migration\");\n  const [audience, setAudience] = useState(\"Leadership\");\n  const [urgency, setUrgency] = useState(\"Normal\");\n  const [execText, setExecText] = useState(\n    \"Atlas Billing Migration is on track: infra move cut latency 30%. Checkout QA found minor issues, half resolved. Vendor delay is the key risk to Q3 timeline.\"\n  );\n  const [teamText, setTeamText] = useState(\n    \"Team update — Atlas Billing:\\n1. Infra migration complete, latency down 30%.\\n2. QA flagged 4 checkout regressions; 2 fixed, 2 in progress.\\n3. Vendor contract renewal delayed — escalating this week.\\n4. New backend engineer (Priya) starts Monday, onboarding plan ready.\"\n  );\n  const [history, setHistory] = useState([\n    { id: 1, name: \"Atlas Billing Migration - Week 24\", date: \"Jun 10\" },\n    { id: 2, name: \"Mobile Redesign Sprint Recap\", date: \"Jun 3\" },\n    { id: 3, name: \"Vendor Renewal Status\", date: \"May 27\" },\n  ]);\n\n  const tabs = [\"Input\", \"Dual Output\", \"Edit & Refine\", \"Export/Share\", \"History\"];\n\n  const generate = () => {\n    setExecText(\n      `${project}: Key progress this period includes infra gains and hiring. Main risk is vendor delay affecting Q3. Audience: ${audience}, Urgency: ${urgency}.`\n    );\n    setTeamText(\n      `Team update — ${project}:\\n1. ${bullets.split(\"\\n\")[0]?.replace(\"- \", \"\") || \"Progress item\"}\\n2. QA and delivery items tracked in board.\\n3. Escalation needed on vendor timeline.\\n4. Staffing update included.`\n    );\n    setScreen(\"Dual Output\");\n  };\n\n  return (\n    \u003cdiv style={styles.app}>\n      \u003cdiv style={styles.nav}>\n        {tabs.map((t) => (\n          \u003cdiv key={t} style={styles.tab(screen === t)} onClick={() => setScreen(t)}>\n            {t}\n          \u003c/div>\n        ))}\n      \u003c/div>\n      \u003cdiv style={styles.main}>\n        {screen === \"Input\" && (\n          \u003cdiv>\n            \u003cdiv style={styles.h1}>New Status Update\u003c/div>\n            \u003cdiv style={styles.sub}>Paste rough bullets, add context, then generate exec + team versions.\u003c/div>\n            \u003cdiv style={styles.panel}>\n              \u003clabel style={styles.label}>Raw Bullets\u003c/label>\n              \u003ctextarea style={styles.textarea} value={bullets} onChange={(e) => setBullets(e.target.value)} />\n              \u003cdiv style={styles.row}>\n                \u003cdiv style={styles.col}>\n                  \u003clabel style={styles.label}>Project Name\u003c/label>\n                  \u003cinput style={styles.input} value={project} onChange={(e) => setProject(e.target.value)} />\n                \u003c/div>\n                \u003cdiv style={styles.col}>\n                  \u003clabel style={styles.label}>Audience\u003c/label>\n                  \u003cselect style={styles.input} value={audience} onChange={(e) => setAudience(e.target.value)}>\n                    \u003coption>Leadership\u003c/option>\n                    \u003coption>Peers\u003c/option>\n                    \u003coption>Client\u003c/option>\n                  \u003c/select>\n                \u003c/div>\n                \u003cdiv style={styles.col}>\n                  \u003clabel style={styles.label}>Urgency\u003c/label>\n                  \u003cselect style={styles.input} value={urgency} onChange={(e) => setUrgency(e.target.value)}>\n                    \u003coption>Normal\u003c/option>\n                    \u003coption>High\u003c/option>\n                    \u003coption>FYI Only\u003c/option>\n                  \u003c/select>\n                \u003c/div>\n              \u003c/div>\n              \u003cbutton style={styles.btn} onClick={generate}>Generate Updates\u003c/button>\n            \u003c/div>\n          \u003c/div>\n        )}\n\n        {screen === \"Dual Output\" && (\n          \u003cdiv>\n            \u003cdiv style={styles.h1}>{project}\u003c/div>\n            \u003cdiv style={styles.sub}>Exec summary vs. team update — compare and refine.\u003c/div>\n            \u003cdiv style={styles.row}>\n              \u003cdiv style={styles.col}>\n                \u003cdiv style={styles.panel}>\n                  \u003cdiv style={styles.cardTitle}>Exec Summary\u003c/div>\n                  \u003cdiv style={{ fontSize: 14, lineHeight: 1.6 }}>{execText}\u003c/div>\n                \u003c/div>\n              \u003c/div>\n              \u003cdiv style={styles.col}>\n                \u003cdiv style={styles.panel}>\n                  \u003cdiv style={styles.cardTitle}>Team Update\u003c/div>\n                  \u003cdiv style={{ fontSize: 14, lineHeight: 1.6, whiteSpace: \"pre-line\" }}>{teamText}\u003c/div>\n                \u003c/div>\n              \u003c/div>\n            \u003c/div>\n            \u003cdiv style={{ marginTop: 16 }}>\n              \u003cbutton style={styles.btn} onClick={() => setScreen(\"Edit & Refine\")}>Edit & Refine\u003c/button>\n              \u003cspan style={{ display: \"inline-block\", width: 10 }} />\n              \u003cbutton style={styles.btnGhost} onClick={() => setScreen(\"Export/Share\")}>Export / Share\u003c/button>\n            \u003c/div>\n          \u003c/div>\n        )}\n\n        {screen === \"Edit & Refine\" && (\n          \u003cdiv>\n            \u003cdiv style={styles.h1}>Edit & Refine\u003c/div>\n            \u003cdiv style={styles.sub}>Tweak either version inline or regenerate just one.\u003c/div>\n            \u003cdiv style={styles.row}>\n              \u003cdiv style={styles.col}>\n                \u003cdiv style={styles.panel}>\n                  \u003cdiv style={styles.cardTitle}>Exec Summary\u003c/div>\n                  \u003ctextarea style={styles.textarea} value={execText} onChange={(e) => setExecText(e.target.value)} />\n                  \u003cbutton style={styles.btnGhost} onClick={() => setExecText(execText + \" (tightened for brevity)\")}>Regenerate Exec\u003c/button>\n                \u003c/div>\n              \u003c/div>\n              \u003cdiv style={styles.col}>\n                \u003cdiv style={styles.panel}>\n                  \u003cdiv style={styles.cardTitle}>Team Update\u003c/div>\n                  \u003ctextarea style={styles.textarea} value={teamText} onChange={(e) => setTeamText(e.target.value)} />\n                  \u003cbutton style={styles.btnGhost} onClick={() => setTeamText(teamText + \"\\n5. Added more detail per regeneration.\")}>Regenerate Team\u003c/button>\n                \u003c/div>\n              \u003c/div>\n            \u003c/div>\n            \u003cdiv style={{ marginTop: 16 }}>\n              \u003cbutton style={styles.btn} onClick={() => setScreen(\"Export/Share\")}>Continue to Export\u003c/button>\n            \u003c/div>\n          \u003c/div>\n        )}\n\n        {screen === \"Export/Share\" && (\n          \u003cdiv>\n            \u003cdiv style={styles.h1}>Export / Share\u003c/div>\n            \u003cdiv style={styles.sub}>Send the final versions wherever your team needs them.\u003c/div>\n            \u003cdiv style={styles.panel}>\n              \u003cdiv style={styles.cardTitle}>Choose Destination\u003c/div>\n              \u003cbutton style={styles.btnGhost}>Copy Exec to Clipboard\u003c/button>\n              \u003cspan style={{ display: \"inline-block\", width: 10 }} />\n              \u003cbutton style={styles.btnGhost}>Copy Team to Clipboard\u003c/button>\n              \u003cspan style={{ display: \"inline-block\", width: 10 }} />\n              \u003cbutton style={styles.btnGhost}>Download as .txt\u003c/button>\n              \u003cdiv style={{ marginTop: 16 }}>\n                \u003cbutton style={styles.btn}>Send to Slack (#atlas-updates)\u003c/button>\n                \u003cspan style={{ display: \"inline-block\", width: 10 }} />\n                \u003cbutton style={styles.btn}>Send via Email\u003c/button>\n              \u003c/div>\n              \u003cdiv\n                style={{\n                  marginTop: 20,\n                  paddingTop: 16,\n                  borderTop: `1px solid ${colors.border}`,\n                }}\n                onClick={() =>\n                  setHistory([{ id: Date.now(), name: `${project} - Update`, date: \"Just now\" }, ...history])\n                }\n              >\n                \u003cbutton style={styles.btnGhost}>Save to History\u003c/button>\n              \u003c/div>\n            \u003c/div>\n          \u003c/div>\n        )}\n\n        {screen === \"History\" && (\n          \u003cdiv>\n            \u003cdiv style={styles.h1}>Past Updates\u003c/div>\n            \u003cdiv style={styles.sub}>Reuse a previous report as a starting point.\u003c/div>\n            {history.map((h) => (\n              \u003cdiv key={h.id} style={styles.historyItem}>\n                \u003cdiv>\n                  \u003cdiv style={{ fontWeight: 600, fontSize: 14 }}>{h.name}\u003c/div>\n                  \u003cdiv style={{ fontSize: 12, color: colors.muted }}>{h.date}\u003c/div>\n                \u003c/div>\n                \u003cbutton style={styles.btnGhost} onClick={() => setScreen(\"Dual Output\")}>Reuse\u003c/button>\n              \u003c/div>\n            ))}\n          \u003c/div>\n        )}\n      \u003c/div>\n    \u003c/div>\n  );\n}\n"},{"label":"L","ideaId":2,"idea":"A tool that turns rough status bullets into a clean update, one version for execs and one for the team.","code":"import React, { useState } from 'react';\n\nconst C = {\n  bg: '#F7F8FA', card: '#FFFFFF', border: '#E2E5EA',\n  text: '#1A1D23', sub: '#5B6472', accent: '#2D6BF3',\n  accentSoft: '#EAF0FE', ok: '#0F9D58', warn: '#D97706'\n};\nconst S = {\n  input: { width: '100%', boxSizing: 'border-box', border: `1px solid ${C.border}`, borderRadius: 8, padding: '10px 12px', fontSize: 14, fontFamily: 'inherit', color: C.text, background: C.card, outline: 'none' },\n  btn: { border: 'none', borderRadius: 8, padding: '9px 16px', fontSize: 13.5, fontWeight: 600, cursor: 'pointer', fontFamily: 'inherit' },\n  card: { background: C.card, border: `1px solid ${C.border}`, borderRadius: 12, padding: 20 },\n  label: { fontSize: 11.5, fontWeight: 700, letterSpacing: 0.5, textTransform: 'uppercase', color: C.sub, marginBottom: 6, display: 'block' },\n  h2: { fontSize: 17, fontWeight: 700, color: C.text, margin: '0 0 4px' },\n  p: { fontSize: 13, color: C.sub, margin: '0 0 14px', lineHeight: 1.5 }\n};\n\nexport default function App() {\n  const [screen, setScreen] = useState('input');\n  const [bullets, setBullets] = useState('- Auth service migrated to v2, latency down 340ms\\n- 3 of 5 onboarding emails shipped; 2 blocked on copy review\\n- Payment provider sandbox keys pending from Finance\\n- Next: load test API gateway Thursday, demo Friday 2pm');\n  const [project, setProject] = useState('Atlas Platform – Sprint 24');\n  const [audience, setAudience] = useState('Executive');\n  const [urgency, setUrgency] = useState('Normal');\n  const [exec, setExec] = useState('Atlas Platform Sprint 24 is on track: auth migration complete, cutting API latency by 340ms. Onboarding emails are 3/5 live, with 2 awaiting copy review. Payment sandbox keys are pending from Finance — the only blocker. Next: API gateway load test Thursday and a demo Friday at 2pm.');\n  const [team, setTeam] = useState('Wins this week:\\n• Auth service migrated to v2 in production — latency reduced 340ms (p95 now 210ms).\\n• 3 of 5 onboarding emails shipped to staging: welcome, verify, first-project.\\n\\nIn progress / blocked:\\n• Emails 4 & 5 blocked on copy review from Maya — need by Wed EOD.\\n• Payment provider sandbox keys still pending from Finance (Sarah).\\n\\nUp next:\\n• Load test API gateway Thursday morning.\\n• Sprint demo Friday 2pm, main room.');\n  const [tone, setTone] = useState('Professional');\n  const [copied, setCopied] = useState('');\n\n  const tabs = [['input','Input'],['output','Output'],['refine','Edit & Refine'],['export','Export & Share'],['history','History']];\n  const history = [\n    { d: 'Mar 14', t: 'Atlas Platform – Sprint 23', n: '4 bullets · Exec + Team' },\n    { d: 'Mar 07', t: 'Atlas Platform – Sprint 22', n: '5 bullets · Exec + Team' },\n    { d: 'Feb 28', t: 'Mobile Beta – Week 6', n: '3 bullets · Team only' }\n  ];\n  const copy = (label) => { setCopied(label); };\n\n  return (\n    \u003cdiv style={{ minHeight: '100vh', background: C.bg, fontFamily: '-apple-system, \"Segoe UI\", Roboto, Helvetica, Arial, sans-serif' }}>\n      \u003cdiv style={{ background: C.card, borderBottom: `1px solid ${C.border}`, padding: '0 24px', display: 'flex', alignItems: 'center', gap: 24, height: 56 }}>\n        \u003cdiv style={{ fontWeight: 800, fontSize: 16, color: C.text, letterSpacing: -0.3 }}>Brieflio\u003c/div>\n        \u003cdiv style={{ display: 'flex', gap: 4 }}>\n          {tabs.map(([k, l]) => (\n            \u003cbutton key={k} onClick={() => setScreen(k)} style={{ ...S.btn, padding: '6px 12px', background: screen === k ? C.accentSoft : 'transparent', color: screen === k ? C.accent : C.sub }}>{l}\u003c/button>\n          ))}\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv style={{ maxWidth: 980, margin: '0 auto', padding: 24 }}>\n        {screen === 'input' && (\n          \u003cdiv style={S.card}>\n            \u003ch2 style={S.h2}>New status update\u003c/h2>\n            \u003cp style={S.p}>Paste rough bullets or notes — Brieflio turns them into two clean versions.\u003c/p>\n            \u003clabel style={S.label}>Raw bullets\u003c/label>\n            \u003ctextarea value={bullets} onChange={e => setBullets(e.target.value)} rows={7} style={{ ...S.input, resize: 'vertical', lineHeight: 1.6 }} />\n            \u003cdiv style={{ display: 'grid', gridTemplateColumns: '2fr 1fr 1fr', gap: 12, marginTop: 16 }}>\n              \u003cdiv>\u003clabel style={S.label}>Project / context\u003c/label>\u003cinput value={project} onChange={e => setProject(e.target.value)} style={S.input} />\u003c/div>\n              \u003cdiv>\u003clabel style={S.label}>Audience emphasis\u003c/label>\n                \u003cselect value={audience} onChange={e => setAudience(e.target.value)} style={S.input}>\u003coption>Executive\u003c/option>\u003coption>Engineering\u003c/option>\u003coption>Stakeholders\u003c/option>\u003c/select>\u003c/div>\n              \u003cdiv>\u003clabel style={S.label}>Urgency\u003c/label>\n                \u003cselect value={urgency} onChange={e => setUrgency(e.target.value)} style={S.input}>\u003coption>Normal\u003c/option>\u003coption>High\u003c/option>\u003coption>Critical\u003c/option>\u003c/select>\u003c/div>\n            \u003c/div>\n            \u003cdiv style={{ marginTop: 18, display: 'flex', gap: 10, alignItems: 'center' }}>\n              \u003cbutton onClick={() => setScreen('output')} style={{ ...S.btn, background: C.accent, color: '#fff' }}>Generate two versions\u003c/button>\n              \u003cspan style={{ fontSize: 12.5, color: C.sub }}>{bullets.split('\\n').filter(Boolean).length} bullets · ~{bullets.split(/\\s+/).length} words\u003c/span>\n            \u003c/div>\n          \u003c/div>\n        )}\n\n        {screen === 'output' && (\n          \u003cdiv>\n            \u003ch2 style={{ ...S.h2, marginBottom: 2 }}>Generated updates\u003c/h2>\n            \u003cp style={S.p}>Two tailored versions from the same source. Click either to edit inline.\u003c/p>\n            \u003cdiv style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16 }}>\n              {[['Exec summary', exec, setExec, 'Concise'], ['Team update', team, setTeam, 'Detailed']].map(([title, val, set, tag]) => (\n                \u003cdiv key={title} style={S.card}>\n                  \u003cdiv style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 10 }}>\n                    \u003cstrong style={{ fontSize: 14, color: C.text }}>{title}\u003c/strong>\n                    \u003cspan style={{ fontSize: 11, fontWeight: 700, color: C.accent, background: C.accentSoft, padding: '3px 8px', borderRadius: 99 }}>{tag}\u003c/span>\n                  \u003c/div>\n                  \u003ctextarea value={val} onChange={e => set(e.target.value)} rows={10} style={{ ...S.input, resize: 'vertical', lineHeight: 1.6, fontSize: 13.5 }} />\n                  \u003cdiv style={{ display: 'flex', gap: 8, marginTop: 10 }}>\n                    \u003cbutton onClick={() => copy(title)} style={{ ...S.btn, background: C.accentSoft, color: C.accent }}>{copied === title ? 'Copied ✓' : 'Copy'}\u003c/button>\n                    \u003cbutton onClick={() => setScreen('refine')} style={{ ...S.btn, background: 'transparent', color: C.sub, border: `1px solid ${C.border}` }}>Refine\u003c/button>\n                  \u003c/div>\n                \u003c/div>\n              ))}\n            \u003c/div>\n            \u003cbutton onClick={() => setScreen('export')} style={{ ...S.btn, background: C.accent, color: '#fff', marginTop: 16 }}>Continue to export →\u003c/button>\n          \u003c/div>\n        )}\n\n        {screen === 'refine' && (\n          \u003cdiv style={S.card}>\n            \u003ch2 style={S.h2}>Edit & refine\u003c/h2>\n            \u003cp style={S.p}>Tweak wording, adjust tone, or regenerate a single version.\u003c/p>\n            \u003cdiv style={{ display: 'flex', gap: 8, alignItems: 'center', marginBottom: 16 }}>\n              \u003clabel style={{ ...S.label, margin: 0 }}>Tone\u003c/label>\n              {['Professional', 'Direct', 'Friendly'].map(t => (\n                \u003cbutton key={t} onClick={() => setTone(t)} style={{ ...S.btn, padding: '6px 12px', background: tone === t ? C.accentSoft : 'transparent', color: tone === t ? C.accent : C.sub, border: `1px solid ${tone === t ? C.accent : C.border}` }}>{t}\u003c/button>\n              ))}\n              \u003cspan style={{ fontSize: 12.5, color: C.sub, marginLeft: 4 }}>Applied to: {tone}\u003c/span>\n            \u003c/div>\n            \u003cdiv style={{ display: 'grid', gap: 14 }}>\n              \u003cdiv>\n                \u003clabel style={S.label}>Exec summary\u003c/label>\n                \u003ctextarea value={exec} onChange={e => setExec(e.target.value)} rows={5} style={{ ...S.input, resize: 'vertical', lineHeight: 1.6 }} />\n                \u003cbutton onClick={() => setExec(exec + ' (refined)')} style={{ ...S.btn, marginTop: 8, background: C.accentSoft, color: C.accent }}>↻ Regenerate this version\u003c/button>\n              \u003c/div>\n              \u003cdiv>\n                \u003clabel style={S.label}>Team update\u003c/label>\n                \u003ctextarea value={team} onChange={e => setTeam(e.target.value)} rows={7} style={{ ...S.input, resize: 'vertical', lineHeight: 1.6 }} />\n                \u003cbutton onClick={() => setTeam(team + '\\n\\n(revised)')} style={{ ...S.btn, marginTop: 8, background: C.accentSoft, color: C.accent }}>↻ Regenerate this version\u003c/button>\n              \u003c/div>\n            \u003c/div>\n            \u003cbutton onClick={() => setScreen('export')} style={{ ...S.btn, background: C.accent, color: '#fff', marginTop: 16 }}>Save & continue →\u003c/button>\n          \u003c/div>\n        )}\n\n        {screen === 'export' && (\n          \u003cdiv>\n            \u003ch2 style={{ ...S.h2, marginBottom: 2 }}>Export & share\u003c/h2>\n            \u003cp style={S.p}>Send both versions anywhere your team works.\u003c/p>\n            \u003cdiv style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16 }}>\n              \u003cdiv style={S.card}>\n                \u003cstrong style={{ fontSize: 14 }}>Copy\u003c/strong>\n                \u003cp style={{ ...S.p, marginTop: 6 }}>Clipboard-ready, formatted for each channel.\u003c/p>\n                \u003cdiv style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>\n                  \u003cbutton onClick={() => copy('Email')} style={{ ...S.btn, background: C.accentSoft, color: C.accent }}>{copied === 'Email' ? 'Copied ✓' : 'Copy for Email'}\u003c/button>\n                  \u003cbutton onClick={() => copy('Slack')} style={{ ...S.btn, background: C.accentSoft, color: C.accent }}>{copied === 'Slack' ? 'Copied ✓' : 'Copy for Slack'}\u003c/button>\n                  \u003cbutton onClick={() => copy('Docs')} style={{ ...S.btn, background: C.accentSoft, color: C.accent }}>{copied === 'Docs' ? 'Copied ✓' : 'Copy for Docs'}\u003c/button>\n                \u003c/div>\n              \u003c/div>\n              \u003cdiv style={S.card}>\n                \u003cstrong style={{ fontSize: 14 }}>Send / download\u003c/strong>\n                \u003cp style={{ ...S.p, marginTop: 6 }}>Direct integrations and file exports.\u003c/p>\n                \u003cdiv style={{ display: 'grid', gap: 8 }}>\n                  \u003cbutton onClick={() => copy('Slack sent')} style={{ ...S.btn, background: C.accent, color: '#fff', textAlign: 'left' }}>{copied === 'Slack sent' ? 'Sent to #atlas-eng ✓' : 'Send to Slack — #atlas-eng'}\u003c/button>\n                  \u003cbutton onClick={() => copy('Email sent')} style={{ ...S.btn, border: `1px solid ${C.border}`, background: 'transparent', color: C.text, textAlign: 'left' }}>{copied === 'Email sent' ? 'Drafted to leads ✓' : 'Email to sprint-leads@company.com'}\u003c/button>\n                  \u003cbutton onClick={() => copy('Doc')} style={{ ...S.btn, border: `1px solid ${C.border}`, background: 'transparent', color: C.text, textAlign: 'left' }}>{copied === 'Doc' ? 'Downloaded ✓' : 'Download .docx / .md'}\u003c/button>\n                \u003c/div>\n              \u003c/div>\n            \u003c/div>\n            \u003cdiv style={{ ...S.card, marginTop: 16 }}>\n              \u003clabel style={S.label}>Preview — Team update\u003c/label>\n              \u003cdiv style={{ fontSize: 13, color: C.text, whiteSpace: 'pre-wrap', lineHeight: 1.6 }}>{team}\u003c/div>\n            \u003c/div>\n          \u003c/div>\n        )}\n\n        {screen === 'history' && (\n          \u003cdiv style={S.card}>\n            \u003ch2 style={S.h2}>History\u003c/h2>\n            \u003cp style={S.p}>Reuse a past update as a starting point.\u003c/p>\n            {history.map(h => (\n              \u003cdiv key={h.t} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '12px 0', borderBottom: `1px solid ${C.border}` }}>\n                \u003cdiv>\n                  \u003cdiv style={{ fontSize: 14, fontWeight: 600 }}>{h.t}\u003c/div>\n                  \u003cdiv style={{ fontSize: 12.5, color: C.sub }}>{h.d} · {h.n}\u003c/div>\n                \u003c/div>\n                \u003cbutton onClick={() => { setScreen('output'); }} style={{ ...S.btn, background: C.accentSoft, color: C.accent }}>Reuse\u003c/button>\n              \u003c/div>\n            ))}\n          \u003c/div>\n        )}\n      \u003c/div>\n    \u003c/div>\n  );\n}\n"},{"label":"M","ideaId":3,"idea":"A decision log that tracks what was decided, why, and when.","code":"import React, {useState} from \"react\";\n\nconst colors = {\n  primary: \"#2C3E50\",\n  secondary: \"#34495E\",\n  accent: \"#2980B9\",\n  bg: \"#ECF0F1\",\n  card: \"#FFFFFF\",\n  text: \"#2C3E50\"\n};\nconst spacing = {p: 12, m: 12, r: 8, br: 4};\nconst btnStyle = {\n  background: colors.accent,\n  color: \"#fff\",\n  border: \"none\",\n  padding: `${spacing.p}px ${spacing.p * 2}px`,\n  margin: spacing.r,\n  borderRadius: spacing.br,\n  cursor: \"pointer\"\n};\nconst inputStyle = {\n  width: \"100%\",\n  padding: spacing.p,\n  marginBottom: spacing.m,\n  border: `1px solid ${colors.secondary}`,\n  borderRadius: spacing.br,\n  fontSize: 14\n};\n\nexport default function App() {\n  const [screen, setScreen] = useState(\"feed\");\n  const [decisions, setDecisions] = useState([\n    {\n      id: 1,\n      title: \"Adopt React 18\",\n      desc: \"Upgrade UI library to React 18 for concurrent features.\",\n      rationale: \"Improved performance and future‑proofing.\",\n      alternatives: [\"Stay on 17\", \"Switch to Vue\"],\n      stakeholders: [\"Alice\", \"Bob\"],\n      tags: [\"frontend\", \"upgrade\"],\n      date: \"2024-08-01\",\n      owner: \"Alice\",\n      updates: [\"Reviewed by team on 08/05.\"]\n    },\n    {\n      id: 2,\n      title: \"Select Cloud Provider\",\n      desc: \"Choose primary infrastructure host.\",\n      rationale: \"Cost, compliance, and latency considerations.\",\n      alternatives: [\"AWS\", \"GCP\", \"Azure\"],\n      stakeholders: [\"Carol\", \"Dave\"],\n      tags: [\"ops\", \"infrastructure\"],\n      date: \"2024-07-15\",\n      owner: \"Carol\",\n      updates: []\n    },\n    {\n      id: 3,\n      title: \"Introduce Code Review Policy\",\n      desc: \"Make peer reviews mandatory for all PRs.\",\n      rationale: \"Raise code quality and knowledge sharing.\",\n      alternatives: [\"Optional reviews\", \"Automated checks only\"],\n      stakeholders: [\"Eve\"],\n      tags: [\"process\"],\n      date: \"2024-06-20\",\n      owner: \"Eve\",\n      updates: [\"Policy rolled out 06/30.\"]\n    }\n  ]);\n  const [selected, setSelected] = useState(null);\n  const [search, setSearch] = useState(\"\");\n  const [filterTag, setFilterTag] = useState(\"\");\n  const [team, setTeam] = useState([\"Alice\", \"Bob\", \"Carol\", \"Dave\", \"Eve\"]);\n  const [tags, setTags] = useState([\"frontend\", \"upgrade\", \"ops\", \"infrastructure\", \"process\"]);\n\n  // New Decision form state\n  const [title, setTitle] = useState(\"\");\n  const [desc, setDesc] = useState(\"\");\n  const [rationale, setRationale] = useState(\"\");\n  const [alternatives, setAlternatives] = useState(\"\");\n  const [stakeholders, setStakeholders] = useState(\"\");\n  const [tagSelect, setTagSelect] = useState(\"\");\n  const [date, setDate] = useState(\"\");\n\n  const filtered = decisions.filter(d => {\n    const matchText = d.title.toLowerCase().includes(search.toLowerCase()) ||\n                      d.desc.toLowerCase().includes(search.toLowerCase());\n    const matchTag = filterTag ? d.tags.includes(filterTag) : true;\n    return matchText && matchTag;\n  });\n\n  const nav = (\n    \u003cdiv style={{display:\"flex\", background:colors.primary, padding:spacing.p}}>\n      {[\"feed\",\"new\",\"search\",\"team\"].map(k=>(\n        \u003cbutton key=k style={{...btnStyle, background:screen===k?colors.accent:colors.secondary}} onClick={()=>{setScreen(k);setSelected(null);}}>{k===\"feed\"?\"Decision Feed\":k===\"new\"?\"New Decision\":k===\"search\"?\"Search/Filter\":k===\"team\"?\"Team Settings\":k}\u003c/button>\n      ))}\n    \u003c/div>\n  );\n\n  let body;\n  if (screen===\"feed\") {\n    body = (\n      \u003cdiv style={{padding:spacing.p}}>\n        \u003ch2 style={{color:colors.primary}}>Decision Log\u003c/h2>\n        {filtered.map(d=>(\n          \u003cdiv key={d.id} style={{background:colors.card, padding:spacing.p, marginBottom:spacing.m, borderRadius:spacing.br, cursor:\"pointer\"}} onClick={()=>{setSelected(d);setScreen(\"detail\");}}>\n            \u003cstrong>{d.title}\u003c/strong> \u003cspan style={{color:colors.secondary}}>{d.date}\u003c/span>\n            \u003cp>{d.desc}\u003c/p>\n            \u003csmall>Tags: {d.tags.join(\", \")}\u003c/small>\n          \u003c/div>\n        ))}\n        {filtered.length===0 && \u003cp>No decisions match.\u003c/p>}\n      \u003c/div>\n    );\n  } else if (screen===\"new\") {\n    body = (\n      \u003cdiv style={{padding:spacing.p}}>\n        \u003ch2 style={{color:colors.primary}}>Add New Decision\u003c/h2>\n        \u003cinput style={inputStyle} placeholder=\"Title\" value={title} onChange={e=>setTitle(e.target.value)} />\n        \u003ctextarea style={inputStyle} placeholder=\"Short description\" rows={2} value={desc} onChange={e=>setDesc(e.target.value)} />\n        \u003ctextarea style={inputStyle} placeholder=\"Rationale (why)\" rows={2} value={rationale} onChange={e=>setRationale(e.target.value)} />\n        \u003cinput style={inputStyle} placeholder=\"Alternatives (comma‑separated)\" value={alternatives} onChange={e=>setAlternatives(e.target.value)} />\n        \u003cinput style={inputStyle} placeholder=\"Stakeholders (comma‑separated)\" value={stakeholders} onChange={e=>setStakeholders(e.target.value)} />\n        \u003cselect style={inputStyle} value={tagSelect} onChange={e=>setTagSelect(e.target.value)}>\n          \u003coption value=\"\">Select tag\u003c/option>\n          {tags.map(t=> \u003coption key={t} value={t}>{t}\u003c/option>)}\n        \u003c/select>\n        \u003cinput style={inputStyle} type=\"date\" value={date} onChange={e=>setDate(e.target.value)} />\n        \u003cbutton style={btnStyle} onClick={()=>{\n          const newDec = {\n            id: Date.now(),\n            title,\n            desc,\n            rationale,\n            alternatives: alternatives.split(\",\").map(s=>s.trim()).filter(Boolean),\n            stakeholders: stakeholders.split(\",\").map(s=>s.trim()).filter(Boolean),\n            tags: tagSelect? [tagSelect] : [],\n            date,\n            owner: \"You\",\n            updates: []\n          };\n          setDecisions([newDec,...decisions]);\n          setTitle(\"\");setDesc(\"\");setRationale(\"\");setAlternatives(\"\");setStakeholders(\"\");setTagSelect(\"\");setDate(\"\");\n          setScreen(\"feed\");\n        }}>Save Decision\u003c/button>\n      \u003c/div>\n    );\n  } else if (screen===\"detail\" && selected) {\n    body = (\n      \u003cdiv style={{padding:spacing.p}}>\n        \u003ch2 style={{color:colors.primary}}>{selected.title}\u003c/h2>\n        \u003cp>\u003cstrong>Date:\u003c/strong> {selected.date} | \u003cstrong>Owner:\u003c/strong> {selected.owner}\u003c/p>\n        \u003cp>{selected.desc}\u003c/p>\n        \u003cp>\u003cstrong>Rationale:\u003c/strong> {selected.rationale}\u003c/p>\n        \u003cp>\u003cstrong>Alternatives:\u003c/strong> {selected.alternatives.join(\", \")}\u003c/p>\n        \u003cp>\u003cstrong>Stakeholders:\u003c/strong> {selected.stakeholders.join(\", \")}\u003c/p>\n        \u003cp>\u003cstrong>Tags:\u003c/strong> {selected.tags.join(\", \")}\u003c/p>\n        \u003ch4>Updates\u003c/h4>\n        {selected.updates.length===0 && \u003cp>No updates yet.\u003c/p>}\n        \u003cul>{selected.updates.map((u,i)=>\u003cli key={i}>{u}\u003c/li>)}\u003c/ul>\n        \u003cbutton style={btnStyle} onClick={()=>{\n          const note = prompt(\"Add update note:\");\n          if(note){\n            const upd = {...selected, updates:[...selected.updates,note]};\n            setDecisions(decisions.map(d=>d.id===upd.id?upd:d));\n            setSelected(upd);\n          }\n        }}>Add Update\u003c/button>\n        \u003cbutton style={btnStyle} onClick={()=>setScreen(\"feed\")}>Back to Feed\u003c/button>\n      \u003c/div>\n    );\n  } else if (screen===\"search\") {\n    body = (\n      \u003cdiv style={{padding:spacing.p}}>\n        \u003ch2 style={{color:colors.primary}}>Search & Filter\u003c/h2>\n        \u003cinput style={inputStyle} placeholder=\"Keyword…\" value={search} onChange={e=>setSearch(e.target.value)} />\n        \u003cselect style={inputStyle} value={filterTag} onChange={e=>setFilterTag(e.target.value)}>\n          \u003coption value=\"\">All tags\u003c/option>\n          {tags.map(t=> \u003coption key={t} value={t}>{t}\u003c/option>)}\n        \u003c/select>\n        {filtered.map(d=>(\n          \u003cdiv key={d.id} style={{background:colors.card, padding:spacing.p, marginBottom:spacing.m, borderRadius:spacing.br}} onClick={()=>{setSelected(d);setScreen(\"detail\");}}>\n            \u003cstrong>{d.title}\u003c/strong> \u003csmall>{d.date}\u003c/small>\n          \u003c/div>\n        ))}\n        {filtered.length===0 && \u003cp>No matches.\u003c/p>}\n      \u003c/div>\n    );\n  } else if (screen===\"team\") {\n    body = (\n      \u003cdiv style={{padding:spacing.p}}>\n        \u003ch2 style={{color:colors.primary}}>Team Settings\u003c/h2>\n        \u003ch4>Members\u003c/h4>\n        \u003cul>{team.map(m=> \u003cli key={m}>{m}\u003c/li>)}\u003c/ul>\n        \u003ch4>Tags\u003c/h4>\n        \u003cul>{tags.map(t=> \u003cli key={t}>{t}\u003c/li>)}\u003c/ul>\n        \u003cp style={{color:colors.secondary, fontSize:12}}>Permissions are managed per‑project (placeholder).\u003c/p>\n      \u003c/div>\n    );\n  }\n\n  return (\n    \u003cdiv style={{fontFamily:\"Arial,Helvetica,sans-serif\", background:colors.bg, minHeight:\"100vh\", color:colors.text}}>\n      {nav}\n      \u003cdiv>{body}\u003c/div>\n    \u003c/div>\n  );\n}\n"},{"label":"N","ideaId":3,"idea":"A decision log that tracks what was decided, why, and when.","code":"import { useState } from \"react\";\n\nconst C = {\n  bg: \"#f6f8fa\",\n  card: \"#ffffff\",\n  border: \"#e3e8ee\",\n  text: \"#1f2d3d\",\n  muted: \"#6b7a8d\",\n  accent: \"#3d6bb3\",\n  accentSoft: \"#eaf0fa\",\n  success: \"#2e7d5b\",\n  warn: \"#a86b1f\",\n};\n\nconst styles = {\n  app: { minHeight: \"100vh\", background: C.bg, color: C.text, fontFamily: \"system-ui, -apple-system, Segoe UI, Roboto, sans-serif\", fontSize: 14, lineHeight: 1.5 },\n  nav: { display: \"flex\", alignItems: \"center\", gap: 4, padding: \"12px 24px\", background: C.card, borderBottom: `1px solid ${C.border}`, flexWrap: \"wrap\" },\n  brand: { fontWeight: 700, fontSize: 18, color: C.accent, marginRight: 20, letterSpacing: 0.2 },\n  tab: (active) => ({ padding: \"7px 14px\", borderRadius: 8, cursor: \"pointer\", border: \"none\", background: active ? C.accentSoft : \"transparent\", color: active ? C.accent : C.muted, fontWeight: active ? 600 : 500, fontSize: 14 }),\n  wrap: { maxWidth: 880, margin: \"0 auto\", padding: \"24px 20px 60px\" },\n  card: { background: C.card, border: `1px solid ${C.border}`, borderRadius: 12, padding: 18, marginBottom: 12 },\n  h1: { fontSize: 22, fontWeight: 700, margin: \"0 0 4px\" },\n  h2: { fontSize: 15, fontWeight: 600, margin: \"0 0 12px\" },\n  sub: { color: C.muted, fontSize: 13, margin: \"0 0 20px\" },\n  label: { display: \"block\", fontSize: 12, fontWeight: 600, color: C.muted, marginBottom: 6, textTransform: \"uppercase\", letterSpacing: 0.4 },\n  input: { width: \"100%\", padding: \"9px 11px\", border: `1px solid ${C.border}`, borderRadius: 8, fontSize: 14, boxSizing: \"border-box\", fontFamily: \"inherit\", color: C.text, background: \"#fff\", outline: \"none\" },\n  btn: { background: C.accent, color: \"#fff\", border: \"none\", padding: \"9px 18px\", borderRadius: 8, fontSize: 14, fontWeight: 600, cursor: \"pointer\" },\n  btnGhost: { background: \"transparent\", color: C.accent, border: `1px solid ${C.accent}`, padding: \"8px 16px\", borderRadius: 8, fontSize: 13, fontWeight: 600, cursor: \"pointer\" },\n  chip: (active) => ({ padding: \"5px 12px\", borderRadius: 20, fontSize: 12, fontWeight: 600, cursor: \"pointer\", border: `1px solid ${active ? C.accent : C.border}`, background: active ? C.accentSoft : \"#fff\", color: active ? C.accent : C.muted }),\n  tag: { display: \"inline-block\", padding: \"2px 9px\", borderRadius: 20, fontSize: 11, fontWeight: 600, background: C.accentSoft, color: C.accent, marginRight: 6 },\n  row: { display: \"flex\", gap: 10, alignItems: \"center\", flexWrap: \"wrap\" },\n  divider: { height: 1, background: C.border, margin: \"16px 0\" },\n  field: { marginBottom: 14 },\n  meta: { fontSize: 12, color: C.muted },\n};\n\nconst decisions = [\n  { id: 1, title: \"Migrate payments to Stripe\", desc: \"Move off legacy processor to reduce failed charges.\", owner: \"Priya Nair\", date: \"2024-11-12\", tags: [\"infra\", \"billing\"], status: \"Active\", rationale: \"Legacy processor had 4.2% failure rate and no webhook reliability. Stripe cut failures to 1.1% in pilot.\", alternatives: \"Braintree, Adyen, staying with legacy processor\", stakeholders: \"Priya Nair, Marcus Webb, Finance\", updates: [{ who: \"Marcus Webb\", when: \"2024-11-20\", text: \"Rollout completed for all EU customers.\" }] },\n  { id: 2, title: \"Adopt quarterly OKR cadence\", desc: \"Replace annual goals with quarterly OKRs.\", owner: \"Devon Ellis\", date: \"2024-10-28\", tags: [\"process\"], status: \"Active\", rationale: \"Annual goals drifted out of sync with roadmap shifts. Quarterly cadence keeps priorities current.\", alternatives: \"Keep annual goals, half-yearly review\", stakeholders: \"Leadership team\", updates: [] },\n  { id: 3, title: \"Sunset the Legacy Reports page\", desc: \"Deprecate old reporting UI in favor of Insights.\", owner: \"Sara Kim\", date: \"2024-09-15\", tags: [\"product\"], status: \"Superseded\", rationale: \"Only 2% of users opened it; maintenance cost high.\", alternatives: \"Keep with limited support, rebuild entirely\", stakeholders: \"Sara Kim, Support\", updates: [{ who: \"Sara Kim\", when: \"2024-10-02\", text: \"Superseded by Insights v2 release.\" }] },\n  { id: 4, title: \"Standardize on Postgres 16\", desc: \"Upgrade all database clusters this quarter.\", owner: \"Marcus Webb\", date: \"2024-08-30\", tags: [\"infra\"], status: \"Active\", rationale: \"Pinned 5.5 years to v12; missing performance and security patches.\", alternatives: \"Stay on v12, migrate to MySQL\", stakeholders: \"Marcus Webb, Priya Nair\", updates: [] },\n];\n\nconst tags = [\"infra\", \"billing\", \"process\", \"product\"];\nconst members = [\n  { name: \"Priya Nair\", role: \"Admin\", email: \"priya@acme.io\" },\n  { name: \"Marcus Webb\", role: \"Editor\", email: \"marcus@acme.io\" },\n  { name: \"Devon Ellis\", role: \"Editor\", email: \"devon@acme.io\" },\n  { name: \"Sara Kim\", role: \"Viewer\", email: \"sara@acme.io\" },\n];\n\nexport default function App() {\n  const [screen, setScreen] = useState(\"feed\");\n  const [selected, setSelected] = useState(null);\n  const [tagFilter, setTagFilter] = useState(\"all\");\n  const [query, setQuery] = useState(\"\");\n  const [form, setForm] = useState({ title: \"\", desc: \"\", rationale: \"\", alternatives: \"\", stakeholders: \"\", tag: \"infra\", date: \"2024-11-15\" });\n\n  const nav = (s) => { setScreen(s); if (s !== \"detail\") setSelected(null); };\n\n  const setF = (k, v) => setForm((f) => ({ ...f, [k]: v }));\n\n  const filtered = decisions.filter((d) => (tagFilter === \"all\" || d.tags.includes(tagFilter)) && (query === \"\" || (d.title + d.desc + d.owner).toLowerCase().includes(query.toLowerCase())));\n\n  let body;\n  if (screen === \"feed\") {\n    body = (\n      \u003cdiv style={styles.wrap}>\n        \u003ch1 style={styles.h1}>Decision Log\u003c/h1>\n        \u003cp style={styles.sub}>Chronological record of team decisions. Newest first.\u003c/p>\n        \u003cdiv style={{ ...styles.row, marginBottom: 16 }}>\n          {[\"all\", ...tags].map((t) => (\n            \u003cbutton key={t} style={styles.chip(tagFilter === t)} onClick={() => setTagFilter(t)}>{t === \"all\" ? \"All\" : t}\u003c/button>\n          ))}\n        \u003c/div>\n        {filtered.map((d) => (\n          \u003cdiv key={d.id} style={{ ...styles.card, cursor: \"pointer\" }} onClick={() => { setSelected(d); setScreen(\"detail\"); }}>\n            \u003cdiv style={{ display: \"flex\", justifyContent: \"space-between\", gap: 12 }}>\n              \u003cdiv style={{ fontWeight: 600, fontSize: 15 }}>{d.title}\u003c/div>\n              \u003cspan style={{ ...styles.meta, color: d.status === \"Superseded\" ? C.warn : C.success, fontWeight: 600 }}>{d.status}\u003c/span>\n            \u003c/div>\n            \u003cp style={{ ...styles.meta, margin: \"6px 0\" }}>{d.desc}\u003c/p>\n            \u003cdiv style={styles.row}>\n              {d.tags.map((t) => \u003cspan key={t} style={styles.tag}>{t}\u003c/span>)}\n              \u003cspan style={styles.meta}>{d.owner} · {d.date}\u003c/span>\n            \u003c/div>\n          \u003c/div>\n        ))}\n      \u003c/div>\n    );\n  } else if (screen === \"new\") {\n    body = (\n      \u003cdiv style={styles.wrap}>\n        \u003ch1 style={styles.h1}>New Decision\u003c/h1>\n        \u003cp style={styles.sub}>Capture context so future teammates understand the why.\u003c/p>\n        \u003cdiv style={styles.card}>\n          \u003cdiv style={styles.field}>\u003clabel style={styles.label}>Title\u003c/label>\u003cinput style={styles.input} value={form.title} onChange={(e) => setF(\"title\", e.target.value)} placeholder=\"e.g. Migrate payments to Stripe\" />\u003c/div>\n          \u003cdiv style={styles.field}>\u003clabel style={styles.label}>Short description\u003c/label>\u003cinput style={styles.input} value={form.desc} onChange={(e) => setF(\"desc\", e.target.value)} placeholder=\"One-line summary\" />\u003c/div>\n          \u003cdiv style={styles.field}>\u003clabel style={styles.label}>Rationale\u003c/label>\u003ctextarea style={{ ...styles.input, minHeight: 70 }} value={form.rationale} onChange={(e) => setF(\"rationale\", e.target.value)} placeholder=\"Why this decision?\" />\u003c/div>\n          \u003cdiv style={styles.field}>\u003clabel style={styles.label}>Alternatives considered\u003c/label>\u003cinput style={styles.input} value={form.alternatives} onChange={(e) => setF(\"alternatives\", e.target.value)} placeholder=\"Comma-separated\" />\u003c/div>\n          \u003cdiv style={styles.field}>\u003clabel style={styles.label}>Key stakeholders\u003c/label>\u003cinput style={styles.input} value={form.stakeholders} onChange={(e) => setF(\"stakeholders\", e.target.value)} placeholder=\"Names involved\" />\u003c/div>\n          \u003cdiv style={{ display: \"flex\", gap: 14 }}>\n            \u003cdiv style={{ ...styles.field, flex: 1 }}>\n              \u003clabel style={styles.label}>Category\u003c/label>\n              \u003cselect style={styles.input} value={form.tag} onChange={(e) => setF(\"tag\", e.target.value)}>{tags.map((t) => \u003coption key={t}>{t}\u003c/option>)}\u003c/select>\n            \u003c/div>\n            \u003cdiv style={{ ...styles.field, flex: 1 }}>\n              \u003clabel style={styles.label}>Decision date\u003c/label>\n              \u003cinput type=\"date\" style={styles.input} value={form.date} onChange={(e) => setF(\"date\", e.target.value)} />\n            \u003c/div>\n          \u003c/div>\n          \u003cdiv style={styles.divider} />\n          \u003cdiv style={styles.row}>\n            \u003cbutton style={styles.btn} onClick={() => nav(\"feed\")}>Save Decision\u003c/button>\n            \u003cbutton style={{ ...styles.btnGhost, borderColor: C.border, color: C.muted }} onClick={() => nav(\"feed\")}>Cancel\u003c/button>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n    );\n  } else if (screen === \"detail\" && selected) {\n    body = (\n      \u003cdiv style={styles.wrap}>\n        \u003cbutton style={{ ...styles.btnGhost, border: \"none\", padding: 0, marginBottom: 14 }} onClick={() => nav(\"feed\")}>← Back to log\u003c/button>\n        \u003cdiv style={{ display: \"flex\", justifyContent: \"space-between\", gap: 12, flexWrap: \"wrap\" }}>\n          \u003ch1 style={styles.h1}>{selected.title}\u003c/h1>\n          \u003cspan style={{ ...styles.meta, color: selected.status === \"Superseded\" ? C.warn : C.success, fontWeight: 600 }}>{selected.status}\u003c/span>\n        \u003c/div>\n        \u003cp style={styles.sub}>{selected.desc}\u003c/p>\n        \u003cdiv style={styles.card}>\n          \u003ch2 style={styles.h2}>Decision details\u003c/h2>\n          \u003cp style={{ margin: \"0 0 10px\" }}>\u003cstrong>Rationale.\u003c/strong> {selected.rationale}\u003c/p>\n          \u003cp style={{ margin: \"0 0 10px\" }}>\u003cstrong>Alternatives considered.\u003c/strong> {selected.alternatives}\u003c/p>\n          \u003cp style={{ margin: \"0 0 10px\" }}>\u003cstrong>Stakeholders.\u003c/strong> {selected.stakeholders}\u003c/p>\n          \u003cdiv style={styles.row}>\n            {selected.tags.map((t) => \u003cspan key={t} style={styles.tag}>{t}\u003c/span>)}\n            \u003cspan style={styles.meta}>Owner: {selected.owner} · Decided {selected.date}\u003c/span>\n          \u003c/div>\n        \u003c/div>\n        \u003cdiv style={styles.card}>\n          \u003ch2 style={styles.h2}>Updates & comments\u003c/h2>\n          {selected.updates.length === 0 && \u003cp style={{ ...styles.meta, margin: 0 }}>No updates yet.\u003c/p>}\n          {selected.updates.map((u, i) => (\n            \u003cdiv key={i} style={{ marginBottom: 10 }}>\n              \u003cdiv style={{ fontWeight: 600, fontSize: 13 }}>{u.who} \u003cspan style={styles.meta}>· {u.when}\u003c/span>\u003c/div>\n              \u003cdiv style={styles.meta}>{u.text}\u003c/div>\n            \u003c/div>\n          ))}\n          \u003cdiv style={styles.divider} />\n          \u003cinput style={styles.input} placeholder=\"Add an update or comment…\" />\n          \u003cdiv style={{ ...styles.row, marginTop: 12 }}>\n            \u003cbutton style={styles.btn}>Post Update\u003c/button>\n            \u003cbutton style={{ ...styles.btnGhost, borderColor: C.border, color: C.muted }}>Mark as Superseded\u003c/button>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n    );\n  } else if (screen === \"search\") {\n    body = (\n      \u003cdiv style={styles.wrap}>\n        \u003ch1 style={styles.h1}>Search & Filter\u003c/h1>\n        \u003cp style={styles.sub}>Find past decisions by keyword, tag, owner, or date range.\u003c/p>\n        \u003cdiv style={styles.card}>\n          \u003cdiv style={styles.field}>\u003cinput style={styles.input} placeholder=\"Search decisions…\" value={query} onChange={(e) => setQuery(e.target.value)} />\u003c/div>\n          \u003cdiv style={styles.row}>\n            {[\"all\", ...tags].map((t) => \u003cbutton key={t} style={styles.chip(tagFilter === t)} onClick={() => setTagFilter(t)}>{t === \"all\" ? \"All tags\" : t}\u003c/button>)}\n          \u003c/div>\n        \u003c/div>\n        \u003cp style={{ ...styles.meta, marginBottom: 10 }}>{filtered.length} result{filtered.length !== 1 ? \"s\" : \"\"}\u003c/p>\n        {filtered.map((d) => (\n          \u003cdiv key={d.id} style={{ ...styles.card, cursor: \"pointer\" }} onClick={() => { setSelected(d); setScreen(\"detail\"); }}>\n            \u003cdiv style={{ fontWeight: 600 }}>{d.title}\u003c/div>\n            \u003cdiv style={styles.meta}>{d.owner} · {d.date} · {d.tags.join(\", \")}\u003c/div>\n          \u003c/div>\n        ))}\n        {filtered.length === 0 && \u003cp style={styles.meta}>No decisions match your filters.\u003c/p>}\n      \u003c/div>\n    );\n  } else {\n    body = (\n      \u003cdiv style={styles.wrap}>\n        \u003ch1 style={styles.h1}>Team Settings\u003c/h1>\n        \u003cp style={styles.sub}>Manage members, tags, and permissions for the decision log.\u003c/p>\n        \u003cdiv style={styles.card}>\n          \u003ch2 style={styles.h2}>Members\u003c/h2>\n          {members.map((m) => (\n            \u003cdiv key={m.email} style={{ display: \"flex\", justifyContent: \"space-between\", padding: \"9px 0\", borderBottom: `1px solid ${C.border}` }}>\n              \u003cdiv>\u003cdiv style={{ fontWeight: 600 }}>{m.name}\u003c/div>\u003cdiv style={styles.meta}>{m.email}\u003c/div>\u003c/div>\n              \u003cspan style={styles.tag}>{m.role}\u003c/span>\n            \u003c/div>\n          ))}\n        \u003c/div>\n        \u003cdiv style={styles.card}>\n          \u003ch2 style={styles.h2}>Tags\u003c/h2>\n          \u003cdiv style={styles.row}>{tags.map((t) => \u003cspan key={t} style={styles.tag}>{t}\u003c/span>)}\u003cbutton style={{ ...styles.btnGhost, padding: \"3px 10px\" }}>+ Add tag\u003c/button>\u003c/div>\n        \u003c/div>\n        \u003cdiv style={styles.card}>\n          \u003ch2 style={styles.h2}>Permissions\u003c/h2>\n          \u003cp style={{ ...styles.meta, margin: 0 }}>Admins can manage members and tags. Editors can create and update decisions. Viewers have read-only access.\u003c/p>\n        \u003c/div>\n      \u003c/div>\n    );\n  }\n\n  return (\n    \u003cdiv style={styles.app}>\n      \u003cdiv style={styles.nav}>\n        \u003cdiv style={styles.brand}>Decido\u003c/div>\n        {[[\"feed\", \"Feed\"], [\"new\", \"New Decision\"], [\"search\", \"Search & Filter\"], [\"settings\", \"Team Settings\"]].map(([k, label]) => (\n          \u003cbutton key={k} style={styles.tab(screen === k)} onClick={() => nav(k)}>{label}\u003c/button>\n        ))}\n      \u003c/div>\n      {body}\n    \u003c/div>\n  );\n}\n"},{"label":"O","ideaId":3,"idea":"A decision log that tracks what was decided, why, and when.","code":"import React, { useState } from \"react\";\n\nconst colors = {\n  bg: \"#f7f9fa\",\n  card: \"#ffffff\",\n  border: \"#e0e6e9\",\n  text: \"#1f2d33\",\n  subtext: \"#5c6b70\",\n  accent: \"#2f6f5e\",\n  accentLight: \"#e6f0ec\",\n  tag: \"#eef2f5\",\n  danger: \"#b5533c\",\n};\n\nconst font = { fontFamily: \"Georgia, 'Times New Roman', serif\" };\nconst label = { fontSize: 12, color: colors.subtext, fontWeight: \"bold\", letterSpacing: 0.5, textTransform: \"uppercase\" };\nconst input = { width: \"100%\", padding: \"8px 10px\", border: `1px solid ${colors.border}`, borderRadius: 6, fontSize: 14, marginTop: 4, marginBottom: 14, boxSizing: \"border-box\", ...font };\nconst card = { background: colors.card, border: `1px solid ${colors.border}`, borderRadius: 10, padding: 16, marginBottom: 14 };\nconst btn = { background: colors.accent, color: \"#fff\", border: \"none\", borderRadius: 6, padding: \"9px 16px\", fontSize: 14, cursor: \"pointer\", ...font };\nconst tabBtn = (active) => ({\n  padding: \"10px 14px\", cursor: \"pointer\", border: \"none\", background: \"none\",\n  borderBottom: active ? `3px solid ${colors.accent}` : \"3px solid transparent\",\n  color: active ? colors.accent : colors.subtext, fontWeight: active ? \"bold\" : \"normal\", fontSize: 14, ...font,\n});\n\nconst decisions = [\n  { id: 1, title: \"Adopt PostgreSQL over MongoDB for core data store\", desc: \"Switching primary database to support relational integrity as billing features grow.\", rationale: \"Billing and subscription data is highly relational; need strong consistency and JOIN support.\", alternatives: \"Stayed on MongoDB with schema validation; evaluated CockroachDB.\", stakeholders: \"Priya Nair (Eng Lead), Marcus Webb (CTO)\", tags: [\"Engineering\", \"Infrastructure\"], date: \"2024-03-12\", owner: \"Priya Nair\", status: \"Active\",\n    updates: [{ date: \"2024-05-02\", text: \"Migration completed for billing service; other services scheduled Q3.\" }] },\n  { id: 2, title: \"Move to quarterly OKRs instead of annual goals\", desc: \"Shorten planning cycles to react faster to market feedback.\", rationale: \"Annual goals were consistently outdated by Q2; teams need tighter feedback loops.\", alternatives: \"Bi-annual planning; rolling monthly goals.\", stakeholders: \"Elena Ruiz (COO), all team leads\", tags: [\"Operations\", \"Strategy\"], date: \"2024-01-22\", owner: \"Elena Ruiz\", status: \"Active\", updates: [] },\n  { id: 3, title: \"Sunset legacy mobile app (v1)\", desc: \"Deprecate the original iOS/Android app in favor of the web app.\", rationale: \"Maintenance cost outweighs the shrinking user base (\u003c 4% of MAU).\", alternatives: \"Keep app in maintenance-only mode; rebuild natively.\", stakeholders: \"Dan Okoro (Product), Priya Nair (Eng Lead)\", tags: [\"Product\"], date: \"2023-11-08\", owner: \"Dan Okoro\", status: \"Superseded\", updates: [{ date: \"2024-02-14\", text: \"Superseded by decision to build a lightweight PWA instead.\" }] },\n  { id: 4, title: \"Hire through agencies for Q2 contractor needs\", desc: \"Use staffing agencies rather than in-house recruiting for short-term roles.\", rationale: \"Faster ramp-up during crunch period; recruiting team is at capacity.\", alternatives: \"Delay hiring; expand recruiting team temporarily.\", stakeholders: \"Elena Ruiz (COO), Sam Whitfield (HR)\", tags: [\"Operations\", \"People\"], date: \"2024-04-30\", owner: \"Sam Whitfield\", status: \"Active\", updates: [] },\n];\n\nconst allTags = [\"Engineering\", \"Infrastructure\", \"Operations\", \"Strategy\", \"Product\", \"People\"];\nconst members = [\n  { name: \"Priya Nair\", role: \"Eng Lead\", access: \"Admin\" },\n  { name: \"Elena Ruiz\", role: \"COO\", access: \"Admin\" },\n  { name: \"Dan Okoro\", role: \"Product Manager\", access: \"Editor\" },\n  { name: \"Sam Whitfield\", role: \"HR Lead\", access: \"Editor\" },\n  { name: \"Marcus Webb\", role: \"CTO\", access: \"Viewer\" },\n];\n\nexport default function App() {\n  const [screen, setScreen] = useState(\"feed\");\n  const [selected, setSelected] = useState(decisions[0]);\n  const [query, setQuery] = useState(\"\");\n\n  const filtered = decisions.filter((d) =>\n    d.title.toLowerCase().includes(query.toLowerCase()) || d.tags.some((t) => t.toLowerCase().includes(query.toLowerCase()))\n  );\n\n  const renderTag = (t) => (\n    \u003cspan key={t} style={{ background: colors.tag, color: colors.accent, borderRadius: 20, padding: \"3px 10px\", fontSize: 12, marginRight: 6 }}>{t}\u003c/span>\n  );\n\n  return (\n    \u003cdiv style={{ ...font, background: colors.bg, minHeight: \"100vh\", color: colors.text }}>\n      \u003cdiv style={{ padding: \"18px 24px\", borderBottom: `1px solid ${colors.border}`, background: colors.card }}>\n        \u003ch1 style={{ margin: 0, fontSize: 22, color: colors.accent }}>Decido\u003c/h1>\n        \u003cdiv style={{ fontSize: 13, color: colors.subtext }}>A calm, searchable record of why decisions were made.\u003c/div>\n      \u003c/div>\n      \u003cdiv style={{ display: \"flex\", borderBottom: `1px solid ${colors.border}`, background: colors.card, paddingLeft: 16 }}>\n        {[\"feed\", \"new\", \"detail\", \"search\", \"settings\"].map((s) => (\n          \u003cbutton key={s} style={tabBtn(screen === s)} onClick={() => setScreen(s)}>\n            {{ feed: \"Decision Feed\", new: \"New Decision\", detail: \"Decision Detail\", search: \"Search & Filter\", settings: \"Team Settings\" }[s]}\n          \u003c/button>\n        ))}\n      \u003c/div>\n\n      \u003cdiv style={{ maxWidth: 720, margin: \"0 auto\", padding: 24 }}>\n        {screen === \"feed\" && (\n          \u003cdiv>\n            \u003cdiv style={{ display: \"flex\", gap: 8, marginBottom: 16 }}>\n              {allTags.slice(0, 4).map((t) => \u003cspan key={t} style={{ ...card, padding: \"6px 12px\", margin: 0, fontSize: 12, color: colors.subtext }}>{t}\u003c/span>)}\n            \u003c/div>\n            {decisions.map((d) => (\n              \u003cdiv key={d.id} style={{ ...card, cursor: \"pointer\" }} onClick={() => { setSelected(d); setScreen(\"detail\"); }}>\n                \u003cdiv style={{ display: \"flex\", justifyContent: \"space-between\" }}>\n                  \u003cstrong>{d.title}\u003c/strong>\n                  \u003cspan style={{ fontSize: 12, color: d.status === \"Active\" ? colors.accent : colors.danger }}>{d.status}\u003c/span>\n                \u003c/div>\n                \u003cdiv style={{ fontSize: 13, color: colors.subtext, margin: \"6px 0\" }}>{d.desc}\u003c/div>\n                \u003cdiv style={{ fontSize: 12, color: colors.subtext }}>{d.date} · {d.owner}\u003c/div>\n                \u003cdiv style={{ marginTop: 8 }}>{d.tags.map(renderTag)}\u003c/div>\n              \u003c/div>\n            ))}\n          \u003c/div>\n        )}\n\n        {screen === \"new\" && (\n          \u003cdiv style={card}>\n            \u003clabel style={label}>Title\u003c/label>\n            \u003cinput style={input} placeholder=\"e.g. Consolidate support tools into Zendesk\" />\n            \u003clabel style={label}>Short description\u003c/label>\n            \u003ctextarea style={{ ...input, height: 50 }} placeholder=\"One or two sentences summarizing the decision\" />\n            \u003clabel style={label}>Rationale\u003c/label>\n            \u003ctextarea style={{ ...input, height: 60 }} placeholder=\"Why this decision was made\" />\n            \u003clabel style={label}>Alternatives considered\u003c/label>\n            \u003ctextarea style={{ ...input, height: 50 }} placeholder=\"Options that were weighed and rejected\" />\n            \u003clabel style={label}>Key stakeholders\u003c/label>\n            \u003cinput style={input} placeholder=\"e.g. Priya Nair, Marcus Webb\" />\n            \u003clabel style={label}>Tags / Category\u003c/label>\n            \u003cinput style={input} placeholder=\"e.g. Engineering, Infrastructure\" />\n            \u003clabel style={label}>Decision date\u003c/label>\n            \u003cinput style={input} type=\"date\" defaultValue=\"2024-06-01\" />\n            \u003cbutton style={btn} onClick={() => setScreen(\"feed\")}>Save Decision\u003c/button>\n          \u003c/div>\n        )}\n\n        {screen === \"detail\" && (\n          \u003cdiv style={card}>\n            \u003cdiv style={{ display: \"flex\", justifyContent: \"space-between\" }}>\n              \u003ch2 style={{ margin: 0, fontSize: 19 }}>{selected.title}\u003c/h2>\n              \u003cspan style={{ fontSize: 12, color: selected.status === \"Active\" ? colors.accent : colors.danger }}>{selected.status}\u003c/span>\n            \u003c/div>\n            \u003cdiv style={{ fontSize: 12, color: colors.subtext, margin: \"6px 0 14px\" }}>{selected.date} · Owner: {selected.owner}\u003c/div>\n            \u003cdiv style={{ marginBottom: 10 }}>{selected.tags.map(renderTag)}\u003c/div>\n            \u003cp>\u003cb>Description:\u003c/b> {selected.desc}\u003c/p>\n            \u003cp>\u003cb>Rationale:\u003c/b> {selected.rationale}\u003c/p>\n            \u003cp>\u003cb>Alternatives considered:\u003c/b> {selected.alternatives}\u003c/p>\n            \u003cp>\u003cb>Stakeholders:\u003c/b> {selected.stakeholders}\u003c/p>\n            \u003cdiv style={{ borderTop: `1px solid ${colors.border}`, marginTop: 14, paddingTop: 14 }}>\n              \u003clabel style={label}>Updates\u003c/label>\n              {selected.updates.length === 0 && \u003cdiv style={{ fontSize: 13, color: colors.subtext }}>No updates yet.\u003c/div>}\n              {selected.updates.map((u, i) => (\n                \u003cdiv key={i} style={{ fontSize: 13, marginTop: 6 }}>{u.date}: {u.text}\u003c/div>\n              ))}\n              \u003cdiv style={{ display: \"flex\", gap: 10, marginTop: 12 }}>\n                \u003cbutton style={btn}>Add Update\u003c/button>\n                \u003cbutton style={{ ...btn, background: colors.danger }}>Mark Superseded\u003c/button>\n              \u003c/div>\n            \u003c/div>\n          \u003c/div>\n        )}\n\n        {screen === \"search\" && (\n          \u003cdiv>\n            \u003cinput style={input} placeholder=\"Search by keyword, tag, or owner...\" value={query} onChange={(e) => setQuery(e.target.value)} />\n            \u003cdiv style={{ display: \"flex\", gap: 10, marginBottom: 16 }}>\n              \u003cselect style={{ ...input, marginBottom: 0 }}>\u003coption>All Tags\u003c/option>{allTags.map((t) => \u003coption key={t}>{t}\u003c/option>)}\u003c/select>\n              \u003cselect style={{ ...input, marginBottom: 0 }}>\u003coption>All Owners\u003c/option>{members.map((m) => \u003coption key={m.name}>{m.name}\u003c/option>)}\u003c/select>\n              \u003cinput style={{ ...input, marginBottom: 0 }} type=\"date\" />\n            \u003c/div>\n            {filtered.map((d) => (\n              \u003cdiv key={d.id} style={{ ...card, cursor: \"pointer\" }} onClick={() => { setSelected(d); setScreen(\"detail\"); }}>\n                \u003cstrong>{d.title}\u003c/strong>\n                \u003cdiv style={{ fontSize: 12, color: colors.subtext, marginTop: 4 }}>{d.date} · {d.owner}\u003c/div>\n              \u003c/div>\n            ))}\n            {filtered.length === 0 && \u003cdiv style={{ color: colors.subtext }}>No decisions match your search.\u003c/div>}\n          \u003c/div>\n        )}\n\n        {screen === \"settings\" && (\n          \u003cdiv>\n            \u003cdiv style={card}>\n              \u003clabel style={label}>Team Members\u003c/label>\n              {members.map((m) => (\n                \u003cdiv key={m.name} style={{ display: \"flex\", justifyContent: \"space-between\", padding: \"8px 0\", borderBottom: `1px solid ${colors.border}` }}>\n                  \u003cspan>{m.name} \u003cspan style={{ color: colors.subtext, fontSize: 12 }}>({m.role})\u003c/span>\u003c/span>\n                  \u003cspan style={{ fontSize: 12, color: colors.accent }}>{m.access}\u003c/span>\n                \u003c/div>\n              ))}\n              \u003cbutton style={{ ...btn, marginTop: 12 }}>Invite Member\u003c/button>\n            \u003c/div>\n            \u003cdiv style={card}>\n              \u003clabel style={label}>Tags\u003c/label>\n              \u003cdiv style={{ marginTop: 8 }}>{allTags.map(renderTag)}\u003c/div>\n              \u003cbutton style={{ ...btn, marginTop: 12 }}>Add Tag\u003
