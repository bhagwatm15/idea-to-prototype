c/button>\n            \u003c/div>\n          \u003c/div>\n        )}\n      \u003c/div>\n    \u003c/div>\n  );\n}\n"},{"label":"P","ideaId":3,"idea":"A decision log that tracks what was decided, why, and when.","code":"import React, { useState } from \"react\";\n\nconst C = {\n  bg: \"#f7f8fa\",\n  card: \"#ffffff\",\n  border: \"#e2e6ed\",\n  text: \"#1f2933\",\n  sub: \"#627080\",\n  accent: \"#2f6f5e\",\n  accentSoft: \"#e4efe9\",\n  warn: \"#8a5a1c\",\n  chip: \"#eef1f5\",\n};\n\nconst styles = {\n  app: { fontFamily: \"'Inter', 'Segoe UI', system-ui, sans-serif\", background: C.bg, color: C.text, minHeight: \"100vh\", padding: \"0 0 40px\" },\n  header: { background: C.card, borderBottom: `1px solid ${C.border}`, padding: \"16px 28px\", display: \"flex\", alignItems: \"center\", gap: 28, flexWrap: \"wrap\" },\n  logo: { fontSize: 20, fontWeight: 700, letterSpacing: -0.4, color: C.accent },\n  tabs: { display: \"flex\", gap: 6, flexWrap: \"wrap\" },\n  tab: (active) => ({ padding: \"7px 14px\", borderRadius: 8, border: \"none\", cursor: \"pointer\", fontSize: 13.5, fontWeight: 600, background: active ? C.accentSoft : \"transparent\", color: active ? C.accent : C.sub }),\n  body: { maxWidth: 900, margin: \"0 auto\", padding: \"26px 28px\" },\n  h1: { fontSize: 22, fontWeight: 700, margin: \"0 0 4px\" },\n  sub: { fontSize: 13.5, color: C.sub, margin: \"0 0 20px\" },\n  card: { background: C.card, border: `1px solid ${C.border}`, borderRadius: 12, padding: 18, marginBottom: 12 },\n  row: { display: \"flex\", justifyContent: \"space-between\", alignItems: \"baseline\", gap: 12, flexWrap: \"wrap\" },\n  title: { fontSize: 15.5, fontWeight: 650, margin: 0 },\n  meta: { fontSize: 12.5, color: C.sub, marginTop: 6 },\n  chip: { display: \"inline-block\", background: C.chip, color: C.sub, fontSize: 11.5, padding: \"3px 9px\", borderRadius: 20, marginRight: 6, fontWeight: 600 },\n  status: (s) => ({ fontSize: 11.5, fontWeight: 700, padding: \"3px 9px\", borderRadius: 20, background: s === \"Active\" ? C.accentSoft : \"#f3ece0\", color: s === \"Active\" ? C.accent : C.warn }),\n  input: { width: \"100%\", boxSizing: \"border-box\", padding: \"9px 11px\", borderRadius: 8, border: `1px solid ${C.border}`, fontSize: 13.5, fontFamily: \"inherit\", color: C.text, background: \"#fcfdfe\", marginBottom: 14 },\n  label: { display: \"block\", fontSize: 12.5, fontWeight: 650, color: C.sub, marginBottom: 5 },\n  btn: { background: C.accent, color: \"#fff\", border: \"none\", padding: \"10px 20px\", borderRadius: 8, fontSize: 13.5, fontWeight: 650, cursor: \"pointer\" },\n  btnGhost: { background: \"transparent\", color: C.accent, border: `1px solid ${C.accent}`, padding: \"7px 14px\", borderRadius: 8, fontSize: 12.5, fontWeight: 650, cursor: \"pointer\" },\n  filterBar: { display: \"flex\", gap: 8, flexWrap: \"wrap\", marginBottom: 18 },\n  filter: (active) => ({ padding: \"6px 13px\", borderRadius: 20, border: `1px solid ${active ? C.accent : C.border}`, background: active ? C.accentSoft : C.card, color: active ? C.accent : C.sub, fontSize: 12.5, fontWeight: 600, cursor: \"pointer\" }),\n  detail: { fontSize: 13.5, lineHeight: 1.65, color: \"#3a4653\" },\n  field: { marginTop: 14 },\n  fieldH: { fontSize: 12, fontWeight: 700, color: C.sub, textTransform: \"uppercase\", letterSpacing: 0.5, marginBottom: 4 },\n  comment: { borderTop: `1px solid ${C.border}`, paddingTop: 12, marginTop: 12, fontSize: 13, color: \"#3a4653\" },\n  memberRow: { display: \"flex\", justifyContent: \"space-between\", padding: \"11px 0\", borderBottom: `1px solid ${C.border}`, fontSize: 13.5 },\n};\n\nconst decisions = [\n  { id: 1, title: \"Standardize on Postgres over MongoDB\", owner: \"Priya Nair\", date: \"Mar 4, 2025\", tags: [\"Data\", \"Infra\"], status: \"Active\", desc: \"Chose Postgres for the core platform to get transactions and mature tooling.\", rationale: \"Relational integrity for billing and audit logs outweighed schema flexibility. Team already skilled in SQL.\", alternatives: \"MongoDB, CockroachDB, DynamoDB\", stakeholders: \"Priya Nair, Tomás Rivera, Dana Okafor\" },\n  { id: 2, title: \"Sunset the legacy mobile v1 client\", owner: \"Dana Okafor\", date: \"Feb 18, 2025\", tags: [\"Product\", \"Roadmap\"], status: \"Active\", desc: \"Drop v1 client support after the Q3 migration window closes.\", rationale: \"Only 1.8% of DAU remain on v1. Maintenance cost is ~2 engineer-weeks per quarter.\", alternatives: \"Keep v1 read-only, Full rewrite\", stakeholders: \"Dana Okafor, Ben Hartley\" },\n  { id: 3, title: \"Switch pricing to per-seat tiers\", owner: \"Tomás Rivera\", date: \"Jan 27, 2025\", tags: [\"Pricing\", \"GTM\"], status: \"Superseded\", desc: \"Moved from usage-based to three per-seat tiers.\", rationale: \"Sales cycles were stalling on unpredictable invoices. Per-seat matched how buyers budget.\", alternatives: \"Flat rate, Hybrid usage + seat\", stakeholders: \"Tomás Rivera, Priya Nair, Lena Fischer\" },\n  { id: 4, title: \"Adopt incident.io for on-call\", owner: \"Ben Hartley\", date: \"Dec 9, 2024\", tags: [\"Infra\", \"Ops\"], status: \"Active\", desc: \"Replaced PagerDuty with incident.io for on-call and postmortems.\", rationale: \"Better Slack workflow and cheaper at our seat count. Postmortems auto-drafted.\", alternatives: \"PagerDuty, Opsgenie, Build in-house\", stakeholders: \"Ben Hartley, Priya Nair\" },\n];\n\nexport default function App() {\n  const [screen, setScreen] = useState(\"feed\");\n  const [openId, setOpenId] = useState(1);\n  const [filter, setFilter] = useState(\"All\");\n  const [query, setQuery] = useState(\"\");\n  const [form, setForm] = useState({ title: \"\", desc: \"\", rationale: \"\", alternatives: \"\", stakeholders: \"\", tags: \"\", date: \"Mar 12, 2025\" });\n\n  const tabs = [[\"feed\", \"Decision Feed\"], [\"new\", \"New Decision\"], [\"search\", \"Search & Filter\"], [\"settings\", \"Team Settings\"]];\n  const open = decisions.find((d) => d.id === openId) || decisions[0];\n  const tagFilters = [\"All\", \"Data\", \"Product\", \"Pricing\", \"Infra\"];\n  const filtered = decisions.filter((d) => filter === \"All\" || d.tags.includes(filter));\n  const searched = decisions.filter((d) => {\n    const q = query.toLowerCase();\n    return !q || d.title.toLowerCase().includes(q) || d.owner.toLowerCase().includes(q) || d.tags.join(\" \").toLowerCase().includes(q);\n  });\n\n  const set = (k) => (e) => setForm({ ...form, [k]: e.target.value });\n\n  return (\n    \u003cdiv style={styles.app}>\n      \u003cdiv style={styles.header}>\n        \u003cdiv style={styles.logo}>Decido\u003c/div>\n        \u003cdiv style={styles.tabs}>\n          {tabs.map(([k, label]) => (\n            \u003cbutton key={k} style={styles.tab(screen === k)} onClick={() => setScreen(k)}>{label}\u003c/button>\n          ))}\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv style={styles.body}>\n        {screen === \"feed\" && (\n          \u003cdiv>\n            \u003ch1 style={styles.h1}>Decision Feed\u003c/h1>\n            \u003cp style={styles.sub}>{decisions.length} logged decisions · most recent first\u003c/p>\n            \u003cdiv style={styles.filterBar}>\n              {tagFilters.map((t) => (\n                \u003cbutton key={t} style={styles.filter(filter === t)} onClick={() => setFilter(t)}>{t}\u003c/button>\n              ))}\n            \u003c/div>\n            {filtered.map((d) => (\n              \u003cdiv key={d.id} style={styles.card}>\n                \u003cdiv style={styles.row}>\n                  \u003cdiv>\n                    \u003ch3 style={styles.title}>{d.title}\u003c/h3>\n                    \u003cdiv style={styles.meta}>{d.owner} · {d.date} · {d.tags.join(\", \")}\u003c/div>\n                  \u003c/div>\n                  \u003cspan style={styles.status(d.status)}>{d.status}\u003c/span>\n                \u003c/div>\n                \u003cp style={styles.detail}>{d.desc}\u003c/p>\n                \u003cbutton style={styles.btnGhost} onClick={() => { setOpenId(d.id); setScreen(\"detail\"); }}>Open decision →\u003c/button>\n              \u003c/div>\n            ))}\n          \u003c/div>\n        )}\n\n        {screen === \"detail\" && (\n          \u003cdiv>\n            \u003cbutton style={styles.btnGhost} onClick={() => setScreen(\"feed\")}>← Back to feed\u003c/button>\n            \u003cdiv style={{ ...styles.card, marginTop: 16 }}>\n              \u003cdiv style={styles.row}>\n                \u003ch1 style={{ ...styles.h1, margin: 0 }}>{open.title}\u003c/h1>\n                \u003cspan style={styles.status(open.status)}>{open.status}\u003c/span>\n              \u003c/div>\n              \u003cdiv style={styles.meta}>{open.owner} · {open.date} · {open.tags.join(\", \")}\u003c/div>\n              \u003cdiv style={styles.field}>\u003cdiv style={styles.fieldH}>Decision\u003c/div>\u003cdiv style={styles.detail}>{open.desc}\u003c/div>\u003c/div>\n              \u003cdiv style={styles.field}>\u003cdiv style={styles.fieldH}>Rationale\u003c/div>\u003cdiv style={styles.detail}>{open.rationale}\u003c/div>\u003c/div>\n              \u003cdiv style={styles.field}>\u003cdiv style={styles.fieldH}>Alternatives considered\u003c/div>\u003cdiv style={styles.detail}>{open.alternatives}\u003c/div>\u003c/div>\n              \u003cdiv style={styles.field}>\u003cdiv style={styles.fieldH}>Stakeholders\u003c/div>\u003cdiv style={styles.detail}>{open.stakeholders}\u003c/div>\u003c/div>\n              \u003cdiv style={styles.comment}>\u003cb>Priya Nair\u003c/b> · Mar 6, 2025\u003cbr />Migration script merged. Revisit partitioning in Q3.\u003c/div>\n              \u003cdiv style={styles.comment}>\u003cb>Ben Hartley\u003c/b> · Mar 5, 2025\u003cbr />Added read replica for the reporting workload.\u003c/div>\n              \u003cdiv style={{ marginTop: 16, display: \"flex\", gap: 8 }}>\n                \u003cbutton style={styles.btn}>Add update\u003c/button>\n                \u003cbutton style={styles.btnGhost}>Mark as superseded\u003c/button>\n              \u003c/div>\n            \u003c/div>\n          \u003c/div>\n        )}\n\n        {screen === \"new\" && (\n          \u003cdiv>\n            \u003ch1 style={styles.h1}>New Decision\u003c/h1>\n            \u003cp style={styles.sub}>Capture what was decided, why, and who was involved.\u003c/p>\n            \u003cdiv style={styles.card}>\n              \u003clabel style={styles.label}>Title\u003c/label>\n              \u003cinput style={styles.input} value={form.title} onChange={set(\"title\")} placeholder=\"e.g. Standardize on Postgres\" />\n              \u003clabel style={styles.label}>Short description\u003c/label>\n              \u003cinput style={styles.input} value={form.desc} onChange={set(\"desc\")} placeholder=\"One or two sentences on the decision\" />\n              \u003clabel style={styles.label}>Rationale\u003c/label>\n              \u003cinput style={styles.input} value={form.rationale} onChange={set(\"rationale\")} placeholder=\"Why this option won\" />\n              \u003clabel style={styles.label}>Alternatives considered\u003c/label>\n              \u003cinput style={styles.input} value={form.alternatives} onChange={set(\"alternatives\")} placeholder=\"Comma separated\" />\n              \u003clabel style={styles.label}>Key stakeholders\u003c/label>\n              \u003cinput style={styles.input} value={form.stakeholders} onChange={set(\"stakeholders\")} placeholder=\"Comma separated names\" />\n              \u003clabel style={styles.label}>Tags / category\u003c/label>\n              \u003cinput style={styles.input} value={form.tags} onChange={set(\"tags\")} placeholder=\"e.g. Data, Infra\" />\n              \u003clabel style={styles.label}>Decision date\u003c/label>\n              \u003cinput style={styles.input} value={form.date} onChange={set(\"date\")} />\n              \u003cbutton style={styles.btn} onClick={() => setScreen(\"feed\")}>Save decision\u003c/button>\n            \u003c/div>\n          \u003c/div>\n        )}\n\n        {screen === \"search\" && (\n          \u003cdiv>\n            \u003ch1 style={styles.h1}>Search & Filter\u003c/h1>\n            \u003cp style={styles.sub}>Find past decisions by keyword, tag, owner, or date range.\u003c/p>\n            \u003cinput style={styles.input} value={query} onChange={(e) => setQuery(e.target.value)} placeholder=\"Search decisions, owners, tags…\" />\n            \u003cdiv style={styles.filterBar}>\n              {tagFilters.map((t) => (\n                \u003cbutton key={t} style={styles.filter(filter === t)} onClick={() => setFilter(t)}>{t}\u003c/button>\n              ))}\n            \u003c/div>\n            \u003cp style={styles.meta}>{searched.length} result{searched.length === 1 ? \"\" : \"s\"} · Jan 2025 – Mar 2025\u003c/p>\n            {searched.map((d) => (\n              \u003cdiv key={d.id} style={styles.card}>\n                \u003cdiv style={styles.row}>\n                  \u003ch3 style={styles.title}>{d.title}\u003c/h3>\n                  \u003cspan style={styles.status(d.status)}>{d.status}\u003c/span>\n                \u003c/div>\n                \u003cdiv style={styles.meta}>{d.owner} · {d.date} · {d.tags.map((t) => \u003cspan key={t} style={styles.chip}>{t}\u003c/span>)}\u003c/div>\n              \u003c/div>\n            ))}\n          \u003c/div>\n        )}\n\n        {screen === \"settings\" && (\n          \u003cdiv>\n            \u003ch1 style={styles.h1}>Team Settings\u003c/h1>\n            \u003cp style={styles.sub}>4 members · 6 tags · admin only for editing\u003c/p>\n            \u003cdiv style={styles.card}>\n              \u003cdiv style={styles.fieldH}>Members\u003c/div>\n              \u003cdiv style={styles.memberRow}>\u003cspan>Priya Nair\u003c/span>\u003cspan style={styles.chip}>Admin\u003c/span>\u003c/div>\n              \u003cdiv style={styles.memberRow}>\u003cspan>Tomás Rivera\u003c/span>\u003cspan style={styles.chip}>Editor\u003c/span>\u003c/div>\n              \u003cdiv style={styles.memberRow}>\u003cspan>Dana Okafor\u003c/span>\u003cspan style={styles.chip}>Editor\u003c/span>\u003c/div>\n              \u003cdiv style={styles.memberRow}>\u003cspan>Ben Hartley\u003c/span>\u003cspan style={styles.chip}>Viewer\u003c/span>\u003c/div>\n            \u003c/div>\n            \u003cdiv style={styles.card}>\n              \u003cdiv style={styles.fieldH}>Tags\u003c/div>\n              {[\"Data\", \"Infra\", \"Product\", \"Pricing\", \"GTM\", \"Ops\"].map((t) => \u003cspan key={t} style={styles.chip}>{t}\u003c/span>)}\n            \u003c/div>\n            \u003cdiv style={styles.card}>\n              \u003cdiv style={styles.fieldH}>Permissions\u003c/div>\n              \u003cdiv style={styles.detail}>Admins can edit and supersede any decision. Editors can add updates. Viewers can read and comment.\u003c/div>\n            \u003c/div>\n          \u003c/div>\n        )}\n      \u003c/div>\n    \u003c/div>\n  );\n}\n"},{"label":"Q","ideaId":3,"idea":"A decision log that tracks what was decided, why, and when.","code":"import React, { useState } from \"react\";\n\nexport default function App() {\n  const colors = {\n    primary: \"#2C3E50\",\n    accent: \"#3498DB\",\n    bg: \"#F5F7FA\",\n    text: \"#333\",\n    light: \"#FFF\",\n  };\n  const spacing = { s: 8, m: 16, l: 24 };\n  const btn = {\n    background: colors.accent,\n    color: colors.light,\n    border: \"none\",\n    padding: `${spacing.s}px ${spacing.m}px`,\n    margin: `${spacing.s}px`,\n    cursor: \"pointer\",\n  };\n  const input = {\n    padding: `${spacing.s}px`,\n    margin: `${spacing.s}px 0`,\n    width: \"100%\",\n    border: `1px solid ${colors.primary}`,\n    borderRadius: 4,\n  };\n  const container = {\n    fontFamily: \"Arial, sans-serif\",\n    color: colors.text,\n    background: colors.bg,\n    minHeight: \"100vh\",\n    padding: spacing.l,\n  };\n  const nav = {\n    display: \"flex\",\n    marginBottom: spacing.l,\n    borderBottom: `2px solid ${colors.primary}`,\n  };\n  const navBtn = (active) => ({\n    ...btn,\n    background: active ? colors.primary : colors.accent,\n  });\n\n  const [screen, setScreen] = useState(\"feed\");\n  const [decisions, setDecisions] = useState([\n    {\n      id: 1,\n      title: \"Adopt new UI library\",\n      desc: \"Switch to React Material UI for consistency\",\n      rationale: \"Better theming, community support\",\n      alternatives: \"Bootstrap, Ant Design\",\n      stakeholders: \"Design Lead, Frontend Team\",\n      tags: [\"UI\", \"Tech Debt\"],\n      date: \"2024-08-12\",\n      updates: [],\n      superseded: false,\n    },\n    {\n      id: 2,\n      title: \"Cloud provider migration\",\n      desc: \"Move services to AWS\",\n      rationale: \"Scalability and cost predictability\",\n      alternatives: \"Azure, GCP\",\n      stakeholders: \"Ops, Finance\",\n      tags: [\"Infrastructure\"],\n      date: \"2024-07-01\",\n      updates: [],\n      superseded: false,\n    },\n    {\n      id: 3,\n      title: \"Quarterly OKR process\",\n      desc: \"Implement OKR tracking tool\",\n      rationale: \"Align goals across teams\",\n      alternatives: \"Manual spreadsheets\",\n      stakeholders: \"HR, All Teams\",\n      tags: [\"Process\"],\n      date: \"2024-06-15\",\n      updates: [],\n      superseded: false,\n    },\n  ]);\n  const [selectedId, setSelectedId] = useState(null);\n  const [search, setSearch] = useState(\"\");\n  const [filterTag, setFilterTag] = useState(\"\");\n  const [newForm, setNewForm] = useState({\n    title: \"\",\n    desc: \"\",\n    rationale: \"\",\n    alternatives: \"\",\n    stakeholders: \"\",\n    tags: \"\",\n    date: \"\",\n  });\n  const [updateText, setUpdateText] = useState(\"\");\n\n  const currentDecision = decisions.find((d) => d.id === selectedId);\n\n  const renderNav = (\n    \u003cdiv style={nav}>\n      {[\"feed\", \"new\", \"search\", \"team\"].map((k) => (\n        \u003cbutton\n          key={k}\n          style={navBtn(screen === k)}\n          onClick={() => setScreen(k)}\n        >\n          {k === \"feed\"\n            ? \"Decision Feed\"\n            : k === \"new\"\n            ? \"New Decision\"\n            : k === \"search\"\n            ? \"Search & Filter\"\n            : \"Team Settings\"}\n        \u003c/button>\n      ))}\n    \u003c/div>\n  );\n\n  const renderFeed = (\n    \u003cdiv>\n      {decisions.map((d) => (\n        \u003cdiv\n          key={d.id}\n          style={{\n            background: colors.light,\n            padding: spacing.m,\n            marginBottom: spacing.m,\n            borderRadius: 4,\n            cursor: \"pointer\",\n          }}\n          onClick={() => {\n            setSelectedId(d.id);\n            setScreen(\"detail\");\n          }}\n        >\n          \u003cstrong>{d.title}\u003c/strong>\n          \u003cdiv style={{ fontSize: 12, color: colors.primary }}>{d.date}\u003c/div>\n          \u003cdiv>{d.tags.map((t) => `#${t}`).join(\" \")}\u003c/div>\n        \u003c/div>\n      ))}\n    \u003c/div>\n  );\n\n  const renderNew = (\n    \u003cform\n      onSubmit={(e) => {\n        e.preventDefault();\n        const newDec = {\n          id: Math.max(...decisions.map((d) => d.id)) + 1,\n          title: newForm.title,\n          desc: newForm.desc,\n          rationale: newForm.rationale,\n          alternatives: newForm.alternatives,\n          stakeholders: newForm.stakeholders,\n          tags: newForm.tags.split(\",\").map((t) => t.trim()),\n          date: newForm.date,\n          updates: [],\n          superseded: false,\n        };\n        setDecisions([newDec, ...decisions]);\n        setNewForm({\n          title: \"\",\n          desc: \"\",\n          rationale: \"\",\n          alternatives: \"\",\n          stakeholders: \"\",\n          tags: \"\",\n          date: \"\",\n        });\n        setScreen(\"feed\");\n      }}\n    >\n      {[\"title\", \"desc\", \"rationale\", \"alternatives\", \"stakeholders\", \"tags\", \"date\"].map(\n        (field) => (\n          \u003cdiv key={field}>\n            \u003clabel style={{ fontWeight: \"bold\" }}>\n              {field.charAt(0).toUpperCase() + field.slice(1)}:\n            \u003c/label>\n            \u003cinput\n              style={input}\n              type={field === \"date\" ? \"date\" : \"text\"}\n              value={newForm[field]}\n              onChange={(e) =>\n                setNewForm({ ...newForm, [field]: e.target.value })\n              }\n              required\n            />\n          \u003c/div>\n        )\n      )}\n      \u003cbutton style={btn} type=\"submit\">\n        Save Decision\n      \u003c/button>\n    \u003c/form>\n  );\n\n  const renderDetail = currentDecision && (\n    \u003cdiv style={{ background: colors.light, padding: spacing.m, borderRadius: 4 }}>\n      \u003ch2>{currentDecision.title}\u003c/h2>\n      \u003cp>{currentDecision.desc}\u003c/p>\n      \u003cp>\u003cstrong>Rationale:\u003c/strong> {currentDecision.rationale}\u003c/p>\n      \u003cp>\u003cstrong>Alternatives:\u003c/strong> {currentDecision.alternatives}\u003c/p>\n      \u003cp>\u003cstrong>Stakeholders:\u003c/strong> {currentDecision.stakeholders}\u003c/p>\n      \u003cp>\u003cstrong>Tags:\u003c/strong> {currentDecision.tags.map((t) => `#${t}`).join(\" \")}\u003c/p>\n      \u003cp>\u003cstrong>Date:\u003c/strong> {currentDecision.date}\u003c/p>\n      \u003cp>\u003cstrong>Status:\u003c/strong> {currentDecision.superseded ? \"Superseded\" : \"Active\"}\u003c/p>\n      \u003chr />\n      \u003ch4>Updates\u003c/h4>\n      {currentDecision.updates.length === 0 && \u003cp>No updates yet.\u003c/p>}\n      {currentDecision.updates.map((u, i) => (\n        \u003cdiv key={i} style={{ marginBottom: spacing.s }}>\n          \u003cem>{u}\u003c/em>\n        \u003c/div>\n      ))}\n      \u003ctextarea\n        style={{ ...input, height: 60 }}\n        placeholder=\"Add an update...\"\n        value={updateText}\n        onChange={(e) => setUpdateText(e.target.value)}\n      />\n      \u003cbutton\n        style={btn}\n        onClick={() => {\n          if (!updateText.trim()) return;\n          const upd = [...decisions];\n          const idx = upd.findIndex((d) => d.id === currentDecision.id);\n          upd[idx].updates.push(updateText.trim());\n          setDecisions(upd);\n          setUpdateText(\"\");\n        }}\n      >\n        Add Update\n      \u003c/button>\n      \u003cbutton\n        style={{ ...btn, background: currentDecision.superseded ? \"#95A5A6\" : \"#E74C3C\" }}\n        onClick={() => {\n          const upd = decisions.map((d) =>\n            d.id === currentDecision.id ? { ...d, superseded: !d.superseded } : d\n          );\n          setDecisions(upd);\n        }}\n      >\n        {currentDecision.superseded ? \"Re‑activate\" : \"Mark Superseded\"}\n      \u003c/button>\n      \u003cbutton style={btn} onClick={() => setScreen(\"feed\")}>\n        Back to Feed\n      \u003c/button>\n    \u003c/div>\n  );\n\n  const filtered = decisions.filter((d) => {\n    const matchesSearch = search\n      ? d.title.toLowerCase().includes(search.toLowerCase()) ||\n        d.desc.toLowerCase().includes(search.toLowerCase())\n      : true;\n    const matchesTag = filterTag ? d.tags.includes(filterTag) : true;\n    return matchesSearch && matchesTag;\n  });\n\n  const renderSearch = (\n    \u003cdiv>\n      \u003cinput\n        style={input}\n        placeholder=\"Keyword...\"\n        value={search}\n        onChange={(e) => setSearch(e.target.value)}\n      />\n      \u003cinput\n        style={input}\n        placeholder=\"Filter by tag (e.g., UI)\"\n        value={filterTag}\n        onChange={(e) => setFilterTag(e.target.value)}\n      />\n      {filtered.map((d) => (\n        \u003cdiv\n          key={d.id}\n          style={{\n            background: colors.light,\n            padding: spacing.m,\n            marginBottom: spacing.m,\n            borderRadius: 4,\n            cursor: \"pointer\",\n          }}\n          onClick={() => {\n            setSelectedId(d.id);\n            setScreen(\"detail\");\n          }}\n        >\n          \u003cstrong>{d.title}\u003c/strong> – {d.date}\n        \u003c/div>\n      ))}\n    \u003c/div>\n  );\n\n  const renderTeam = (\n    \u003cdiv>\n      \u003ch3>Members\u003c/h3>\n      \u003cul>\n        \u003cli>Alice – Admin\u003c/li>\n        \u003cli>Bob – Editor\u003c/li>\n        \u003cli>Carol – Viewer\u003c/li>\n      \u003c/ul>\n      \u003ch3>Tags\u003c/h3>\n      \u003cul>\n        \u003cli>UI\u003c/li>\n        \u003cli>Infrastructure\u003c/li>\n        \u003cli>Process\u003c/li>\n      \u003c/ul>\n    \u003c/div>\n  );\n\n  let main;\n  if (screen === \"feed\") main = renderFeed;\n  else if (screen === \"new\") main = renderNew;\n  else if (screen === \"detail\") main = renderDetail;\n  else if (screen === \"search\") main = renderSearch;\n  else if (screen === \"team\") main = renderTeam;\n\n  return (\n    \u003cdiv style={container}>\n      \u003ch1 style={{ color: colors.primary }}>Decido\u003c/h1>\n      {renderNav}\n      {main}\n    \u003c/div>\n  );\n}\n"},{"label":"R","ideaId":3,"idea":"A decision log that tracks what was decided, why, and when.","code":"import React, { useState } from \"react\";\n\nexport default function App() {\n  const colors = {\n    bg: \"#f4f6f8\",\n    card: \"#ffffff\",\n    primary: \"#2c5f7c\",\n    primaryDark: \"#1e4459\",\n    text: \"#1f2937\",\n    subtext: \"#6b7280\",\n    border: \"#e2e5e9\",\n    tag: \"#eaf1f4\",\n  };\n  const font = \"'Segoe UI', Helvetica, Arial, sans-serif\";\n  const page = { padding: 24, fontFamily: font, color: colors.text, maxWidth: 780, margin: \"0 auto\" };\n  const card = { background: colors.card, border: `1px solid ${colors.border}`, borderRadius: 10, padding: 18, marginBottom: 14 };\n  const label = { display: \"block\", fontSize: 13, color: colors.subtext, marginBottom: 4, marginTop: 12 };\n  const input = { width: \"100%\", padding: \"8px 10px\", border: `1px solid ${colors.border}`, borderRadius: 6, fontSize: 14, fontFamily: font, boxSizing: \"border-box\" };\n  const button = { background: colors.primary, color: \"#fff\", border: \"none\", padding: \"9px 16px\", borderRadius: 6, cursor: \"pointer\", fontSize: 14 };\n  const pill = { display: \"inline-block\", background: colors.tag, color: colors.primaryDark, padding: \"3px 10px\", borderRadius: 12, fontSize: 12, marginRight: 6 };\n\n  const [screen, setScreen] = useState(\"feed\");\n  const [decisions, setDecisions] = useState([\n    { id: 1, title: \"Adopt Postgres over MongoDB for core data store\", desc: \"Migrate primary datastore to Postgres for relational integrity.\", rationale: \"Need strong transactional guarantees for billing data.\", alternatives: \"MongoDB, DynamoDB\", stakeholders: \"Priya Anand, Tom Reyes\", tags: [\"Engineering\", \"Infra\"], date: \"2024-02-14\", owner: \"Priya Anand\", status: \"Active\", updates: [\"2024-03-01: Migration 60% complete.\"] },\n    { id: 2, title: \"Move to quarterly OKRs instead of annual goals\", desc: \"Switch planning cadence to quarterly for faster iteration.\", rationale: \"Annual goals became stale after Q2 market shifts.\", alternatives: \"Keep annual, monthly sprints\", stakeholders: \"Dana Wu, Leadership Team\", tags: [\"Strategy\"], date: \"2024-01-08\", owner: \"Dana Wu\", status: \"Active\", updates: [] },\n    { id: 3, title: \"Sunset legacy mobile app v1\", desc: \"Deprecate v1 app in favor of unified web app.\", rationale: \"Maintenance cost too high, low active usage (4%).\", alternatives: \"Keep supporting, partial rewrite\", stakeholders: \"Marcus Lee, Support Team\", tags: [\"Product\"], date: \"2023-11-20\", owner: \"Marcus Lee\", status: \"Superseded\", updates: [\"2024-01-15: Superseded by 'Unified App Rollout' decision.\"] },\n  ]);\n  const [selectedId, setSelectedId] = useState(1);\n  const [form, setForm] = useState({ title: \"\", desc: \"\", rationale: \"\", alternatives: \"\", stakeholders: \"\", tags: \"\", date: \"\" });\n  const [search, setSearch] = useState({ keyword: \"\", tag: \"All\", owner: \"All\", from: \"\", to: \"\" });\n\n  const tabs = [\"feed\", \"new\", \"detail\", \"search\", \"settings\"];\n  const tabLabels = { feed: \"Decision Feed\", new: \"New Decision\", detail: \"Decision Detail\", search: \"Search & Filter\", settings: \"Team Settings\" };\n  const selected = decisions.find((d) => d.id === selectedId);\n  const allTags = [\"All\", ...Array.from(new Set(decisions.flatMap((d) => d.tags)))];\n  const allOwners = [\"All\", ...Array.from(new Set(decisions.map((d) => d.owner)))];\n\n  const openDetail = (id) => { setSelectedId(id); setScreen(\"detail\"); };\n  const saveDecision = () => {\n    if (!form.title) return;\n    const nd = { id: Date.now(), title: form.title, desc: form.desc, rationale: form.rationale, alternatives: form.alternatives, stakeholders: form.stakeholders, tags: form.tags ? form.tags.split(\",\").map((t) => t.trim()) : [\"General\"], date: form.date || new Date().toISOString().slice(0, 10), owner: \"You\", status: \"Active\", updates: [] };\n    setDecisions([nd, ...decisions]);\n    setForm({ title: \"\", desc: \"\", rationale: \"\", alternatives: \"\", stakeholders: \"\", tags: \"\", date: \"\" });\n    setScreen(\"feed\");\n  };\n  const markSuperseded = () => setDecisions(decisions.map((d) => (d.id === selectedId ? { ...d, status: \"Superseded\" } : d)));\n  const addUpdate = () => setDecisions(decisions.map((d) => (d.id === selectedId ? { ...d, updates: [...d.updates, new Date().toISOString().slice(0, 10) + \": Reviewed, still on track.\" ] } : d)));\n\n  const filtered = decisions.filter((d) => {\n    const kw = search.keyword.toLowerCase();\n    const matchKw = !kw || d.title.toLowerCase().includes(kw) || d.desc.toLowerCase().includes(kw);\n    const matchTag = search.tag === \"All\" || d.tags.includes(search.tag);\n    const matchOwner = search.owner === \"All\" || d.owner === search.owner;\n    const matchFrom = !search.from || d.date >= search.from;\n    const matchTo = !search.to || d.date \u003c= search.to;\n    return matchKw && matchTag && matchOwner && matchFrom && matchTo;\n  });\n\n  return (\n    \u003cdiv style={{ background: colors.bg, minHeight: \"100vh\" }}>\n      \u003cdiv style={{ background: colors.primaryDark, color: \"#fff\", padding: \"16px 24px\" }}>\n        \u003cdiv style={{ maxWidth: 780, margin: \"0 auto\", display: \"flex\", justifyContent: \"space-between\", alignItems: \"center\" }}>\n          \u003cdiv style={{ fontSize: 20, fontWeight: 600 }}>Decido\u003c/div>\n          \u003cdiv style={{ display: \"flex\", gap: 6 }}>\n            {tabs.map((t) => (\n              \u003cdiv key={t} onClick={() => setScreen(t)} style={{ padding: \"6px 12px\", borderRadius: 6, cursor: \"pointer\", fontSize: 13, background: screen === t ? \"#fff\" : \"transparent\", color: screen === t ? colors.primaryDark : \"#dbe6ec\" }}>\n                {tabLabels[t]}\n              \u003c/div>\n            ))}\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv style={page}>\n        {screen === \"feed\" && (\n          \u003cdiv>\n            \u003ch2 style={{ marginBottom: 4 }}>Decision Log\u003c/h2>\n            \u003cp style={{ color: colors.subtext, marginTop: 0 }}>{decisions.length} decisions recorded\u003c/p>\n            \u003cdiv style={{ marginBottom: 14 }}>\n              {allTags.map((t) => (\n                \u003cspan key={t} style={{ ...pill, cursor: \"pointer\" }} onClick={() => { setSearch({ ...search, tag: t }); setScreen(\"search\"); }}>{t}\u003c/span>\n              ))}\n            \u003c/div>\n            {decisions.map((d) => (\n              \u003cdiv key={d.id} style={{ ...card, cursor: \"pointer\" }} onClick={() => openDetail(d.id)}>\n                \u003cdiv style={{ display: \"flex\", justifyContent: \"space-between\" }}>\n                  \u003cstrong>{d.title}\u003c/strong>\n                  \u003cspan style={{ fontSize: 12, color: d.status === \"Active\" ? colors.primary : \"#a15c00\" }}>{d.status}\u003c/span>\n                \u003c/div>\n                \u003cp style={{ color: colors.subtext, fontSize: 14 }}>{d.desc}\u003c/p>\n                \u003cdiv>{d.tags.map((t) => \u003cspan key={t} style={pill}>{t}\u003c/span>)}\u003c/div>\n                \u003cdiv style={{ fontSize: 12, color: colors.subtext, marginTop: 6 }}>{d.date} · {d.owner}\u003c/div>\n              \u003c/div>\n            ))}\n          \u003c/div>\n        )}\n\n        {screen === \"new\" && (\n          \u003cdiv style={card}>\n            \u003ch2 style={{ marginTop: 0 }}>Log a New Decision\u003c/h2>\n            \u003clabel style={label}>Title\u003c/label>\n            \u003cinput style={input} value={form.title} onChange={(e) => setForm({ ...form, title: e.target.value })} placeholder=\"e.g. Switch billing provider to Stripe\" />\n            \u003clabel style={label}>Short description\u003c/label>\n            \u003cinput style={input} value={form.desc} onChange={(e) => setForm({ ...form, desc: e.target.value })} placeholder=\"One or two sentences of context\" />\n            \u003clabel style={label}>Rationale\u003c/label>\n            \u003cinput style={input} value={form.rationale} onChange={(e) => setForm({ ...form, rationale: e.target.value })} placeholder=\"Why this decision was made\" />\n            \u003clabel style={label}>Alternatives considered\u003c/label>\n            \u003cinput style={input} value={form.alternatives} onChange={(e) => setForm({ ...form, alternatives: e.target.value })} placeholder=\"e.g. Braintree, Adyen\" />\n            \u003clabel style={label}>Key stakeholders\u003c/label>\n            \u003cinput style={input} value={form.stakeholders} onChange={(e) => setForm({ ...form, stakeholders: e.target.value })} placeholder=\"Names, comma separated\" />\n            \u003clabel style={label}>Tags (comma separated)\u003c/label>\n            \u003cinput style={input} value={form.tags} onChange={(e) => setForm({ ...form, tags: e.target.value })} placeholder=\"Finance, Infra\" />\n            \u003clabel style={label}>Decision date\u003c/label>\n            \u003cinput style={input} type=\"date\" value={form.date} onChange={(e) => setForm({ ...form, date: e.target.value })} />\n            \u003cbutton style={{ ...button, marginTop: 18 }} onClick={saveDecision}>Save Decision\u003c/button>\n          \u003c/div>\n        )}\n\n        {screen === \"detail\" && selected && (\n          \u003cdiv>\n            \u003cdiv style={card}>\n              \u003cdiv style={{ display: \"flex\", justifyContent: \"space-between\" }}>\n                \u003ch2 style={{ marginTop: 0 }}>{selected.title}\u003c/h2>\n                \u003cspan style={{ fontSize: 12, color: selected.status === \"Active\" ? colors.primary : \"#a15c00\" }}>{selected.status}\u003c/span>\n              \u003c/div>\n              \u003cp style={{ color: colors.subtext }}>{selected.desc}\u003c/p>\n              \u003cdiv style={{ marginBottom: 8 }}>{selected.tags.map((t) => \u003cspan key={t} style={pill}>{t}\u003c/span>)}\u003c/div>\n              \u003cp>\u003cstrong>Rationale:\u003c/strong> {selected.rationale}\u003c/p>\n              \u003cp>\u003cstrong>Alternatives considered:\u003c/strong> {selected.alternatives}\u003c/p>\n              \u003cp>\u003cstrong>Stakeholders:\u003c/strong> {selected.stakeholders}\u003c/p>\n              \u003cp style={{ fontSize: 12, color: colors.subtext }}>Decided {selected.date} by {selected.owner}\u003c/p>\n              \u003cdiv style={{ marginTop: 10 }}>\n                \u003cbutton style={button} onClick={addUpdate}>Add Update\u003c/button>\n                \u003cbutton style={{ ...button, background: \"#a15c00\", marginLeft: 8 }} onClick={markSuperseded}>Mark Superseded\u003c/button>\n              \u003c/div>\n            \u003c/div>\n            \u003ch3>Updates\u003c/h3>\n            {selected.updates.length === 0 && \u003cp style={{ color: colors.subtext }}>No updates yet.\u003c/p>}\n            {selected.updates.map((u, i) => \u003cdiv key={i} style={card}>{u}\u003c/div>)}\n          \u003c/div>\n        )}\n\n        {screen === \"search\" && (\n          \u003cdiv>\n            \u003ch2>Search & Filter\u003c/h2>\n            \u003cdiv style={card}>\n              \u003clabel style={label}>Keyword\u003c/label>\n              \u003cinput style={input} value={search.keyword} onChange={(e) => setSearch({ ...search, keyword: e.target.value })} placeholder=\"Search titles and descriptions\" />\n              \u003clabel style={label}>Tag\u003c/label>\n              \u003cselect style={input} value={search.tag} onChange={(e) => setSearch({ ...search, tag: e.target.value })}>\n                {allTags.map((t) => \u003coption key={t}>{t}\u003c/option>)}\n              \u003c/select>\n              \u003clabel style={label}>Owner\u003c/label>\n              \u003cselect style={input} value={search.owner} onChange={(e) => setSearch({ ...search, owner: e.target.value })}>\n                {allOwners.map((o) => \u003coption key={o}>{o}\u003c/option>)}\n              \u003c/select>\n              \u003cdiv style={{ display: \"flex\", gap: 10 }}>\n                \u003cdiv style={{ flex: 1 }}>\n                  \u003clabel style={label}>From\u003c/label>\n                  \u003cinput style={input} type=\"date\" value={search.from} onChange={(e) => setSearch({ ...search, from: e.target.value })} />\n                \u003c/div>\n                \u003cdiv style={{ flex: 1 }}>\n                  \u003clabel style={label}>To\u003c/label>\n                  \u003cinput style={input} type=\"date\" value={search.to} onChange={(e) => setSearch({ ...search, to: e.target.value })} />\n                \u003c/div>\n              \u003c/div>\n            \u003c/div>\n            \u003cp style={{ color: colors.subtext }}>{filtered.length} result(s)\u003c/p>\n            {filtered.map((d) => (\n              \u003cdiv key={d.id} style={{ ...card, cursor: \"pointer\" }} onClick={() => openDetail(d.id)}>\n                \u003cstrong>{d.title}\u003c/strong>\n                \u003cdiv style={{ fontSize: 12, color: colors.subtext }}>{d.date} · {d.owner}\u003c/div>\n              \u003c/div>\n            ))}\n          \u003c/div>\n        )}\n\n        {screen === \"settings\" && (\n          \u003cdiv>\n            \u003ch2>Team Settings\u003c/h2>\n            \u003cdiv style={card}>\n              \u003ch3 style={{ marginTop: 0 }}>Members\u003c/h3>\n              {[[\"Priya Anand\", \"Admin\"], [\"Tom Reyes\", \"Editor\"], [\"Dana Wu\", \"Admin\"], [\"Marcus Lee\", \"Viewer\"]].map(([n, r]) => (\n                \u003cdiv key={n} style={{ display: \"flex\", justifyContent: \"space-between\", padding: \"6px 0\", borderBottom: `1px solid ${colors.border}` }}>\n                  \u003cspan>{n}\u003c/span>\n                  \u003cspan style={{ color: colors.subtext, fontSize: 13 }}>{r}\u003c/span>\n                \u003c/div>\n              ))}\n              \u003cbutton style={{ ...button, marginTop: 14 }}>Invite Member\u003c/button>\n            \u003c/div>\n            \u003cdiv style={card}>\n              \u003ch3 style={{ marginTop: 0 }}>Tags\u003c/h3>\n              \u003cdiv>{allTags.filter((t) => t !== \"All\").map((t) => \u003cspan key={t} style={pill}>{t}\u003c/span>)}\u003c/div>\n              \u003cbutton style={{ ...button, marginTop: 14 }}>Add Tag\u003c/button>\n            \u003c/div>\n          \u003c/div>\n        )}\n      \u003c/div>\n    \u003c/div>\n  );\n}\n"},{"label":"S","ideaId":4,"idea":"An app that plans a week of meals around what's already in the fridge.","code":"import React, { useState } from 'react';\n\nconst App = () => {\n  const colors = { primary: '#2E7D32', secondary: '#A5D6A7', bg: '#F1FAF0', text: '#333' };\n  const spacing = { xs: 4, s: 8, m: 16, l: 24 };\n  const btnStyle = {\n    backgroundColor: colors.secondary,\n    border: 'none',\n    borderRadius: 4,\n    padding: `${spacing.xs}px ${spacing.s}px`,\n    margin: `${spacing.xs}px`,\n    cursor: 'pointer'\n  };\n  const navStyle = {\n    display: 'flex',\n    justifyContent: 'space-around',\n    backgroundColor: colors.primary,\n    color: '#fff',\n    padding: spacing.s\n  };\n  const container = { padding: spacing.m, backgroundColor: colors.bg, minHeight: '100vh', fontFamily: 'Arial, sans-serif', color: colors.text };\n  const screens = ['inventory', 'plan', 'recipe', 'shopping', 'settings'];\n  const [screen, setScreen] = useState('inventory');\n  const [selectedMeal, setSelectedMeal] = useState(null);\n\n  const inventory = [\n    { name: 'Eggs', qty: 12, unit: 'pcs' },\n    { name: 'Spinach', qty: 200, unit: 'g' },\n    { name: 'Cheddar', qty: 150, unit: 'g' }\n  ];\n  const plan = [\n    { day: 'Mon', meal: 'Spinach & Cheddar Omelette' },\n    { day: 'Tue', meal: 'Chicken Caesar Salad' },\n    { day: 'Wed', meal: 'Veggie Stir‑Fry' },\n    { day: 'Thu', meal: 'Pasta Primavera' },\n    { day: 'Fri', meal: 'Grilled Salmon' },\n    { day: 'Sat', meal: 'Taco Night' },\n    { day: 'Sun', meal: 'Roast Beef & Potatoes' }\n  ];\n  const recipe = {\n    title: 'Spinach & Cheddar Omelette',\n    ingredients: ['2 Eggs', '30g Spinach', '20g Cheddar', '1 tbsp Olive Oil'],\n    steps: ['Whisk eggs', 'Sauté spinach', 'Add eggs and cheese', 'Fold and serve']\n  };\n  const shopping = [\n    { name: 'Chicken Breast', qty: 2, unit: 'pcs' },\n    { name: 'Lettuce', qty: 1, unit: 'head' },\n    { name: 'Taco Shells', qty: 8, unit: 'pcs' }\n  ];\n  const preferences = { diet: 'None', household: 2, cuisine: 'Mixed' };\n\n  const renderNav = (\n    \u003cdiv style={navStyle}>\n      {screens.map(s => (\n        \u003cbutton\n          key={s}\n          style={{ ...btnStyle, opacity: screen === s ? 0.7 : 1 }}\n          onClick={() => setScreen(s)}\n        >\n          {s.charAt(0).toUpperCase() + s.slice(1)}\n        \u003c/button>\n      ))}\n    \u003c/div>\n  );\n\n  let content;\n  if (screen === 'inventory') {\n    content = (\n      \u003cdiv>\n        \u003ch2 style={{ marginBottom: spacing.m }}>Fridge & Pantry\u003c/h2>\n        {inventory.map((item, i) => (\n          \u003cdiv key={i} style={{ marginBottom: spacing.xs }}>\n            {item.name}: {item.qty}{item.unit}\n          \u003c/div>\n        ))}\n        \u003cbutton style={btnStyle}>+ Add Item\u003c/button>\n      \u003c/div>\n    );\n  } else if (screen === 'plan') {\n    content = (\n      \u003cdiv>\n        \u003ch2 style={{ marginBottom: spacing.m }}>7‑Day Meal Plan\u003c/h2>\n        {plan.map((p, i) => (\n          \u003cdiv key={i} style={{ display: 'flex', justifyContent: 'space-between', marginBottom: spacing.xs }}>\n            \u003cspan>{p.day}\u003c/span>\n            \u003cspan>{p.meal}\u003c/span>\n            \u003cbutton\n              style={btnStyle}\n              onClick={() => {\n                setSelectedMeal(p.meal);\n                setScreen('recipe');\n              }}\n            >\n              View\n            \u003c/button>\n          \u003c/div>\n        ))}\n        \u003cbutton style={btnStyle}>Swap a Meal\u003c/button>\n      \u003c/div>\n    );\n  } else if (screen === 'recipe') {\n    content = (\n      \u003cdiv>\n        \u003ch2 style={{ marginBottom: spacing.m }}>{recipe.title}\u003c/h2>\n        \u003ch4>Ingredients\u003c/h4>\n        \u003cul>\n          {recipe.ingredients.map((ing, i) => (\n            \u003cli key={i}>{ing}\u003c/li>\n          ))}\n        \u003c/ul>\n        \u003ch4>Steps\u003c/h4>\n        \u003col>\n          {recipe.steps.map((st, i) => (\n            \u003cli key={i}>{st}\u003c/li>\n          ))}\n        \u003c/ol>\n        \u003cbutton style={btnStyle} onClick={() => setScreen('plan')}>Back to Plan\u003c/button>\n      \u003c/div>\n    );\n  } else if (screen === 'shopping') {\n    content = (\n      \u003cdiv>\n        \u003ch2 style={{ marginBottom: spacing.m }}>Shopping List\u003c/h2>\n        {shopping.map((s, i) => (\n          \u003cdiv key={i} style={{ marginBottom: spacing.xs }}>\n            {s.name}: {s.qty}{s.unit}\n          \u003c/div>\n        ))}\n        \u003cbutton style={btnStyle}>Mark All Bought\u003c/button>\n      \u003c/div>\n    );\n  } else if (screen === 'settings') {\n    content = (\n      \u003cdiv>\n        \u003ch2 style={{ marginBottom: spacing.m }}>Preferences\u003c/h2>\n        \u003cdiv style={{ marginBottom: spacing.xs }}>Dietary: {preferences.diet}\u003c/div>\n        \u003cdiv style={{ marginBottom: spacing.xs }}>Household size: {preferences.household}\u003c/div>\n        \u003cdiv style={{ marginBottom: spacing.xs }}>Cuisine style: {preferences.cuisine}\u003c/div>\n        \u003cbutton style={btnStyle}>Edit Preferences\u003c/button>\n      \u003c/div>\n    );\n  }\n\n  return (\n    \u003cdiv style={container}>\n      {renderNav}\n      \u003cdiv style={{ marginTop: spacing.l }}>{content}\u003c/div>\n    \u003c/div>\n  );\n};\n\nexport default App;\n"},{"label":"T","ideaId":4,"idea":"An app that plans a week of meals around what's already in the fridge.","code":"import React, { useState } from \"react\";\n\nconst C = {\n  bg: \"#F5FBF6\",\n  card: \"#FFFFFF\",\n  green: \"#2FA36B\",\n  greenLight: \"#E3F4EA\",\n  lime: \"#A8DC6E\",\n  text: \"#1F3D2B\",\n  muted: \"#6E8A78\",\n  border: \"#D8EADF\",\n  orange: \"#F2994A\",\n};\nconst sh = { maxWidth: 520, margin: \"0 auto\", padding: \"0 16px 90px\" };\nconst card = {\n  background: C.card,\n  border: `1px solid ${C.border}`,\n  borderRadius: 14,\n  padding: 14,\n  marginBottom: 10,\n};\nconst btn = {\n  background: C.green,\n  color: \"white\",\n  border: \"none\",\n  borderRadius: 10,\n  padding: \"10px 14px\",\n  fontWeight: 600,\n  fontSize: 14,\n  cursor: \"pointer\",\n  fontFamily: \"inherit\",\n};\nconst chip = {\n  display: \"inline-block\",\n  background: C.greenLight,\n  color: C.green,\n  borderRadius: 20,\n  padding: \"3px 10px\",\n  fontSize: 12,\n  fontWeight: 600,\n  marginRight: 6,\n  marginTop: 6,\n};\nconst h2 = { fontSize: 22, margin: \"18px 0 10px\", color: C.text };\nconst sub = { color: C.muted, fontSize: 13, marginTop: -6, marginBottom: 14 };\n\nexport default function App() {\n  const [screen, setScreen] = useState(\"fridge\");\n\n  const tabs = [\n    [\"fridge\", \"🧊 Fridge\"],\n    [\"plan\", \"📅 Plan\"],\n    [\"list\", \"🛒 List\"],\n    [\"settings\", \"⚙️ Settings\"],\n  ];\n\n  return (\n    \u003cdiv style={{ fontFamily: \"system-ui,-apple-system,'Segoe UI',sans-serif\", background: C.bg, minHeight: \"100vh\", color: C.text }}>\n      \u003cdiv style={sh}>\n        \u003cdiv style={{ paddingTop: 20, paddingBottom: 4 }}>\n          \u003cdiv style={{ fontSize: 26, fontWeight: 800 }}>\n            Fridge\u003cspan style={{ color: C.green }}>Week\u003c/span>\n          \u003c/div>\n          \u003cdiv style={{ color: C.muted, fontSize: 13 }}>Cook what you have. Waste nothing.\u003c/div>\n        \u003c/div>\n\n        {screen === \"fridge\" && (\n          \u003cdiv>\n            \u003ch2 style={h2}>Fridge Inventory\u003c/h2>\n            \u003cdiv style={sub}>12 items tracked · updated 2 days ago\u003c/div>\n            \u003cbutton style={{ ...btn, width: \"100%\", marginBottom: 14 }}>📷 Scan barcode or receipt\u003c/button>\n            {[\n              { n: \"Chicken thighs\", q: \"500 g\", t: \"Use soon\" },\n              { n: \"Baby spinach\", q: \"200 g bag\", t: \"Use soon\" },\n              { n: \"Greek yogurt\", q: \"1 tub\", t: \"Fresh\" },\n              { n: \"Brown rice\", q: \"Half bag\", t: \"Pantry\" },\n              { n: \"Cherry tomatoes\", q: \"1 punnet\", t: \"Fresh\" },\n            ].map((it) => (\n              \u003cdiv key={it.n} style={{ ...card, display: \"flex\", justifyContent: \"space-between\", alignItems: \"center\" }}>\n                \u003cdiv>\n                  \u003cdiv style={{ fontWeight: 600 }}>{it.n}\u003c/div>\n                  \u003cdiv style={{ color: C.muted, fontSize: 12 }}>{it.q}\u003c/div>\n                \u003c/div>\n                \u003cspan style={{ ...chip, marginTop: 0, background: it.t === \"Use soon\" ? \"#FDEBD8\" : C.greenLight, color: it.t === \"Use soon\" ? C.orange : C.green }}>{it.t}\u003c/span>\n              \u003c/div>\n            ))}\n          \u003c/div>\n        )}\n\n        {screen === \"plan\" && (\n          \u003cdiv>\n            \u003ch2 style={h2}>Weekly Plan\u003c/h2>\n            \u003cdiv style={sub}>4 meals use what you have · 2 items to buy\u003c/div>\n            {[\n              { d: \"Mon\", m: \"Spinach & Chicken Rice Bowl\", s: \"From your fridge\" },\n              { d: \"Tue\", m: \"Tomato Yogurt Flatbread\", s: \"Borrows: flatbread + lemon\" },\n              { d: \"Wed\", m: \"Chicken & Veg Stir-fry\", s: \"From your fridge\" },\n              { d: \"Thu\", m: \"Greek Yogurt Overnight Oats\", s: \"From your fridge\" },\n              { d: \"Fri\", m: \"Tomato Rice Pilaf\", s: \"From your fridge\" },\n            ].map((r) => (\n              \u003cdiv key={r.d} style={{ ...card, display: \"flex\", alignItems: \"center\", gap: 12 }}>\n                \u003cdiv style={{ width: 42, height: 42, borderRadius: 10, background: C.greenLight, color: C.green, display: \"flex\", alignItems: \"center\", justifyContent: \"center\", fontWeight: 700, fontSize: 13 }}>\n                  {r.d}\n                \u003c/div>\n                \u003cdiv style={{ flex: 1 }}>\n                  \u003cdiv style={{ fontWeight: 600 }}>{r.m}\u003c/div>\n                  \u003cdiv style={{ color: C.muted, fontSize: 12 }}>{r.s}\u003c/div>\n                \u003c/div>\n                \u003cbutton onClick={() => setScreen(\"recipe\")} style={{ ...btn, padding: \"6px 10px\", fontSize: 12, background: C.greenLight, color: C.green }}>Swap\u003c/button>\n              \u003c/div>\n            ))}\n            \u003cbutton onClick={() => setScreen(\"list\")} style={{ ...btn, width: \"100%\", marginTop: 4 }}>Build shopping list →\u003c/button>\n          \u003c/div>\n        )}\n\n        {screen === \"recipe\" && (\n          \u003cdiv>\n            \u003ch2 style={h2}>Spinach & Chicken Rice Bowl\u003c/h2>\n            \u003cdiv style={sub}>35 min · serves 2 · 540 kcal\u003c/div>\n            \u003cdiv style={card}>\n              \u003cdiv style={{ fontWeight: 700, marginBottom: 6 }}>Ingredients\u003c/div>\n              \u003cdiv>· 300 g chicken thighs\u003c/div>\n              \u003cdiv>· 150 g baby spinach\u003c/div>\n              \u003cdiv>· 1 cup cooked brown rice\u003c/div>\n              \u003cdiv>· 1 tbsp olive oil, salt, pepper\u003c/div>\n            \u003c/div>\n            \u003cdiv style={card}>\n              \u003cdiv style={{ fontWeight: 700, marginBottom: 6 }}>Steps\u003c/div>\n              \u003cdiv>1. Season and pan-sear chicken 6 min per side.\u003c/div>\n              \u003cdiv>2. Wilt spinach in the same pan.\u003c/div>\n              \u003cdiv>3. Fold rice through, top with sliced chicken.\u003c/div>\n            \u003c/div>\n            \u003cdiv style={card}>\n              \u003cdiv style={{ fontWeight: 700, marginBottom: 2 }}>Substitutions\u003c/div>\n              \u003cspan style={chip}>No spinach → kale\u003c/span>\n              \u003cspan style={chip}>Brown rice → quinoa\u003c/span>\n            \u003c/div>\n            \u003cbutton onClick={() => setScreen(\"plan\")} style={{ ...btn, width: \"100%\" }}>✓ Mark as cooked\u003c/button>\n          \u003c/div>\n        )}\n\n        {screen === \"list\" && (\n          \u003cdiv>\n            \u003ch2 style={h2}>Shopping List\u003c/h2>\n            \u003cdiv style={sub}>6 ingredients · 2 stores · ~£11.40\u003c/div>\n            {[\n              { n: \"Flatbreads\", q: \"1 pack\" },\n              { n: \"Lemon\", q: \"2\" },\n              { n: \"Olive oil\", q: \"1 bottle\" },\n              { n: \"Onion\", q: \"3\" },\n            ].map((i) => (\n              \u003cdiv key={i.n} style={{ ...card, display: \"flex\", justifyContent: \"space-between\", alignItems: \"center\" }}>\n                \u003cdiv>\n                  \u003cdiv style={{ fontWeight: 600 }}>{i.n}\u003c/div>\n                  \u003cdiv style={{ color: C.muted, fontSize: 12 }}>{i.q}\u003c/div>\n                \u003c/div>\n                \u003cbutton style={{ ...btn, padding: \"6px 10px\", fontSize: 12, background: C.greenLight, color: C.green }}>Add\u003c/button>\n              \u003c/div>\n            ))}\n            \u003cbutton onClick={() => setScreen(\"settings\")} style={{ ...btn, width: \"100%\", marginTop: 4 }}>Confirm & check off\u003c/button>\n          \u003c/div>\n        )}\n\n        {screen === \"settings\" && (\n          \u003cdiv>\n            \u003ch2 style={h2}>Settings & Preferences\u003c/h2>\n            \u003cdiv style={sub}>Personalise your weekly plan\u003c/div>\n            \u003cdiv style={card}>\n              \u003cdiv style={{ fontWeight: 600, marginBottom: 6 }}>Household size\u003c/div>\n              \u003cspan style={chip}>2 people\u003c/span>\n              \u003cspan style={chip}>+ Add child\u003c/span>\n            \u003c/div>\n            \u003cdiv style={card}>\n              \u003cdiv style={{ fontWeight: 600, marginBottom: 6 }}>Dietary restrictions\u003c/div>\n              \u003cspan style={chip}>No shellfish\u003c/span>\n              \u003cspan style={chip}>Lower sodium\u003c/span>\n            \u003c/div>\n            \u003cdiv style={card}>\n              \u003cdiv style={{ fontWeight: 600, marginBottom: 6 }}>Cooking preferences\u003c/div>\n              \u003cspan style={chip}>Max 35 min\u003c/span>\n              \u003cspan style={chip}>Batch cook\u003c/span>\n            \u003c/div>\n            \u003cbutton onClick={() => setScreen(\"plan\")} style={{ ...btn, width: \"100%\" }}>Save preferences\u003c/button>\n          \u003c/div>\n        )}\n      \u003c/div>\n\n      \u003cdiv style={{ position: \"fixed\", bottom: 0, left: 0, right: 0, background: C.card, borderTop: `1px solid ${C.border}`, display: \"flex\", justifyContent: \"center\" }}>\n        \u003cdiv style={{ ...sh, padding: \"10px 8px\", display: \"flex\", gap: 6 }}>\n          {tabs.map(([k, label]) => (\n            \u003cbutton key={k} onClick={() => setScreen(k)} style={{\n              flex: 1,\n              border: \"none\",\n              background: screen === k ? C.greenLight : \"transparent\",\n              color: screen === k ? C.green : C.muted,\n              borderRadius: 10,\n              padding: \"8px 4px\",\n              fontSize: 12,\n              fontWeight: 700,\n              cursor: \"pointer\",\n              fontFamily: \"inherit\",\n            }}>{label}\u003c/button>\n          ))}\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  );\n}\n"},{"label":"U","ideaId":4,"idea":"An app that plans a week of meals around what's already in the fridge.","code":"import React, { useState } from \"react\";\n\nconst App = () => {\n  // ---------- shared styles ----------\n  const palette = {\n    bg: \"#f5fff7\",\n    primary: \"#2e8b57\",\n    accent: \"#a3d9a5\",\n    text: \"#2b2b2b\",\n    muted: \"#6b6b6b\",\n  };\n  const spacing = { xs: 4, sm: 8, md: 12, lg: 16 };\n  const base = {\n    container: { fontFamily: \"Arial, sans-serif\", color: palette.text, background: palette.bg, minHeight: \"100vh\", padding: spacing.lg },\n    header: { fontSize: 24, marginBottom: spacing.md, color: palette.primary },\n    subHeader: { fontSize: 18, marginTop: spacing.md, marginBottom: spacing.sm, color: palette.primary },\n    button: { background: palette.primary, color: \"#fff\", border: \"none\", borderRadius: 4, padding: `${spacing.sm}px ${spacing.md}px`, cursor: \"pointer\", marginRight: spacing.sm },\n    input: { padding: spacing.sm, border: `1px solid ${palette.muted}`, borderRadius: 4, marginRight: spacing.sm },\n    listItem: { padding: `${spacing.xs}px 0`, borderBottom: `1px solid ${palette.accent}` },\n    navBar: { position: \"fixed\", bottom: 0, left: 0, right: 0, background: \"#fff\", borderTop: `1px solid ${palette.accent}`, display: \"flex\", justifyContent: \"space-around\", padding: spacing.sm },\n    navBtn: (active) => ({\n      background: \"none\",\n      border: \"none\",\n      color: active ? palette.primary : palette.muted,\n      fontWeight: active ? \"bold\" : \"normal\",\n      cursor: \"pointer\",\n    }),\n  };\n\n  // ---------- state ----------\n  const [screen, setScreen] = useState(\"Inventory\");\n  const [inventory, setInventory] = useState([\"Milk 1L\", \"Eggs 12\", \"Spinach 200g\"]);\n  const [newItem, setNewItem] = useState(\"\");\n  const [plan, setPlan] = useState([\n    { day: \"Mon\", meal: \"Veggie Omelette\" },\n    { day: \"Tue\", meal: \"Chicken Stir‑Fry\" },\n    { day: \"Wed\", meal: \"Quinoa Salad\" },\n    { day: \"Thu\", meal: \"Salmon & Asparagus\" },\n    { day: \"Fri\", meal: \"Pasta Primavera\" },\n    { day: \"Sat\", meal: \"Taco Night\" },\n    { day: \"Sun\", meal: \"Roast Veggie Bowl\" },\n  ]);\n  const [selectedRecipe, setSelectedRecipe] = useState(null);\n  const [shopping, setShopping] = useState([\"Chicken Breast 500g\", \"Tomatoes 4\", \"Parmesan 100g\"]);\n  const [settings, setSettings] = useState({ diet: \"None\", size: 2, pref: \"Quick\" });\n\n  // ---------- handlers ----------\n  const addItem = () => {\n    if (newItem.trim()) {\n      setInventory([...inventory, newItem.trim()]);\n      setNewItem(\"\");\n    }\n  };\n  const openRecipe = (meal) => setSelectedRecipe(meal);\n  const closeRecipe = () => setSelectedRecipe(null);\n  const updateSetting = (key, value) => setSettings({ ...settings, [key]: value });\n\n  // ---------- render ----------\n  let content;\n  if (screen === \"Inventory\") {\n    content = (\n      \u003cdiv>\n        \u003cdiv style={base.header}>Fridge & Pantry\u003c/div>\n        \u003cdiv>\n          {inventory.map((i, idx) => (\n            \u003cdiv key={idx} style={base.listItem}>{i}\u003c/div>\n          ))}\n        \u003c/div>\n        \u003cdiv style={{ marginTop: spacing.md }}>\n          \u003cinput\n            style={base.input}\n            placeholder=\"Add item (e.g. Yogurt 500g)\"\n            value={newItem}\n            onChange={(e) => setNewItem(e.target.value)}\n          />\n          \u003cbutton style={base.button} onClick={addItem}>Add\u003c/button>\n        \u003c/div>\n      \u003c/div>\n    );\n  } else if (screen === \"Plan\") {\n    content = (\n      \u003cdiv>\n        \u003cdiv style={base.header}>7‑Day Meal Plan\u003c/div>\n        {plan.map((p, idx) => (\n          \u003cdiv key={idx} style={base.listItem}>\n            \u003cstrong>{p.day}:\u003c/strong> {p.meal}\n            \u003cbutton style={base.button} onClick={() => openRecipe(p.meal)}>Details\u003c/button>\n          \u003c/div>\n        ))}\n      \u003c/div>\n    );\n  } else if (screen === \"Recipe\" && selectedRecipe) {\n    content = (\n      \u003cdiv>\n        \u003cdiv style={base.header}>Recipe: {selectedRecipe}\u003c/div>\n        \u003cdiv style={base.subHeader}>Ingredients\u003c/div>\n        \u003cul style={{ marginLeft: spacing.lg }}>\n          \u003cli>2 pcs {selectedRecipe.includes(\"Salmon\") ? \"Salmon fillet\" : \"Eggs\"}\u003c/li>\n          \u003cli>1 cup {selectedRecipe.includes(\"Salmon\") ? \"Quinoa\" : \"Spinach\"} \u003c/li>\n          \u003cli>Salt & pepper\u003c/li>\n        \u003c/ul>\n        \u003cdiv style={base.subHeader}>Steps\u003c/div>\n        \u003col style={{ marginLeft: spacing.lg }}>\n          \u003cli>Prep ingredients.\u003c/li>\n          \u003cli>Cook according to method.\u003c/li>\n          \u003cli>Serve warm.\u003c/li>\n        \u003c/ol>\n        \u003cdiv style={base.subHeader}>Substitutions\u003c/div>\n        \u003cp style={{ color: palette.muted, marginLeft: spacing.lg }}>\n          Swap {selectedRecipe.includes(\"Salmon\") ? \"Quinoa\" : \"Eggs\"} for tofu for a vegetarian option.\n        \u003c/p>\n        \u003cbutton style={base.button} onClick={closeRecipe}>Back to Plan\u003c/button>\n      \u003c/div>\n    );\n  } else if (screen === \"Shopping\") {\n    content = (\n      \u003cdiv>\n        \u003cdiv style={base.header}>Shopping List\u003c/div>\n        {shopping.map((s, idx) => (\n          \u003cdiv key={idx} style={base.listItem}>{s}\u003c/div>\n        ))}\n      \u003c/div>\n    );\n  } else if (screen === \"Settings\") {\n    content = (\n      \u003cdiv>\n        \u003cdiv style={base.header}>Preferences\u003c/div>\n        \u003cdiv style={{ marginTop: spacing.sm }}>\n          \u003clabel>Dietary restriction: \u003c/label>\n          \u003cselect\n            style={base.input}\n            value={settings.diet}\n            onChange={(e) => updateSetting(\"diet\", e.target.value)}\n          >\n            \u003coption>None\u003c/option>\n            \u003coption>Vegetarian\u003c/option>\n            \u003coption>Vegan\u003c/option>\n            \u003coption>Gluten‑Free\u003c/option>\n          \u003c/select>\n        \u003c/div>\n        \u003cdiv style={{ marginTop: spacing.sm }}>\n          \u003clabel>Household size: \u003c/label>\n          \u003cinput\n            type=\"number\"\n            style={base.input}\n            min={1}\n            value={settings.size}\n            onChange={(e) => updateSetting(\"size\", +e.target.value)}\n          />\n        \u003c/div>\n        \u003cdiv style={{ marginTop: spacing.sm }}>\n          \u003clabel>Cooking preference: \u003c/label>\n          \u003cselect\n            style={base.input}\n            value={settings.pref}\n            onChange={(e) => updateSetting(\"pref\", e.target.value)}\n          >\n            \u003coption>Quick\u003c/option>\n            \u003coption>Meal‑Prep\u003c/option>\n            \u003coption>Gourmet\u003c/option>\n          \u003c/select>\n        \u003c/div>\n      \u003c/div>\n    );\n  }\n\n  // If recipe detail opened from Plan, override screen name\n  const displayedScreen = screen === \"Plan\" && selectedRecipe ? \"Recipe\" : screen;\n\n  return (\n    \u003cdiv style={base.container}>\n      {content}\n      \u003cdiv style={base.navBar}>\n        {[\"Inventory\", \"Plan\", \"Shopping\", \"Settings\"].map((tab) => (\n          \u003cbutton\n            key={tab}\n            style={base.navBtn(displayedScreen === tab)}\n            onClick={() => {\n              setScreen(tab);\n              if (tab !== \"Plan\") setSelectedRecipe(null);\n            }}\n          >\n            {tab}\n          \u003c/button>\n        ))}\n      \u003c/div>\n    \u003c/div>\n  );\n};\n\nexport default App;\n"},{"label":"V","ideaId":4,"idea":"An app that plans a week of meals around what's already in the fridge.","code":"import React, { useState } from \"react\";\n\nconst colors = {\n  bg: \"#F4FBF4\",\n  primary: \"#2E7D32\",\n  primaryLight: \"#E8F5E9\",\n  accent: \"#FFA726\",\n  text: \"#1B3A1E\",\n  border: \"#C8E6C9\",\n  white: \"#FFFFFF\",\n};\n\nconst styles = {\n  app: { fontFamily: \"'Segoe UI', sans-serif\", background: colors.bg, minHeight: \"100vh\", color: colors.text, paddingBottom: 70, maxWidth: 480, margin: \"0 auto\" },\n  header: { background: colors.primary, color: colors.white, padding: \"18px 20px\", fontSize: 22, fontWeight: 700 },\n  section: { padding: 16 },\n  card: { background: colors.white, border: `1px solid ${colors.border}`, borderRadius: 10, padding: 12, marginBottom: 10 },\n  btn: { background: colors.primary, color: colors.white, border: \"none\", borderRadius: 8, padding: \"8px 14px\", fontWeight: 600, cursor: \"pointer\" },\n  btnOutline: { background: colors.white, color: colors.primary, border: `2px solid ${colors.primary}`, borderRadius: 8, padding: \"8px 14px\", fontWeight: 600, cursor: \"pointer\" },\n  input: { border: `1px solid ${colors.border}`, borderRadius: 8, padding: 8, fontSize: 14, width: \"100%\", boxSizing: \"border-box\" },\n  nav: { position: \"fixed\", bottom: 0, left: 0, right: 0, maxWidth: 480, margin: \"0 auto\", display: \"flex\", background: colors.white, borderTop: `1px solid ${colors.border}` },\n  navBtn: (active) => ({ flex: 1, padding: \"10px 4px\", textAlign: \"center\", background: active ? colors.primaryLight : colors.white, color: active ? colors.primary : \"#777\", fontSize: 11, fontWeight: 600, border: \"none\", cursor: \"pointer\" }),\n  chip: { display: \"inline-block\", background: colors.primaryLight, color: colors.primary, borderRadius: 20, padding: \"3px 10px\", fontSize: 12, marginRight: 6, marginBottom: 6 },\n};\n\nconst recipes = {\n  \"Lemon Garlic Chicken & Rice\": { ingredients: [\"Chicken breast (2)\", \"Rice (1 cup)\", \"Lemon\", \"Garlic\", \"Broccoli\"], steps: [\"Sear chicken 5 min/side\", \"Simmer rice 18 min\", \"Steam broccoli\", \"Toss with lemon-garlic sauce\"], sub: \"Swap chicken for tofu for a vegetarian version.\" },\n  \"Veggie Stir-Fry with Tofu\": { ingredients: [\"Tofu (1 block)\", \"Bell peppers\", \"Soy sauce\", \"Carrots\", \"Rice noodles\"], steps: [\"Press & cube tofu\", \"Stir-fry veggies 4 min\", \"Add tofu & sauce\", \"Toss with noodles\"], sub: \"Use chickpeas instead of tofu if preferred.\" },\n  \"Baked Salmon & Asparagus\": { ingredients: [\"Salmon fillets (2)\", \"Asparagus\", \"Olive oil\", \"Lemon\", \"Garlic\"], steps: [\"Preheat oven 400°F\", \"Season salmon & asparagus\", \"Bake 14 min\"], sub: \"Swap salmon for trout or chicken thighs.\" },\n  \"Black Bean Tacos\": { ingredients: [\"Black beans (1 can)\", \"Tortillas\", \"Cheddar cheese\", \"Salsa\", \"Avocado\"], steps: [\"Warm beans with spices\", \"Fill tortillas\", \"Top with cheese & salsa\"], sub: \"Add grilled chicken for extra protein.\" },\n  \"Pasta Primavera\": { ingredients: [\"Penne pasta\", \"Zucchini\", \"Cherry tomatoes\", \"Parmesan\", \"Olive oil\"], steps: [\"Boil pasta 10 min\", \"Sauté veggies\", \"Toss together with parmesan\"], sub: \"Use gluten-free pasta if needed.\" },\n};\n\nconst mealNames = Object.keys(recipes);\n\nexport default function App() {\n  const [screen, setScreen] = useState(\"Fridge\");\n  const [fridge, setFridge] = useState([\n    { id: 1, name: \"Chicken breast\", qty: \"2 pcs\" },\n    { id: 2, name: \"Rice\", qty: \"1 cup\" },\n    { id: 3, name: \"Broccoli\", qty: \"1 head\" },\n    { id: 4, name: \"Eggs\", qty: \"6\" },\n  ]);\n  const [newItem, setNewItem] = useState(\"\");\n  const [plan, setPlan] = useState([\n    { day: \"Monday\", meal: mealNames[0], cooked: false },\n    { day: \"Tuesday\", meal: mealNames[1], cooked: false },\n    { day: \"Wednesday\", meal: mealNames[2], cooked: false },\n    { day: \"Thursday\", meal: mealNames[3], cooked: false },\n    { day: \"Friday\", meal: mealNames[4], cooked: false },\n    { day: \"Saturday\", meal: mealNames[0], cooked: false },\n    { day: \"Sunday\", meal: mealNames[2], cooked: false },\n  ]);\n  const [selectedMeal, setSelectedMeal] = useState(mealNames[0]);\n  const [shopping, setShopping] = useState([\n    { name: \"Salmon fillets\", qty: \"2\", checked: false },\n    { name: \"Asparagus\", qty: \"1 bunch\", checked: false },\n    { name: \"Tofu\", qty: \"1 block\", checked: false },\n    { name: \"Cherry tomatoes\", qty: \"1 pint\", checked: false },\n  ]);\n  const [prefs, setPrefs] = useState({ diet: \"Vegetarian-friendly\", household: 2, cookTime: \"30 min or less\" });\n\n  const addFridgeItem = () => {\n    if (!newItem.trim()) return;\n    setFridge([...fridge, { id: Date.now(), name: newItem, qty: \"1\" }]);\n    setNewItem(\"\");\n  };\n  const removeFridgeItem = (id) => setFridge(fridge.filter((f) => f.id !== id));\n  const swapMeal = (i) => {\n    const next = [...plan];\n    const idx = mealNames.indexOf(next[i].meal);\n    next[i].meal = mealNames[(idx + 1) % mealNames.length];\n    setPlan(next);\n  };\n  const toggleCooked = (i) => {\n    const next = [...plan];\n    next[i].cooked = !next[i].cooked;\n    setPlan(next);\n  };\n  const toggleShop = (i) => {\n    const next = [...shopping];\n    next[i].checked = !next[i].checked;\n    setShopping(next);\n  };\n\n  const tabs = [\"Fridge\", \"Plan\", \"Recipe\", \"Shopping\", \"Settings\"];\n\n  return (\n    \u003cdiv style={styles.app}>\n      \u003cdiv style={styles.header}>🥬 FridgeWeek\u003c/div>\n      \u003cdiv style={styles.section}>\n        {screen === \"Fridge\" && (\n          \u003cdiv>\n            \u003ch3>Fridge & Pantry Inventory\u003c/h3>\n            \u003cdiv style={{ display: \"flex\", gap: 8, marginBottom: 12 }}>\n              \u003cinput style={styles.input} placeholder=\"Add item (e.g. Spinach)\" value={newItem} onChange={(e) => setNewItem(e.target.value)} />\n              \u003cbutton style={styles.btn} onClick={addFridgeItem}>Add\u003c/button>\n            \u003c/div>\n            \u003cbutton style={{ ...styles.btnOutline, marginBottom: 12 }} onClick={() => setFridge([...fridge, { id: Date.now(), name: \"Bell Pepper (scanned)\", qty: \"3\" }])}>📷 Scan Items\u003c/button>\n            {fridge.map((item) => (\n              \u003cdiv key={item.id} style={{ ...styles.card, display: \"flex\", justifyContent: \"space-between\" }}>\n                \u003cspan>{item.name} \u003cspan style={{ color: \"#888\" }}>({item.qty})\u003c/span>\u003c/span>\n                \u003cbutton style={{ ...styles.btnOutline, padding: \"2px 8px\" }} onClick={() => removeFridgeItem(item.id)}>✕\u003c/button>\n              \u003c/div>\n            ))}\n          \u003c/div>\n        )}\n        {screen === \"Plan\" && (\n          \u003cdiv>\n            \u003ch3>This Week's Meal Plan\u003c/h3>\n            \u003cp style={{ fontSize: 13, color: \"#555\" }}>2 items flagged — check Shopping List 🛒\u003c/p>\n            {plan.map((p, i) => (\n              \u003cdiv key={p.day} style={styles.card}>\n                \u003cdiv style={{ display: \"flex\", justifyContent: \"space-between\", fontWeight: 700 }}>\n                  \u003cspan>{p.day}\u003c/span>\n                  \u003cspan>{p.cooked ? \"✅ Cooked\" : \"\"}\u003c/span>\n                \u003c/div>\n                \u003cdiv onClick={() => { setSelectedMeal(p.meal); setScreen(\"Recipe\"); }} style={{ color: colors.primary, cursor: \"pointer\", margin: \"4px 0\" }}>{p.meal}\u003c/div>\n                \u003cdiv style={{ display: \"flex\", gap: 8 }}>\n                  \u003cbutton style={styles.btnOutline} onClick={() => swapMeal(i)}>🔄 Swap\u003c/button>\n                  \u003cbutton style={styles.btn} onClick={() => toggleCooked(i)}>{p.cooked ? \"Undo\" : \"Mark Cooked\"}\u003c/button>\n                \u003c/div>\n              \u003c/div>\n            ))}\n          \u003c/div>\n        )}\n        {screen === \"Recipe\" && (\n          \u003cdiv>\n            \u003ch3>Recipe Detail\u003c/h3>\n            \u003cselect style={styles.input} value={selectedMeal} onChange={(e) => setSelectedMeal(e.target.value)}>\n              {mealNames.map((m) => \u003coption key={m}>{m}\u003c/option>)}\n            \u003c/select>\n            \u003cdiv style={{ ...styles.card, marginTop: 12 }}>\n              \u003ch4>{selectedMeal}\u003c/h4>\n              \u003cb>Ingredients\u003c/b>\n              {recipes[selectedMeal].ingredients.map((i) => \u003cdiv key={i} style={styles.chip}>{i}\u003c/div>)}\n              \u003cb style={{ display: \"block\", marginTop: 10 }}>Steps\u003c/b>\n              \u003col>{recipes[selectedMeal].steps.map((s, idx) => \u003cli key={idx} style={{ marginBottom: 4 }}>{s}\u003c/li>)}\u003c/ol>\n              \u003cb>Substitution Tip\u003c/b>\n              \u003cp style={{ fontSize: 13, color: \"#555\" }}>{recipes[selectedMeal].sub}\u003c/p>\n            \u003c/div>\n          \u003c/div>\n        )}\n        {screen === \"Shopping\" && (\n          \u003cdiv>\n            \u003ch3>Shopping List\u003c/h3>\n            \u003cp style={{ fontSize: 13, color: \"#555\" }}>Consolidated from this week's plan\u003c/p>\n            {shopping.map((s, i) => (\n              \u003cdiv key={s.name} style={{ ...styles.card, display: \"flex\", alignItems: \"center\", gap: 10 }}>\n                \u003cinput type=\"checkbox\" checked={s.checked} onChange={() => toggleShop(i)} />\n                \u003cspan style={{ textDecoration: s.checked ? \"line-through\" : \"none\", flex: 1 }}>{s.name}\u003c/span>\n                \u003cspan style={{ color: \"#888\" }}>{s.qty}\u003c/span>\n              \u003c/div>\n            ))}\n          \u003c/div>\n        )}\n        {screen === \"Settings\" && (\n          \u003cdiv>\n            \u003ch3>Settings & Preferences\u003c/h3>\n            \u003cdiv style={styles.card}>\n              \u003clabel>Dietary Restrictions\u003c/label>\n              \u003cselect style={styles.input} value={prefs.diet} onChange={(e) => setPrefs({ ...prefs, diet: e.target.value })}>\n                \u003coption>None\u003c/option>\u003coption>Vegetarian-friendly\u003c/option>\u003coption>Gluten-free\u003c/option>\u003coption>Dairy-free\u003c/option>\n              \u003c/select>\n            \u003c/div>\n            \u003cdiv style={styles.card}>\n              \u003clabel>Household Size\u003c/label>\n              \u003cinput type=\"number\" style={styles.input} value={prefs.household} onChange={(e) => setPrefs({ ...prefs, household: e.target.value })} />\n            \u003c/div>\n            \u003cdiv style={styles.card}>\n              \u003clabel>Cooking Time Preference\u003c/label>\n              \u003cselect style={styles.input} value={prefs.cookTime} onChange={(e) => setPrefs({ ...prefs, cookTime: e.target.value })}>\n                \u003coption>15 min or less\u003c/option>\u003coption>30 min or less\u003c/option>\u003coption>No limit\u003c/option>\n              \u003c/select>\n            \u003c/div>\n          \u003c/div>\n        )}\n      \u003c/div>\n      \u003cdiv style={styles.nav}>\n        {tabs.map((t) => (\n          \u003cbutton key={t} style={styles.navBtn(screen === t)} onClick={() => setScreen(t)}>{t}\u003c/button>\n        ))}\n      \u003c/div>\n    \u003c/div>\n  );\n}\n"},{"label":"W","ideaId":4,"idea":"An app that plans a week of meals around what's already in the fridge.","code":"import React, { useState } from \"react\";\n\nexport default function App() {\n  const [screen, setScreen] = useState(\"fridge\");\n  const [plan, setPlan] = useState([\n    { day: \"Mon\", meal: \"Spinach & Feta Omelette\", uses: \"eggs, spinach, feta\", missing: [] },\n    { day: \"Tue\", meal: \"Chicken Stir Fry\", uses: \"chicken, peppers, rice\", missing: [\"soy sauce\"] },\n    { day: \"Wed\", meal: \"Tomato Basil Pasta\", uses: \"pasta, tomatoes, basil\", missing: [\"parmesan\"] },\n    { day: \"Thu\", meal: \"Black Bean Tacos\", uses: \"beans, tortillas, onion\", missing: [] },\n    { day: \"Fri\", meal: \"Salmon & Roasted Veg\", uses: \"salmon, zucchini, carrots\", missing: [\"lemon\"] },\n    { day: \"Sat\", meal: \"Veggie Fried Rice\", uses: \"rice, peas, eggs\", missing: [] },\n    { day: \"Sun\", meal: \"Lentil Soup\", uses: \"lentils, carrots, celery\", missing: [\"vegetable broth\"] },\n  ]);\n  const [fridge, setFridge] = useState([\n    { name: \"Eggs\", qty: \"8\" },\n    { name: \"Spinach\", qty: \"1 bag\" },\n    { name: \"Chicken breast\", qty: \"2\" },\n    { name: \"Tomatoes\", qty: \"5\" },\n    { name: \"Rice\", qty: \"1 kg\" },\n  ]);\n  const [checked, setChecked] = useState([]);\n  const [cooked, setCooked] = useState([]);\n  const [diet, setDiet] = useState(\"Vegetarian-friendly\");\n\n  const colors = { bg: \"#f6fbf7\", card: \"#ffffff\", primary: \"#2e9e5b\", accent: \"#f59e0b\", text: \"#1f3d2b\", muted: \"#6b7f72\", border: \"#e0ece3\" };\n  const card = { background: colors.card, borderRadius: 14, padding: 16, marginBottom: 12, border: `1px solid ${colors.border}` };\n  const btn = { background: colors.primary, color: \"#fff\", border: \"none\", borderRadius: 10, padding: \"10px 16px\", fontSize: 15, fontWeight: 600, cursor: \"pointer\" };\n  const btnAlt = { ...btn, background: \"#e8f5ee\", color: colors.primary };\n  const h1 = { fontSize: 22, fontWeight: 700, color: colors.text, margin: \"0 0 12px\" };\n  const h2 = { fontSize: 16, fontWeight: 600, color: colors.text, margin: \"0 0 6px\" };\n  const p = { fontSize: 14, color: colors.muted, margin: \"2px 0\" };\n  const input = { width: \"100%\", padding: 10, borderRadius: 8, border: `1px solid ${colors.border}`, fontSize: 14, boxSizing: \"border-box\", marginBottom: 10 };\n\n  const missing = plan.filter(m => !cooked.includes(m.day)).flatMap(m => m.missing);\n  const uniqMissing = [...new Set(missing)];\n\n  const addFridge = () => {\n    const name = prompt(\"Item name?\");\n    if (name) setFridge([...fridge, { name, qty: \"1\" }]);\n  };\n\n  const swapMeal = (i) => {\n    const options = [\"Sheet Pan Veggies\", \"Quinoa Bowl\", \"Egg Fried Rice\", \"Grilled Cheese & Soup\"];\n    const next = options[Math.floor(Math.random() * options.length)];\n    const copy = [...plan];\n    copy[i] = { ...copy[i], meal: next };\n    setPlan(copy);\n  };\n\n  const toggleCook = (day) => setCooked(cooked.includes(day) ? cooked.filter(d => d !== day) : [...cooked, day]);\n\n  return (\n    \u003cdiv style={{ fontFamily: \"system-ui, -apple-system, Segoe UI, sans-serif\", background: colors.bg, minHeight: \"100vh\", paddingBottom: 70 }}>\n      \u003cdiv style={{ maxWidth: 520, margin: \"0 auto\", padding: 16 }}>\n        \u003ch1 style={{ ...h1, fontSize: 24 }}>🥬 FridgeWeek\u003c/h1>\n\n        {screen === \"fridge\" && (\n          \u003cdiv>\n            \u003ch2 style={h1}>Fridge Inventory\u003c/h2>\n            \u003cdiv style={card}>\n              \u003cp style={p}>Scan a receipt or add items manually.\u003c/p>\n              \u003cbutton style={{ ...btn, width: \"100%\", marginTop: 8 }} onClick={addFridge}>📷 Scan / Add Item\u003c/button>\n            \u003c/div>\n            {fridge.map((item, i) => (\n              \u003cdiv key={i} style={{ ...card, display: \"flex\", justifyContent: \"space-between\", alignItems: \"center\" }}>\n                \u003cdiv>\u003cb style={{ color: colors.text }}>{item.name}\u003c/b>\u003cp style={p}>Qty: {item.qty}\u003c/p>\u003c/div>\n                \u003cbutton style={btnAlt} onClick={() => setFridge(fridge.filter((_, j) => j !== i))}>Edit\u003c/button>\n              \u003c/div>\n            ))}\n            \u003cbutton style={{ ...btn, width: \"100%\" }} onClick={() => setScreen(\"plan\")}>Generate Weekly Plan →\u003c/button>\n          \u003c/div>\n        )}\n\n        {screen === \"plan\" && (\n          \u003cdiv>\n            \u003ch2 style={h1}>This Week's Plan\u003c/h2>\n            {plan.map((m, i) => (\n              \u003cdiv key={i} style={{ ...card, background: cooked.includes(m.day) ? \"#e8f5ee\" : colors.card }}>\n                \u003cdiv style={{ display: \"flex\", justifyContent: \"space-between\" }}>\n                  \u003cb style={{ color: colors.primary }}>{m.day}\u003c/b>\n                  {m.missing.length > 0 && \u003cspan style={{ fontSize: 12, color: colors.accent }}>⚠ {m.missing.length} to buy\u003c/span>}\n                \u003c/div>\n                \u003ch2 style={h2}>{m.meal}\u003c/h2>\n                \u003cp style={p}>Uses: {m.uses}\u003c/p>\n                \u003cdiv style={{ display: \"flex\", gap: 8, marginTop: 8 }}>\n                  \u003cbutton style={{ ...btnAlt, flex: 1 }} onClick={() => setScreen(\"recipe\")}>View\u003c/button>\n                  \u003cbutton style={{ ...btnAlt, flex: 1 }} onClick={() => swapMeal(i)}>Swap\u003c/button>\n                  \u003cbutton style={{ ...btn, flex: 1 }} onClick={() => toggleCook(m.day)}>{cooked.includes(m.day) ? \"Cooked ✓\" : \"Cook\"}\u003c/button>\n                \u003c/div>\n              \u003c/div>\n            ))}\n          \u003c/div>\n        )}\n\n        {screen === \
