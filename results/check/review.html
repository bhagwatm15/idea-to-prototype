<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blind Prototype Review</title>
<style>
  :root { --bg:#f7f7f5; --panel:#fff; --text:#1d1d1b; --muted:#6b6b66; --line:#e2e1dc; --accent:#3b5bdb; --done:#2f9e44; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161615; --panel:#1f1f1d; --text:#ececea; --muted:#9a9a94; --line:#33332f; --accent:#7b93ff; --done:#51cf66; } }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--text); }
  .app { display:grid; grid-template-columns: 220px 1fr; min-height:100vh; }
  nav { border-right:1px solid var(--line); padding:16px; background:var(--panel); overflow-y:auto; }
  nav h1 { font-size:15px; margin:0 0 4px; }
  nav p { color:var(--muted); font-size:13px; margin:0 0 16px; }
  nav h2 { font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:16px 0 6px; }
  nav button { display:flex; justify-content:space-between; width:100%; padding:6px 10px; margin:2px 0; border:1px solid transparent; border-radius:6px; background:none; color:inherit; font:inherit; cursor:pointer; text-align:left; }
  nav button:hover { border-color:var(--line); }
  nav button.active { border-color:var(--accent); }
  nav .score { color:var(--done); font-weight:600; }
  main { padding:24px; min-width:0; }
  .idea { color:var(--muted); margin:4px 0 16px; max-width:70ch; }
  .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin:16px 0; }
  .btn { padding:6px 14px; border-radius:6px; border:1px solid var(--line); background:var(--panel); color:inherit; font:inherit; cursor:pointer; }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .scores label { display:inline-flex; align-items:center; gap:4px; margin-right:10px; }
  textarea { width:100%; max-width:70ch; min-height:70px; padding:8px; border:1px solid var(--line); border-radius:6px; background:var(--panel); color:inherit; font:inherit; }
  @media (max-width: 720px) { .app { grid-template-columns: 1fr; } nav { border-right:0; border-bottom:1px solid var(--line); } main { padding:16px; } }
</style>
<script type="importmap">
{ "imports": {
  "react": "https://esm.sh/react@19.2.4",
  "react/": "https://esm.sh/react@19.2.4/",
  "react-dom": "https://esm.sh/react-dom@19.2.4",
  "react-dom/": "https://esm.sh/react-dom@19.2.4/",
  "@codesandbox/sandpack-react": "https://esm.sh/@codesandbox/sandpack-react@2.20.0?external=react,react-dom"
} }
</script>
</head>
<body>

<script id="outputs" type="application/json">[{"label":"A","ideaId":1,"idea":"A dashboard that helps PMs re-orient when switching between projects, showing the last decision made, blockers, and who's waiting on what.","code":"import React, { useState } from \"react\";\n\nconst C = {\n  bg: \"#f4f6f8\",\n  card: \"#ffffff\",\n  text: \"#1f2937\",\n  sub: \"#6b7280\",\n  border: \"#e2e6ea\",\n  accent: \"#3b6e8f\",\n  accentSoft: \"#e8f0f4\",\n  good: \"#3f8f6b\",\n  warn: \"#c98a2b\",\n  bad: \"#c0524a\",\n};\n\nconst S = {\n  page: { background: C.bg, minHeight: \"100vh\", fontFamily: \"Georgia, 'Segoe UI', serif\", color: C.text },\n  wrap: { maxWidth: 860, margin: \"0 auto\", padding: \"24px 20px 60px\" },\n  nav: { display: \"flex\", gap: 6, borderBottom: `1px solid ${C.border}`, padding: \"0 20px\", background: C.card },\n  navBtn: { padding: \"14px 12px\", border: \"none\", background: \"none\", cursor: \"pointer\", fontSize: 14, color: C.sub, borderBottom: \"2px solid transparent\", fontFamily: \"inherit\" },\n  navBtnActive: { color: C.accent, borderBottom: `2px solid ${C.accent}`, fontWeight: 600 },\n  card: { background: C.card, border: `1px solid ${C.border}`, borderRadius: 10, padding: 18, marginBottom: 14 },\n  h1: { fontSize: 22, margin: \"0 0 4px\", fontWeight: 600 },\n  h2: { fontSize: 16, margin: \"0 0 10px\", fontWeight: 600, color: C.accent },\n  sub: { color: C.sub, fontSize: 13 },\n  row: { display: \"flex\", justifyContent: \"space-between\", alignItems: \"center\", padding: \"10px 0\", borderBottom: `1px solid ${C.border}` },\n  pill: (bg, fg) => ({ background: bg, color: fg, fontSize: 12, padding: \"3px 9px\", borderRadius: 12, fontWeight: 600 }),\n  btn: { background: C.accent, color: \"#fff\", border: \"none\", borderRadius: 6, padding: \"7px 13px\", fontSize: 13, cursor: \"pointer\", marginRight: 8 },\n  btnGhost: { background: \"none\", color: C.accent, border: `1px solid ${C.accent}`, borderRadius: 6, padding: \"7px 13px\", fontSize: 13, cursor: \"pointer\", marginRight: 8 },\n};\n\nconst statusColor = { \"On track\": [C.accentSoft, C.good], \"At risk\": [\"#fbf1e0\", C.warn], Blocked: [\"#f8e6e4\", C.bad] };\n\nconst projects = [\n  { id: 1, name: \"Atlas Migration\", last: \"2 hours ago\", status: \"On track\" },\n  { id: 2, name: \"Checkout Redesign\", last: \"1 day ago\", status: \"At risk\" },\n  { id: 3, name: \"Mobile Push Notifications\", last: \"3 days ago\", status: \"Blocked\" },\n  { id: 4, name: \"Vendor Billing Sync\", last: \"5 hours ago\", status: \"On track\" },\n  { id: 5, name: \"Q3 Roadmap Planning\", last: \"2 days ago\", status: \"At risk\" },\n];\n\nconst summaries = {\n  1: { decision: \"Ship migration in two phases instead of one big-bang cutover\", rationale: \"Reduces downtime risk for EU customers; lets us validate data integrity mid-flight.\", date: \"Jun 3\", blockers: [\"Waiting on DB snapshot from infra team\", \"Schema review overdue by 2 days\"] },\n  2: { decision: \"Delay guest checkout launch to July\", rationale: \"Payment SDK has an unresolved bug with saved cards on iOS.\", date: \"May 29\", blockers: [\"Vendor SDK patch not yet released\", \"QA sign-off pending\"] },\n  3: { decision: \"Use Firebase instead of building in-house push infra\", rationale: \"Faster to ship, team lacks bandwidth to maintain custom infra this quarter.\", date: \"May 24\", blockers: [\"Legal review of data processing terms\", \"iOS cert renewal blocked on Apple support\"] },\n  4: { decision: \"Reconcile billing nightly instead of real-time\", rationale: \"Real-time sync overloaded the vendor API rate limit.\", date: \"Jun 5\", blockers: [\"Awaiting confirmation from finance on rounding rule\"] },\n  5: { decision: \"Cut mobile offline-mode from Q3 scope\", rationale: \"Dependency on new sync engine won't be ready in time.\", date: \"May 30\", blockers: [\"Leadership sign-off on revised roadmap\"] },\n};\n\nconst waitingOnYou = [\n  { name: \"Priya Nair\", item: \"Approve schema change\", age: \"2d\", priority: \"High\" },\n  { name: \"Sam Okafor\", item: \"Reply on vendor contract terms\", age: \"4d\", priority: \"High\" },\n  { name: \"Elena Duarte\", item: \"Confirm rounding rule for billing\", age: \"1d\", priority: \"Medium\" },\n];\nconst youWaitingOn = [\n  { name: \"Infra Team\", item: \"DB snapshot for migration\", age: \"3d\", priority: \"High\" },\n  { name: \"Apple Support\", item: \"Cert renewal\", age: \"6d\", priority: \"Medium\" },\n  { name: \"Legal\", item: \"Data processing review\", age: \"5d\", priority: \"Low\" },\n];\n\nconst decisionLog = {\n  1: [\n    { date: \"Jun 3\", text: \"Ship migration in two phases instead of one big-bang cutover\" },\n    { date: \"May 20\", text: \"Chose blue/green rollout strategy\" },\n    { date: \"May 10\", text: \"Selected Postgres over DynamoDB for new store\" },\n  ],\n  2: [\n    { date: \"May 29\", text: \"Delay guest checkout launch to July\" },\n    { date: \"May 15\", text: \"Approved new PCI-compliant payment vendor\" },\n  ],\n  3: [\n    { date: \"May 24\", text: \"Use Firebase instead of building in-house push infra\" },\n    { date: \"May 12\", text: \"Deprioritized Android rich notifications\" },\n  ],\n  4: [{ date: \"Jun 5\", text: \"Reconcile billing nightly instead of real-time\" }],\n  5: [{ date: \"May 30\", text: \"Cut mobile offline-mode from Q3 scope\" }],\n};\n\nexport default function App() {\n  const [screen, setScreen] = useState(\"switcher\");\n  const [activeId, setActiveId] = useState(1);\n  const active = projects.find((p) => p.id === activeId);\n  const tabs = [\n    [\"switcher\", \"Projects\"],\n    [\"summary\", \"Re-entry Summary\"],\n    [\"waiting\", \"Waiting-On Board\"],\n    [\"log\", \"Decision Log\"],\n    [\"integrations\", \"Integrations\"],\n  ];\n\n  let content;\n  if (screen === \"switcher\") {\n    content = (\n      \u003cdiv style={S.wrap}>\n        \u003ch1 style={S.h1}>Your Projects\u003c/h1>\n        \u003cp style={S.sub}>Pick up where you left off.\u003c/p>\n        {projects.map((p) => {\n          const [bg, fg] = statusColor[p.status];\n          return (\n            \u003cdiv key={p.id} style={{ ...S.card, cursor: \"pointer\" }} onClick={() => { setActiveId(p.id); setScreen(\"summary\"); }}>\n              \u003cdiv style={{ display: \"flex\", justifyContent: \"space-between\", alignItems: \"center\" }}>\n                \u003cdiv>\n                  \u003cdiv style={{ fontWeight: 600, fontSize: 15 }}>{p.name}\u003c/div>\n                  \u003cdiv style={S.sub}>Last touched {p.last}\u003c/div>\n                \u003c/div>\n                \u003cspan style={S.pill(bg, fg)}>{p.status}\u003c/span>\n              \u003c/div>\n            \u003c/div>\n          );\n        })}\n      \u003c/div>\n    );\n  } else if (screen === \"summary\") {\n    const s = summaries[activeId];\n    return renderShell();\n  } else if (screen === \"waiting\") {\n    content = (\n      \u003cdiv style={S.wrap}>\n        \u003ch1 style={S.h1}>Waiting-On Board\u003c/h1>\n        \u003cdiv style={S.card}>\n          \u003ch2 style={S.h2}>Waiting on you\u003c/h2>\n          {waitingOnYou.map((w, i) => (\n            \u003cdiv key={i} style={S.row}>\n              \u003cdiv>\u003cb>{w.name}\u003c/b> — {w.item}\u003cdiv style={S.sub}>Waiting {w.age}\u003c/div>\u003c/div>\n              \u003cspan style={S.pill(w.priority === \"High\" ? \"#f8e6e4\" : \"#eef1f3\", w.priority === \"High\" ? C.bad : C.sub)}>{w.priority}\u003c/span>\n            \u003c/div>\n          ))}\n        \u003c/div>\n        \u003cdiv style={S.card}>\n          \u003ch2 style={S.h2}>You're waiting on\u003c/h2>\n          {youWaitingOn.map((w, i) => (\n            \u003cdiv key={i} style={S.row}>\n              \u003cdiv>\u003cb>{w.name}\u003c/b> — {w.item}\u003cdiv style={S.sub}>Waiting {w.age}\u003c/div>\u003c/div>\n              \u003cspan style={S.pill(w.priority === \"High\" ? \"#f8e6e4\" : \"#eef1f3\", w.priority === \"High\" ? C.bad : C.sub)}>{w.priority}\u003c/span>\n            \u003c/div>\n          ))}\n        \u003c/div>\n      \u003c/div>\n    );\n  } else if (screen === \"log\") {\n    content = (\n      \u003cdiv style={S.wrap}>\n        \u003ch1 style={S.h1}>Decision Log — {active.name}\u003c/h1>\n        \u003cdiv style={S.card}>\n          {decisionLog[activeId].map((d, i) => (\n            \u003cdiv key={i} style={S.row}>\n              \u003cspan>{d.text}\u003c/span>\n              \u003cspan style={S.sub}>{d.date}\u003c/span>\n            \u003c/div>\n          ))}\n        \u003c/div>\n      \u003c/div>\n    );\n  } else if (screen === \"integrations\") {\n    content = (\n      \u003cdiv style={S.wrap}>\n        \u003ch1 style={S.h1}>Integrations\u003c/h1>\n        \u003cp style={S.sub}>Connect tools so Regroup can log decisions and blockers automatically.\u003c/p>\n        {[[\"Slack\", \"Connected\", C.good], [\"Jira\", \"Connected\", C.good], [\"Email\", \"Not connected\", C.sub]].map(([n, s, c], i) => (\n          \u003cdiv key={i} style={S.card}>\n            \u003cdiv style={S.row}>\n              \u003cb>{n}\u003c/b>\n              \u003cspan style={{ color: c, fontSize: 13 }}>{s}\u003c/span>\n            \u003c/div>\n          \u003c/div>\n        ))}\n      \u003c/div>\n    );\n  }\n\n  function renderShell() {\n    const s = summaries[activeId];\n    return (\n      \u003cdiv style={S.page}>\n        {nav()}\n        \u003cdiv style={S.wrap}>\n          \u003ch1 style={S.h1}>{active.name}\u003c/h1>\n          \u003cp style={S.sub}>Picking back up — here's where things stand.\u003c/p>\n          \u003cdiv style={S.card}>\n            \u003ch2 style={S.h2}>Last decision · {s.date}\u003c/h2>\n            \u003cdiv style={{ fontSize: 15, marginBottom: 6 }}>{s.decision}\u003c/div>\n            \u003cdiv style={S.sub}>Why: {s.rationale}\u003c/div>\n          \u003c/div>\n          \u003cdiv style={S.card}>\n            \u003ch2 style={S.h2}>Current blockers\u003c/h2>\n            {s.blockers.map((b, i) => (\n              \u003cdiv key={i} style={S.row}>\u003cspan>{b}\u003c/span>\u003c/div>\n            ))}\n            \u003cdiv style={{ marginTop: 12 }}>\n              \u003cbutton style={S.btn}>Reply\u003c/button>\n              \u003cbutton style={S.btnGhost}>Reassign\u003c/button>\n              \u003cbutton style={S.btnGhost}>Snooze\u003c/button>\n              \u003cbutton style={S.btnGhost}>Mark resolved\u003c/button>\n            \u003c/div>\n          \u003c/div>\n          \u003cdiv style={S.card}>\n            \u003ch2 style={S.h2}>Waiting on you\u003c/h2>\n            {waitingOnYou.slice(0, 2).map((w, i) => (\n              \u003cdiv key={i} style={S.row}>\n                \u003cspan>\u003cb>{w.name}\u003c/b> — {w.item}\u003c/span>\n                \u003cspan style={S.sub}>{w.age}\u003c/span>\n              \u003c/div>\n            ))}\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n    );\n  }\n\n  function nav() {\n    return (\n      \u003cdiv style={S.nav}>\n        {tabs.map(([key, label]) => (\n          \u003cbutton key={key} style={{ ...S.navBtn, ...(screen === key ? S.navBtnActive : {}) }} onClick={() => setScreen(key)}>\n            {label}\n          \u003c/button>\n        ))}\n      \u003c/div>\n    );\n  }\n\n  return (\n    \u003cdiv style={S.page}>\n      {nav()}\n      {content}\n    \u003c/div>\n  );\n}\n"},{"label":"B","ideaId":1,"idea":"A dashboard that helps PMs re-orient when switching between projects, showing the last decision made, blockers, and who's waiting on what.","code":"import React, { useState } from 'react';\n\nconst App = () => {\n  const [currentScreen, setCurrentScreen] = useState('projects');\n  const [selectedProject, setSelectedProject] = useState(null);\n\n  // Shared color palette & spacing\n  const colors = {\n    bg: '#f9f8f6',\n    surface: '#ffffff',\n    text: '#2c2c2c',\n    textLight: '#666666',\n    accent: '#4a90a4',\n    accentLight: '#e8f0f5',\n    success: '#5a9b6f',\n    warning: '#d4a574',\n    border: '#e0dcd7',\n  };\n\n  const spacing = {\n    xs: '8px',\n    sm: '12px',\n    md: '16px',\n    lg: '24px',\n    xl: '32px',\n  };\n\n  // Sample data\n  const projects = [\n    { id: 1, name: 'Mobile App Redesign', status: 'Active', lastTouched: '2 hours ago', health: 'on-track' },\n    { id: 2, name: 'API v2 Migration', status: 'Active', lastTouched: '1 day ago', health: 'at-risk' },\n    { id: 3, name: 'Analytics Dashboard', status: 'Planning', lastTouched: '3 days ago', health: 'on-track' },\n    { id: 4, name: 'Support Portal', status: 'Blocked', lastTouched: '5 days ago', health: 'blocked' },\n  ];\n\n  const projectDetails = {\n    1: {\n      name: 'Mobile App Redesign',\n      lastDecision: 'Approved new onboarding flow with 3-step process',\n      rationale: 'User research showed 40% drop-off at registration. Reduced steps to minimum viable.',\n      decisionDate: '2024-01-15',\n      blockers: ['Design review from brand team (pending)', 'iOS build optimization'],\n    },\n    2: {\n      name: 'API v2 Migration',\n      lastDecision: 'Postponed database migration to Q2',\n      rationale: 'Performance testing revealed schema changes need 3+ weeks prep.',\n      decisionDate: '2024-01-10',\n      blockers: ['Waiting on infrastructure team for capacity plan'],\n    },\n    3: {\n      name: 'Analytics Dashboard',\n      lastDecision: 'Added real-time metrics module to scope',\n      rationale: 'Sales team identified this as critical for enterprise deals.',\n      decisionDate: '2024-01-08',\n      blockers: [],\n    },\n    4: {\n      name: 'Support Portal',\n      lastDecision: 'Blocked pending legal review',\n      rationale: 'GDPR compliance check required before launch.',\n      decisionDate: '2024-01-05',\n      blockers: ['Legal team review in progress (5 days)'],\n    },\n  };\n\n  const waitingOn = {\n    1: {\n      waiting: [\n        { name: 'Sarah Chen', role: 'Brand Lead', age: '3 days', priority: 'high' },\n        { name: 'Mike Rodriguez', role: 'iOS Engineer', age: '1 day', priority: 'medium' },\n      ],\n      waitingOnYou: [{ name: 'James Park', role: 'Design', age: '2 days', priority: 'high' }],\n    },\n    2: {\n      waiting: [{ name: 'Infrastructure Team', role: 'DevOps', age: '4 days', priority: 'high' }],\n      waitingOnYou: [{ name: 'You', role: 'PM', age: '0 days', priority: 'medium' }],\n    },\n  };\n\n  const decisions = {\n    1: [\n      { title: 'Approved new onboarding flow with 3-step process', date: '2024-01-15' },\n      { title: 'Decided to prioritize iOS over Android for initial launch', date: '2024-01-10' },\n      { title: 'Reduced scope to exclude offline mode for v1', date: '2024-01-05' },\n    ],\n    2: [\n      { title: 'Postponed database migration to Q2', date: '2024-01-10' },\n      { title: 'Chose PostgreSQL over MongoDB for v2 schema', date: '2024-01-01' },\n    ],\n  };\n\n  // Base container and text styles\n  const containerStyle = {\n    minHeight: '100vh',\n    backgroundColor: colors.bg,\n    padding: spacing.lg,\n    fontFamily: 'system-ui, -apple-system, sans-serif',\n    color: colors.text,\n  };\n\n  const headerStyle = {\n    fontSize: '28px',\n    fontWeight: '600',\n    marginBottom: spacing.md,\n    color: colors.text,\n  };\n\n  const subheaderStyle = {\n    fontSize: '14px',\n    color: colors.textLight,\n    marginBottom: spacing.lg,\n  };\n\n  const navStyle = {\n    display: 'flex',\n    gap: spacing.sm,\n    marginBottom: spacing.lg,\n    borderBottom: `1px solid ${colors.border}`,\n    paddingBottom: spacing.sm,\n  };\n\n  const navButtonStyle = (isActive) => ({\n    padding: `${spacing.sm} ${spacing.md}`,\n    border: 'none',\n    backgroundColor: 'transparent',\n    color: isActive ? colors.accent : colors.textLight,\n    cursor: 'pointer',\n    fontSize: '14px',\n    fontWeight: isActive ? '600' : '400',\n    borderBottom: isActive ? `2px solid ${colors.accent}` : 'none',\n    marginBottom: '-1px',\n  });\n\n  const cardStyle = {\n    backgroundColor: colors.surface,\n    border: `1px solid ${colors.border}`,\n    borderRadius: '8px',\n    padding: spacing.md,\n    marginBottom: spacing.md,\n    cursor: 'pointer',\n  };\n\n  const buttonStyle = (variant = 'primary') => ({\n    padding: `${spacing.xs} ${spacing.md}`,\n    border: 'none',\n    borderRadius: '6px',\n    fontSize: '13px',\n    fontWeight: '500',\n    cursor: 'pointer',\n    backgroundColor: variant === 'primary' ? colors.accent : colors.accentLight,\n    color: variant === 'primary' ? '#fff' : colors.accent,\n    marginRight: spacing.xs,\n  });\n\n  // Render based on current screen\n  return (\n    \u003cdiv style={containerStyle}>\n      \u003cnav style={navStyle}>\n        \u003cbutton style={navButtonStyle(currentScreen === 'projects')} onClick={() => setCurrentScreen('projects')}>\n          Projects\n        \u003c/button>\n        {selectedProject && (\n          \u003c>\n            \u003cbutton style={navButtonStyle(currentScreen === 'summary')} onClick={() => setCurrentScreen('summary')}>\n              Re-entry\n            \u003c/button>\n            \u003cbutton style={navButtonStyle(currentScreen === 'waiting')} onClick={() => setCurrentScreen('waiting')}>\n              Waiting On\n            \u003c/button>\n            \u003cbutton style={navButtonStyle(currentScreen === 'decisions')} onClick={() => setCurrentScreen('decisions')}>\n              Decisions\n            \u003c/button>\n          \u003c/>\n        )}\n        \u003cbutton style={navButtonStyle(currentScreen === 'integrations')} onClick={() => setCurrentScreen('integrations')}>\n          Settings\n        \u003c/button>\n      \u003c/nav>\n\n      {currentScreen === 'projects' && (\n        \u003cdiv>\n          \u003ch1 style={headerStyle}>Projects\u003c/h1>\n          \u003cp style={subheaderStyle}>Active & recent projects\u003c/p>\n          {projects.map((p) => (\n            \u003cdiv\n              key={p.id}\n              style={{\n                ...cardStyle,\n                backgroundColor: colors.surface,\n                opacity: p.status === 'Blocked' ? 0.85 : 1,\n              }}\n              onClick={() => {\n                setSelectedProject(p.id);\n                setCurrentScreen('summary');\n              }}\n            >\n              \u003cdiv style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>\n                \u003cdiv>\n                  \u003cdiv style={{ fontSize: '16px', fontWeight: '600' }}>{p.name}\u003c/div>\n                  \u003cdiv style={{ fontSize: '13px', color: colors.textLight, marginTop: spacing.xs }}>\n                    {p.status} • Last touched {p.lastTouched}\n                  \u003c/div>\n                \u003c/div>\n                \u003cdiv\n                  style={{\n                    width: '12px',\n                    height: '12px',\n                    borderRadius: '50%',\n                    backgroundColor:\n                      p.health === 'on-track'\n                        ? colors.success\n                        : p.health === 'at-risk'\n                          ? colors.warning\n                          : '#d9534f',\n                  }}\n                />\n              \u003c/div>\n            \u003c/div>\n          ))}\n        \u003c/div>\n      )}\n\n      {currentScreen === 'summary' && selectedProject && (\n        \u003cdiv>\n          \u003ch1 style={headerStyle}>{projectDetails[selectedProject].name}\u003c/h1>\n          \u003cp style={subheaderStyle}>Last decision & blockers\u003c/p>\n\n          \u003cdiv style={{ ...cardStyle, backgroundColor: colors.accentLight }}>\n            \u003cdiv style={{ fontSize: '12px', color: colors.textLight, textTransform: 'uppercase', letterSpacing: '0.5px' }}>\n              Last Decision\n            \u003c/div>\n            \u003cdiv style={{ fontSize: '16px', fontWeight: '600', marginTop: spacing.sm }}>\n              {projectDetails[selectedProject].lastDecision}\n            \u003c/div>\n            \u003cdiv style={{ fontSize: '13px', color: colors.textLight, marginTop: spacing.sm }}>\n              \u003cstrong>Why:\u003c/strong> {projectDetails[selectedProject].rationale}\n            \u003c/div>\n            \u003cdiv style={{ fontSize: '12px', color: colors.textLight, marginTop: spacing.sm }}>\n              {projectDetails[selectedProject].decisionDate}\n            \u003c/div>\n          \u003c/div>\n\n          {projectDetails[selectedProject].blockers.length > 0 && (\n            \u003cdiv>\n              \u003ch3 style={{ fontSize: '14px', fontWeight: '600', marginBottom: spacing.sm }}>Current Blockers\u003c/h3>\n              {projectDetails[selectedProject].blockers.map((blocker, i) => (\n                \u003cdiv key={i} style={{ ...cardStyle, borderLeft: `3px solid ${colors.warning}` }}>\n                  \u003cdiv style={{ fontSize: '14px', fontWeight: '500' }}>{blocker}\u003c/div>\n                  \u003cdiv style={{ marginTop: spacing.sm }}>\n                    \u003cbutton style={buttonStyle('primary')}>Reply\u003c/button>\n                    \u003cbutton style={buttonStyle('secondary')}>Snooze\u003c/button>\n                  \u003c/div>\n                \u003c/div>\n              ))}\n            \u003c/div>\n          )}\n        \u003c/div>\n      )}\n\n      {currentScreen === 'waiting' && selectedProject && waitingOn[selectedProject] && (\n        \u003cdiv>\n          \u003ch1 style={headerStyle}>Waiting On\u003c/h1>\n          \u003cp style={subheaderStyle}>{projectDetails[selectedProject].name}\u003c/p>\n\n          \u003ch3 style={{ fontSize: '14px', fontWeight: '600', marginBottom: spacing.sm, marginTop: spacing.lg }}>\n            Waiting on You\n          \u003c/h3>\n          {waitingOn[selectedProject].waitingOnYou.map((item, i) => (\n            \u003cdiv key={i} style={cardStyle}>\n              \u003cdiv style={{ display: 'flex', justifyContent: 'space-between' }}>\n                \u003cdiv>\n                  \u003cdiv style={{ fontWeight: '600' }}>{item.name}\u003c/div>\n                  \u003cdiv style={{ fontSize: '13px', color: colors.textLight }}>{item.role}\u003c/div>\n                \u003c/div>\n                \u003cdiv style={{ textAlign: 'right', fontSize: '13px', color: colors.warning }}>\n                  {item.age}\n                \u003c/div>\n              \u003c/div>\n              \u003cbutton style={{ ...buttonStyle('primary'), marginTop: spacing.sm }}>Reply\u003c/button>\n            \u003c/div>\n          ))}\n\n          \u003ch3 style={{ fontSize: '14px', fontWeight: '600', marginBottom: spacing.sm, marginTop: spacing.lg }}>\n            You're Waiting On\n          \u003c/h3>\n          {waitingOn[selectedProject].waiting.map((item, i) => (\n            \u003cdiv key={i} style={cardStyle}>\n              \u003cdiv style={{ display: 'flex', justifyContent: 'space-between' }}>\n                \u003cdiv>\n                  \u003cdiv style={{ fontWeight: '600' }}>{item.name}\u003c/div>\n                  \u003cdiv style={{ fontSize: '13px', color: colors.textLight }}>{item.role}\u003c/div>\n                \u003c/div>\n                \u003cdiv\n                  style={{\n                    textAlign: 'right',\n                    fontSize: '13px',\n                    color: item.priority === 'high' ? '#d9534f' : colors.warning,\n                    fontWeight: '600',\n                  }}\n                >\n                  {item.age}\n                \u003c/div>\n              \u003c/div>\n              \u003cbutton style={{ ...buttonStyle('secondary'), marginTop: spacing.sm }}>Nudge\u003c/button>\n            \u003c/div>\n          ))}\n        \u003c/div>\n      )}\n\n      {currentScreen === 'decisions' && selectedProject && decisions[selectedProject] && (\n        \u003cdiv>\n          \u003ch1 style={headerStyle}>Decision Log\u003c/h1>\n          \u003cp style={subheaderStyle}>{projectDetails[selectedProject].name}\u003c/p>\n          {decisions[selectedProject].map((d, i) => (\n            \u003cdiv key={i} style={cardStyle}>\n              \u003cdiv style={{ fontSize: '14px', fontWeight: '500' }}>{d.title}\u003c/div>\n              \u003cdiv style={{ fontSize: '12px', color: colors.textLight, marginTop: spacing.xs }}>{d.date}\u003c/div>\n            \u003c/div>\n          ))}\n        \u003c/div>\n      )}\n\n      {currentScreen === 'integrations' && (\n        \u003cdiv>\n          \u003ch1 style={headerStyle}>Integrations & Settings\u003c/h1>\n          \u003cp style={subheaderStyle}>Connect tools to auto-log decisions and blockers\u003c/p>\n\n          {['Slack', 'Jira', 'Email'].map((tool) => (\n            \u003cdiv key={tool} style={cardStyle}>\n              \u003cdiv style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>\n                \u003cdiv>\n                  \u003cdiv style={{ fontWeight: '600' }}>{tool}\u003c/div>\n                  \u003cdiv style={{ fontSize: '13px', color: colors.textLight }}>\n                    {tool === 'Slack' && 'Post decisions to #product'}\n                    {tool === 'Jira' && 'Sync blockers with Jira issues'}\n                    {tool === 'Email' && 'Auto-digest of waiting-on summaries'}\n                  \u003c/div>\n                \u003c/div>\n                \u003cbutton style={buttonStyle('primary')}>Connect\u003c/button>\n              \u003c/div>\n            \u003c/div>\n          ))}\n        \u003c/div>\n      )}\n    \u003c/div>\n  );\n};\n\nexport default App;\n"}]</script>
<script type="module">
import React, { useState, useEffect } from "react";
import { createRoot } from "react-dom/client";
import { SandpackProvider, SandpackLayout, SandpackPreview, SandpackCodeViewer } from "@codesandbox/sandpack-react";

const h = React.createElement;
const outputs = JSON.parse(document.getElementById("outputs").textContent);
const STORE = "blind-review-scores";

function loadScores() {
  try { return JSON.parse(localStorage.getItem(STORE)) || {}; } catch { return {}; }
}
function saveScores(scores) {
  try { localStorage.setItem(STORE, JSON.stringify(scores)); } catch {}
}
function exportCsv(scores) {
  const esc = (s) => /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  const rows = ["label,idea_id,score,notes"].concat(outputs.map((o) => {
    const s = scores[o.label] || {};
    return [o.label, o.ideaId, s.score ?? "", esc(s.notes ?? "")].join(",");
  }));
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([rows.join("\n") + "\n"], { type: "text/csv" }));
  a.download = "review-scores.csv";
  a.click();
}

function App() {
  const [index, setIndex] = useState(0);
  const [showCode, setShowCode] = useState(false);
  const [scores, setScores] = useState(loadScores);
  useEffect(() => saveScores(scores), [scores]);

  const current = outputs[index];
  const mine = scores[current.label] || {};
  const update = (patch) => setScores({ ...scores, [current.label]: { ...mine, ...patch } });
  const ideaIds = [...new Set(outputs.map((o) => o.ideaId))];

  return h("div", { className: "app" },
    h("nav", null,
      h("h1", null, "Blind review"),
      h("p", null, Object.values(scores).filter((s) => s.score).length + " of " + outputs.length + " scored"),
      ideaIds.map((id) => h(React.Fragment, { key: id },
        h("h2", null, "Idea " + id),
        outputs.map((o, i) => o.ideaId === id && h("button", {
          key: o.label, className: i === index ? "active" : "", onClick: () => { setIndex(i); setShowCode(false); },
        }, "Output " + o.label, h("span", { className: "score" }, scores[o.label]?.score ?? ""))),
      )),
      h("div", { className: "row" }, h("button", { className: "btn", onClick: () => exportCsv(scores) }, "Export scores CSV")),
    ),
    h("main", null,
      h("h1", { style: { margin: 0 } }, "Output " + current.label),
      h("p", { className: "idea" }, "Idea " + current.ideaId + ": " + current.idea),
      h(SandpackProvider, { key: current.label, template: "react", files: { "/App.js": current.code } },
        h(SandpackLayout, null,
          h(SandpackPreview, { showNavigator: false, showOpenInCodeSandbox: false, style: { height: 560, width: "100%" } })),
        showCode && h("div", { style: { marginTop: 12 } },
          h(SandpackLayout, null, h(SandpackCodeViewer, { showLineNumbers: true }))),
      ),
      h("div", { className: "row" },
        h("button", { className: "btn", onClick: () => setShowCode(!showCode) }, showCode ? "Hide code" : "Show code"),
        h("button", { className: "btn", disabled: index === 0, onClick: () => { setIndex(index - 1); setShowCode(false); } }, "Previous"),
        h("button", { className: "btn primary", disabled: index === outputs.length - 1, onClick: () => { setIndex(index + 1); setShowCode(false); } }, "Next"),
      ),
      h("div", { className: "row scores" },
        h("strong", null, "Quality"),
        [1, 2, 3, 4, 5].map((n) => h("label", { key: n },
          h("input", { type: "radio", name: "score", checked: mine.score === n, onChange: () => update({ score: n }) }), n)),
      ),
      h("textarea", { placeholder: "Notes", value: mine.notes ?? "", onChange: (e) => update({ notes: e.target.value }) }),
    ),
  );
}

createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>
