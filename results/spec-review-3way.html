<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blind Spec Review</title>
<style>
  :root { --bg:#f7f7f5; --panel:#fff; --text:#1d1d1b; --muted:#6b6b66; --line:#e2e1dc; --accent:#3b5bdb; --done:#2f9e44; --chip:#eef0f7; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161615; --panel:#1f1f1d; --text:#ececea; --muted:#9a9a94; --line:#33332f; --accent:#7b93ff; --done:#51cf66; --chip:#2a2c36; } }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.55 system-ui, sans-serif; background:var(--bg); color:var(--text); }
  .app { display:grid; grid-template-columns: 200px 1fr; min-height:100vh; }
  nav { border-right:1px solid var(--line); padding:16px; background:var(--panel); overflow-y:auto; }
  nav h1 { font-size:15px; margin:0 0 4px; }
  nav p { color:var(--muted); font-size:13px; margin:0 0 16px; }
  nav h2 { font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:16px 0 6px; }
  nav button { display:flex; justify-content:space-between; width:100%; padding:6px 10px; margin:2px 0; border:1px solid transparent; border-radius:6px; background:none; color:inherit; font:inherit; cursor:pointer; text-align:left; }
  nav button:hover { border-color:var(--line); }
  nav button.active { border-color:var(--accent); }
  nav .tick { color:var(--done); font-weight:600; }
  main { padding:24px; min-width:0; display:grid; grid-template-columns: minmax(0, 1fr) 320px; gap:24px; align-items:start; }
  .idea { color:var(--muted); margin:4px 0 16px; }
  .spec { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:20px 24px; }
  .spec h2 { margin:0 0 2px; font-size:22px; }
  .spec .oneliner { color:var(--muted); margin:0 0 12px; font-size:16px; }
  .spec h3 { font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:20px 0 6px; }
  .spec p { margin:0; }
  .chips span { display:inline-block; background:var(--chip); border-radius:999px; padding:2px 10px; margin:0 6px 6px 0; font-size:13px; }
  .spec ol, .spec ul { margin:0; padding-left:22px; }
  .spec li { margin:3px 0; }
  .screen { border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin:8px 0; }
  .screen strong { display:block; }
  pre.raw { white-space:pre-wrap; margin:0; }
  aside { position:sticky; top:24px; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px 18px; }
  aside h2 { font-size:15px; margin:0 0 12px; }
  fieldset { border:0; padding:0; margin:0 0 16px; }
  legend { font-weight:600; margin-bottom:6px; padding:0; }
  .opts label { display:inline-flex; align-items:center; gap:4px; margin-right:12px; cursor:pointer; }
  textarea { width:100%; min-height:90px; padding:8px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:inherit; font:inherit; }
  .row { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .btn { padding:6px 14px; border-radius:6px; border:1px solid var(--line); background:var(--panel); color:inherit; font:inherit; cursor:pointer; }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn:disabled { opacity:.5; cursor:default; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } aside { position:static; } }
  @media (max-width: 640px) { .app { grid-template-columns: 1fr; } nav { border-right:0; border-bottom:1px solid var(--line); } main { padding:16px; } .spec { padding:16px; } }
</style>
</head>
<body>
<div class="app">
  <nav>
    <h1>Blind spec review (3 models)</h1>
    <p id="progress"></p>
    <div id="list"></div>
    <div class="row"><button class="btn" id="export">Export rubric CSV</button></div>
  </nav>
  <main>
    <section>
      <h1 id="title" style="margin:0"></h1>
      <p class="idea" id="idea"></p>
      <article class="spec" id="spec"></article>
    </section>
    <aside>
      <h2>Rubric</h2>
      <fieldset><legend>Are the screens specific to the idea?</legend><div class="opts" data-q="screens"></div></fieldset>
      <fieldset><legend>Does the out-of-scope list make sense?</legend><div class="opts" data-q="outOfScope"></div></fieldset>
      <fieldset><legend>Would you approve it without major edits?</legend><div class="opts" data-q="approve"></div></fieldset>
      <textarea id="notes" placeholder="Notes"></textarea>
      <div class="row">
        <button class="btn" id="prev">Previous</button>
        <button class="btn primary" id="next">Next</button>
      </div>
    </aside>
  </main>
</div>
<script id="specs" type="application/json">[{"label":"A","ideaId":1,"idea":"A dashboard that helps PMs re-orient when switching between projects, showing the last decision made, blockers, and who's waiting on what.","spec":{"productName":"ContextSwitch","oneLiner":"A re-orientation dashboard that gets PMs back up to speed in seconds when switching between projects.","problem":"Product managers juggle multiple projects a day, and every switch costs 10-20 minutes of reloading context: what was the last decision, what's blocked, and who is waiting on them. That friction burns focus, causes dropped follow-ups, and leads to decisions made without full context.","targetUser":"Product managers at startups and mid-size companies who own 2-5 parallel projects or workstreams and context-switch multiple times per day.","tone":"Calm, focused, trustworthy","platform":"web","coreFlow":["PM opens the dashboard and sees cards for each active project with a freshness indicator.","PM clicks a project card to expand its re-orientation brief in the same view.","The brief shows: last decision (what, when, who), current blockers (what, why stuck, owner), and who is waiting on the PM and for what.","PM clicks any item to jump to the source (ticket, doc, message) or mark it resolved / no longer waiting.","PM pins or snoozes items to clear their queue, and returns to the grid with one project marked as 're-oriented'."],"screens":[{"name":"Project Grid","purpose":"Home view showing all active projects as cards with status, freshness, and counts of blockers and waiting-on-you items so the PM picks where to re-orient."},{"name":"Re-orientation Brief","purpose":"Expanded view of a single project showing the last decision, open blockers, and who's waiting on what, with one-click access to the underlying sources."},{"name":"Waiting On You","purpose":"Cross-project queue of everything other people are blocked on the PM for, sorted by age and importance, so nothing falls through the cracks."},{"nam th status and last activity so the PM can choose where to jump in"},{"name":"Re-entry Brief","purpose":"Single consolidated view showing the last decision, open blockers, and who's waiting, so the PM regains context in seconds"},{"name":"Decision Log","purpose":"Chronological history of key decisions per project for deeper context or audit"},{"name":"Blocker Detail","purpose":"Drill into a specific blocker to see owner, timeline, and update its status"},{"name":"Waiting-On Queue","purpose":"Cross-project list of everyone currently waiting on the PM, prioritized by urgency"}],"outOfScope":["Full task/project management (not a replacement for Jira, Linear, or Asana)","Real-time chat or messaging","Time tracking or reporting","Native mobile app in v1","AI-generated decisions or automated prioritization in v1"]}},{"label":"C","ideaId":1,"idea":"A dashboard that helps PMs re-orient when switching between projects, showing the last decision made, blockers, and who's waiting on what.","spec":{"productName":"Relay","oneLiner":"A re-orientation dashboard that tells PMs where every project stands the moment they switch back to it.","problem":"Product managers juggle multiple projects in parallel and lose 15-30 minutes of context every time they switch, reconstructing the last decision, unresolved blockers, and who is waiting on them. This wasted ramp-up time leads to slow replies, duplicated conversations, and dropped threads.","targetUser":"Mid-to-senior product managers at startups or scale-ups who own 2-5 concurrent projects and context-switch multiple times per day.","tone":"calm, focused, trustworthy","platform":"Web (desktop-first, responsive)","coreFlow":["PM lands on the dashboard and sees all active projects as 'context cards' ranked by staleness and urgency.","PM clicks a project card (or hits the global keyboard shortcut to jump to the project they last touched).","The project view surfaces the three anchors: last decision made (with timestamp and owner), current blockers, and open threads with who is waiting on what.","PM marks items as acknowledged, resolved, or nudged, and optionally writes a one-line 'where I left off' note.","The dashboard updates staleness and priority scores in real time so the next switch is instantly oriented."],"screens":[{"name":"Dashboard / Project Switcher","purpose":"Show all active projects as context cards with last-touched time, decision recency, blocker count, and waiting-on count; allow one-click entry into any project."},{"name":"Project Orientation View","purpose":"Present the last decision, active blockers, and a 'who's waiting on what' list for one project, with actions to acknowledge, resolve, or nudge."},{"name":"Focus / Handoff Note","purpose":"Let the PM write a short 'where I left off' note when leaving a project, which becomes the first thing they see on return."},{"name":"Integrations and Sources","purpose":"Connect Slack, Jira/Linear, GitHub, and calendars so decisions, blockers, and waiting-on items are inferred automatically rather than entered manually."},{"name":"Settings and Priorities","purpose":"Configure which projects are tracked, staleness thresholds, notification rules, and which sources feed each project."}],"outOfScope":["Full project management (no sprint planning, backlog grooming, or gantt charts)","Real-time chat or commenting — PMs still respond in their source tools","Team-facing dashboards or reporting for leadership","Mobile native apps (web only for v1)","AI-generated summaries of every thread in v1 — start with decision, blocker, and waiting-on extraction only","Time tracking, invoicing, or billing features","Replacing Slack, Jira, Linear, or Notion — Relay reads from them, it does not replace them"]}},{"label":"D","ideaId":1,"idea":"A dashboard that helps PMs re-orient when switching between projects, showing the last decision made, blockers, and who's waiting on what.","spec":{"productName":"Resume","oneLiner":"A re-entry dashboard that tells PMs exactly uctName":"Brieflio","oneLiner":"Paste your rough status bullets and get two polished updates instantly: one for execs, one for your team.","problem":"People who write frequent status updates waste time reformatting the same information for different audiences, often stripping out detail for leadership or adding too much jargon for peers, leading to inconsistent, unclear communication.","targetUser":"Project managers, team leads, and individual contributors who send recurring status updates to both leadership and their immediate team","tone":"clean, professional, efficient","platform":"web","coreFlow":["User pastes or types rough status bullets into a single input box","User selects context (e.g. project name, audience emphasis, urgency)","Tool generates two versions: a concise exec summary and a detailed team update","User reviews and edits either version inline","User copies or exports the final versions to email, Slack, or docs"],"screens":[{"name":"Input Screen","purpose":"Capture raw bullet points and optional context like project name or tone preference"},{"name":"Dual Output Screen","purpose":"Display exec and team versions side by side for comparison and editing"},{"name":"Edit & Refine Screen","purpose":"Allow inline tweaks, regeneration of a single version, or tone adjustments"},{"name":"Export/Share Screen","purpose":"Copy to clipboard, download, or send directly to email/Slack integrations"},{"name":"History Screen","purpose":"View and reuse past updates for recurring status reports"}],"outOfScope":["Real-time collaborative editing with multiple users","Native mobile apps","Direct integration with project management tools (e.g. Jira, Asana) for auto-pulling status data","Automated scheduling or sending of updates on a recurring basis","Support for languages other than English at launch"]}},{"label":"H","ideaId":2,"idea":"A tool that turns rough status bullets into a clean update, one version for execs and one for the team.","spec":{"productName":"TwoTakes nd reduced communication efficiency.","targetUser":"Product managers, project leads, and team leads who need to share concise status reports to both executives and their own teams.","tone":"professional, clear, efficient","platform":"web","coreFlow":["User lands on the dashboard","User pastes or types raw status bullets","User selects target audience (executive or team)","System generates a polished version","User reviews, edits if needed, and exports or shares the update"],"screens":[{"name":"Dashboard","purpose":"Welcome screen with quick start, recent updates, and help resources."},{"name":"Bullet Input","purpose":"Rich text area where users paste or type their raw status bullets."},{"name":"Audience Selector","purpose":"Toggle to choose between executive version and team version, with preview of tone differences."},{"name":"Generated Update Preview","purpose":"Displays the AI‑crafted update, allowing inline edits and formatting adjustments."},{"name":"Export & Share","purpose":"Options to copy to clipboard, download as PDF/MD, or send via email/slack integration."}],"outOfScope":["Mobile native app","Real‑time multi‑user collaboration","Deep integrations with all third‑party PM tools","Advanced analytics on update effectiveness","Multi‑language translation"]}},{"label":"J","ideaId":2,"idea":"A tool that turns rough status bullets into a clean update, one version for execs and one for the team.","spec":{"productName":"BulletBrief","oneLiner":"Convert raw status notes into polished updates tailored for executives and the broader team.","problem":"Teams waste time reformatting status bullets and struggle to craft messages that suit different audiences, leading to inconsistent communication and missed insights.","targetUser":"Mid-level managers and project leads who compile weekly status reports for both leadership and their own teams.","tone":"clear, professional, efficient","platform":"web","coreFlow":["Paste or import bullet points","Choose audience (Exec / Team) <script>
const specs = JSON.parse(document.getElementById("specs").textContent);
const STORE = "blind-spec-review-3way";
const OPTIONS = { screens: ["Yes", "Partly", "No"], outOfScope: ["Yes", "Partly", "No"], approve: ["Yes", "No"] };
const QUESTIONS = Object.keys(OPTIONS);
let answers = {};
try { answers = JSON.parse(localStorage.getItem(STORE)) || {}; } catch (e) {}
let index = 0;

function save() { try { localStorage.setItem(STORE, JSON.stringify(answers)); } catch (e) {} }
function done(label) { const a = answers[label] || {}; return QUESTIONS.every((q) => a[q]); }
function el(tag, attrs, children) {
  const node = document.createElement(tag);
  Object.assign(node, attrs || {});
  for (const child of [].concat(children || [])) node.append(child);
  return node;
}
function section(title, body) { return [el("h3", { textContent: title }), body]; }
function text(value) { return value === undefined || value === null || value === "" ? "(not given)" : String(value); }
function list(tag, items) { return el(tag, {}, (Array.isArray(items) ? items : []).map((item) => el("li", { textContent: text(item) }))); }

function renderSpec(entry) {
  const box = document.getElementById("spec");
  box.replaceChildren();
  if (entry.raw !== undefined) {
    box.append(el("p", { textContent: "This spec didn't parse as JSON. Raw output:" }), el("pre", { className: "raw", textContent: entry.raw }));
    return;
  }
  const s = entry.spec;
  const chips = el("div", { className: "chips" }, [
    el("span", { textContent: "Tone: " + text(s.tone) }),
    el("span", { textContent: "Platform: " + text(s.platform) }),
  ]);
  const screens = el("div", {}, (Array.isArray(s.screens) ? s.screens : []).map((sc) =>
    el("div", { className: "screen" }, [el("strong", { textContent: text(sc && sc.name) }), el("span", { textContent: text(sc && sc.purpose) })])));
  box.append(
    el("h2", { textContent: text(s.productName) }),
    el("p", { className: "oneliner", textContent: text(s.oneLiner) }),
    chips,
    ...section("Problem", el("p", { textContent: text(s.problem) })),
    ...section("Target user", el("p", { textContent: text(s.targetUser) })),
    ...section("Core flow", list("ol", s.coreFlow)),
    ...section("Screens", screens),
    ...section("Out of scope", list("ul", s.outOfScope)),
  );
}

function renderRubric(entry) {
  const a = answers[entry.label] || {};
  for (const box of document.querySelectorAll(".opts")) {
    const q = box.dataset.q;
    box.replaceChildren(...OPTIONS[q].map((opt) => {
      const input = el("input", { type: "radio", name: q, checked: a[q] === opt });
      input.addEventListener("change", () => { update(entry.label, { [q]: opt }); });
      return el("label", {}, [input, opt]);
    }));
  }
  document.getElementById("notes").value = a.notes || "";
}

function update(label, patch) {
  answers[label] = Object.assign({}, answers[label], patch);
  save();
  renderNav();
}

function renderNav() {
  const listBox = document.getElementById("list");
  listBox.replaceChildren();
  let lastIdea = null;
  specs.forEach((entry, i) => {
    if (entry.ideaId !== lastIdea) { listBox.append(el("h2", { textContent: "Idea " + entry.ideaId })); lastIdea = entry.ideaId; }
    const button = el("button", { className: i === index ? "active" : "" }, [
      "Spec " + entry.label, el("span", { className: "tick", textContent: done(entry.label) ? "✓" : "" })]);
    button.addEventListener("click", () => go(i));
    listBox.append(button);
  });
  document.getElementById("progress").textContent = specs.filter((s) => done(s.label)).length + " of " + specs.length + " reviewed";
}

function go(i) {
  index = i;
  const entry = specs[index];
  document.getElementById("title").textContent = "Spec " + entry.label;
  document.getElementById("idea").textContent = "Idea " + entry.ideaId + ": " + entry.idea;
  renderSpec(entry);
  renderRubric(entry);
  renderNav();
  document.getElementById("prev").disabled = index === 0;
  document.getElementById("next").disabled = index === specs.length - 1;
  window.scrollTo(0, 0);
}

document.getElementById("notes").addEventListener("input", (e) => update(specs[index].label, { notes: e.target.value }));
document.getElementById("prev").addEventListener("click", () => go(index - 1));
document.getElementById("next").addEventListener("click", () => go(index + 1));
document.getElementById("export").addEventListener("click", () => {
  const esc = (v) => { const s = v === undefined ? "" : String(v); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const rows = ["label,idea_id,screens_specific,out_of_scope_sensible,approve_without_major_edits,notes"].concat(specs.map((entry) => {
    const a = answers[entry.label] || {};
    return [entry.label, entry.ideaId, a.screens, a.outOfScope, a.approve, a.notes].map(esc).join(",");
  }));
  const link = el("a", { download: "spec-review-3way-scores.csv", href: URL.createObjectURL(new Blob([rows.join("\n") + "\n"], { type: "text/csv" })) });
  link.click();
});

go(0);
</script>
</body>
</html>
