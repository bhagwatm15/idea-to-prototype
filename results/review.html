<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blind Prototype Review</title>
<style>
  :root { --bg:#f7f7f5; --panel:#fff; --text:#1d1d1b; --muted:#6b6b66; --line:#e2e1dc; --accent:#3b5bdb; --done:#2f9e44; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161615; --panel:#1f1f1d; --text:#ececea; --muted:#9a9a94; --line:#33332f; --accent:#7b93ff; --done:#51cf66; } }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--text); }
  .app { display:grid; grid-template-columns: 220px 1fr; min-height:100vh; }
  nav { border-right:1px solid var(--line); padding:16px; background:var(--panel); overflow-y:auto; }
  nav h1 { font-size:15px; margin:0 0 4px; }
  nav p { color:var(--muted); font-size:13px; margin:0 0 16px; }
  nav h2 { font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:16px 0 6px; }
  nav button { display:flex; justify-content:space-between; width:100%; padding:6px 10px; margin:2px 0; border:1px solid transparent; border-radius:6px; background:none; color:inherit; font:inherit; cursor:pointer; text-align:left; }
  nav button:hover { border-color:var(--line); }
  nav button.active { border-color:var(--accent); }
  nav .score { color:var(--done); font-weight:600; }
  main { padding:24px; min-width:0; }
  .idea { color:var(--muted); margin:4px 0 16px; max-width:70ch; }
  .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin:16px 0; }
  .btn { padding:6px 14px; border-radius:6px; border:1px solid var(--line); background:var(--panel); color:inherit; font:inherit; cursor:pointer; }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .scores label { display:inline-flex; align-items:center; gap:4px; margin-right:10px; }
  textarea { width:100%; max-width:70ch; min-height:70px; padding:8px; border:1px solid var(--line); border-radius:6px; background:var(--panel); color:inherit; font:inherit; }
  @media (max-width: 720px) { .app { grid-template-columns: 1fr; } nav { border-right:0; border-bottom:1px solid var(--line); } main { padding:16px; } }
</style>
<script type="importmap">
{ "imports": {
  "react": "https://esm.sh/react@19.2.4",
  "react/": "https://esm.sh/react@19.2.4/",

  "react-dom/": "https://esm.sh/react-dom@19.2.4/",

} }
</script>
</head>

<script id="outputs" type="application/json">[{"label":"A","ideaId":1,"idea":"A dashboard that helps PMs re-orient when switching between projects, showing the last decision made, blockers, and who's waiting on what.","code":"import React, { useState } from 'react';\n\nexport default function App() {\n  const colors = {\n    bg: '#f6f7f9', card: '#ffffff', border: '#e2e5e9', text: '#20242b',\n    sub: '#6b7280', accent: '#3b6e8f', accentSoft: '#eaf1f5',\n    green: '#3f9c6d', yellow: '#c9962e', red: '#c05a4a'\n  };\n  const font = { fontFamily: 'Segoe UI, Helvetica, Arial, sans-serif', color: colors.text };\n  const page = { minHeight: '100vh', background: colors.bg, ...font };\n  const nav = { display: 'flex', gap: 8, padding: '14px 24px', borderBottom: `1px solid ${colors.border}`, background: colors.card };\n  const navBtn = (on) => ({ padding: '8px 14px', borderRadius: 8, border: 'none', cursor: 'pointer', fontSize: 14, fontWeight: 600, background: on ? colors.accent : 'transparent', color: on ? '#fff' : colors.sub });\n  const wrap = { padding: '28px 32px', maxWidth: 760, margin: '0 auto' };\n  const card = { background: colors.card, border: `1px solid ${colors.border}`, borderRadius: 12, padding: 18, marginBottom: 14 };\n  const h1 = { fontSize: 22, fontWeight: 700, margin: '0 0 18px' };\n  const h2 = { fontSize: 15, fontWeight: 700, margin: '0 0 8px' };\n  const sub = { color: colors.sub, fontSize: 13 };\n  const btn = { background: colors.accent, color: '#fff', border: 'none', borderRadius: 7, padding: '7px 12px', fontSize: 13, fontWeight: 600, cursor: 'pointer', marginRight: 8 };\n  const dot = (s) => ({ display: 'inline-block', width: 9, height: 9, borderRadius: 9, marginRight: 8, background: s === 'green' ? colors.green : s === 'yellow' ? colors.yellow : colors.red });\n\n  const projects = [\n    { id: 1, name: 'Atlas Migration', status: 'green',\n      lastDecision: { text: 'Adopt Postgres over DynamoDB for cost predictability', by: 'You', date: 'Oct 2' },\n      blockers: [{ id: 1, title: 'Infra budget sign-off pending', who: 'Dana Kim (Infra)', age: '3 days', reason: 'Awaiting finance approval on Q4 spend', next: 'Ping Dana directly, escalate to Priya if no reply by Fri' }],\n      waiting: [{ who: 'Dana Kim', what: 'Infra budget approval', since: '3 days' }],\n      decisions: [\n        { date: 'Oct 2', text: 'Adopt Postgres over DynamoDB for cost predictability', by: 'You' },\n        { date: 'Sep 27', text: 'Delay cutover to avoid holiday freeze', by: 'You' },\n        { date: 'Sep 20', text: 'Use blue/green deploy strategy', by: 'Marcus Lee' }\n      ] },\n    { id: 2, name: 'Checkout Redesign', status: 'yellow',\n      lastDecision: { text: 'Move to single-page checkout flow', by: 'You', date: 'Oct 4' },\n      blockers: [{ id: 2, title: 'Design review stalled', who: 'Sofia Renz (Design)', age: '6 days', reason: 'Two competing layouts, no tiebreaker yet', next: 'Pick a variant this week, or delegate the call to Sofia' }],\n      waiting: [{ who: 'Sofia Renz', what: 'Final layout decision', since: '6 days' }, { who: 'Growth team', what: 'Confirmation on A/B split', since: '2 days' }],\n      decisions: [\n        { date: 'Oct 4', text: 'Move to single-page checkout flow', by: 'You' },\n        { date: 'Sep 30', text: 'Drop guest-checkout upsell modal', by: 'You' }\n      ] },\n    { id: 3, name: 'Onboarding V2', status: 'red',\n      lastDecision: { text: 'Pause email drip until copy is rewritten', by: 'You', date: 'Sep 29' },\n      blockers: [{ id: 3, title: 'Legal review overdue', who: 'Tom Alvarez (Legal)', age: '9 days', reason: 'Consent language flagged, no revision sent back', next: 'Escalate to Legal lead, request interim approval' }],\n      waiting: [{ who: 'Tom Alvarez', what: 'Consent copy sign-off', since: '9 days' }],\n      decisions: [{ date: 'Sep 29', text: 'Pause email drip until copy is rewritten', by: 'You' }] }\n  ];\n\n  const [screen, setScreen] = useState('switcher');\n  const [projectId, setProjectId] = useState(null);\n  const [blockerId, setBlockerId] = useState(null);\n  const [caughtUp, setCaughtUp] = useState({});\n  const project = projects.find(p => p.id === projectId);\n  const blocker = project && project.blockers.find(b => b.id === blockerId);\n  const goProject = (id) => { setProjectId(id); setScreen('summary'); };\n  const tabs = ['switcher', 'summary', 'decisions', 'blocker', 'queue'];\n  const label = { switcher: 'Switcher', summary: 'Re-entry Summary', decisions: 'Decision Log', blocker: 'Blocker Detail', queue: 'Waiting-On Queue' };\n\n  let body;\n  if (screen === 'switcher') {\n    body = (\u003cdiv style={wrap}>\u003ch1 style={h1}>Your Projects\u003c/h1>\n      {projects.map(p => (\n        \u003cdiv key={p.id} style={card}>\n          \u003cdiv style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>\n            \u003cdiv>\u003cspan style={dot(p.status)} />{p.name} {caughtUp[p.id] && \u003cspan style={{ ...sub, marginLeft: 8 }}>✓ caught up\u003c/span>}\u003c/div>\n            \u003cbutton style={btn} onClick={() => goProject(p.id)}>Resume\u003c/button>\n          \u003c/div>\n          \u003cdiv style={{ ...sub, marginTop: 6 }}>Last decision: {p.lastDecision.text}\u003c/div>\n        \u003c/div>))}\n    \u003c/div>);\n  } else if (screen === 'summary' && project) {\n    body = (\u003cdiv style={wrap}>\u003ch1 style={h1}>{project.name}\u003c/h1>\n      \u003cdiv style={card}>\u003ch2 style={h2}>Last decision\u003c/h2>\u003cdiv>{project.lastDecision.text}\u003c/div>\u003cdiv style={sub}>{project.lastDecision.by} · {project.lastDecision.date}\u003c/div>\u003c/div>\n      \u003cdiv style={card}>\u003ch2 style={h2}>Blockers\u003c/h2>\n        {project.blockers.map(b => (\u003cdiv key={b.id} style={{ marginBottom: 8 }}>\n          \u003cdiv>{b.title} \u003cspan style={sub}>({b.age} open)\u003c/span>\u003c/div>\n          \u003cbutton style={btn} onClick={() => { setBlockerId(b.id); setScreen('blocker'); }}>View & act\u003c/button>\n        \u003c/div>))}\n      \u003c/div>\n      \u003cdiv style={card}>\u003ch2 style={h2}>Who's waiting\u003c/h2>\n        {project.waiting.map((w, i) => (\u003cdiv key={i} style={{ marginBottom: 6 }}>{w.who} — {w.what} \u003cspan style={sub}>({w.since})\u003c/span> \u003cbutton style={{ ...btn, background: colors.accentSoft, color: colors.accent }} onClick={() => alert('Reply sent to ' + w.who)}>Reply\u003c/button>\u003c/div>))}\n      \u003c/div>\n      \u003cbutton style={btn} onClick={() => setCaughtUp({ ...caughtUp, [project.id]: true })}>Mark caught up\u003c/button>\n      \u003cbutton style={{ ...btn, background: 'transparent', color: colors.sub, border: `1px solid ${colors.border}` }} onClick={() => setScreen('switcher')}>Back to Switcher\u003c/button>\n    \u003c/div>);\n  } else if (screen === 'decisions' && project) {\n    body = (\u003cdiv style={wrap}>\u003ch1 style={h1}>Decision Log — {project.name}\u003c/h1>\n      {project.decisions.map((d, i) => (\u003cdiv key={i} style={card}>\u003cdiv>{d.text}\u003c/div>\u003cdiv style={sub}>{d.by} · {d.date}\u003c/div>\u003c/div>))}\n    \u003c/div>);\n  } else if (screen === 'blocker' && blocker) {\n    body = (\u003cdiv style={wrap}>\u003ch1 style={h1}>Blocker Detail\u003c/h1>\n      \u003cdiv style={card}>\n        \u003ch2 style={h2}>{blocker.title}\u003c/h2>\n        \u003cdiv style={sub}>Affects: {blocker.who}\u003c/div>\n        \u003cdiv style={sub}>Open for: {blocker.age}\u003c/div>\n        \u003cdiv style={{ margin: '10px 0' }}>Why it's stuck: {blocker.reason}\u003c/div>\n        \u003cdiv style={{ marginBottom: 12 }}>Suggested next step: {blocker.next}\u003c/div>\n        \u003cbutton style={btn} onClick={() => alert('Unblock message sent to ' + blocker.who)}>Unblock now\u003c/button>\n        \u003cbutton style={{ ...btn, background: colors.accentSoft, color: colors.accent }} onClick={() => setScreen('summary')}>Back to Summary\u003c/button>\n      \u003c/div>\n    \u003c/div>);\n  } else if (screen === 'queue') {\n    const all = projects.flatMap(p => p.waiting.map(w => ({ ...w, project: p.name })));\n    body = (\u003cdiv style={wrap}>\u003ch1 style={h1}>Waiting on You\u003c/h1>\n      {all.map((w, i) => (\u003cdiv key={i} style={card}>\n        \u003cdiv>{w.who} — {w.what}\u003c/div>\n        \u003cdiv style={sub}>{w.project} · waiting {w.since}\u003c/div>\n        \u003cbutton style={btn} onClick={() => alert('Replied to ' + w.who)}>Reply\u003c/button>\n      \u003c/div>))}\n    \u003c/div>);\n  } else {\n    body = (\u003cdiv style={wrap}>\u003cp style={sub}>Select a project from the Switcher first.\u003c/p>\u003c/div>);\n  }\n\n  return (\u003cdiv style={page}>\n    \u003cdiv style={nav}>{tabs.map(t => (\u003cbutton key={t} style={navBtn(screen === t)} onClick={() => setScreen(t)}>{label[t]}\u003c/button>))}\u003c/div>\n    {body}\n  \u003c/div>);\n}\n"},{"label":"B","ideaId":1,"idea":"A dashboard that helps PMs re-orient when switching between projects, showing the last decision made, blockers, and who's waiting on what.","code":"import React, { useState } from 'react';\n\nconst App = () => {\n  const [screen, setScreen] = useState('switcher');\n  const [selectedProject, setSelectedProject] = useState(null);\n  const [caughtUpProjects, setCaughtUpProjects] = useState(new Set());\n\n  // Shared styles\n  const colors = {\n    primary: '#2C3E50',\n    secondary: '#34495E',\n    accent: '#3498DB',\n    success: '#27AE60',\n    warning: '#E67E22',\n    danger: '#E74C3C',\n    background: '#ECF0F1',\n    border: '#BDC3C7',\n    text: '#2C3E50',\n    lightText: '#7F8C8D',\n  };\n\n  const spacing = {\n    xs: '4px',\n    sm: '8px',\n    md: '16px',\n    lg: '24px',\n    xl: '32px',\n  };\n\n  const sharedButtonStyle = {\n    padding: `${spacing.sm} ${spacing.md}`,\n    borderRadius: '4px',\n    border: 'none',\n    cursor: 'pointer',\n    fontSize: '14px',\n    fontWeight: '500',\n  };\n\n  // Sample data\n  const projects = [\n    {\n      id: 1,\n      name: 'Mobile App Redesign',\n      status: 'at-risk',\n      blockers: 2,\n      waiting: 1,\n      lastActivity: '2 hours ago',\n    },\n    {\n      id: 2,\n      name: 'API Migration',\n      status: 'on-track',\n      blockers: 0,\n      waiting: 3,\n      lastActivity: '30 min ago',\n    },\n    {\n      id: 3,\n      name: 'Analytics Dashboard',\n      status: 'at-risk',\n      blockers: 1,\n      waiting: 0,\n      lastActivity: '4 hours ago',\n    },\n    {\n      id: 4,\n      name: 'Payment Integration',\n      status: 'on-track',\n      blockers: 0,\n      waiting: 0,\n      lastActivity: '1 day ago',\n    },\n  ];\n\n  const decisions = [\n    {\n      id: 1,\n      date: '2024-01-15 2:30 PM',\n      title: 'Approved new color palette for redesign',\n      maker: 'You',\n      impact: 'Unblocked design handoff',\n    },\n    {\n      id: 2,\n      date: '2024-01-14 10:15 AM',\n      title: 'Postponed backend optimization to Phase 2',\n      maker: 'You',\n      impact: 'Adjusted timeline',\n    },\n    {\n      id: 3,\n      date: '2024-01-13 4:45 PM',\n      title: 'Selected Postgres for primary database',\n      maker: 'Tech Lead Sarah',\n      impact: 'Unblocked infrastructure setup',\n    },\n  ];\n\n  const blockers = [\n    {\n      id: 1,\n      title: 'Waiting on design system components from Design',\n      owner: 'Marcus (Design Lead)',\n      duration: '3 days',\n      impact: '4 engineers blocked',\n      nextAction: 'Follow up with Marcus on timeline',\n    },\n    {\n      id: 2,\n      title: 'API rate limits causing test failures',\n      owner: 'Platform Team',\n      duration: '1 day',\n      impact: 'Testing pipeline unstable',\n      nextAction: 'Request sandbox environment',\n    },\n  ];\n\n  const waitingOn = [\n    {\n      id: 1,\n      project: 'Mobile App Redesign',\n      request: 'Review design mockups - 5 screens',\n      from: 'Design Lead Marcus',\n      date: '2 hours ago',\n    },\n    {\n      id: 2,\n      project: 'API Migration',\n      request: 'Approve database schema changes',\n      from: 'Tech Lead Sarah',\n      date: '1 hour ago',\n    },\n    {\n      id: 3,\n      project: 'API Migration',\n      request: 'Sign off on deployment plan',\n      from: 'DevOps Alex',\n      date: '30 min ago',\n    },\n  ];\n\n  const getStatusColor = (status) => {\n    return status === 'on-track' ? colors.success : colors.warning;\n  };\n\n  const getStatusLabel = (status) => {\n    return status === 'on-track' ? '●' : '⚠';\n  };\n\n  // Screen: Project Switcher\n  if (screen === 'switcher') {\n    return (\n      \u003cdiv style={{ minHeight: '100vh', backgroundColor: colors.background, fontFamily: 'system-ui' }}>\n        \u003cdiv style={{ maxWidth: '800px', margin: '0 auto', padding: spacing.xl }}>\n          \u003ch1 style={{ color: colors.primary, fontSize: '28px', marginBottom: spacing.lg, fontWeight: '600' }}>\n            Resume\n          \u003c/h1>\n          \u003cp style={{ color: colors.lightText, fontSize: '14px', marginBottom: spacing.xl }}>\n            Your active projects at a glance. Select one to catch up.\n          \u003c/p>\n\n          {projects.map((project) => (\n            \u003cdiv\n              key={project.id}\n              style={{\n                backgroundColor: '#FFFFFF',\n                border: `1px solid ${colors.border}`,\n                borderRadius: '6px',\n                padding: spacing.md,\n                marginBottom: spacing.md,\n                cursor: 'pointer',\n                transition: 'box-shadow 0.2s',\n              }}\n              onClick={() => {\n                setSelectedProject(project);\n                setScreen('summary');\n              }}\n            >\n              \u003cdiv style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'start' }}>\n                \u003cdiv style={{ flex: 1 }}>\n                  \u003cdiv style={{ display: 'flex', alignItems: 'center', gap: spacing.sm, marginBottom: spacing.sm }}>\n                    \u003cspan style={{ fontSize: '16px', color: getStatusColor(project.status) }}>\n                      {getStatusLabel(project.status)}\n                    \u003c/span>\n                    \u003ch3 style={{ color: colors.primary, fontSize: '16px', margin: 0, fontWeight: '500' }}>\n                      {project.name}\n                    \u003c/h3>\n                  \u003c/div>\n                  \u003cp style={{ color: colors.lightText, fontSize: '13px', margin: `${spacing.xs} 0`, marginLeft: '20px' }}>\n                    {project.blockers > 0 && `${project.blockers} blocker${project.blockers > 1 ? 's' : ''} • `}\n                    {project.waiting} waiting on you • Last activity {project.lastActivity}\n                  \u003c/p>\n                \u003c/div>\n                \u003cbutton\n                  style={{\n                    ...sharedButtonStyle,\n                    backgroundColor: colors.accent,\n                    color: '#FFFFFF',\n                  }}\n                >\n                  Open\n                \u003c/button>\n              \u003c/div>\n            \u003c/div>\n          ))}\n        \u003c/div>\n      \u003c/div>\n    );\n  }\n\n  // Screen: Re-entry Summary\n  if (screen === 'summary') {\n    return (\n      \u003cdiv style={{ minHeight: '100vh', backgroundColor: colors.background, fontFamily: 'system-ui' }}>\n        \u003cdiv style={{ maxWidth: '800px', margin: '0 auto', padding: spacing.xl }}>\n          \u003cdiv style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: spacing.lg }}>\n            \u003ch1 style={{ color: colors.primary, fontSize: '24px', margin: 0, fontWeight: '600' }}>\n              {selectedProject?.name}\n            \u003c/h1>\n            \u003cbutton\n              onClick={() => setScreen('switcher')}\n              style={{\n                ...sharedButtonStyle,\n                backgroundColor: colors.background,\n                color: colors.primary,\n                border: `1px solid ${colors.border}`,\n              }}\n            >\n              ← Back\n            \u003c/button>\n          \u003c/div>\n\n          {/* Tabs */}\n          \u003cdiv style={{ display: 'flex', gap: spacing.md, marginBottom: spacing.lg, borderBottom: `2px solid ${colors.border}` }}>\n            {['summary', 'decisions', 'blockers', 'waiting'].map((tab) => (\n              \u003cbutton\n                key={tab}\n                onClick={() => setScreen(tab === 'summary' ? 'summary' : tab)}\n                style={{\n                  ...sharedButtonStyle,\n                  backgroundColor: 'transparent',\n                  color: screen === (tab === 'summary' ? 'summary' : tab) ? colors.primary : colors.lightText,\n                  borderBottom: screen === (tab === 'summary' ? 'summary' : tab) ? `2px solid ${colors.accent}` : 'none',\n                  paddingBottom: spacing.sm,\n                }}\n              >\n                {tab.charAt(0).toUpperCase() + tab.slice(1)}\n              \u003c/button>\n            ))}\n          \u003c/div>\n\n          {/* Last Decision */}\n          \u003cdiv style={{ backgroundColor: '#FFFFFF', border: `1px solid ${colors.border}`, borderRadius: '6px', padding: spacing.md, marginBottom: spacing.lg }}>\n            \u003ch3 style={{ color: colors.primary, fontSize: '14px', margin: `0 0 ${spacing.sm} 0`, fontWeight: '600', textTransform: 'uppercase' }}>\n              Last Decision\n            \u003c/h3>\n            \u003cp style={{ color: colors.primary, fontSize: '15px', margin: `0 0 ${spacing.xs} 0`, fontWeight: '500' }}>\n              {decisions[0].title}\n            \u003c/p>\n            \u003cp style={{ color: colors.lightText, fontSize: '13px', margin: 0 }}>\n              {decisions[0].date} • {decisions[0].maker} • {decisions[0].impact}\n            \u003c/p>\n          \u003c/div>\n\n          {/* Active Blockers */}\n          \u003cdiv style={{ backgroundColor: '#FFFFFF', border: `1px solid ${colors.border}`, borderRadius: '6px', padding: spacing.md, marginBottom: spacing.lg }}>\n            \u003ch3 style={{ color: colors.primary, fontSize: '14px', margin: `0 0 ${spacing.md} 0`, fontWeight: '600', textTransform: 'uppercase' }}>\n              Active Blockers ({blockers.length})\n            \u003c/h3>\n            {blockers.map((blocker) => (\n              \u003cdiv\n                key={blocker.id}\n                style={{ paddingBottom: spacing.md, marginBottom: spacing.md, borderBottom: `1px solid ${colors.border}`, cursor: 'pointer' }}\n                onClick={() => setScreen('blocker')}\n              >\n                \u003cp style={{ color: colors.primary, fontSize: '14px', margin: `0 0 ${spacing.xs} 0`, fontWeight: '500' }}>\n                  {blocker.title}\n                \u003c/p>\n                \u003cp style={{ color: colors.lightText, fontSize: '13px', margin: `0 0 ${spacing.xs} 0` }}>\n                  {blocker.owner} • Open {blocker.duration} • {blocker.impact}\n                \u003c/p>\n              \u003c/div>\n            ))}\n          \u003c/div>\n\n          {/* Who's Waiting */}\n          \u003cdiv style={{ backgroundColor: '#FFFFFF', border: `1px solid ${colors.border}`, borderRadius: '6px', padding: spacing.md }}>\n            \u003ch3 style={{ color: colors.primary, fontSize: '14px', margin: `0 0 ${spacing.md} 0`, fontWeight: '600', textTransform: 'uppercase' }}>\n              Waiting on You ({selectedProject?.waiting})\n            \u003c/h3>\n            {waitingOn\n              .filter((item) => item.project === selectedProject?.name)\n              .map((item) => (\n                \u003cdiv key={item.id} style={{ paddingBottom: spacing.md, marginBottom: spacing.md, borderBottom: `1px solid ${colors.border}`, cursor: 'pointer' }} onClick={() => setScreen('waiting')}>\n                  \u003cp style={{ color: colors.primary, fontSize: '14px', margin: `0 0 ${spacing.xs} 0`, fontWeight: '500' }}>\n                    {item.request}\n                  \u003c/p>\n                  \u003cp style={{ color: colors.lightText, fontSize: '13px', margin: 0 }}>\n                    {item.from} • {item.date}\n                  \u003c/p>\n                \u003c/div>\n              ))}\n          \u003c/div>\n\n          \u003cbutton\n            onClick={() => {\n              setCaughtUpProjects((prev) => new Set(prev).add(selectedProject.id));\n              setScreen('switcher');\n            }}\n            style={{\n              ...sharedButtonStyle,\n              backgroundColor: colors.success,\n              color: '#FFFFFF',\n              marginTop: spacing.lg,\n              width: '100%',\n            }}\n          >\n            Mark as Caught Up\n          \u003c/button>\n        \u003c/div>\n      \u003c/div>\n    );\n  }\n\n  // Screen: Decision Log\n  if (screen === 'decisions') {\n    return (\n      \u003cdiv style={{ minHeight: '100vh', backgroundColor: colors.background, fontFamily: 'system-ui' }}>\n        \u003cdiv style={{ maxWidth: '800px', margin: '0 auto', padding: spacing.xl }}>\n          \u003cbutton\n            onClick={() => setScreen('summary')}\n            style={{\n              ...sharedButtonStyle,\n              backgroundColor: colors.background,\n              color: colors.primary,\n              border: `1px solid ${colors.border}`,\n              marginBottom: spacing.lg,\n            }}\n          >\n            ← Back to Summary\n          \u003c/button>\n          \u003ch2 style={{ color: colors.primary, fontSize: '24px', marginBottom: spacing.lg, fontWeight: '600' }}>\n            Decision Log\n          \u003c/h2>\n          {decisions.map((decision) => (\n            \u003cdiv\n              key={decision.id}\n              style={{ backgroundColor: '#FFFFFF', border: `1px solid ${colors.border}`, borderRadius: '6px', padding: spacing.md, margin tText, fontSize: '12px', margin: `0 0 ${spacing.xs} 0`, textTransform: 'uppercase', fontWeight: '600' }}>\n                  Owner\n                \u003c/p>\n                \u003cp style={{ color: colors.primary, fontSize: '14px', margin: 0 }}>{blocker.owner}\u003c/p>\n              \u003c/div>\n              \u003cdiv style={{ marginBottom: spacing.md }}>\n                \u003cp style={{ color: colors.lightText, fontSize: '12px', margin: `0 0 ${spacing.xs} 0`, textTransform: 'uppercase', fontWeight: '600' }}>\n                  Duration\n                \u003c/p>\n                \u003cp style={{ color: colors.primary, fontSize: '14px', margin: 0 }}>{blocker.duration}\u003c/p>\n              \u003c/div>\n              \u003cdiv style={{ marginBottom: spacing.md }}>\n                \u003cp style={{ color: colors.lightText, fontSize: '12px', margin: `0 0 ${spacing.xs} 0`, textTransform: 'uppercase', fontWeight: '600' }}>\n                  Impact\n                \u003c/p>\n                \u003cp style={{ color: colors.primary, fontSize: '14px', margin: 0 }}>{blocker.impact}\u003c/p>\n              \u003c/div>\n              \u003cdiv style={{ marginBottom: spacing.lg }}>\n                \u003cp style={{ color: colors.lightText, fontSize: '12px', margin: `0 0 ${spacing.xs} 0`, textTransform: 'uppercase', fontWeight: '600' }}>\n                  Next Action\n                \u003c/p>\n                \u003cp style={{ color: colors.primary, fontSize: '14px', margin: 0 }}>{blocker.nextAction}\u003c/p>\n              \u003c/div>\n              \u003cbutton\n                style={{\n                  ...sharedButtonStyle,\n                  backgroundColor: colors.accent,\n                  color: '#FFFFFF',\n                }}\n              >\n                Take Action\n              \u003c/button>\n            \u003c/div>\n          ))}\n        \u003c/div>\n      \u003c/div>\n    );\n  }\n\n  // Screen: Waiting-On Queue\n  if (screen === 'waiting') {\n    return (\n      \u003cdiv style={{ minHeight: '100vh', backgroundColor: colors.background, fontFamily: 'system-ui' }}>\n        \u003cdiv style={{ maxWidth: '800px', margin: '0 auto', padding: spacing.xl }}>\n          \u003cbutton\n            onClick={() => setScreen('summary')}\n            style={{\n              ...sharedButtonStyle,\n              backgroundColor: colors.background,\n              color: colors.primary,\n              border: `1px solid ${colors.border}`,\n              marginBottom: spacing.lg,\n            }}\n          >\n            ← Back to Summary\n          \u003c/button>\n          \u003ch2 style={{ color: colors.primary, fontSize: '24px', marginBottom: spacing.lg, fontWeight: '600' }}>\n            Waiting on You ({waitingOn.length})\n          \u003c/h2>\n          {waitingOn.map((item) => (\n            \u003cdiv\n              key={item.id}\n              style={{\n                backgroundColor: '#FFFFFF',\n                border: `1px solid ${colors.border}`,\n                borderRadius: '6px',\n                padding: spacing.md,\n                marginBottom: spacing.md,\n              }}\n            >\n              \u003cp style={{ color: colors.accent, fontSize: '12px', margin: `0 0 ${spacing.xs} 0`, fontWeight: '600' }}>\n                {item.project}\n              \u003c/p>\n              \u003ch4 style={{ color: colors.primary, fontSize: '15px', margin: `0 0 ${spacing.xs} 0`, fontWeight: '600' }}>\n                {item.request}\n              \u003c/h4>\n              \u003cp style={{ color: colors.lightText, fontSize: '13px', margin: 0 }}>\n                {item.from} • {item.date}\n              \u003c/p>\n              \u003cbutton\n                style={{\n                  ...sharedButtonStyle,\n                  backgroundColor: colors.accent,\n                  color: '#FFFFFF',\n                  marginTop: spacing.md,\n                }}\n              >\n                Reply\n              \u003c/button>\n            \u003c/div>\n          ))}\n        \u003c/div>\n      \u003c/div>\n    );\n  }\n};\n\nexport default App;\n"},{"label":"C","ideaId":1,"idea":"A dashboard that helps PMs re-orient when switching between projects, showing the last decision made, blockers, and who's waiting on what.","code":"export default function App() {\n  const colors = {\n    bg: '#f6f7f9', card: '#ffffff', border: '#e3e6eb', text: '#232733',\n    sub: '#6b7280', accent: '#4a5eea', green: '#3f9d6f', yellow: '#c99a2e',\n    red: '#c8555f', chip: '#eef0f6'\n  };\n  const page = { minHeight: '100vh', background: colors.bg, fontFamily: 'Georgia, \"Segoe UI\", sans-serif', color: colors.text };\n  const card = { background: colors.card, border: `1px solid ${colors.border}`, borderRadius: 10, padding: 18, marginBottom: 14 };\n  const btn = (bg, fg = '#fff') => ({ background: bg, color: fg, border: 'none', borderRadius: 6, padding: '8px 14px', fontSize: 13, cursor: 'pointer', marginRight: 8 });\n  const tab = (active) => ({ padding: '10px 16px', cursor: 'pointer', fontSize: 14, borderBottom: active ? `2px solid ${colors.accent}` : '2px solid transparent', color: active ? colors.accent : colors.sub, fontWeight: active ? 600 : 400 });\n  const dot = (c) => ({ display: 'inline-block', width: 9, height: 9, borderRadius: 5, background: c, marginRight: 6 });\n  const statusColor = { green: colors.green, yellow: colors.yellow, red: colors.red };\n\n  const [screen, setScreen] = useState('switcher');\n  const [projectId, setProjectId] = useState(null);\n  const [blockerId, setBlockerId] = useState(null);\n  const [caughtUp, setCaughtUp] = useState({});\n\n  const projects = [\n    { id: 1, name: 'Northwind Checkout Redesign', status: 'yellow',\n      lastDecision: 'Switched to single-page checkout flow (Mar 12)',\n      blockers: [\n        { id: 'b1', title: 'Payments API contract unsigned', since: '4 days', who: 'Priya Nair (Eng)', why: 'Legal review pending on vendor terms', next: 'Ping Legal for ETA, offer to walk them through redlines' },\n        { id: 'b2', title: 'Design QA blocked on new icons', since: '1 day', who: 'Sam Ortiz (Design)', why: 'Icon set not yet exported from Figma', next: 'Ask Sam to export placeholder set to unblock QA' }\n      ],\n      waitingOn: [ { person: 'Priya Nair', ask: 'Approve fallback plan if vendor slips', since: '2 days' }, { person: 'Dana Lee', ask: 'Confirm launch date with marketing', since: '1 day' } ] },\n    { id: 2, name: 'Atlas Onboarding Revamp', status: 'green',\n      lastDecision: 'Kept email verification as first step (Mar 14)',\n      blockers: [ { id: 'b3', title: 'Copy review overdue', since: '2 days', who: 'Marcus Webb (Content)', why: 'Waiting on brand voice sign-off', next: 'Escalate to brand lead directly' } ],\n      waitingOn: [ { person: 'Marcus Webb', ask: 'Finalize onboarding copy', since: '2 days' } ] },\n    { id: 3, name: 'Helios Data Migration', status: 'red',\n      lastDecision: 'Delayed cutover to April 2nd (Mar 10)',\n      blockers: [\n        { id: 'b4', title: 'Schema mismatch on legacy accounts', since: '6 days', who: 'Tariq Malik (Eng)', why: 'Legacy table missing normalized IDs', next: 'Schedule sync with data team to patch schema' },\n        { id: 'b5', title: 'Rollback plan unapproved', since: '3 days', who: 'Elena Cruz (Eng Lead)', why: 'Needs sign-off from infra on cost impact', next: 'Send cost summary directly to Elena' } ],\n      waitingOn: [ { person: 'Elena Cruz', ask: 'Approve rollback plan', since: '3 days' }, { person: 'Tariq Malik', ask: 'Confirm schema fix timeline', since: '1 day' } ] },\n    { id: 4, name: 'Fern Mobile App v2', status: 'green',\n      lastDecision: 'Adopted dark mode as default (Mar 9)',\n      blockers: [], waitingOn: [ { person: 'Nina Osei', ask: 'Share App Store screenshots', since: '5 days' } ] }\n  ];\n\n  const project = projects.find(p => p.id === projectId);\n  const decisionsLog = project ? [\n    project.lastDecision,\n    'Deferred internationalization to phase 2',\n    'Agreed to reuse existing auth service instead of rebuilding'\n  ] : [];\n  const blocker = project && project.blockers.find(b => b.id === blockerId);\n  const allWaiting = projects.flatMap(p => p.waitingOn.map(w => ({ ...w, project: p.name, pid: p.id })));\n\n  const Nav = () => (\n    \u003cdiv style={{ display: 'flex', borderBottom: `1px solid ${colors.border}`, padding: '0 24px', background: colors.card }}>\n      {['switcher', 'summary', 'decisions', 'blocker', 'waiting'].map(s => (\n        \u003cdiv key={s} style={tab(screen === s)} onClick={() => setScreen(s)}>\n          {{ switcher: 'Projects', summary: 'Re-entry Summary', decisions: 'Decision Log', blocker: 'Blocker Detail', waiting: 'Waiting-On Queue' }[s]}\n        \u003c/div>\n      ))}\n    \u003c/div>\n  );\n\n  let content;\n  if (screen === 'switcher') {\n    content = (\u003cdiv>\n      \u003ch2>Your Projects\u003c/h2>\n      {projects.map(p => (\n        \u003cdiv key={p.id} style={{ ...card, cursor: 'pointer' }} onClick={() => { setProjectId(p.id); setScreen('summary'); }}>\n          \u003cdiv style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>\n            \u003cdiv>\u003cspan style={dot(statusColor[p.status])}>\u003c/span>\u003cstrong>{p.name}\u003c/strong>\u003c/div>\n            \u003cspan style={{ fontSize: 12, color: colors.sub }}>{caughtUp[p.id] ? 'Caught up' : `${p.blockers.length} blocker(s)`}\u003c/span>\n          \u003c/div>\n          \u003cdiv style={{ fontSize: 13, color: colors.sub, marginTop: 6 }}>{p.lastDecision}\u003c/div>\n        \u003c/div>\n      ))}\n    \u003c/div>);\n  } else if (!project) {\n    content = \u003cdiv style={card}>Select a project from the switcher first.\u003c/div>;\n  } else if (screen === 'summary') {\n    content = (\u003cdiv>\n      \u003ch2>{project.name}\u003c/h2>\n      \u003cdiv style={card}>\u003cstrong>Last Decision\u003c/strong>\u003cp style={{ color: colors.sub }}>{project.lastDecision}\u003c/p>\u003c/div>\n      \u003cdiv style={card}>\u003cstrong>Active Blockers\u003c/strong>\n        {project.blockers.length === 0 && \u003cp style={{ color: colors.sub }}>None — clear to move fast.\u003c/p>}\n        {project.blockers.map(b => (\n          \u003cdiv key={b.id} style={{ padding: '8px 0', borderTop: `1px solid ${colors.border}` }}>\n            \u003cdiv>{b.title} \u003cspan style={{ fontSize: 12, color: colors.sub }}>· open {b.since}\u003c/span>\u003c/div>\n            \u003cbutton style={btn(colors.accent)} onClick={() => { setBlockerId(b.id); setScreen('blocker'); }}>View\u003c/button>\n          \u003c/div>\n        ))}\n      \u003c/div>\n      \u003cdiv style={card}>\u003cstrong>Waiting On You\u003c/strong>\n        {project.waitingOn.map((w, i) => (\n          \u003cdiv key={i} style={{ padding: '8px 0', borderTop: `1px solid ${colors.border}` }}>\n            {w.person} needs: {w.ask} \u003cspan style={{ fontSize: 12, color: colors.sub }}>({w.since})\u003c/span>\n            \u003cdiv>\u003cbutton style={btn(colors.green)}>Reply\u003c/button>\u003c/div>\n          \u003c/div>\n        ))}\n      \u003c/div>\n      \u003cbutton style={btn(colors.text)} onClick={() => setCaughtUp({ ...caughtUp, [project.id]: true })}>Mark Caught Up\u003c/button>\n    \u003c/div>);\n  } else if (screen === 'decisions') {\n    content = (\u003cdiv>\u003ch2>Decision Log — {project.name}\u003c/h2>\n      {decisionsLog.map((d, i) => (\u003cdiv key={i} style={card}>{d}\u003c/div>))}\n    \u003c/div>);\n  } else if (screen === 'blocker') {\n    content = !blocker ? \u003cdiv style={card}>Pick a blocker from the summary view.\u003c/div> : (\n      \u003cdiv>\u003ch2>{blocker.title}\u003c/h2>\n        \u003cdiv style={card}>\n          \u003cp>\u003cstrong>Affected:\u003c/strong> {blocker.who}\u003c/p>\n          \u003cp>\u003cstrong>Open for:\u003c/strong> {blocker.since}\u003c/p>\n          \u003cp>\u003cstrong>Why it's stuck:\u003c/strong> {blocker.why}\u003c/p>\n          \u003cp>\u003cstrong>Suggested next action:\u003c/strong> {blocker.next}\u003c/p>\n          \u003cbutton style={btn(colors.accent)}>Unblock Now\u003c/button>\n        \u003c/div>\n      \u003c/div>);\n  } else if (screen === 'waiting') {\n    content = (\u003cdiv>\u003ch2>Waiting-On Queue\u003c/h2>\n      {allWaiting.map((w, i) => (\n        \u003cdiv key={i} style={card}>\n          \u003cdiv style={{ fontSize: 12, color: colors.sub }}>{w.project}\u003c/div>\n          \u003cdiv>{w.person}: {w.ask} \u003cspan style={{ fontSize: 12, color: colors.sub }}>({w.since})\u003c/span>\u003c/div>\n          \u003cbutton style={btn(colors.green)}>Reply\u003c/button>\n        \u003c/div>\n      ))}\n    \u003c/div>);\n  }\n\n  return (\u003cdiv style={page}>\n    \u003cdiv style={{ padding: '18px 24px', fontSize: 20, fontWeight: 700 }}>Resume\u003c/div>\n    \u003cNav />\n    \u003cdiv style={{ padding: 24, maxWidth: 700, margin: '0 auto' }}>{content}\u003c/div>\n  \u003c/div>);\n}\n"},{"label":"D","ideaId":1,"idea":"A dashboard that helps PMs re-orient when switching between projects, showing the last decision made, blockers, and who's waiting on what.","code":"import React, { useState } from 'react';\n\nconst App = () => {\n  const [currentScreen, setCurrentScreen] = useState('switcher');\n  const [selectedProject, setSelectedProject] = useState(null);\n\n  // Shared style constants\n  const colors = {\n    bg: '#f8f7f5',\n    surface: '#ffffff',\n    text: '#2c2c2c',\n    textLight: '#6b6b6b',\n    accent: '#4a7c7e',\n    accentLight: '#e8f1f1',\n    warning: '#d97757',\n    success: '#5a8f6a',\n    border: '#e0ddd8',\n  };\n\n  const spacing = {\n    xs: 8,\n    sm: 12,\n    md: 16,\n    lg: 24,\n    xl: 32,\n  };\n\n  const baseText = {\n    fontFamily: \"'system-ui', sans-serif\",\n    color: colors.text,\n  };\n\n  const projects = [\n    { id: 1, name: 'Mobile App Redesign', status: 'on-track', lastUpdate: '2h ago', blockers: 1, waiting: 0 },\n bel = (status) => {\n    if (status === 'on-track') return 'On Track';\n    if (status === 'at-risk') return 'At Risk';\n    return 'Blocked';\n  };\n\n  // Project Switcher Screen\n  const renderSwitcher = () => (\n    \u003cdiv style={{ padding: spacing.lg }}>\n      \u003ch1 style={{ ...baseText, fontSize: 28, fontWeight: 600, marginBottom: spacing.lg }}>Active Projects\u003c/h1>\n      \u003cdiv style={{ display: 'grid', gap: spacing.md }}>\n        {projects.map((p) => (\n          \u003cdiv\n            key={p.id}\n            onClick={() => {\n              setSelectedProject(p.id);\n              setCurrentScreen('reentry');\n            }}\n            style={{\n              backgroundColor: colors.surface,\n              border: `1px solid ${colors.border}`,\n              borderRadius: 8,\n              padding: spacing.md,\n              cursor: 'pointer',\n              transition: 'all 0.2s',\n            }}\n            onMouseEnter={(e) => {\n              e.currentTarget.style.boxShadow = '0 2px 8px rgba(0,0,0,0.08)';\n              e.currentTarget.style.transform = 'translateY(-1px)';\n            }}\n            onMouseLeave={(e) => {\n              e.currentTarget.style.boxShadow = 'none';\n              e.currentTarget.style.transform = 'translateY(0)';\n            }}\n          >\n            \u003cdiv style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'start' }}>\n              \u003cdiv style={{ flex: 1 }}>\n                \u003ch3 style={{ ...baseText, fontSize: 16, fontWeight: 600, marginBottom: 4 }}>{p.name}\u003c/h3>\n                \u003cp style={{ ...baseText, color: colors.textLight, fontSize: 13 }}>Updated {p.lastUpdate}\u003c/p>\n              \u003c/div>\n              \u003cdiv\n                style={{\n                  backgroundColor: getStatusColor(p.status),\n                  color: '#fff',\n                  padding: `${spacing.xs}px ${spacing.sm}px`,\n                  borderRadius: 4,\n n    setExecSummary(exec);\n    setTeamUpdate(team);\n    setScreen('output');\n  };\n\n  const handleExport = (version) => {\n    const text = version === 'exec' ? execSummary : teamUpdate;\n    navigator.clipboard.writeText(text);\n    alert(`${version === 'exec' ? 'Executive Summary' : 'Team Update'} copied to clipboard!`);\n  };\n\n  const handleSaveHistory = () => {\n    const newEntry = {\n      id: Math.max(...history.map(h => h.id), 0) + 1,\n      project: projectName || 'Untitled',\n      date: new Date().toISOString().split('T')[0],\n      preview: rawBullets.split('\\n')[0].slice(0, 50) + '...',\n      execSummary,\n      teamUpdate,\n    };\n    setHistory([newEntry, ...history]);\n    alert('Status update saved to history!');\n  };\n\n  const navTabs = ['input', 'output', 'history'];\n  const navLabels = { input: 'Compose', output: 'Review', history: 'History' };\n\n  return (\n    \u003cdiv style={{ minHeight: '100vh', backgroundColor: colors.white, fontFamily: 'system-ui, -apple-system, sans-serif', color: colors.text }}>\n      {/* Navigation */}\n      \u003cdiv style={{ borderBottom: `1px solid ${colors.border}`, display: 'flex', gap: spacing.lg, padding: `${spacing.md}px ${spacing.xl}px` }}>\n        {navTabs.map(tab => (\n          \u003cbutton\n            key={tab}\n            onClick={() => setScreen(tab)}\n            style={{\n              background: 'none',\n              border: 'none',\n              fontSize: 14,\n              fontWeight: screen === tab ? 600 : 400,\n              color: screen === tab ? colors.primary : colors.lightText,\n              cursor: 'pointer',\n              paddingBottom: spacing.xs,\n              borderBottom: screen === tab ? `2px solid ${colors.primary}` : 'none',\n            }}\n          >\n            {navLabels[tab]}\n          \u003c/button>\n        ))}\n      \u003c/div>\n\n      {/* Main Content */}\n      \u003cdiv style={{ maxWidth: 1200, margin: '0 auto', padding: spacing.xl }}>\n
