              \u003coption value=\"normal\">Normal\u003c/option>\n                  \u003coption value=\"high\">High\u003c/option>\n                \u003c/select>\n              \u003c/div>\n            \u003c/div>\n            \u003cbutton onClick={handleGenerate} style={{ ...buttonStyle, width: '100%' }}>\n              Generate Versions\n            \u003c/button>\n          \u003c/div>\n        )}\n\n        {/* Output Screen */}\n        {screen === 'output' && (\n          \u003cdiv>\n            \u003ch1 style={headerStyle}>Review & Refine\u003c/h1>\n            \u003cdiv style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: spacing.lg, marginBottom: spacing.lg }}>\n              \u003cdiv style={{ padding: spacing.md, backgroundColor: colors.bg, borderRadius: 8, border: `1px solid ${colors.border}` }}>\n                \u003ch2 style={{ fontSize: 16, fontWeight: 600, marginBottom: spacing.md }}>Executive Summary\u003c/h2>\n                \u003ctextarea\n                  value={execSummary}\n                  onChange={(e) => setExecSummary(e.target.value)}\n                  style={{ ...inputStyle, minHeight: 200, fontFamily: 'monospace', fontSize: 13, marginBottom: spacing.md }}\n                />\n                \u003cbutton onClick={() => handleExport('exec')} style={{ ...secondaryButtonStyle, width: '100%' }}>\n                  Copy to Clipboard\n                \u003c/button>\n              \u003c/div>\n              \u003cdiv style={{ padding: spacing.md, backgroundColor: colors.bg, borderRadius: 8, border: `1px solid ${colors.border}` }}>\n                \u003ch2 style={{ fontSize: 16, fontWeight: 600, marginBottom: spacing.md }}>Team Update\u003c/h2>\n                \u003ctextarea\n                  value={teamUpdate}\n                  onChange={(e) => setTeamUpdate(e.target.value)}\n                  style={{ ...inputStyle, minHeight: 200, fontFamily: 'monospace', fontSize: 13, marginBottom: spacing.md }}\n                />\n                \u003cbutton onClick={() => handleExport('team')} style={{ ...secondaryButtonStyle, width: '100%' }}>\n                  Copy to Clipboard\n                \u003c/button>\n              \u003c/div>\n            \u003c/div>\n            \u003cdiv style={{ display: 'flex', gap: spacing.md }}>\n              \u003cbutton onClick={handleSaveHistory} style={{ ...buttonStyle, flex: 1 }}>\n                Save to History\n              \u003c/button>\n              \u003cbutton onClick={() => setScreen('input')} style={{ ...secondaryButtonStyle, flex: 1 }}>\n                Back to Compose\n              \u003c/button>\n            \u003c/div>\n          \u003c/div>\n        )}\n\n        {/* History Screen */}\n        {screen === 'history' && (\n          \u003cdiv>\n            \u003ch1 style={headerStyle}>Status Update History\u003c/h1>\n            \u003cdiv style={{ display: 'flex', flexDirection: 'column', gap: spacing.md }}>\n              {history.map((item) => (\n                \u003cdiv\n                  key={item.id}\n                  onClick={() => {\n                    setProjectName(item.project);\n                    setRawBullets(item.preview);\n                    if (item.execSummary) {\n                      setExecSummary(item.execSummary);\n                      setTeamUpdate(item.teamUpdate);\n                      setScreen('output');\n                    }\n                  }}\n                  style={{\n                    padding: spacing.md,\n                    backgroundColor: colors.bg,\n                    borderRadius: 8,\n                    border: `1px solid ${colors.border}`,\n                    cursor: 'pointer',\n                  }}\n                >\n                  \u003cdiv style={{ fontSize: 14, fontWeight: 600 }}>{item.project}\u003c/div>\n                  \u003cdiv style={{ fontSize: 12, color: colors.lightText, marginTop: spacing.xs }}>{item.date}\u003c/div>\n                  \u003cdiv style={{ fontSize: 13, color: colors.lightText, marginTop: spacing.xs }}>{item.preview}\u003c/div>\n                \u003c/div>\n              ))}\n            \u003c/div>\n          \u003c/div>\n        )}\n      \u003c/div>\n    \u003c/div>\n  );\n};\n\nexport default App;\n"},{"label":"F","ideaId":2,"idea":"A tool that turns rough status bullets into a clean update, one version for execs and one for the team.","code":"import React, { useState } from \"react\";\n\nconst colors = {\n  bg: \"#f7f8fa\",\n  panel: \"#ffffff\",\n  border: \"#e0e3e8\",\n  primary: \"#1f4e79\",\n  accent: \"#2f80ed\",\n  text: \"#2b2f36\",\n  muted: \"#6b7280\",\n};\n\nconst font = \"'Segoe UI', Helvetica, Arial, sans-serif\";\n\nconst styles = {\n  app: { fontFamily: font, background: colors.bg, minHeight: \"100vh\", color: colors.text },\n  nav: { display: \"flex\", gap: 4, background: colors.primary, padding: \"0 16px\" },\n  tab: (active) => ({\n    padding: \"14px 18px\",\n    cursor: \"pointer\",\n    color: active ? \"#fff\" : \"#cdd8e6\",\n    borderBottom: active ? \"3px solid #fff\" : \"3px solid transparent\",\n    fontSize: 14,\n    fontWeight: 600,\n  }),\n  main: { padding: 28, maxWidth: 1100, margin: \"0 auto\" },\n  h1: { fontSize: 22, fontWeight: 700, marginBottom: 6, color: colors.primary },\n  sub: { fontSize: 13, color: colors.muted, marginBottom: 20 },\n  panel: { background: colors.panel, border: `1px solid ${colors.border}`, borderRadius: 8, padding: 20 },\n  label: { fontSize: 12, fontWeight: 600, color: colors.muted, marginBottom: 6, display: \"block\", textTransform: \"uppercase\", letterSpacing: 0.4 },\n  input: { width: \"100%\", padding: \"10px 12px\", border: `1px solid ${colors.border}`, borderRadius: 6, fontSize: 14, marginBottom: 16, boxSizing: \"border-box\", fontFamily: font },\n  textarea: { width: \"100%\", minHeight: 160, padding: 12, border: `1px solid ${colors.border}`, borderRadius: 6, fontSize: 14, marginBottom: 16, boxSizing: \"border-box\", fontFamily: font, resize: \"vertical\" },\n  btn: { background: colors.accent, color: \"#fff\", border: \"none\", padding: \"10px 18px\", borderRadius: 6, fontSize: 14, fontWeight: 600, cursor: \"pointer\" },\n  btnGhost: { background: \"transparent\", color: colors.primary, border: `1px solid ${colors.primary}`, padding: \"9px 16px\", borderRadius: 6, fontSize: 13, fontWeight: 600, cursor: \"pointer\" },\n  row: { display: \"flex\", gap: 20 },\n  col: { flex: 1 },\n  cardTitle: { fontSize: 15, fontWeight: 700, marginBottom: 10, color: colors.primary },\n  historyItem: { padding: \"12px 14px\", border: `1px solid ${colors.border}`, borderRadius: 6, marginBottom: 10, background: colors.panel, display: \"flex\", justifyContent: \"space-between\", alignItems: \"center\" },\n};\n\nexport default function App() {\n  const [screen, setScreen] = useState(\"Input\");\n  const [bullets, setBullets] = useState(\n    \"- Migrated billing service to new infra, cut latency 30%\\n- QA found 4 regressions in checkout flow, 2 fixed\\n- Vendor contract renewal delayed, blocks Q3 rollout\\n- Hired 1 new backend engineer, starts Monday\"\n  );\n  const [project, setProject] = useState(\"Atlas Billing Migration\");\n  const [audience, setAudience] = useState(\"Leadership\");\n  const [urgency, setUrgency] = useState(\"Normal\");\n  const [execText, setExecText] = useState(\n    \"Atlas Billing Migration is on track: infra move cut latency 30%. Checkout QA found minor issues, half resolved. Vendor delay is the key risk to Q3 timeline.\"\n  );\n  const [teamText, setTeamText] = useState(\n    \"Team update — Atlas Billing:\\n1. Infra migration complete, latency down 30%.\\n2. QA flagged 4 checkout regressions; 2 fixed, 2 in progress.\\n3. Vendor contract renewal delayed — escalating this week.\\n4. New backend engineer (Priya) starts Monday, onboarding plan ready.\"\n  );\n  const [history, setHistory] = useState([\n    { id: 1, name: \"Atlas Billing Migration - Week 24\", date: \"Jun 10\" },\n    { id: 2, name: \"Mobile Redesign Sprint Recap\", date: \"Jun 3\" },\n    { id: 3, name: \"Vendor Renewal Status\", date: \"May 27\" },\n  ]);\n\n  const tabs = [\"Input\", \"Dual Output\", \"Edit & Refine\", \"Export/Share\", \"History\"];\n\n  const generate = () => {\n    setExecText(\n      `${project}: Key progress this period includes infra gains and hiring. Main risk is vendor delay affecting Q3. Audience: ${audience}, Urgency: ${urgency}.`\n    );\n    setTeamText(\n      `Team update — ${project}:\\n1. ${bullets.split(\"\\n\")[0]?.replace(\"- \", \"\") || \"Progress item\"}\\n2. QA and delivery items tracked in board.\\n3. Escalation needed on vendor timeline.\\n4. Staffing update included.`\n    );\n    setScreen(\"Dual Output\");\n  };\n\n  return (\n    \u003cdiv style={styles.app}>\n      \u003cdiv style={styles.nav}>\n        {tabs.map((t) => (\n          \u003cdiv key={t} style={styles.tab(screen === t)} onClick={() => setScreen(t)}>\n            {t}\n          \u003c/div>\n        ))}\n      \u003c/div>\n      \u003cdiv style={styles.main}>\n        {screen === \"Input\" && (\n          \u003cdiv>\n            \u003cdiv style={styles.h1}>New Status Update\u003c/div>\n            \u003cdiv style={styles.sub}>Paste rough bullets, add context, then generate exec + team versions.\u003c/div>\n            \u003cdiv style={styles.panel}>\n              \u003clabel style={styles.label}>Raw Bullets\u003c/label>\n              \u003ctextarea style={styles.textarea} value={bullets} onChange={(e) => setBullets(e.target.value)} />\n              \u003cdiv style={styles.row}>\n                \u003cdiv style={styles.col}>\n                  \u003clabel style={styles.label}>Project Name\u003c/label>\n                  \u003cinput style={styles.input} value={project} onChange={(e) => setProject(e.target.value)} />\n                \u003c/div>\n                \u003cdiv style={styles.col}>\n                  \u003clabel style={styles.label}>Audience\u003c/label>\n                  \u003cselect style={styles.input} value={audience} onChange={(e) => setAudience(e.target.value)}>\n                    \u003coption>Leadership\u003c/option>\n                    \u003coption>Peers\u003c/option>\n                    \u003coption>Client\u003c/option>\n                  \u003c/select>\n                \u003c/div>\n                \u003cdiv style={styles.col}>\n                  \u003clabel style={styles.label}>Urgency\u003c/label>\n                  \u003cselect style={styles.input} value={urgency} onChange={(e) => setUrgency(e.target.value)}>\n                    \u003coption>Normal\u003c/option>\n                    \u003coption>High\u003c/option>\n                    \u003coption>FYI Only\u003c/option>\n                  \u003c/select>\n                \u003c/div>\n              \u003c/div>\n              \u003cbutton style={styles.btn} onClick={generate}>Generate Updates\u003c/button>\n            \u003c/div>\n          \u003c/div>\n        )}\n\n        {screen === \"Dual Output\" && (\n          \u003cdiv>\n            \u003cdiv style={styles.h1}>{project}\u003c/div>\n            \u003cdiv style={styles.sub}>Exec summary vs. team update — compare and refine.\u003c/div>\n            \u003cdiv style={styles.row}>\n              \u003cdiv style={styles.col}>\n                \u003cdiv style={styles.panel}>\n                  \u003cdiv style={styles.cardTitle}>Exec Summary\u003c/div>\n                  \u003cdiv style={{ fontSize: 14, lineHeight: 1.6 }}>{execText}\u003c/div>\n                \u003c/div>\n              \u003c/div>\n              \u003cdiv style={styles.col}>\n                \u003cdiv style={styles.panel}>\n                  \u003cdiv style={styles.cardTitle}>Team Update\u003c/div>\n                  \u003cdiv style={{ fontSize: 14, lineHeight: 1.6, whiteSpace: \"pre-line\" }}>{teamText}\u003c/div>\n                \u003c/div>\n              \u003c/div>\n            \u003c/div>\n            \u003cdiv style={{ marginTop: 16 }}>\n              \u003cbutton style={styles.btn} onClick={() => setScreen(\"Edit & Refine\")}>Edit & Refine\u003c/button>\n              \u003cspan style={{ display: \"inline-block\", width: 10 }} />\n              \u003cbutton style={styles.btnGhost} onClick={() => setScreen(\"Export/Share\")}>Export / Share\u003c/button>\n            \u003c/div>\n          \u003c/div>\n        )}\n\n        {screen === \"Edit & Refine\" && (\n          \u003cdiv>\n            \u003cdiv style={styles.h1}>Edit & Refine\u003c/div>\n            \u003cdiv style={styles.sub}>Tweak either version inline or regenerate just one.\u003c/div>\n            \u003cdiv style={styles.row}>\n              \u003cdiv style={styles.col}>\n                \u003cdiv style={styles.panel}>\n                  \u003cdiv style={styles.cardTitle}>Exec Summary\u003c/div>\n                  \u003ctextarea style={styles.textarea} value={execText} onChange={(e) => setExecText(e.target.value)} />\n                  \u003cbutton style={styles.btnGhost} onClick={() => setExecText(execText + \" (tightened for brevity)\")}>Regenerate Exec\u003c/button>\n                \u003c/div>\n              \u003c/div>\n              \u003cdiv style={styles.col}>\n                \u003cdiv style={styles.panel}>\n                  \u003cdiv style={styles.cardTitle}>Team Update\u003c/div>\n                  \u003ctextarea style={styles.textarea} value={teamText} onChange={(e) => setTeamText(e.target.value)} />\n                  \u003cbutton style={styles.btnGhost} onClick={() => setTeamText(teamText + \"\\n5. Added more detail per regeneration.\")}>Regenerate Team\u003c/button>\n                \u003c/div>\n              \u003c/div>\n            \u003c/div>\n            \u003cdiv style={{ marginTop: 16 }}>\n              \u003cbutton style={styles.btn} onClick={() => setScreen(\"Export/Share\")}>Continue to Export\u003c/button>\n            \u003c/div>\n          \u003c/div>\n        )}\n\n        {screen === \"Export/Share\" && (\n          \u003cdiv>\n            \u003cdiv style={styles.h1}>Export / Share\u003c/div>\n            \u003cdiv style={styles.sub}>Send the final versions wherever your team needs them.\u003c/div>\n            \u003cdiv style={styles.panel}>\n              \u003cdiv style={styles.cardTitle}>Choose Destination\u003c/div>\n              \u003cbutton style={styles.btnGhost}>Copy Exec to Clipboard\u003c/button>\n              \u003cspan style={{ display: \"inline-block\", width: 10 }} />\n              \u003cbutton style={styles.btnGhost}>Copy Team to Clipboard\u003c/button>\n              \u003cspan style={{ display: \"inline-block\", width: 10 }} />\n              \u003cbutton style={styles.btnGhost}>Download as .txt\u003c/button>\n              \u003cdiv style={{ marginTop: 16 }}>\n                \u003cbutton style={styles.btn}>Send to Slack (#atlas-updates)\u003c/button>\n                \u003cspan style={{ display: \"inline-block\", width: 10 }} />\n                \u003cbutton style={styles.btn}>Send via Email\u003c/button>\n              \u003c/div>\n              \u003cdiv\n                style={{\n                  marginTop: 20,\n                  paddingTop: 16,\n                  borderTop: `1px solid ${colors.border}`,\n                }}\n                onClick={() =>\n                  setHistory([{ id: Date.now(), name: `${project} - Update`, date: \"Just now\" }, ...history])\n                }\n              >\n                \u003cbutton style={styles.btnGhost}>Save to History\u003c/button>\n              \u003c/div>\n            \u003c/div>\n          \u003c/div>\n        )}\n\n        {screen === \"History\" && (\n          \u003cdiv>\n            \u003cdiv style={styles.h1}>Past Updates\u003c/div>\n            \u003cdiv style={styles.sub}>Reuse a previous report as a starting point.\u003c/div>\n            {history.map((h) => (\n              \u003cdiv key={h.id} style={styles.historyItem}>\n                \u003cdiv>\n                  \u003cdiv style={{ fontWeight: 600, fontSize: 14 }}>{h.name}\u003c/div>\n                  \u003cdiv style={{ fontSize: 12, color: colors.muted }}>{h.date}\u003c/div>\n                \u003c/div>\n                \u003cbutton style={styles.btnGhost} onClick={() => setScreen(\"Dual Output\")}>Reuse\u003c/button>\n              \u003c/div>\n            ))}\n          \u003c/div>\n        )}\n      \u003c/div>\n    \u003c/div>\n  );\n}\n"},{"label":"G","ideaId":2,"idea":"A tool that turns rough status bullets into a clean update, one version for execs and one for the team.","code":"import React, { useState } from \"react\";\n\nconst colors = {\n  bg: \"#F5F7FA\",\n  card: \"#FFFFFF\",\n  navy: \"#1F2A44\",\n  accent: \"#2D6CDF\",\n  muted: \"#6B7280\",\n  border: \"#E2E8F0\",\n  green: \"#1B8A5A\",\n};\nconst font = \"'Segoe UI', system-ui, -apple-system, sans-serif\";\n\nexport default function App() {\n  const [screen, setScreen] = useState(\"input\");\n  const [bullets, setBullets] = useState(\n    \"- Migrated billing DB to new cluster, 0 downtime\\n- Checkout latency down 18% after caching fix\\n- Vendor contract for SSO delayed to next sprint\\n- Hired 1 backend engineer, starts Nov 3\\n- Q3 budget tracking 4% under forecast\"\n  );\n  const [project, setProject] = useState(\"Atlas Platform Migration\");\n  const [audience, setAudience] = useState(\"Leadership\");\n  const [urgency, setUrgency] = useState(\"Normal\");\n  const [exec, setExec] = useState(\"\");\n  const [team, setTeam] = useState(\"\");\n  const [history, setHistory] = useState([\n    { id: 1, project: \"Atlas Platform Migration\", date: \"Oct 21\", exec: \"Migration on track; checkout latency improved 18%; SSO vendor slip noted.\" },\n    { id: 2, project: \"Q3 Growth Sprint\", date: \"Oct 14\", exec: \"Signups up 12% WoW; onboarding email A/B test launched Friday.\" },\n  ]);\n\n  const generate = () => {\n    const lines = bullets.split(\"\\n\").filter((l) => l.trim());\n    const execText = `${project} — ${urgency} update for ${audience}.\\n\\n` +\n      lines.slice(0, 3).map((l) => l.replace(/^-\\s*/, \"\")).join(\"; \") + \".\";\n    const teamText = `${project} — Detailed Team Update\\n\\n` +\n      lines.map((l) => \"• \" + l.replace(/^-\\s*/, \"\")).join(\"\\n\") +\n      \"\\n\\nNext steps: follow up on open items and confirm owners by Friday.\";\n    setExec(execText);\n    setTeam(teamText);\n    setHistory([{ id: Date.now(), project, date: \"Just now\", exec: execText.slice(0, 80) + \"…\" }, ...history]);\n    setScreen(\"output\");\n  };\n\n  const tabs = [\"input\", \"output\", \"edit\", \"export\", \"history\"];\n  const labels = { input: \"1. Input\", output: \"2. Dual Output\", edit: \"3. Edit & Refine\", export: \"4. Export\", history: \"History\" };\n\n  const s = {\n    page: { fontFamily: font, background: colors.bg, minHeight: \"100vh\", color: colors.navy },\n    nav: { display: \"flex\", gap: 8, padding: \"16px 24px\", background: colors.navy, alignItems: \"center\" },\n    navBtn: (active) => ({\n      padding: \"8px 14px\", borderRadius: 6, cursor: \"pointer\", border: \"none\",\n      background: active ? colors.accent : \"transparent\", color: active ? \"#fff\" : \"#CBD5E1\",\n      fontWeight: 600, fontSize: 13,\n    }),\n    body: { padding: 28, maxWidth: 1100, margin: \"0 auto\" },\n    card: { background: colors.card, border: `1px solid ${colors.border}`, borderRadius: 10, padding: 20, marginBottom: 16 },\n    label: { fontSize: 12, fontWeight: 700, color: colors.muted, marginBottom: 6, display: \"block\", textTransform: \"uppercase\", letterSpacing: 0.5 },\n    input: { width: \"100%\", padding: \"9px 10px\", borderRadius: 6, border: `1px solid ${colors.border}`, fontSize: 14, marginBottom: 14, boxSizing: \"border-box\", fontFamily: font },\n    textarea: { width: \"100%\", minHeight: 160, padding: 10, borderRadius: 6, border: `1px solid ${colors.border}`, fontSize: 14, fontFamily: font, boxSizing: \"border-box\" },\n    h1: { fontSize: 22, fontWeight: 700, marginBottom: 4 },\n    sub: { fontSize: 13, color: colors.muted, marginBottom: 18 },\n    btn: { background: colors.accent, color: \"#fff\", border: \"none\", padding: \"10px 18px\", borderRadius: 6, fontWeight: 600, cursor: \"pointer\", fontSize: 14 },\n    btnGhost: { background: \"#fff\", color: colors.navy, border: `1px solid ${colors.border}`, padding: \"9px 16px\", borderRadius: 6, fontWeight: 600, cursor: \"pointer\", fontSize: 13, marginRight: 8 },\n    col: { flex: 1, minWidth: 320 },\n  };\n\n  return (\n    \u003cdiv style={s.page}>\n      \u003cdiv style={s.nav}>\n        \u003cdiv style={{ color: \"#fff\", fontWeight: 800, fontSize: 18, marginRight: 20 }}>Brieflio\u003c/div>\n        {tabs.map((t) => (\n          \u003cbutton key={t} style={s.navBtn(screen === t)} onClick={() => setScreen(t)}>{labels[t]}\u003c/button>\n        ))}\n      \u003c/div>\n      \u003cdiv style={s.body}>\n        {screen === \"input\" && (\n          \u003cdiv style={s.card}>\n            \u003cdiv style={s.h1}>New Status Update\u003c/div>\n            \u003cdiv style={s.sub}>Paste rough bullets and set context. Brieflio will draft exec + team versions.\u003c/div>\n            \u003clabel style={s.label}>Raw Bullets\u003c/label>\n            \u003ctextarea style={s.textarea} value={bullets} onChange={(e) => setBullets(e.target.value)} />\n            \u003cdiv style={{ display: \"flex\", gap: 14, marginTop: 14 }}>\n              \u003cdiv style={{ flex: 1 }}>\n                \u003clabel style={s.label}>Project\u003c/label>\n                \u003cinput style={s.input} value={project} onChange={(e) => setProject(e.target.value)} />\n              \u003c/div>\n              \u003cdiv style={{ flex: 1 }}>\n                \u003clabel style={s.label}>Audience\u003c/label>\n                \u003cselect style={s.input} value={audience} onChange={(e) => setAudience(e.target.value)}>\n                  \u003coption>Leadership\u003c/option>\u003coption>Engineering Team\u003c/option>\u003coption>Cross-functional Stakeholders\u003c/option>\n                \u003c/select>\n              \u003c/div>\n              \u003cdiv style={{ flex: 1 }}>\n                \u003clabel style={s.label}>Urgency\u003c/label>\n                \u003cselect style={s.input} value={urgency} onChange={(e) => setUrgency(e.target.value)}>\n                  \u003coption>Normal\u003c/option>\u003coption>Time-sensitive\u003c/option>\u003coption>FYI Only\u003c/option>\n                \u003c/select>\n              \u003c/div>\n            \u003c/div>\n            \u003cbutton style={s.btn} onClick={generate}>Generate Updates →\u003c/button>\n          \u003c/div>\n        )}\n\n        {(screen === \"output\" || screen === \"edit\") && (\n          \u003cdiv>\n            \u003cdiv style={s.h1}>{project}\u003c/div>\n            \u003cdiv style={s.sub}>{screen === \"edit\" ? \"Edit & Refine — tweak wording or regenerate a single version.\" : \"Compare exec summary and team detail side by side.\"}\u003c/div>\n            \u003cdiv style={{ display: \"flex\", gap: 16, flexWrap: \"wrap\" }}>\n              \u003cdiv style={s.col}>\n                \u003cdiv style={s.card}>\n                  \u003cdiv style={{ fontWeight: 700, color: colors.accent, marginBottom: 8 }}>Exec Summary\u003c/div>\n                  \u003ctextarea style={{ ...s.textarea, minHeight: 200 }} value={exec} onChange={(e) => setExec(e.target.value)} />\n                  {screen === \"edit\" && (\n                    \u003cdiv style={{ marginTop: 10 }}>\n                      \u003cbutton style={s.btnGhost} onClick={() => setExec(exec + \"\\n(Regenerated tone: more concise.)\")}>Regenerate\u003c/button>\n                      \u003cbutton style={s.btnGhost} onClick={() => setExec(exec.toUpperCase())}>Punch up tone\u003c/button>\n                    \u003c/div>\n                  )}\n                \u003c/div>\n              \u003c/div>\n              \u003cdiv style={s.col}>\n                \u003cdiv style={s.card}>\n                  \u003cdiv style={{ fontWeight: 700, color: colors.green, marginBottom: 8 }}>Team Update\u003c/div>\n                  \u003ctextarea style={{ ...s.textarea, minHeight: 200 }} value={team} onChange={(e) => setTeam(e.target.value)} />\n                  {screen === \"edit\" && (\n                    \u003cdiv style={{ marginTop: 10 }}>\n                      \u003cbutton style={s.btnGhost} onClick={() => setTeam(team + \"\\n• Added detail on blockers.\")}>Regenerate\u003c/button>\n                      \u003cbutton style={s.btnGhost} onClick={() => setTeam(team + \"\\n• Softer tone applied.\")}>Soften tone\u003c/button>\n                    \u003c/div>\n                  )}\n                \u003c/div>\n              \u003c/div>\n            \u003c/div>\n            \u003cbutton style={s.btn} onClick={() => setScreen(screen === \"output\" ? \"edit\" : \"export\")}>\n              {screen === \"output\" ? \"Edit & Refine →\" : \"Continue to Export →\"}\n            \u003c/button>\n          \u003c/div>\n        )}\n\n        {screen === \"export\" && (\n          \u003cdiv style={s.card}>\n            \u003cdiv style={s.h1}>Export \"{project}\"\u003c/div>\n            \u003cdiv style={s.sub}>Copy, download, or send the final versions.\u003c/div>\n            \u003cdiv style={{ display: \"flex\", gap: 10, marginBottom: 18 }}>\n              \u003cbutton style={s.btn}>Copy Exec Summary\u003c/button>\n              \u003cbutton style={s.btn}>Copy Team Update\u003c/button>\n              \u003cbutton style={s.btnGhost}>Download .docx\u003c/button>\n            \u003c/div>\n            \u003cdiv style={{ display: \"flex\", gap: 10 }}>\n              \u003cbutton style={s.btnGhost}>Send to Slack #status-updates\u003c/button>\n              \u003cbutton style={s.btnGhost}>Email to leadership@company.com\u003c/button>\n            \u003c/div>\n          \u003c/div>\n        )}\n\n        {screen === \"history\" && (\n          \u003cdiv>\n            \u003cdiv style={s.h1}>Past Updates\u003c/div>\n            \u003cdiv style={s.sub}>Reuse a previous report as a starting point.\u003c/div>\n            {history.map((h) => (\n              \u003cdiv key={h.id} style={s.card}>\n                \u003cdiv style={{ display: \"flex\", justifyContent: \"space-between\" }}>\n                  \u003cdiv style={{ fontWeight: 700 }}>{h.project}\u003c/div>\n                  \u003cdiv style={{ color: colors.muted, fontSize: 12 }}>{h.date}\u003c/div>\n                \u003c/div>\n                \u003cdiv style={{ color: colors.muted, fontSize: 13, marginTop: 6 }}>{h.exec}\u003c/div>\n                \u003cbutton style={{ ...s.btnGhost, marginTop: 10 }} onClick={() => setScreen(\"output\")}>Reuse\u003c/button>\n              \u003c/div>\n            ))}\n          \u003c/div>\n        )}\n      \u003c/div>\n    \u003c/div>\n  );\n}\n"},{"label":"H","ideaId":2,"idea":"A tool that turns rough status bullets into a clean update, one version for execs and one for the team.","code":"import React, { useState } from 'react';\n\nconst App = () => {\n  // Shared styles\n  const colors = {\n    primary: '#0066cc',\n    secondary: '#f5f5f5',\n    text: '#1a1a1a',\n    border: '#e0e0e0',\n    success: '#28a745',\n  };\n\n  const spacing = {\n    xs: '8px',\n    sm: '12px',\n    md: '16px',\n    lg: '24px',\n    xl: '32px',\n  };\n\n  const baseButtonStyle = {\n    padding: `${spacing.sm} ${spacing.md}`,\n    border: 'none',\n    borderRadius: '6px',\n    cursor: 'pointer',\n    fontSize: '14px',\n    fontWeight: '500',\n  };\n\n  // State management\n  const [screen, setScreen] = useState('input');\n  const [rawBullets, setRawBullets] = useState('');\n  const [projectName, setProjectName] = useState('Q4 Platform Roadmap');\n  const [audience, setAudience] = useState('executive');\n  const [urgency, setUrgency] = useState('normal');\n\n  const [execSummary, setExecSummary] = useState(\n    'Successfully launched analytics dashboard v2.1 with improved query performance (40% faster). Completed API documentation overhaul and onboarded 3 new enterprise clients. Q4 roadmap on track; security audit scheduled for Dec 15.'\n  );\n\n  const [teamUpdate, setTeamUpdate] = useState(\n    '• Analytics Dashboard: Shipped v2.1 with PostgreSQL query optimization, reducing avg load time from 2.3s to 1.4s. Testing complete across staging.\\n• Documentation: API docs fully rewritten using OpenAPI 3.1; 12 missing endpoints documented.\\n• Client Onboarding: Acme Corp, TechStart Inc, and Global Logistics signed contracts. Implementation kickoffs scheduled.\\n• Q4 Milestones: On schedule. Security audit with external firm booked for Dec 15-17. Mobile app beta expected Dec 8.\\n• Blockers: Awaiting approval on data retention policy from legal (needed by Dec 1).'\n  );\n\n  const [history] = useState([\n    { date: 'Dec 1', project: 'Backend Refactor', summary: 'Database migration 85% complete...' },\n    { date: 'Nov 28', project: 'Mobile v1.2', summary: 'iOS build passed App Store review...' },\n    { date: 'Nov 25', project: 'Q4 Platform Roadmap', summary: 'Successfully launched analytics dashboard...' },\n  ]);\n\n  // Helper to generate placeholder output\n  const generateOutput = () => {\n    if (!rawBullets.trim()) {\n      setExecSummary('Please enter bullet points to generate output.');\n      setTeamUpdate('Please enter bullet points to generate output.');\n      return;\n    }\n    const lines = rawBullets.split('\\n').filter(l => l.trim()).slice(0, 3);\n    const bulletList = lines.map(l => `• ${l.replace(/^[-•]\\s*/, '')}`).join('\\n');\n    setExecSummary(`${projectName} update: ${lines[0]?.replace(/^[-•]\\s*/, '') || 'Progress update'}. Milestones tracking on schedule.`);\n    setTeamUpdate(bulletList + '\\n\\n• Next steps: Continue development and monitor for blockers.');\n    setScreen('output');\n  };\n\n  return (\n    \u003cdiv style={{ fontFamily: '-apple-system, BlinkMacSystemFont, \"Segoe UI\", sans-serif', color: colors.text }}>\n      {/* Header */}\n      \u003cdiv style={{ backgroundColor: '#fff', borderBottom: `1px solid ${colors.border}`, padding: spacing.md }}>\n        \u003cdiv style={{ maxWidth: '1200px', margin: '0 auto', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>\n          \u003ch1 style={{ margin: 0, fontSize: '24px', fontWeight: '700' }}>Brieflio\u003c/h1>\n          \u003cdiv style={{ display: 'flex', gap: spacing.md, fontSize: '13px' }}>\n            {['input', 'output', 'edit', 'export', 'history'].map(s => (\n              \u003cbutton\n                key={s}\n                onClick={() => setScreen(s)}\n                style={{\n                  background: screen === s ? colors.primary : 'transparent',\n                  color: screen === s ? '#fff' : colors.text,\n                  padding: `${spacing.xs} ${spacing.sm}`,\n                  border: 'none',\n                  borderRadius: '4px',\n                  cursor: 'pointer',\n                  fontWeight: screen === s ? '600' : '400',\n                }}\n              >\n                {s.charAt(0).toUpperCase() + s.slice(1)}\n              \u003c/button>\n            ))}\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      {/* Content */}\n      \u003cdiv style={{ maxWidth: '1200px', margin: '0 auto', padding: spacing.lg }}>\n        {screen === 'input' && (\n          \u003cdiv>\n            \u003ch2 style={{ marginTop: 0 }}>New Status Update\u003c/h2>\n            \u003cdiv style={{ marginBottom: spacing.lg }}>\n              \u003clabel style={{ display: 'block', marginBottom: spacing.sm, fontWeight: '500', fontSize: '14px' }}>\n                Project Name\n              \u003c/label>\n              \u003cinput\n                type=\"text\"\n                value={projectName}\n                onChange={e => setProjectName(e.target.value)}\n                style={{\n                  width: '100%',\n                  padding: spacing.sm,\n                  border: `1px solid ${colors.border}`,\n                  borderRadius: '6px',\n                  fontSize: '14px',\n                  boxSizing: 'border-box',\n                }}\n              />\n            \u003c/div>\n\n            \u003cdiv style={{ marginBottom: spacing.lg }}>\n              \u003clabel style={{ display: 'block', marginBottom: spacing.sm, fontWeight: '500', fontSize: '14px' }}>\n                Paste or type your status bullets\n              \u003c/label>\n              \u003ctextarea\n                value={rawBullets}\n                onChange={e => setRawBullets(e.target.value)}\n                placeholder=\"- Completed Q4 analytics dashboard launch&#10;- Security audit approved&#10;- 3 new enterprise clients onboarded\"\n                style={{\n                  width: '100%',\n                  minHeight: '200px',\n                  padding: spacing.md,\n                  border: `1px solid ${colors.border}`,\n                  borderRadius: '6px',\n                  fontSize: '14px',\n                  fontFamily: 'inherit',\n                  boxSizing: 'border-box',\n                }}\n              />\n            \u003c/div>\n\n            \u003cdiv style={{ display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: spacing.md, marginBottom: spacing.lg }}>\n              \u003cdiv>\n                \u003clabel style={{ display: 'block', marginBottom: spacing.sm, fontWeight: '500', fontSize: '14px' }}>\n                  Audience\n                \u003c/label>\n                \u003cselect\n                  value={audience}\n                  onChange={e => setAudience(e.target.value)}\n                  style={{\n                    width: '100%',\n                    padding: spacing.sm,\n                    border: `1px solid ${colors.border}`,\n                    borderRadius: '6px',\n                    fontSize: '14px',\n                  }}\n                >\n                  \u003coption>executive\u003c/option>\n                  \u003coption>team\u003c/option>\n                  \u003coption>stakeholder\u003c/option>\n                \u003c/select>\n              \u003c/div>\n              \u003cdiv>\n                \u003clabel style={{ display: 'block', marginBottom: spacing.sm, fontWeight: '500', fontSize: '14px' }}>\n                  Urgency\n                \u003c/label>\n                \u003cselect\n                  value={urgency}\n                  onChange={e => setUrgency(e.target.value)}\n                  style={{\n                    width: '100%',\n                    padding: spacing.sm,\n                    border: `1px solid ${colors.border}`,\n                    borderRadius: '6px',\n                    fontSize: '14px',\n                  }}\n                >\n                  \u003coption>normal\u003c/option>\n                  \u003coption>high\u003c/option>\n                  \u003coption>critical\u003c/option>\n                \u003c/select>\n              \u003c/div>\n            \u003c/div>\n\n            \u003cbutton\n              onClick={generateOutput}\n              style={{\n                ...baseButtonStyle,\n                backgroundColor: colors.primary,\n                color: '#fff',\n                width: '100%',\n                padding: spacing.md,\n              }}\n            >\n              Generate Versions\n            \u003c/button>\n          \u003c/div>\n        )}\n\n        {screen === 'output' && (\n          \u003cdiv>\n            \u003ch2 style={{ marginTop: 0 }}>Dual Output\u003c/h2>\n            \u003cdiv style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: spacing.lg }}>\n              \u003cdiv style={{ border: `1px solid ${colors.border}`, borderRadius: '8px', padding: spacing.md, backgroundColor: colors.secondary }}>\n                \u003ch3 style={{ marginTop: 0, fontSize: '16px', fontWeight: '600' }}>Executive Summary\u003c/h3>\n                \u003cp style={{ margin: 0, fontSize: '14px', lineHeight: '1.6' }}>{execSummary}\u003c/p>\n                \u003cbutton\n                  onClick={() => setScreen('edit')}\n                  style={{\n                    ...baseButtonStyle,\n                    backgroundColor: colors.primary,\n                    color: '#fff',\n                    marginTop: spacing.md,\n                    width: '100%',\n                  }}\n                >\n                  Edit\n                \u003c/button>\n              \u003c/div>\n              \u003cdiv style={{ border: `1px solid ${colors.border}`, borderRadius: '8px', padding: spacing.md, backgroundColor: colors.secondary }}>\n                \u003ch3 style={{ marginTop: 0, fontSize: '16px', fontWeight: '600' }}>Team Update\u003c/h3>\n                \u003cp style={{ margin: 0, fontSize: '14px', lineHeight: '1.6', whiteSpace: 'pre-wrap' }}>{teamUpdate}\u003c/p>\n                \u003cbutton\n                  onClick={() => setScreen('edit')}\n                  style={{\n                    ...baseButtonStyle,\n                    backgroundColor: colors.primary,\n                    color: '#fff',\n                    marginTop: spacing.md,\n                    width: '100%',\n                  }}\n                >\n                  Edit\n                \u003c/button>\n              \u003c/div>\n            \u003c/div>\n            \u003cbutton\n              onClick={() => setScreen('export')}\n              style={{\n                ...baseButtonStyle,\n                backgroundColor: colors.success,\n                color: '#fff',\n                width: '100%',\n                marginTop: spacing.lg,\n                padding: spacing.md,\n              }}\n            >\n              Continue to Export\n            \u003c/button>\n          \u003c/div>\n        )}\n\n        {screen === 'edit' && (\n          \u003cdiv>\n            \u003ch2 style={{ marginTop: 0 }}>Edit & Refine\u003c/h2>\n            \u003cdiv style={{ marginBottom: spacing.lg }}>\n              \u003clabel style={{ display: 'block', marginBottom: spacing.sm, fontWeight: '500', fontSize: '14px' }}>\n                Executive Summary\n              \u003c/label>\n              \u003ctextarea\n                value={execSummary}\n                onChange={e => setExecSummary(e.target.value)}\n                style={{\n                  width: '100%',\n                  minHeight: '120px',\n                  padding: spacing.md,\n                  border: `1px solid ${colors.border}`,\n                  borderRadius: '6px',\n                  fontSize: '14px',\n                  fontFamily: 'inherit',\n                  boxSizing: 'border-box',\n                }}\n              />\n            \u003c/div>\n\n            \u003cdiv style={{ marginBottom: spacing.lg }}>\n              \u003clabel style={{ display: 'block', marginBottom: spacing.sm, fontWeight: '500', fontSize: '14px' }}>\n                Team Update\n              \u003c/label>\n              \u003ctextarea\n                value={teamUpdate}\n                onChange={e => setTeamUpdate(e.target.value)}\n                style={{\n                  width: '100%',\n                  minHeight: '180px',\n                  padding: spacing.md,\n                  border: `1px solid ${colors.border}`,\n                  borderRadius: '6px',\n                  fontSize: '14px',\n                  fontFamily: 'inherit',\n                  boxSizing: 'border-box',\n                }}\n              />\n            \u003c/div>\n\n            \u003cbutton\n              onClick={() => setScreen('export')}\n              style={{\n                ...baseButtonStyle,\n                backgroundColor: colors.success,\n                color: '#fff',\n                width: '100%',\n                padding: spacing.md,\n              }}\n            >\n              Ready to Export\n            \u003c/button>\n          \u003c/div>\n        )}\n\n        {screen === 'export' && (\n          \u003cdiv>\n            \u003ch2 style={{ marginTop: 0 }}>Export & Share\u003c/h2>\n            \u003cdiv style={{ display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: spacing.md, marginBottom: spacing.lg }}>\n              {[\n                { label: 'Copy to Clipboard', action: () => navigator.clipboard.writeText(execSummary + '\\n\\n' + teamUpdate) },\n                { label: 'Download as Text', action: () => {} },\n                { label: 'Email', action: () => {} },\n                { label: 'Slack', action: () => {} },\n              ].map((item, i) => (\n                \u003cbutton\n                  key={i}\n                  onClick={item.action}\n                  style={{\n                    ...baseButtonStyle,\n                    backgroundColor: colors.primary,\n                    color: '#fff',\n                    padding: spacing.md,\n                  }}\n                >\n                  {item.label}\n                \u003c/button>\n              ))}\n            \u003c/div>\n\n            \u003cdiv style={{ backgroundColor: colors.secondary, padding: spacing.md, borderRadius: '6px', marginBottom: spacing.lg }}>\n              \u003ch3 style={{ marginTop: 0, fontSize: '14px', fontWeight: '600' }}>Preview\u003c/h3>\n              \u003cp style={{ fontSize: '13px', margin: 0, whiteSpace: 'pre-wrap', lineHeight: '1.5' }}>\n                \u003cstrong>Executive Summary:\u003c/strong> {execSummary}\n                {'\\n\\n'}\n                \u003cstrong>Team Update:\u003c/strong> {teamUpdate}\n              \u003c/p>\n            \u003c/div>\n\n            \u003cbutton\n              onClick={() => setScreen('input')}\n              style={{\n                ...baseButtonStyle,\n                backgroundColor: '#666',\n                color: '#fff',\n                width: '100%',\n                padding: spacing.md,\n              }}\n            >\n              Create New Update\n            \u003c/button>\n          \u003c/div>\n        )}\n\n        {screen === 'history' && (\n          \u003cdiv>\n            \u003ch2 style={{ marginTop: 0 }}>History\u003c/h2>\n            \u003cdiv style={{ backgroundColor: colors.secondary, borderRadius: '8px', overflow: 'hidden' }}>\n              {history.map((item, i) => (\n                \u003cdiv\n                  key={i}\n                  style={{\n                    padding: spacing.md,\n                    borderBottom: i \u003c history.length - 1 ? `1px solid ${colors.border}` : 'none',\n                    display: 'flex',\n                    justifyContent: 'space-between',\n                    alignItems: 'center',\n                  }}\n                >\n                  \u003cdiv>\n                    \u003cdiv style={{ fontWeight: '600', fontSize: '14px' }}>{item.project}\u003c/div>\n                    \u003cdiv style={{ fontSize: '13px', color: '#666', marginTop: '4px' }}>{item.summary}\u003c/div>\n                  \u003c/div>\n                  \u003cdiv style={{ fontSize: '12px', color: '#999' }}>{item.date}\u003c/div>\n                \u003c/div>\n              ))}\n            \u003c/div>\n          \u003c/div>\n        )}\n      \u003c/div>\n    \u003c/div>\n  );\n};\n\nexport default App;\n"},{"label":"I","ideaId":3,"idea":"A decision log that tracks what was decided, why, and when.","code":"import React, { useState } from \"react\";\n\nexport default function App() {\n  const colors = {\n    bg: \"#f4f6f8\",\n    card: \"#ffffff\",\n    primary: \"#2c5f7c\",\n    primaryDark: \"#1e4459\",\n    text: \"#1f2937\",\n    subtext: \"#6b7280\",\n    border: \"#e2e5e9\",\n    tag: \"#eaf1f4\",\n  };\n  const font = \"'Segoe UI', Helvetica, Arial, sans-serif\";\n  const page = { padding: 24, fontFamily: font, color: colors.text, maxWidth: 780, margin: \"0 auto\" };\n  const card = { background: colors.card, border: `1px solid ${colors.border}`, borderRadius: 10, padding: 18, marginBottom: 14 };\n  const label = { display: \"block\", fontSize: 13, color: colors.subtext, marginBottom: 4, marginTop: 12 };\n  const input = { width: \"100%\", padding: \"8px 10px\", border: `1px solid ${colors.border}`, borderRadius: 6, fontSize: 14, fontFamily: font, boxSizing: \"border-box\" };\n  const button = { background: colors.primary, color: \"#fff\", border: \"none\", padding: \"9px 16px\", borderRadius: 6, cursor: \"pointer\", fontSize: 14 };\n  const pill = { display: \"inline-block\", background: colors.tag, color: colors.primaryDark, padding: \"3px 10px\", borderRadius: 12, fontSize: 12, marginRight: 6 };\n\n  const [screen, setScreen] = useState(\"feed\");\n  const [decisions, setDecisions] = useState([\n    { id: 1, title: \"Adopt Postgres over MongoDB for core data store\", desc: \"Migrate primary datastore to Postgres for relational integrity.\", rationale: \"Need strong transactional guarantees for billing data.\", alternatives: \"MongoDB, DynamoDB\", stakeholders: \"Priya Anand, Tom Reyes\", tags: [\"Engineering\", \"Infra\"], date: \"2024-02-14\", owner: \"Priya Anand\", status: \"Active\", updates: [\"2024-03-01: Migration 60% complete.\"] },\n    { id: 2, title: \"Move to quarterly OKRs instead of annual goals\", desc: \"Switch planning cadence to quarterly for faster iteration.\", rationale: \"Annual goals became stale after Q2 market shifts.\", alternatives: \"Keep annual, monthly sprints\", stakeholders: \"Dana Wu, Leadership Team\", tags: [\"Strategy\"], date: \"2024-01-08\", owner: \"Dana Wu\", status: \"Active\", updates: [] },\n    { id: 3, title: \"Sunset legacy mobile app v1\", desc: \"Deprecate v1 app in favor of unified web app.\", rationale: \"Maintenance cost too high, low active usage (4%).\", alternatives: \"Keep supporting, partial rewrite\", stakeholders: \"Marcus Lee, Support Team\", tags: [\"Product\"], date: \"2023-11-20\", owner: \"Marcus Lee\", status: \"Superseded\", updates: [\"2024-01-15: Superseded by 'Unified App Rollout' decision.\"] },\n  ]);\n  const [selectedId, setSelectedId] = useState(1);\n  const [form, setForm] = useState({ title: \"\", desc: \"\", rationale: \"\", alternatives: \"\", stakeholders: \"\", tags: \"\", date: \"\" });\n  const [search, setSearch] = useState({ keyword: \"\", tag: \"All\", owner: \"All\", from: \"\", to: \"\" });\n\n  const tabs = [\"feed\", \"new\", \"detail\", \"search\", \"settings\"];\n  const tabLabels = { feed: \"Decision Feed\", new: \"New Decision\", detail: \"Decision Detail\", search: \"Search & Filter\", settings: \"Team Settings\" };\n  const selected = decisions.find((d) => d.id === selectedId);\n  const allTags = [\"All\", ...Array.from(new Set(decisions.flatMap((d) => d.tags)))];\n  const allOwners = [\"All\", ...Array.from(new Set(decisions.map((d) => d.owner)))];\n\n  const openDetail = (id) => { setSelectedId(id); setScreen(\"detail\"); };\n  const saveDecision = () => {\n    if (!form.title) return;\n    const nd = { id: Date.now(), title: form.title, desc: form.desc, rationale: form.rationale, alternatives: form.alternatives, stakeholders: form.stakeholders, tags: form.tags ? form.tags.split(\",\").map((t) => t.trim()) : [\"General\"], date: form.date || new Date().toISOString().slice(0, 10), owner: \"You\", status: \"Active\", updates: [] };\n    setDecisions([nd, ...decisions]);\n    setForm({ title: \"\", desc: \"\", rationale: \"\", alternatives: \"\", stakeholders: \"\", tags: \"\", date: \"\" });\n    setScreen(\"feed\");\n  };\n  const markSuperseded = () => setDecisions(decisions.map((d) => (d.id === selectedId ? { ...d, status: \"Superseded\" } : d)));\n  const addUpdate = () => setDecisions(decisions.map((d) => (d.id === selectedId ? { ...d, updates: [...d.updates, new Date().toISOString().slice(0, 10) + \": Reviewed, still on track.\" ] } : d)));\n\n  const filtered = decisions.filter((d) => {\n    const kw = search.keyword.toLowerCase();\n    const matchKw = !kw || d.title.toLowerCase().includes(kw) || d.desc.toLowerCase().includes(kw);\n    const matchTag = search.tag === \"All\" || d.tags.includes(search.tag);\n    const matchOwner = search.owner === \"All\" || d.owner === search.owner;\n    const matchFrom = !search.from || d.date >= search.from;\n    const matchTo = !search.to || d.date \u003c= search.to;\n    return matchKw && matchTag && matchOwner && matchFrom && matchTo;\n  });\n\n  return (\n    \u003cdiv style={{ background: colors.bg, minHeight: \"100vh\" }}>\n      \u003cdiv style={{ background: colors.primaryDark, color: \"#fff\", padding: \"16px 24px\" }}>\n        \u003cdiv style={{ maxWidth: 780, margin: \"0 auto\", display: \"flex\", justifyContent: \"space-between\", alignItems: \"center\" }}>\n          \u003cdiv style={{ fontSize: 20, fontWeight: 600 }}>Decido\u003c/div>\n          \u003cdiv style={{ display: \"flex\", gap: 6 }}>\n            {tabs.map((t) => (\n              \u003cdiv key={t} onClick={() => setScreen(t)} style={{ padding: \"6px 12px\", borderRadius: 6, cursor: \"pointer\", fontSize: 13, background: screen === t ? \"#fff\" : \"transparent\", color: screen === t ? colors.primaryDark : \"#dbe6ec\" }}>\n                {tabLabels[t]}\n              \u003c/div>\n            ))}\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv style={page}>\n        {screen === \"feed\" && (\n          \u003cdiv>\n            \u003ch2 style={{ marginBottom: 4 }}>Decision Log\u003c/h2>\n            \u003cp style={{ color: colors.subtext, marginTop: 0 }}>{decisions.length} decisions recorded\u003c/p>\n            \u003cdiv style={{ marginBottom: 14 }}>\n              {allTags.map((t) => (\n                \u003cspan key={t} style={{ ...pill, cursor: \"pointer\" }} onClick={() => { setSearch({ ...search, tag: t }); setScreen(\"search\"); }}>{t}\u003c/span>\n              ))}\n            \u003c/div>\n            {decisions.map((d) => (\n              \u003cdiv key={d.id} style={{ ...card, cursor: \"pointer\" }} onClick={() => openDetail(d.id)}>\n                \u003cdiv style={{ display: \"flex\", justifyContent: \"space-between\" }}>\n                  \u003cstrong>{d.title}\u003c/strong>\n                  \u003cspan style={{ fontSize: 12, color: d.status === \"Active\" ? colors.primary : \"#a15c00\" }}>{d.status}\u003c/span>\n                \u003c/div>\n                \u003cp style={{ color: colors.subtext, fontSize: 14 }}>{d.desc}\u003c/p>\n                \u003cdiv>{d.tags.map((t) => \u003cspan key={t} style={pill}>{t}\u003c/span>)}\u003c/div>\n                \u003cdiv style={{ fontSize: 12, color: colors.subtext, marginTop: 6 }}>{d.date} · {d.owner}\u003c/div>\n              \u003c/div>\n            ))}\n          \u003c/div>\n        )}\n\n        {screen === \"new\" && (\n          \u003cdiv style={card}>\n            \u003ch2 style={{ marginTop: 0 }}>Log a New Decision\u003c/h2>\n            \u003clabel style={label}>Title\u003c/label>\n            \u003cinput style={input} value={form.title} onChange={(e) => setForm({ ...form, title: e.target.value })} placeholder=\"e.g. Switch billing provider to Stripe\" />\n            \u003clabel style={label}>Short description\u003c/label>\n            \u003cinput style={input} value={form.desc} onChange={(e) => setForm({ ...form, desc: e.target.value })} placeholder=\"One or two sentences of context\" />\n            \u003clabel style={label}>Rationale\u003c/label>\n            \u003cinput style={input} value={form.rationale} onChange={(e) => setForm({ ...form, rationale: e.target.value })} placeholder=\"Why this decision was made\" />\n            \u003clabel style={label}>Alternatives considered\u003c/label>\n            \u003cinput style={input} value={form.alternatives} onChange={(e) => setForm({ ...form, alternatives: e.target.value })} placeholder=\"e.g. Braintree, Adyen\" />\n            \u003clabel style={label}>Key stakeholders\u003c/label>\n            \u003cinput style={input} value={form.stakeholders} onChange={(e) => setForm({ ...form, stakeholders: e.target.value })} placeholder=\"Names, comma separated\" />\n            \u003clabel style={label}>Tags (comma separated)\u003c/label>\n            \u003cinput style={input} value={form.tags} onChange={(e) => setForm({ ...form, tags: e.target.value })} placeholder=\"Finance, Infra\" />\n            \u003clabel style={label}>Decision date\u003c/label>\n            \u003cinput style={input} type=\"date\" value={form.date} onChange={(e) => setForm({ ...form, date: e.target.value })} />\n            \u003cbutton style={{ ...button, marginTop: 18 }} onClick={saveDecision}>Save Decision\u003c/button>\n          \u003c/div>\n        )}\n\n        {screen === \"detail\" && selected && (\n          \u003cdiv>\n            \u003cdiv style={card}>\n              \u003cdiv style={{ display: \"flex\", justifyContent: \"space-between\" }}>\n                \u003ch2 style={{ marginTop: 0 }}>{selected.title}\u003c/h2>\n                \u003cspan style={{ fontSize: 12, color: selected.status === \"Active\" ? colors.primary : \"#a15c00\" }}>{selected.status}\u003c/span>\n              \u003c/div>\n              \u003cp style={{ color: colors.subtext }}>{selected.desc}\u003c/p>\n              \u003cdiv style={{ marginBottom: 8 }}>{selected.tags.map((t) => \u003cspan key={t} style={pill}>{t}\u003c/span>)}\u003c/div>\n              \u003cp>\u003cstrong>Rationale:\u003c/strong> {selected.rationale}\u003c/p>\n              \u003cp>\u003cstrong>Alternatives considered:\u003c/strong> {selected.alternatives}\u003c/p>\n              \u003cp>\u003cstrong>Stakeholders:\u003c/strong> {selected.stakeholders}\u003c/p>\n              \u003cp style={{ fontSize: 12, color: colors.subtext }}>Decided {selected.date} by {selected.owner}\u003c/p>\n              \u003cdiv style={{ marginTop: 10 }}>\n                \u003cbutton style={button} onClick={addUpdate}>Add Update\u003c/button>\n                \u003cbutton style={{ ...button, background: \"#a15c00\", marginLeft: 8 }} onClick={markSuperseded}>Mark Superseded\u003c/button>\n              \u003c/div>\n            \u003c/div>\n            \u003ch3>Updates\u003c/h3>\n            {selected.updates.length === 0 && \u003cp style={{ color: colors.subtext }}>No updates yet.\u003c/p>}\n            {selected.updates.map((u, i) => \u003cdiv key={i} style={card}>{u}\u003c/div>)}\n          \u003c/div>\n        )}\n\n        {screen === \"search\" && (\n          \u003cdiv>\n            \u003ch2>Search & Filter\u003c/h2>\n            \u003cdiv style={card}>\n              \u003clabel style={label}>Keyword\u003c/label>\n              \u003cinput style={input} value={search.keyword} onChange={(e) => setSearch({ ...search, keyword: e.target.value })} placeholder=\"Search titles and descriptions\" />\n              \u003clabel style={label}>Tag\u003c/label>\n              \u003cselect style={input} value={search.tag} onChange={(e) => setSearch({ ...search, tag: e.target.value })}>\n                {allTags.map((t) => \u003coption key={t}>{t}\u003c/option>)}\n              \u003c/select>\n              \u003clabel style={label}>Owner\u003c/label>\n              \u003cselect style={input} value={search.owner} onChange={(e) => setSearch({ ...search, owner: e.target.value })}>\n                {allOwners.map((o) => \u003coption key={o}>{o}\u003c/option>)}\n              \u003c/select>\n              \u003cdiv style={{ display: \"flex\", gap: 10 }}>\n                \u003cdiv style={{ flex: 1 }}>\n                  \u003clabel style={label}>From\u003c/label>\n                  \u003cinput style={input} type=\"date\" value={search.from} onChange={(e) => setSearch({ ...search, from: e.target.value })} />\n                \u003c/div>\n                \u003cdiv style={{ flex: 1 }}>\n                  \u003clabel style={label}>To\u003c/label>\n                  \u003cinput style={input} type=\"date\" value={search.to} onChange={(e) => setSearch({ ...search, to: e.target.value })} />\n                \u003c/div>\n              \u003c/div>\n            \u003c/div>\n            \u003cp style={{ color: colors.subtext }}>{filtered.length} result(s)\u003c/p>\n            {filtered.map((d) => (\n              \u003cdiv key={d.id} style={{ ...card, cursor: \"pointer\" }} onClick={() => openDetail(d.id)}>\n                \u003cstrong>{d.title}\u003c/strong>\n                \u003cdiv style={{ fontSize: 12, color: colors.subtext }}>{d.date} · {d.owner}\u003c/div>\n              \u003c/div>\n            ))}\n          \u003c/div>\n        )}\n\n        {screen === \"settings\" && (\n          \u003cdiv>\n            \u003ch2>Team Settings\u003c/h2>\n            \u003cdiv style={card}>\n              \u003ch3 style={{ marginTop: 0 }}>Members\u003c/h3>\n              {[[\"Priya Anand\", \"Admin\"], [\"Tom Reyes\", \"Editor\"], [\"Dana Wu\", \"Admin\"], [\"Marcus Lee\", \"Viewer\"]].map(([n, r]) => (\n                \u003cdiv key={n} style={{ display: \"flex\", justifyContent: \"space-between\", padding: \"6px 0\", borderBottom: `1px solid ${colors.border}` }}>\n                  \u003cspan>{n}\u003c/span>\n                  \u003cspan style={{ color: colors.subtext, fontSize: 13 }}>{r}\u003c/span>\n                \u003c/div>\n              ))}\n              \u003cbutton style={{ ...button, marginTop: 14 }}>Invite Member\u003c/button>\n            \u003c/div>\n            \u003cdiv style={card}>\n              \u003ch3 style={{ marginTop: 0 }}>Tags\u003c/h3>\n              \u003cdiv>{allTags.filter((t) => t !== \"All\").map((t) => \u003cspan key={t} style={pill}>{t}\u003c/span>)}\u003c/div>\n              \u003cbutton style={{ ...button, marginTop: 14 }}>Add Tag\u003c/button>\n            \u003c/div>\n          \u003c/div>\n        )}\n      \u003c/div>\n    \u003c/div>\n  );\n}\n"},{"label":"J","ideaId":3,"idea":"A decision log that tracks what was decided, why, and when.","code":"import React, { useState } from 'react';\n\nconst App = () => {\n  const [screen, setScreen] = useState('feed');\n  const [decisions, setDecisions] = useState([\n    {\n      id: 1,\n      title: 'Migrate to cloud infrastructure',\n      description: 'Move from on-premise servers to AWS',\n      date: '2024-01-15',\n      owner: 'Sarah Chen',\n      tags: ['infrastructure', 'technical'],\n      rationale: 'Cost reduction and scalability',\n      alternatives: ['Google Cloud', 'Azure', 'Hybrid approach'],\n      stakeholders: 'DevOps, Finance, Security',\n      status: 'active',\n    },\n    {\n      id: 2,\n      title: 'Adopt agile sprint methodology',\n      description: 'Transition from waterfall to 2-week sprints',\n      date: '2024-01-10',\n      owner: 'Marcus Thompson',\n      tags: ['process', 'team'],\n      rationale: 'Faster feedback cycles and team alignment',\n      alternatives: ['Kanban', 'Scrumban'],\n      stakeholders: 'Engineering, Product, Management',\n      status: 'active',\n    },\n    {\n      id: 3,\n      title: 'Implement database sharding',\n      description: 'Distribute database across multiple nodes',\n      date: '2023-12-28',\n      owner: 'David Kumar',\n      tags: ['database', 'performance'],\n      rationale: 'Improve query performance for 10M+ users',\n      alternatives: ['Read replicas only', 'NoSQL migration'],\n      stakeholders: 'Backend team, Analytics',\n      status: 'active',\n    },\n  ]);\n  const [formData, setFormData] = useState({\n    title: '',\n    description: '',\n    rationale: '',\n    alternatives: '',\n    stakeholders: '',\n    tags: '',\n    date: new Date().toISOString().split('T')[0],\n  });\n  const [selectedDecision, setSelectedDecision] = useState(null);\n  const [searchTerm, setSearchTerm] = useState('');\n  const [filterTag, setFilterTag] = useState('');\n\n  const colors = {\n    primary: '#0f766e',\n    secondary: '#f3f4f6',\n    border: '#e5e7eb',\n    text: '#1f2937',\n    textLight: '#6b7280',\n    white: '#ffffff',\n  };\n\n  const baseStyles = {\n    container: {\n     gap: '12px',\n      marginBottom: '24px',\n      alignItems: 'center',\n      flexWrap: 'wrap',\n    },\n  };\n\n  const handleAddDecision = () => {\n    if (formData.title.trim()) {\n      const newDecision = {\n        id: Math.max(...decisions.map(d => d.id), 0) + 1,\n        ...formData,\n        tags: formData.tags.split(',').map(t => t.trim()).filter(Boolean),\n        owner: 'Current User',\n        status: 'active',\n      };\n      setDecisions([newDecision, ...decisions]);\n      setFormData({\n        title: '',\n        description: '',\n        rationale: '',\n        alternatives: '',\n        stakeholders: '',\n        tags: '',\n        date: new Date().toISOString().split('T')[0],\n      });\n      setScreen('feed');\n    }\n  };\n\n  const filteredDecisions = decisions.filter(d => {\n    const matchesSearch = d.title.toLowerCase().includes(searchTerm.toLowerCase()) ||\n                         d.description.toLowerCase().includes(searchTerm.toLowerCase());\n    const matchesTag = !filterTag || d.tags.includes(filterTag);\n    return matchesSearch && matchesTag;\n  });\n\n  const allTags = [...new Set(decisions.flatMap(d => d.tags))];\n\n  const renderFeed = () => (\n    \u003cdiv>\n      \u003cdiv style={baseStyles.header}>\n        \u003ch1 style={baseStyles.title}>Decision Log\u003c/h1>\n        \u003cp style={baseStyles.subtitle}>Searchable record of team decisions and rationale\u003c/p>\n      \u003c/div>\n      \u003cdiv style={baseStyles.filterBar}>\n        \u003cinput\n          type=\"text\"\n          placeholder=\"Search decisions...\"\n          value={searchTerm}\n          onChange={(e) => setSearchTerm(e.target.value)}\n          style={{ ...baseStyles.input, flex: 1, minWidth: '200px' }}\n        />\n        \u003cselect\n          value={filterTag}\n          onChange={(e) => setFilterTag(e.target.value)}\n          style={baseStyles.input}\n        >\n          \u003coption value=\"\">All tags\u003c/option>\n          {allTags.map(tag => (\n            \u003coption key={tag} value={tag}>{tag}\u003c/option>\n          ))}\n        \u003c/select>\n        \u003cbutton style={baseStyles.button} onClick={() => setScreen('new')}>+ New Decision\u003c/button>\n      \u003c/div>\n      \u003cdiv>\n        {filteredDecisions.map(d => (\n          \u003cdiv\n            key={d.id}\n            style={baseStyles.card}\n            onClick={() => {\n              setSelectedDecision(d);\n              setScreen('detail');\n            }}\n          >\n            \u003cdiv style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'start', marginBottom: '8px' }}>\n              \u003ch3 style={{ margin: '0 0 4px 0', fontSize: '16px', fontWeight: '600' }}>{d.title}\u003c/h3>\n              \u003cdiv style={{ fontSize: '12px', color: colors.textLight }}>{d.date}\u003c/div>\n            \u003c/div>\n            \u003cp style={{ margin: '0 0 8px 0', fontSize: '14px', color: colors.textLight }}>{d.description}\u003c/p>\n            \u003cdiv style={{ display: 'flex', gap: '8px', flexWrap: 'wrap' }}>\n              {d.tags.map(tag => (\n                \u003cspan\n                  key={tag}\n                  style={{\n                    fontSize: '12px',\n                    background: colors.secondary,\n                    padding: '4px 8px',\n                    borderRadius: '4px',\n                    color: colors.primary,\n                  }}\n                >\n                  {tag}\n                \u003c/span>\n              ))}\n            \u003c/div>\n            \u003cdiv style={{ fontSize: '12px', color: colors.textLight, marginTop: '8px' }}>by {d.owner}\u003c/div>\n          \u003c/div>\n        ))}\n      \u003c/div>\n    \u003c/div>\n  );\n\n  const renderNewDecision = () => (\n    \u003cdiv>\n      \u003cdiv style={baseStyles.header}>\n        \u003ch1 style={baseStyles.title}>Log New Decision\u003c/h1>\n      \u003c/div>\n      \u003cdiv style={baseStyles.form}>\n        \u003cdiv>\n          \u003clabel style={baseStyles.label}>Decision Title\u003c/label>\n          \u003cinput\n            type=\"text\"\n            placeholder=\"e.g., Migrate to microservices architecture\"\n            value={formData.title}\n            onChange={(e) => setFormData({ ...formData, title: e.target.value })}\n            style={{ ...baseStyles.input, width: '100%', boxSizing: 'border-box' }}\n          />\n        \u003c/div>\n        \u003cdiv>\n          \u003clabel style={baseStyles.label}>Description\u003c/label>\n          \u003cinput\n            type=\"text\"\n            placeholder=\"Brief context of the decision\"\n            value={formData.description}\n            onChange={(e) => setFormData({ ...formData, description: e.target.value })}\n            style={{ ...baseStyles.input, width: '100%', boxSizing: 'border-box' }}\n          />\n        \u003c/div>\n        \u003cdiv>\n          \u003clabel style={baseStyles.label}>Rationale\u003c/label>\n          \u003cinput\n            type=\"text\"\n            placeholder=\"Why this decision was made\"\n            value={formData.rationale}\n            onChange={(e) => setFormData({ ...formData, rationale: e.target.value })}\n            style={{ ...baseStyles.input, width: '100%', boxSizing: 'border-box' }}\n          />\n        \u003c/div>\n        \u003cdiv>\n          \u003clabel style={baseStyles.label}>Alternatives Considered\u003c/label>\n          \u003cinput\n            type=\"text\"\n            placeholder=\"Comma-separated list\"\n            value={formData.alternatives}\n            onChange={(e) => setFormData({ ...formData, alternatives: e.target.value })}\n            style={{ ...baseStyles.input, width: '100%', boxSizing: 'border-box' }}\n          />\n        \u003c/div>\n        \u003cdiv>\n          \u003clabel style={baseStyles.label}>Key Stakeholders\u003c/label>\n          \u003cinput\n            type=\"text\"\n            placeholder=\"Teams or people involved\"\n            value={formData.stakeholders}\n            onChange={(e) => setFormData({ ...formData, stakeholders: e.target.value })}\n            style={{ ...baseStyles.input, width: '100%', boxSizing: 'border-box' }}\n          />\n        \u003c/div>\n        \u003cdiv>\n          \u003clabel style={baseStyles.label}>Tags\u003c/label>\n          \u003cinput\n            type=\"text\"\n            placeholder=\"Comma-separated, e.g., infrastructure, technical\"\n            value={formData.tags}\n            onChange={(e) => setFormData({ ...formData, tags: e.target.value })}\n            style={{ ...baseStyles.input, width: '100%', boxSizing: 'border-box' }}\n          />\n        \u003c/div>\n        \u003cdiv>\n          \u003clabel style={baseStyles.label}>Decision Date\u003c/label>\n          \u003cinput\n            type=\"date\"\n            value={formData.date}\n            onChange={(e) => setFormData({ ...formData, date: e.target.value })}\n            style={{ ...baseStyles.input, width: '100%', boxSizing: 'border-box' }}\n          />\n        \u003c/div>\n        \u003cdiv style={{ display: 'flex', gap: '12px' }}>\n          \u003cbutton style={baseStyles.button} onClick={handleAddDecision}>Save Decision\u003c/button>\n          \u003cbutton\n            style={{ ...baseStyles.button, background: colors.textLight }}\n            onClick={() => setScreen('feed')}\n          >\n            Cancel\n          \u003c/button>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  );\n\n  const renderDetail = () => selectedDecision && (\n    \u003cdiv>\n      \u003cdiv style={baseStyles.header}>\n        \u003ch1 style={baseStyles.title}>{selectedDecision.title}\u003c/h1>\n        \u003cp style={baseStyles.subtitle}>{selectedDecision.date} • {selectedDecision.owner}\u003c/p>\n      \u003c/div>\n      \u003cdiv style={{ maxWidth: '600px' }}>\n        \u003cdiv style={{ ...baseStyles.card, cursor: 'auto' }}>\n          \u003ch3 style={{ margin: '0 0 8px 0', fontSize: '14px', fontWeight: '600', color: colors.primary }}>Description\u003c/h3>\n          \u003cp style={{ margin: '0 0 16px 0', color: colors.textLight }}>{selectedDecision.description}\u003c/p>\n\n          \u003ch3 style={{ margin: '0 0 8px 0', fontSize: '14px', fontWeight: '600', color: colors.primary }}>Rationale\u003c/h3>\n          \u003cp style={{ margin: '0 0 16px 0', color: colors.textLight }}>{selectedDecision.rationale}\u003c/p>\n\n          \u003ch3 style={{ margin: '0 0 8px 0', fontSize: '14px', fontWeight: '600', color: colors.primary }}>Alternatives Considered\u003c/h3>\n          \u003cp style={{ margin: '0 0 16px 0', color: colors.textLight }}>{selectedDecision.alternatives.join(', ')}\u003c/p>\n\n          \u003ch3 style={{ margin: '0 0 8px 0', fontSize: '14px', fontWeight: '600', color: colors.primary }}>Stakeholders\u003c/h3>\n          \u003cp style={{ margin: '0 0 16px 0', color: colors.textLight }}>{selectedDecision.stakeholders}\u003c/p>\n\n          \u003ch3 style={{ margin: '0 0 8px 0', fontSize: '14px', fontWeight: '600', color: colors.primary }}>Tags\u003c/h3>\n          \u003cdiv style={{ display: 'flex', gap: '8px', marginBottom: '16px', flexWrap: 'wrap' }}>\n            {selectedDecision.tags.map(tag => (\n              \u003cspan\n                key={tag}\n                style={{\n                  fontSize: '12px',\n                  background: colors.secondary,\n                  padding: '4px 8px',\n                  borderRadius: '4px',\n                  color: colors.primary,\n                }}\n              >\n                {tag}\n              \u003c/span>\n            ))}\n          \u003c/div>\n        \u003c/div>\n        \u003cbutton\n          style={{ ...baseStyles.button, marginTop: '16px' }}\n          onClick={() => setScreen('feed')}\n        >\n          Back to Feed\n        \u003c/button>\n      \u003c/div>\n    \u003c/div>\n  );\n\n  const renderSettings = () => (\n    \u003cdiv>\n      \u003cdiv style={baseStyles.header}>\n        \u003ch1 style={baseStyles.title}>Team Settings\u003c/h1>\n      \u003c/div>\n      \u003cdiv style={{ maxWidth: '600px' }}>\n        \u003cdiv style={baseStyles.card}>\n          \u003ch3 style={{ margin: '0 0 12px 0', fontSize: '16px', fontWeight: '600' }}>Team Members\u003c/h3>\n          {['Sarah Chen', 'Marcus Thompson', 'David Kumar', 'Emma Rodriguez'].map(name => (\n            \u003cdiv key={name} style={{ padding: '8px 0', borderBottom: `1px solid ${colors.border}`, fontSize: '14px' }}>\n              {name}\n            \u003c/div>\n          ))}\n        \u003c/div>\n        \u003cdiv style={{ ...baseStyles.card, marginTop: '16px' }}>\n          \u003ch3 style={{ margin: '0 0 12px 0', fontSize: '16px', fontWeight: '600' }}>Available Tags\u003c/h3>\n          {allTags.map(tag => (\n            \u003cdiv key={tag} style={{ padding: '8px 0', borderBottom: `1px solid ${colors.border}`, fontSize: '14px' }}>\n              {tag}\n            \u003c/div>\n          ))}\n        \u003c/div>\n        \u003cbutton\n          style={{ ...baseStyles.button, marginTop: '24px' }}\n          onClick={() => setScreen('feed')}\n        >\n          Back\n        \u003c/button>\n      \u003c/div>\n    \u003c/div>\n  );\n\n  return (\n    \u003cdiv style={baseStyles.container}>\n      \u003cdiv style={baseStyles.nav}>\n        {['feed', 'new', 'detail', 'settings'].map(screenName => (\n          \u003cbutton\n            key={screenName}\n            style={{\n              ...baseStyles.navBtn,\n              ...(screen === screenName ? baseStyles.navBtnActive : {}),\n            }}\n            onClick={() => {\n              if (screenName === 'detail' && !selectedDecision) return;\n              setScreen(screenName);\n            }}\n          >\n            {screenName === 'feed' && 'Feed'}\n            {screenName === 'new' && 'New Decision'}\n            {screenName === 'detail' && 'Details'}\n            {screenName === 'settings' && 'Settings'}\n          \u003c/button>\n        ))}\n      \u003c/div>\n\n      {screen === 'feed' && renderFeed()}\n      {screen === 'new' && renderNewDecision()}\n      {screen === 'detail' && renderDetail()}\n      {screen === 'settings' && renderSettings()}\n    \u003c/div>\n  );\n};\n\nexport default App;\n"},{"label":"K","ideaId":3,"idea":"A decision log that tracks what was decided, why, and when.","code":"import React, { useState } from \"react\";\n\nconst colors = {\n  bg: \"#f7f9fa\",\n  card: \"#ffffff\",\n  border: \"#e0e6e9\",\n  text: \"#1f2d33\",\n  subtext: \"#5c6b70\",\n  accent: \"#2f6f5e\",\n  accentLight: \"#e6f0ec\",\n  tag: \"#eef2f5\",\n  danger: \"#b5533c\",\n};\n\nconst font = { fontFamily: \"Georgia, 'Times New Roman', serif\" };\nconst label = { fontSize: 12, color: colors.subtext, fontWeight: \"bold\", letterSpacing: 0.5, textTransform: \"uppercase\" };\nconst input = { width: \"100%\", padding: \"8px 10px\", border: `1px solid ${colors.border}`, borderRadius: 6, fontSize: 14, marginTop: 4, marginBottom: 14, boxSizing: \"border-box\", ...font };\nconst card = { background: colors.card, border: `1px solid ${colors.border}`, borderRadius: 10, padding: 16, marginBottom: 14 };\nconst btn = { background: colors.accent, color: \"#fff\", border: \"none\", borderRadius: 6, padding: \"9px 16px\", fontSize: 14, cursor: \"pointer\", ...font };\nconst tabBtn = (active) => ({\n  padding: \"10px 14px\", cursor: \"pointer\", border: \"none\", background: \"none\",\n  borderBottom: active ? `3px solid ${colors.accent}` : \"3px solid transparent\",\n  color: active ? colors.accent : colors.subtext, fontWeight: active ? \"bold\" : \"normal\", fontSize: 14, ...font,\n});\n\nconst decisions = [\n  { id: 1, title: \"Adopt PostgreSQL over MongoDB for core data store\", desc: \"Switching primary database to support relational integrity as billing features grow.\", rationale: \"Billing and subscription data is highly relational; need strong consistency and JOIN support.\", alternatives: \"Stayed on MongoDB with schema validation; evaluated CockroachDB.\", stakeholders: \"Priya Nair (Eng Lead), Marcus Webb (CTO)\", tags: [\"Engineering\", \"Infrastructure\"], date: \"2024-03-12\", owner: \"Priya Nair\", status: \"Active\",\n    updates: [{ date: \"2024-05-02\", text: \"Migration completed for billing service; other services scheduled Q3.\" }] },\n  { id: 2, title: \"Move to quarterly OKRs instead of annual goals\", desc: \"Shorten planning cycles to react faster to market feedback.\", rationale: \"Annual goals were consistently outdated by Q2; teams need tighter feedback loops.\", alternatives: \"Bi-annual planning; rolling monthly goals.\", stakeholders: \"Elena Ruiz (COO), all team leads\", tags: [\"Operations\", \"Strategy\"], date: \"2024-01-22\", owner: \"Elena Ruiz\", status: \"Active\", updates: [] },\n  { id: 3, title: \"Sunset legacy mobile app (v1)\", desc: \"Deprecate the original iOS/Android app in favor of the web app.\", rationale: \"Maintenance cost outweighs the shrinking user base (\u003c 4% of MAU).\", alternatives: \"Keep app in maintenance-only mode; rebuild natively.\", stakeholders: \"Dan Okoro (Product), Priya Nair (Eng Lead)\", tags: [\"Product\"], date: \"2023-11-08\", owner: \"Dan Okoro\", status: \"Superseded\", updates: [{ date: \"2024-02-14\", text: \"Superseded by decision to build a lightweight PWA instead.\" }] },\n  { id: 4, title: \"Hire through agencies for Q2 contractor needs\", desc: \"Use staffing agencies rather than in-house recruiting for short-term roles.\", rationale: \"Faster ramp-up during crunch period; recruiting team is at capacity.\", alternatives: \"Delay hiring; expand recruiting team temporarily.\", stakeholders: \"Elena Ruiz (COO), Sam Whitfield (HR)\", tags: [\"Operations\", \"People\"], date: \"2024-04-30\", owner: \"Sam Whitfield\", status: \"Active\", updates: [] },\n];\n\nconst allTags = [\"Engineering\", \"Infrastructure\", \"Operations\", \"Strategy\", \"Product\", \"People\"];\nconst members = [\n  { name: \"Priya Nair\", role: \"Eng Lead\", access: \"Admin\" },\n  { name: \"Elena Ruiz\", role: \"COO\", access: \"Admin\" },\n  { name: \"Dan Okoro\", role: \"Product Manager\", access: \"Editor\" },\n  { name: \"Sam Whitfield\", role: \"HR Lead\", access: \"Editor\" },\n  { name: \"Marcus Webb\", role: \"CTO\", access: \"Viewer\" },\n];\n\nexport default function App() {\n  const [screen, setScreen] = useState(\"feed\");\n  const [selected, setSelected] = useState(decisions[0]);\n  const [query, setQuery] = useState(\"\");\n\n  const filtered = decisions.filter((d) =>\n    d.title.toLowerCase().includes(query.toLowerCase()) || d.tags.some((t) => t.toLowerCase().includes(query.toLowerCase()))\n  );\n\n  const renderTag = (t) => (\n    \u003cspan key={t} style={{ background: colors.tag, color: colors.accent, borderRadius: 20, padding: \"3px 10px\", fontSize: 12, marginRight: 6 }}>{t}\u003c/span>\n  );\n\n  return (\n    \u003cdiv style={{ ...font, background: colors.bg, minHeight: \"100vh\", color: colors.text }}>\n      \u003cdiv style={{ padding: \"18px 24px\", borderBottom: `1px solid ${colors.border}`, background: colors.card }}>\n        \u003ch1 style={{ margin: 0, fontSize: 22, color: colors.accent }}>Decido\u003c/h1>\n        \u003cdiv style={{ fontSize: 13, color: colors.subtext }}>A calm, searchable record of why decisions were made.\u003c/div>\n      \u003c/div>\n      \u003cdiv style={{ display: \"flex\", borderBottom: `1px solid ${colors.border}`, background: colors.card, paddingLeft: 16 }}>\n        {[\"feed\", \"new\", \"detail\", \"search\", \"settings\"].map((s) => (\n          \u003cbutton key={s} style={tabBtn(screen === s)} onClick={() => setScreen(s)}>\n            {{ feed: \"Decision Feed\", new: \"New Decision\", detail: \"Decision Detail\", search: \"Search & Filter\", settings: \"Team Settings\" }[s]}\n          \u003c/button>\n        ))}\n      \u003c/div>\n\n      \u003cdiv style={{ maxWidth: 720, margin: \"0 auto\", padding: 24 }}>\n        {screen === \"feed\" && (\n          \u003cdiv>\n            \u003cdiv style={{ display: \"flex\", gap: 8, marginBottom: 16 }}>\n              {allTags.slice(0, 4).map((t) => \u003cspan key={t} style={{ ...card, padding: \"6px 12px\", margin: 0, fontSize: 12, color: colors.subtext }}>{t}\u003c/span>)}\n            \u003c/div>\n            {decisions.map((d) => (\n              \u003cdiv key={d.id} style={{ ...card, cursor: \"pointer\" }} onClick={() => { setSelected(d); setScreen(\"detail\"); }}>\n                \u003cdiv style={{ display: \"flex\", justifyContent: \"space-between\" }}>\n                  \u003cstrong>{d.title}\u003c/strong>\n                  \u003cspan style={{ fontSize: 12, color: d.status === \"Active\" ? colors.accent : colors.danger }}>{d.status}\u003c/span>\n                \u003c/div>\n                \u003cdiv style={{ fontSize: 13, color: colors.subtext, margin: \"6px 0\" }}>{d.desc}\u003c/div>\n                \u003cdiv style={{ fontSize: 12, color: colors.subtext }}>{d.date} · {d.owner}\u003c/div>\n                \u003cdiv style={{ marginTop: 8 }}>{d.tags.map(renderTag)}\u003c/div>\n              \u003c/div>\n            ))}\n          \u003c/div>\n        )}\n\n        {screen === \"new\" && (\n          \u003cdiv style={card}>\n            \u003clabel style={label}>Title\u003c/label>\n            \u003cinput style={input} placeholder=\"e.g. Consolidate support tools into Zendesk\" />\n            \u003clabel style={label}>Short description\u003c/label>\n            \u003ctextarea style={{ ...input, height: 50 }} placeholder=\"One or two sentences summarizing the decision\" />\n            \u003clabel style={label}>Rationale\u003c/label>\n            \u003ctextarea style={{ ...input, height: 60 }} placeholder=\"Why this decision was made\" />\n            \u003clabel style={label}>Alternatives considered\u003c/label>\n            \u003ctextarea style={{ ...input, height: 50 }} p
