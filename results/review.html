laceholder=\"Options that were weighed and rejected\" />\n            \u003clabel style={label}>Key stakeholders\u003c/label>\n            \u003cinput style={input} placeholder=\"e.g. Priya Nair, Marcus Webb\" />\n            \u003clabel style={label}>Tags / Category\u003c/label>\n            \u003cinput style={input} placeholder=\"e.g. Engineering, Infrastructure\" />\n            \u003clabel style={label}>Decision date\u003c/label>\n            \u003cinput style={input} type=\"date\" defaultValue=\"2024-06-01\" />\n            \u003cbutton style={btn} onClick={() => setScreen(\"feed\")}>Save Decision\u003c/button>\n          \u003c/div>\n        )}\n\n        {screen === \"detail\" && (\n          \u003cdiv style={card}>\n            \u003cdiv style={{ display: \"flex\", justifyContent: \"space-between\" }}>\n              \u003ch2 style={{ margin: 0, fontSize: 19 }}>{selected.title}\u003c/h2>\n              \u003cspan style={{ fontSize: 12, color: selected.status === \"Active\" ? colors.accent : colors.danger }}>{selected.status}\u003c/span>\n            \u003c/div>\n            \u003cdiv style={{ fontSize: 12, color: colors.subtext, margin: \"6px 0 14px\" }}>{selected.date} · Owner: {selected.owner}\u003c/div>\n            \u003cdiv style={{ marginBottom: 10 }}>{selected.tags.map(renderTag)}\u003c/div>\n            \u003cp>\u003cb>Description:\u003c/b> {selected.desc}\u003c/p>\n            \u003cp>\u003cb>Rationale:\u003c/b> {selected.rationale}\u003c/p>\n            \u003cp>\u003cb>Alternatives considered:\u003c/b> {selected.alternatives}\u003c/p>\n            \u003cp>\u003cb>Stakeholders:\u003c/b> {selected.stakeholders}\u003c/p>\n            \u003cdiv style={{ borderTop: `1px solid ${colors.border}`, marginTop: 14, paddingTop: 14 }}>\n              \u003clabel style={label}>Updates\u003c/label>\n              {selected.updates.length === 0 && \u003cdiv style={{ fontSize: 13, color: colors.subtext }}>No updates yet.\u003c/div>}\n              {selected.updates.map((u, i) => (\n                \u003cdiv key={i} style={{ fontSize: 13, marginTop: 6 }}>{u.date}: {u.text}\u003c/div>\n              ))}\n              \u003cdiv style={{ display: \"flex\", gap: 10, marginTop: 12 }}>\n                \u003cbutton style={btn}>Add Update\u003c/button>\n                \u003cbutton style={{ ...btn, background: colors.danger }}>Mark Superseded\u003c/button>\n              \u003c/div>\n            \u003c/div>\n          \u003c/div>\n        )}\n\n        {screen === \"search\" && (\n          \u003cdiv>\n            \u003cinput style={input} placeholder=\"Search by keyword, tag, or owner...\" value={query} onChange={(e) => setQuery(e.target.value)} />\n            \u003cdiv style={{ display: \"flex\", gap: 10, marginBottom: 16 }}>\n              \u003cselect style={{ ...input, marginBottom: 0 }}>\u003coption>All Tags\u003c/option>{allTags.map((t) => \u003coption key={t}>{t}\u003c/option>)}\u003c/select>\n              \u003cselect style={{ ...input, marginBottom: 0 }}>\u003coption>All Owners\u003c/option>{members.map((m) => \u003coption key={m.name}>{m.name}\u003c/option>)}\u003c/select>\n              \u003cinput style={{ ...input, marginBottom: 0 }} type=\"date\" />\n            \u003c/div>\n            {filtered.map((d) => (\n              \u003cdiv key={d.id} style={{ ...card, cursor: \"pointer\" }} onClick={() => { setSelected(d); setScreen(\"detail\"); }}>\n                \u003cstrong>{d.title}\u003c/strong>\n                \u003cdiv style={{ fontSize: 12, color: colors.subtext, marginTop: 4 }}>{d.date} · {d.owner}\u003c/div>\n              \u003c/div>\n            ))}\n            {filtered.length === 0 && \u003cdiv style={{ color: colors.subtext }}>No decisions match your search.\u003c/div>}\n          \u003c/div>\n        )}\n\n        {screen === \"settings\" && (\n          \u003cdiv>\n            \u003cdiv style={card}>\n              \u003clabel style={label}>Team Members\u003c/label>\n              {members.map((m) => (\n                \u003cdiv key={m.name} style={{ display: \"flex\", justifyContent: \"space-between\", padding: \"8px 0\", borderBottom: `1px solid ${colors.border}` }}>\n                  \u003cspan>{m.name} \u003cspan style={{ color: colors.subtext, fontSize: 12 }}>({m.role})\u003c/span>\u003c/span>\n                  \u003cspan style={{ fontSize: 12, color: colors.accent }}>{m.access}\u003c/span>\n                \u003c/div>\n              ))}\n              \u003cbutton style={{ ...btn, marginTop: 12 }}>Invite Member\u003c/button>\n            \u003c/div>\n            \u003cdiv style={card}>\n              \u003clabel style={label}>Tags\u003c/label>\n              \u003cdiv style={{ marginTop: 8 }}>{allTags.map(renderTag)}\u003c/div>\n              \u003cbutton style={{ ...btn, marginTop: 12 }}>Add Tag\u003c/button>\n            \u003c/div>\n          \u003c/div>\n        )}\n      \u003c/div>\n    \u003c/div>\n  );\n}\n"},{"label":"L","ideaId":3,"idea":"A decision log that tracks what was decided, why, and when.","code":"import React, { useState } from 'react';\n\nexport default function App() {\n  const [screen, setScreen] = useState('feed');\n  const [decisions, setDecisions] = useState([\n    {\n      id: 1,\n      title: 'Migrate to microservices architecture',\n      description: 'Move from monolithic to microservices',\n      rationale: 'Improve scalability and deployment speed',\n      alternatives: ['Keep monolith, optimize', 'Serverless approach'],\n      stakeholders: ['Engineering', 'DevOps', 'Product'],\n      tags: ['infrastructure', 'architecture'],\n      owner: 'Alice Chen',\n      date: '2024-01-15',\n      updates: ['Phase 1 complete', 'Phase 2 in progress']\n    },\n    {\n      id: 2,\n      title: 'Adopt React for frontend',\n      description: 'Switch from Vue to React',\n      rationale: 'Larger community, better hiring pool',\n      alternatives: ['Stay with Vue', 'Try Svelte'],\n      stakeholders: ['Frontend Team', 'HR'],\n      tags: ['technology', 'frontend'],\n      owner: 'Bob Martinez',\n      date: '2024-01-10',\n      updates: []\n    },\n    {\n      id: 3,\n      title: 'Change pricing model to usage-based',\n      description: 'Move from fixed to usage-based billing',\n      rationale: 'Better align with customer value',\n      alternatives: ['Keep fixed pricing', 'Hybrid model'],\n      stakeholders: ['Finance', 'Sales', 'Product'],\n      tags: ['business', 'pricing'],\n      owner: 'Carol Singh',\n      date: '2024-01-08',\n      updates: ['Implementation complete']\n    }\n  ]);\n  \n  const [newDecision, setNewDecision] = useState({\n    title: '',\n    description: '',\n    rationale: '',\n    alternatives: '',\n    stakeholders: '',\n    tags: '',\n    date: new Date().toISOString().split('T')[0]\n  });\n  \n  const [selectedDecision, setSelectedDecision] = useState(null);\n  const [searchTerm, setSearchTerm] = useState('');\n  const [filterTag, setFilterTag] = useState('');\n\n  const colors = {\n    primary: '#2563eb',\n    bg: '#f8fafc',\n    border: '#e2e8f0',\n    text: '#1e293b',\n    textLight: '#64748b',\n    accent: '#0ea5e9'\n  };\n\n  const spacing = {\n    xs: '8px',\n    sm: '12px',\n    md: '16px',\n    lg: '24px',\n    xl: '32px'\n  };\n\n  const handleNewDecision = () => {\n    if (newDecision.title && newDecision.description) {\n      const decision = {\n        id: Math.max(...decisions.map(d => d.id), 0) + 1,\n        ...newDecision,\n        owner: 'You',\n        alternatives: newDecision.alternatives.split(',').map(a => a.trim()),\n        stakeholders: newDecision.stakeholders.split(',').map(s => s.trim()),\n        tags: newDecision.tags.split(',').map(t => t.trim()),\n        updates: []\n      };\n      setDecisions([decision, ...decisions]);\n      setNewDecision({\n        title: '',\n        description: '',\n        rationale: '',\n        alternatives: '',\n        stakeholders: '',\n        tags: '',\n        date: new Date().toISOString().split('T')[0]\n      });\n      setScreen('feed');\n    }\n  };\n\n  const filteredDecisions = decisions.filter(d => {\n    const matchesSearch = d.title.toLowerCase().includes(searchTerm.toLowerCase()) ||\n                         d.description.toLowerCase().includes(searchTerm.toLowerCase());\n    const matchesTag = !filterTag || d.tags.includes(filterTag);\n    return matchesSearch && matchesTag;\n  });\n\n  const allTags = Array.from(new Set(decisions.flatMap(d => d.tags)));\n\n  return (\n    \u003cdiv style={{ fontFamily: '-apple-system, BlinkMacSystemFont, sans-serif', backgroundColor: colors.bg, minHeight: '100vh' }}>\n      {/* Header */}\n      \u003cdiv style={{ backgroundColor: 'white', borderBottom: `1px solid ${colors.border}`, padding: spacing.lg, boxShadow: '0 1px 3px rgba(0,0,0,0.05)' }}>\n        \u003ch1 style={{ margin: 0, fontSize: '24px', fontWeight: '600', color: colors.text }}>Decido\u003c/h1>\n        \u003cp style={{ margin: `${spacing.xs} 0 0 0`, fontSize: '14px', color: colors.textLight }}>Team decision log\u003c/p>\n      \u003c/div>\n\n      {/* Nav tabs */}\n      \u003cdiv style={{ display: 'flex', gap: spacing.md, padding: spacing.md, backgroundColor: 'white', borderBottom: `1px solid ${colors.border}`, overflowX: 'auto' }}>\n        {['feed', 'new', 'search', 'settings'].map(tab => (\n          \u003cbutton\n            key={tab}\n            onClick={() => setScreen(tab)}\n            style={{\n              padding: `${spacing.sm} ${spacing.md}`,\n              border: 'none',\n              backgroundColor: screen === tab ? colors.primary : 'transparent',\n              color: screen === tab ? 'white' : colors.textLight,\n              cursor: 'pointer',\n              fontSize: '14px',\n              fontWeight: '500',\n              borderRadius: '4px',\n              transition: 'none'\n            }}\n          >\n            {tab === 'feed' && 'Feed'}\n            {tab === 'new' && 'New Decision'}\n            {tab === 'search' && 'Search'}\n            {tab === 'settings' && 'Settings'}\n          \u003c/button>\n        ))}\n      \u003c/div>\n\n      {/* Content */}\n      \u003cdiv style={{ padding: spacing.lg, maxWidth: '900px', margin: '0 auto' }}>\n        {screen === 'feed' && (\n          \u003cdiv>\n            \u003ch2 style={{ fontSize: '18px', fontWeight: '600', color: colors.text, marginTop: 0 }}>Decision Feed\u003c/h2>\n            {filteredDecisions.map(d => (\n              \u003cdiv\n                key={d.id}\n                onClick={() => { setSelectedDecision(d); setScreen('detail'); }}\n                style={{\n                  backgroundColor: 'white',\n                  padding: spacing.md,\n                  marginBottom: spacing.md,\n                  border: `1px solid ${colors.border}`,\n                  borderRadius: '6px',\n                  cursor: 'pointer',\n                  transition: 'none'\n                }}\n              >\n                \u003cdiv style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'start' }}>\n                  \u003cdiv>\n                    \u003ch3 style={{ margin: 0, fontSize: '16px', fontWeight: '600', color: colors.text }}>{d.title}\u003c/h3>\n                    \u003cp style={{ margin: `${spacing.xs} 0`, fontSize: '14px', color: colors.textLight }}>{d.description}\u003c/p>\n                    \u003cdiv style={{ display: 'flex', gap: spacing.sm, marginTop: spacing.sm, flexWrap: 'wrap' }}>\n                      {d.tags.map(tag => (\n                        \u003cspan key={tag} style={{\n                          backgroundColor: '#dbeafe',\n                          color: colors.primary,\n                          padding: `2px 8px`,\n                          borderRadius: '3px',\n                          fontSize: '12px',\n                          fontWeight: '500'\n                        }}>\n                          {tag}\n                        \u003c/span>\n                      ))}\n                    \u003c/div>\n                  \u003c/div>\n                  \u003cdiv style={{ textAlign: 'right' }}>\n                    \u003cp style={{ margin: 0, fontSize: '12px', color: colors.textLight }}>{d.owner}\u003c/p>\n                    \u003cp style={{ margin: `${spacing.xs} 0 0 0`, fontSize: '12px', color: colors.textLight }}>{d.date}\u003c/p>\n                  \u003c/div>\n                \u003c/div>\n              \u003c/div>\n            ))}\n          \u003c/div>\n        )}\n\n        {screen === 'new' && (\n          \u003cdiv>\n            \u003ch2 style={{ fontSize: '18px', fontWeight: '600', color: colors.text, marginTop: 0 }}>Log a New Decision\u003c/h2>\n            \u003cdiv style={{ backgroundColor: 'white', padding: spacing.lg, borderRadius: '6px', border: `1px solid ${colors.border}` }}>\n              {[\n                { label: 'Decision Title', key: 'title' },\n                { label: 'Description', key: 'description' },\n                { label: 'Rationale', key: 'rationale' },\n                { label: 'Alternatives (comma-separated)', key: 'alternatives' },\n                { label: 'Stakeholders (comma-separated)', key: 'stakeholders' },\n                { label: 'Tags (comma-separated)', key: 'tags' }\n              ].map(field => (\n                \u003cdiv key={field.key} style={{ marginBottom: spacing.md }}>\n                  \u003clabel style={{ display: 'block', fontSize: '14px', fontWeight: '500', color: colors.text, marginBottom: spacing.xs }}>\n                    {field.label}\n                  \u003c/label>\n                  \u003cinput\n                    type={field.key === 'date' ? 'date' : 'text'}\n                    value={newDecision[field.key]}\n                    onChange={e => setNewDecision({ ...newDecision, [field.key]: e.target.value })}\n                    style={{\n                      width: '100%',\n                      padding: spacing.sm,\n                      border: `1px solid ${colors.border}`,\n                      borderRadius: '4px',\n                      fontSize: '14px',\n                      boxSizing: 'border-box'\n                    }}\n                  />\n                \u003c/div>\n              ))}\n              \u003cdiv style={{ marginBottom: spacing.md }}>\n                \u003clabel style={{ display: 'block', fontSize: '14px', fontWeight: '500', color: colors.text, marginBottom: spacing.xs }}>\n                  Decision Date\n                \u003c/label>\n                \u003cinput\n                  type=\"date\"\n                  value={newDecision.date}\n                  onChange={e => setNewDecision({ ...newDecision, date: e.target.value })}\n                  style={{\n                    width: '100%',\n                    padding: spacing.sm,\n                    border: `1px solid ${colors.border}`,\n                    borderRadius: '4px',\n                    fontSize: '14px',\n                    boxSizing: 'border-box'\n                  }}\n                />\n              \u003c/div>\n              \u003cbutton\n                onClick={handleNewDecision}\n                style={{\n                  backgroundColor: colors.primary,\n                  color: 'white',\n                  padding: `${spacing.sm} ${spacing.md}`,\n                  border: 'none',\n                  borderRadius: '4px',\n                  cursor: 'pointer',\n                  fontSize: '14px',\n                  fontWeight: '500'\n                }}\n              >\n                Save Decision\n              \u003c/button>\n            \u003c/div>\n          \u003c/div>\n        )}\n\n        {screen === 'search' && (\n          \u003cdiv>\n            \u003ch2 style={{ fontSize: '18px', fontWeight: '600', color: colors.text, marginTop: 0 }}>Search & Filter\u003c/h2>\n            \u003cdiv style={{ backgroundColor: 'white', padding: spacing.md, borderRadius: '6px', border: `1px solid ${colors.border}`, marginBottom: spacing.lg }}>\n              \u003cinput\n                type=\"text\"\n                placeholder=\"Search decisions...\"\n                value={searchTerm}\n                onChange={e => setSearchTerm(e.target.value)}\n                style={{\n                  width: '100%',\n                  padding: spacing.sm,\n                  border: `1px solid ${colors.border}`,\n                  borderRadius: '4px',\n                  fontSize: '14px',\n                  boxSizing: 'border-box',\n                  marginBottom: spacing.md\n                }}\n              />\n              \u003clabel style={{ display: 'block', fontSize: '14px', fontWeight: '500', color: colors.text, marginBottom: spacing.xs }}>\n                Filter by Tag\n              \u003c/label>\n              \u003cselect\n                value={filterTag}\n                onChange={e => setFilterTag(e.target.value)}\n                style={{\n                  width: '100%',\n                  padding: spacing.sm,\n                  border: `1px solid ${colors.border}`,\n                  borderRadius: '4px',\n                  fontSize: '14px'\n                }}\n              >\n                \u003coption value=\"\">All Tags\u003c/option>\n                {allTags.map(tag => (\n                  \u003coption key={tag} value={tag}>{tag}\u003c/option>\n                ))}\n              \u003c/select>\n            \u003c/div>\n            \u003cdiv>\n              {filteredDecisions.map(d => (\n                \u003cdiv\n                  key={d.id}\n                  onClick={() => { setSelectedDecision(d); setScreen('detail'); }}\n                  style={{\n                    backgroundColor: 'white',\n                    padding: spacing.md,\n                    marginBottom: spacing.md,\n                    border: `1px solid ${colors.border}`,\n                    borderRadius: '6px',\n                    cursor: 'pointer'\n                  }}\n                >\n                  \u003ch3 style={{ margin: 0, fontSize: '16px', fontWeight: '600', color: colors.text }}>{d.title}\u003c/h3>\n                  \u003cp style={{ margin: `${spacing.xs} 0`, fontSize: '14px', color: colors.textLight }}>{d.description}\u003c/p>\n                \u003c/div>\n              ))}\n            \u003c/div>\n          \u003c/div>\n        )}\n\n        {screen === 'detail' && selectedDecision && (\n          \u003cdiv>\n            \u003cbutton\n              onClick={() => setScreen('feed')}\n              style={{\n                backgroundColor: 'white',\n                border: `1px solid ${colors.border}`,\n                padding: `${spacing.xs} ${spacing.sm}`,\n                borderRadius: '4px',\n                cursor: 'pointer',\n                fontSize: '14px',\n                marginBottom: spacing.md\n              }}\n            >\n              ← Back\n            \u003c/button>\n            \u003cdiv style={{ backgroundColor: 'white', padding: spacing.lg, borderRadius: '6px', border: `1px solid ${colors.border}` }}>\n              \u003ch2 style={{ margin: 0, fontSize: '20px', fontWeight: '600', color: colors.text }}>{selectedDecision.title}\u003c/h2>\n              \u003cp style={{ margin: `${spacing.sm} 0`, fontSize: '14px', color: colors.textLight }}>\n                By {selectedDecision.owner} on {selectedDecision.date}\n              \u003c/p>\n              \n              \u003cdiv style={{ marginTop: spacing.lg }}>\n                \u003ch3 style={{ fontSize: '14px', fontWeight: '600', color: colors.text, marginBottom: spacing.sm }}>Description\u003c/h3>\n                \u003cp style={{ margin: 0, fontSize: '14px', color: colors.text }}>{selectedDecision.description}\u003c/p>\n              \u003c/div>\n\n              \u003cdiv style={{ marginTop: spacing.md }}>\n                \u003ch3 style={{ fontSize: '14px', fontWeight: '600', color: colors.text, marginBottom: spacing.sm }}>Rationale\u003c/h3>\n                \u003cp style={{ margin: 0, fontSize: '14px', color: colors.text }}>{selectedDecision.rationale}\u003c/p>\n              \u003c/div>\n\n              \u003cdiv style={{ marginTop: spacing.md }}>\n                \u003ch3 style={{ fontSize: '14px', fontWeight: '600', color: colors.text, marginBottom: spacing.sm }}>Alternatives\u003c/h3>\n                \u003cul style={{ margin: 0, paddingLeft: spacing.lg, fontSize: '14px', color: colors.text }}>\n                  {selectedDecision.alternatives.map((alt, i) => (\n                    \u003cli key={i}>{alt}\u003c/li>\n                  ))}\n                \u003c/ul>\n              \u003c/div>\n\n              \u003cdiv style={{ marginTop: spacing.md }}>\n                \u003ch3 style={{ fontSize: '14px', fontWeight: '600', color: colors.text, marginBottom: spacing.sm }}>Stakeholders\u003c/h3>\n                \u003cp style={{ margin: 0, fontSize: '14px', color: colors.text }}>{selectedDecision.stakeholders.join(', ')}\u003c/p>\n              \u003c/div>\n\n              {selectedDecision.updates.length > 0 && (\n                \u003cdiv style={{ marginTop: spacing.md }}>\n                  \u003ch3 style={{ fontSize: '14px', fontWeight: '600', color: colors.text, marginBottom: spacing.sm }}>Updates\u003c/h3>\n                  \u003cul style={{ margin: 0, paddingLeft: spacing.lg, fontSize: '14px', color: colors.text }}>\n                    {selectedDecision.updates.map((update, i) => (\n                      \u003cli key={i}>{update}\u003c/li>\n                    ))}\n                  \u003c/ul>\n                \u003c/div>\n              )}\n            \u003c/div>\n          \u003c/div>\n        )}\n\n        {screen === 'settings' && (\n          \u003cdiv>\n            \u003ch2 style={{ fontSize: '18px', fontWeight: '600', color: colors.text, marginTop: 0 }}>Team Settings\u003c/h2>\n            \u003cdiv style={{ backgroundColor: 'white', padding: spacing.lg, borderRadius: '6px', border: `1px solid ${colors.border}`, marginBottom: spacing.lg }}>\n              \u003ch3 style={{ margin: 0, fontSize: '16px', fontWeight: '600', color: colors.text, marginBottom: spacing.md }}>Team Members\u003c/h3>\n              {['Alice Chen (Admin)', 'Bob Martinez (Member)', 'Carol Singh (Member)', 'David Lee (Member)'].map((member, i) => (\n                \u003cdiv key={i} style={{\n                  padding: spacing.md,\n                  borderBottom: i \u003c 3 ? `1px solid ${colors.border}` : 'none',\n                  fontSize: '14px',\n                  color: colors.text\n                }}>\n                  {member}\n                \u003c/div>\n              ))}\n            \u003c/div>\n\n            \u003cdiv style={{ backgroundColor: 'white', padding: spacing.lg, borderRadius: '6px', border: `1px solid ${colors.border}` }}>\n              \u003ch3 style={{ margin: 0, fontSize: '16px', fontWeight: '600', color: colors.text, marginBottom: spacing.md }}>Available Tags\u003c/h3>\n              \u003cdiv style={{ display: 'flex', gap: spacing.sm, flexWrap: 'wrap' }}>\n                {allTags.map(tag => (\n                  \u003cspan key={tag} style={{\n                    backgroundColor: '#dbeafe',\n                    color: colors.primary,\n                    padding: `${spacing.xs} ${spacing.sm}`,\n                    borderRadius: '3px',\n                    fontSize: '14px',\n                    fontWeight: '500'\n                  }}>\n                    {tag}\n                  \u003c/span>\n                ))}\n              \u003c/div>\n            \u003c/div>\n          \u003c/div>\n        )}\n      \u003c/div>\n    \u003c/div>\n  );\n}\n"},{"label":"M","ideaId":4,"idea":"An app that plans a week of meals around what's already in the fridge.","code":"import React, { useState } from 'react';\n\nexport default function App() {\n  const [screen, setScreen] = useState('inventory');\n  const [fridge, setFridge] = useState([\n    { id: 1, name: 'Chicken Breast', expiry: '2025-02-05' },\n    { id: 2, name: 'Broccoli', expiry: '2025-02-03' },\n    { id: 3, name: 'Pasta', expiry: '2025-06-01' },\n    { id: 4, name: 'Olive Oil', expiry: '2025-08-15' },\n  ]);\n  const [newItem, setNewItem] = useState('');\n  const [mealPlan, setMealPlan] = useState([\n    { day: 'Monday', meal: 'Grilled Chicken & Broccoli', completed: false },\n    { day: 'Tuesday', meal: 'Pasta Carbonara', completed: false },\n    { day: 'Wednesday', meal: 'Chicken Stir-Fry', completed: false },\n    { day: 'Thursday', meal: 'Baked Salmon with Asparagus', completed: false },\n    { day: 'Friday', meal: 'Vegetable Fried Rice', completed: false },\n    { day: 'Saturday', meal: 'Beef Tacos', completed: false },\n    { day: 'Sunday', meal: 'Roast Chicken & Potatoes', completed: false },\n  ]);\n  const [selectedRecipe, setSelectedRecipe] = useState(null);\n  const [dietary, setDietary] = useState('');\n  const [household, setHousehold] = useState('2');\n\n  const colors = {\n    primary: '#10B981',\n    secondary: '#F3F4F6',\n    text: '#1F2937',\n    light: '#FFFFFF',\n    border: '#E5E7EB',\n  };\n\n  const sharedButton = {\n    padding: '10px 16px',\n    border: 'none',\n    borderRadius: '8px',\n    cursor: 'pointer',\n    fontSize: '14px',\n    fontWeight: '600',\n  };\n\n  const recipes = {\n    'Grilled Chicken & Broccoli': {\n      ingredients: ['Chicken Breast (300g)', 'Broccoli (200g)', 'Garlic (3 cloves)', 'Olive Oil (2 tbsp)', 'Salt & Pepper'],\n      steps: ['Season chicken and broccoli', 'Heat oil in pan', 'Grill chicken 6-7 min each side', 'Add broccoli last 4 minutes', 'Serve hot'],\n    },\n    'Pasta Carbonara': {\n      ingredients: ['Pasta (400g)', 'Eggs (3)', 'Bacon (150g)', 'Parmesan (100g)', 'Black Pepper'],\n      steps: ['Cook pasta until al dente', 'Fry bacon until crispy', 'Mix eggs with grated cheese', 'Toss hot pasta with bacon', 'Add egg mixture off heat, stir quickly'],\n    },\n    'Chicken Stir-Fry': {\n      ingredients: ['Chicken Breast (300g)', 'Mixed Vegetables (400g)', 'Soy Sauce (3 tbsp)', 'Ginger (1 tbsp)', 'Garlic (2 cloves)'],\n      steps: ['Cube chicken and vegetables', 'Heat oil in wok', 'Stir-fry chicken until cooked', 'Add vegetables and sauce', 'Serve over rice'],\n    },\n  };\n\n  const shoppingList = [\n    { item: 'Salmon Fillet', qty: '500g' },\n    { item: 'Asparagus', qty: '300g' },\n    { item: 'Beef Mince', qty: '500g' },\n    { item: 'Taco Shells', qty: '12 shells' },\n    { item: 'Potatoes', qty: '1kg' },\n  ];\n\n  const handleAddItem = () => {\n    if (newItem.trim()) {\n      setFridge([...fridge, { id: Date.now(), name: newItem, expiry: '2025-02-20' }]);\n      setNewItem('');\n    }\n  };\n\n  const handleRemoveItem = (id) => {\n    setFridge(fridge.filter(item => item.id !== id));\n  };\n\n  const toggleMeal = (index) => {\n    const updated = [...mealPlan];\n    updated[index].completed = !updated[index].completed;\n    setMealPlan(updated);\n  };\n\n  const navStyle = {\n    display: 'flex',\n    gap: '8px',\n    borderBottom: `2px solid ${colors.border}`,\n    marginBottom: '24px',\n    padding: '0 0 8px 0',\n  };\n\n  const navButtonStyle = (active) => ({\n    ...sharedButton,\n    padding: '12px 16px',\n    background: active ? colors.primary : 'transparent',\n    color: active ? colors.light : colors.text,\n    fontSize: '13px',\n  });\n\n  return (\n    \u003cdiv style={{ maxWidth: '600px', margin: '0 auto', padding: '16px', fontFamily: 'system-ui, -apple-system, sans-serif', background: colors.light, minHeight: '100vh' }}>\n      \u003cdiv style={{ marginBottom: '24px' }}>\n        \u003ch1 style={{ color: colors.primary, fontSize: '28px', margin: '0 0 8px 0', fontWeight: '700' }}>FridgeWeek\u003c/h1>\n        \u003cp style={{ color: '#6B7280', margin: '0', fontSize: '14px' }}>Fresh meals from what you have\u003c/p>\n      \u003c/div>\n\n      \u003cdiv style={navStyle}>\n        {['inventory', 'plan', 'shopping', 'settings'].map(tab => (\n          \u003cbutton key={tab} onClick={() => { setScreen(tab); setSelectedRecipe(null); }} style={navButtonStyle(screen === tab)}>\n            {tab === 'inventory' && '🧊 Inventory'}\n            {tab === 'plan' && '📅 Plan'}\n            {tab === 'shopping' && '🛒 Shopping'}\n            {tab === 'settings' && '⚙️ Settings'}\n          \u003c/button>\n        ))}\n      \u003c/div>\n\n      {screen === 'inventory' && (\n        \u003cdiv>\n          \u003ch2 style={{ color: colors.text, fontSize: '18px', marginBottom: '16px' }}>Your Fridge & Pantry\u003c/h2>\n          \u003cdiv style={{ display: 'flex', gap: '8px', marginBottom: '16px' }}>\n            \u003cinput type=\"text\" value={newItem} onChange={(e) => setNewItem(e.target.value)} placeholder=\"Add item...\" style={{ flex: 1, padding: '10px', border: `1px solid ${colors.border}`, borderRadius: '6px', fontSize: '14px' }} />\n            \u003cbutton onClick={handleAddItem} style={{ ...sharedButton, background: colors.primary, color: colors.light }}>Add\u003c/button>\n          \u003c/div>\n          \u003cdiv style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>\n            {fridge.map(item => (\n              \u003cdiv key={item.id} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '12px', background: colors.secondary, borderRadius: '6px', fontSize: '14px' }}>\n                \u003cdiv>\n                  \u003cdiv style={{ fontWeight: '600', color: colors.text }}>{item.name}\u003c/div>\n                  \u003cdiv style={{ fontSize: '12px', color: '#9CA3AF' }}>Expires {item.expiry}\u003c/div>\n                \u003c/div>\n                \u003cbutton onClick={() => handleRemoveItem(item.id)} style={{ ...sharedButton, background: '#EF4444', color: colors.light, padding: '6px 12px', fontSize: '12px' }}>Remove\u003c/button>\n              \u003c/div>\n            ))}\n          \u003c/div>\n        \u003c/div>\n      )}\n\n      {screen === 'plan' && !selectedRecipe && (\n        \u003cdiv>\n          \u003ch2 style={{ color: colors.text, fontSize: '18px', marginBottom: '16px' }}>7-Day Meal Plan\u003c/h2>\n          \u003cdiv style={{ display: 'flex', flexDirection: 'column', gap: '10px' }}>\n            {mealPlan.map((day, i) => (\n              \u003cdiv key={i} style={{ display: 'flex', alignItems: 'center', gap: '12px', padding: '12px', background: colors.secondary, borderRadius: '6px', cursor: 'pointer' }} onClick={() => setSelectedRecipe(day.meal)}>\n                \u003cinput type=\"checkbox\" checked={day.completed} onChange={() => toggleMeal(i)} style={{ cursor: 'pointer', width: '18px', height: '18px' }} />\n                \u003cdiv style={{ flex: 1 }}>\n                  \u003cdiv style={{ fontWeight: '600', color: colors.text, textDecoration: day.completed ? 'line-through' : 'none' }}>{day.day}\u003c/div>\n                  \u003cdiv style={{ fontSize: '13px', color: '#6B7280' }}>{day.meal}\u003c/div>\n                \u003c/div>\n                \u003cspan style={{ fontSize: '18px' }}>→\u003c/span>\n              \u003c/div>\n            ))}\n          \u003c/div>\n        \u003c/div>\n      )}\n\n      {screen === 'plan' && selectedRecipe && (\n        \u003cdiv>\n          \u003cbutton onClick={() => setSelectedRecipe(null)} style={{ ...sharedButton, background: colors.secondary, color: colors.text, marginBottom: '16px' }}>← Back\u003c/button>\n          \u003ch2 style={{ color: colors.text, fontSize: '18px', marginBottom: '16px' }}>{selectedRecipe}\u003c/h2>\n          \u003cdiv style={{ marginBottom: '20px' }}>\n            \u003ch3 style={{ color: colors.text, fontSize: '14px', fontWeight: '600', marginBottom: '8px' }}>Ingredients:\u003c/h3>\n            \u003cul style={{ margin: '0', paddingLeft: '20px', color: '#6B7280', fontSize: '13px' }}>\n              {recipes[selectedRecipe]?.ingredients.map((ing, i) => \u003cli key={i}>{ing}\u003c/li>)}\n            \u003c/ul>\n          \u003c/div>\n          \u003cdiv>\n            \u003ch3 style={{ color: colors.text, fontSize: '14px', fontWeight: '600', marginBottom: '8px' }}>Instructions:\u003c/h3>\n            \u003col style={{ margin: '0', paddingLeft: '20px', color: '#6B7280', fontSize: '13px' }}>\n              {recipes[selectedRecipe]?.steps.map((step, i) => \u003cli key={i}>{step}\u003c/li>)}\n            \u003c/ol>\n          \u003c/div>\n        \u003c/div>\n      )}\n\n      {screen === 'shopping' && (\n        \u003cdiv>\n          \u003ch2 style={{ color: colors.text, fontSize: '18px', marginBottom: '16px' }}>Shopping List\u003c/h2>\n          \u003cp style={{ color: '#6B7280', fontSize: '13px', marginBottom: '16px' }}>Items to buy for this week's meals:\u003c/p>\n          \u003cdiv style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>\n            {shoppingList.map((item, i) => (\n              \u003cdiv key={i} style={{ display: 'flex', alignItems: 'center', gap: '12px', padding: '12px', background: colors.secondary, borderRadius: '6px' }}>\n                \u003cinput type=\"checkbox\" style={{ cursor: 'pointer', width: '18px', height: '18px' }} />\n                \u003cdiv style={{ flex: 1 }}>\n                  \u003cdiv style={{ fontWeight: '600', color: colors.text }}>{item.item}\u003c/div>\n                  \u003cdiv style={{ fontSize: '12px', color: '#9CA3AF' }}>{item.qty}\u003c/div>\n                \u003c/div>\n              \u003c/div>\n            ))}\n          \u003c/div>\n        \u003c/div>\n      )}\n\n      {screen === 'settings' && (\n        \u003cdiv>\n          \u003ch2 style={{ color: colors.text, fontSize: '18px', marginBottom: '16px' }}>Preferences\u003c/h2>\n          \u003cdiv style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>\n            \u003cdiv>\n              \u003clabel style={{ display: 'block', fontWeight: '600', color: colors.text, marginBottom: '6px', fontSize: '14px' }}>Dietary Restrictions\u003c/label>\n              \u003cselect value={dietary} onChange={(e) => setDietary(e.target.value)} style={{ width: '100%', padding: '10px', border: `1px solid ${colors.border}`, borderRadius: '6px', fontSize: '14px' }}>\n                \u003coption value=\"\">None\u003c/option>\n                \u003coption value=\"vegetarian\">Vegetarian\u003c/option>\n                \u003coption value=\"vegan\">Vegan\u003c/option>\n                \u003coption value=\"glutenfree\">Gluten-free\u003c/option>\n                \u003coption value=\"dairyfree\">Dairy-free\u003c/option>\n              \u003c/select>\n            \u003c/div>\n            \u003cdiv>\n              \u003clabel style={{ display: 'block', fontWeight: '600', color: colors.text, marginBottom: '6px', fontSize: '14px' }}>Household Size\u003c/label>\n              \u003cselect value={household} onChange={(e) => setHousehold(e.target.value)} style={{ width: '100%', padding: '10px', border: `1px solid ${colors.border}`, borderRadius: '6px', fontSize: '14px' }}>\n                \u003coption value=\"1\">1 Person\u003c/option>\n                \u003coption value=\"2\">2 People\u003c/option>\n                \u003coption value=\"4\">4 People\u003c/option>\n                \u003coption value=\"6\">6+ People\u003c/option>\n              \u003c/select>\n            \u003c/div>\n            \u003cbutton style={{ ...sharedButton, background: colors.primary, color: colors.light }}>Save Preferences\u003c/button>\n          \u003c/div>\n        \u003c/div>\n      )}\n    \u003c/div>\n  );\n}\n"},{"label":"N","ideaId":4,"idea":"An app that plans a week of meals around what's already in the fridge.","code":"import React, { useState } from 'react';\n\nexport default function App() {\n  const [currentScreen, setCurrentScreen] = useState('inventory');\n  const [inventory, setInventory] = useState([\n    { id: 1, name: 'Chicken Breast', daysLeft: 3 },\n    { id: 2, name: 'Broccoli', daysLeft: 5 },\n    { id: 3, name: 'Rice', daysLeft: 30 },\n  ]);\n  const [mealPlan, setMealPlan] = useState([\n    { day: 'Monday', meal: 'Grilled Chicken & Broccoli', status: 'pending' },\n    { day: 'Tuesday', meal: 'Pasta Carbonara', status: 'pending' },\n    { day: 'Wednesday', meal: 'Stir-Fried Rice', status: 'pending' },\n    { day: 'Thursday', meal: 'Grilled Salmon', status: 'pending' },\n    { day: 'Friday', meal: 'Tacos', status: 'pending' },\n  ]);\n  const [shoppingList, setShoppingList] = useState([\n    { item: 'Eggs', quantity: '12', reason: 'Pasta Carbonara' },\n    { item: 'Salmon Fillet', quantity: '1.5 lbs', reason: 'Grilled Salmon' },\n    { item: 'Ground Beef', quantity: '2 lbs', reason: 'Tacos' },\n  ]);\n  const [preferences, setPreferences] = useState({\n    dietaryRestrictions: 'None',\n    householdSize: 2,\n    cookingTime: 'Medium (30-45 min)',\n  });\n  const [newItem, setNewItem] = useState('');\n  const [selectedRecipe, setSelectedRecipe] = useState(null);\n\n  const colors = {\n    primary: '#2ecc71',\n    secondary: '#27ae60',\n    background: '#f8fef6',\n    text: '#2c3e50',\n    lightText: '#7f8c8d',\n    border: '#e0e8e3',\n    white: '#ffffff',\n  };\n\n  const sharedStyles = {\n    container: {\n      minHeight: '100vh',\n      backgroundColor: colors.background,\n      fontFamily: \"'Segoe UI', Tahoma, Geneva, Verdana, sans-serif\",\n      color: colors.text,\n    },\n    header: {\n      backgroundColor: colors.primary,\n      padding: '20px',\n      color: colors.white,\n      textAlign: 'center',\n      fontSize: '28px',\n      fontWeight: 'bold',\n    },\n    navBar: {\n      display: 'flex',\n      backgroundColor: colors.white,\n      borderTop: `2px solid ${colors.border}`,\n      borderBottom: `2px solid ${colors.border}`,\n    },\n    navButton: (isActive) => ({\n      flex: 1,\n      padding: '12px',\n      border: 'none',\n      backgroundColor: isActive ? colors.primary : colors.white,\n      color: isActive ? colors.white : colors.text,\n      cursor: 'pointer',\n      fontSize: '13px',\n      fontWeight: '600',\n      borderBottom: isActive ? `3px solid ${colors.secondary}` : 'none',\n    }),\n    mainContent: {\n      padding: '20px',\n      maxWidth: '800px',\n      margin: '0 auto',\n    },\n    sectionTitle: {\n      fontSize: '20px',\n      fontWeight: 'bold',\n      marginBottom: '15px',\n      color: colors.text,\n    },\n    card: {\n      backgroundColor: colors.white,\n      border: `1px solid ${colors.border}`,\n      borderRadius: '8px',\n      padding: '15px',\n      marginBottom: '10px',\n    },\n    button: {\n      backgroundColor: colors.primary,\n      color: colors.white,\n      border: 'none',\n      padding: '10px 15px',\n      borderRadius: '6px',\n      cursor: 'pointer',\n      fontSize: '13px',\n      fontWeight: '600',\n    },\n    input: {\n      padding: '10px',\n      borderRadius: '6px',\n      border: `1px solid ${colors.border}`,\n      fontSize: '13px',\n      width: '100%',\n      boxSizing: 'border-box',\n      marginBottom: '10px',\n    },\n  };\n\n  const recipes = {\n    'Grilled Chicken & Broccoli': {\n      ingredients: ['Chicken Breast', 'Broccoli', 'Olive Oil', 'Salt', 'Pepper'],\n      steps: ['Preheat grill to 400°F', 'Season chicken with salt and pepper', 'Grill 6-7 minutes per side', 'Steam broccoli 5 minutes', 'Serve together'],\n      substitutions: ['Chicken → Turkey breast', 'Broccoli → Asparagus'],\n    },\n    'Pasta Carbonara': {\n      ingredients: ['Pasta', 'Eggs', 'Bacon', 'Parmesan', 'Black Pepper'],\n      steps: ['Cook pasta al dente', 'Fry bacon until crispy', 'Mix eggs with grated Parmesan', 'Combine pasta with bacon and egg mixture', 'Season with black pepper'],\n      substitutions: ['Bacon → Pancetta', 'Parmesan → Pecorino Romano'],\n    },\n  };\n\n  return (\n    \u003cdiv style={sharedStyles.container}>\n      \u003cdiv style={sharedStyles.header}>🥗 FridgeWeek\u003c/div>\n\n      {currentScreen === 'inventory' && (\n        \u003cdiv style={sharedStyles.mainContent}>\n          \u003ch2 style={sharedStyles.sectionTitle}>Your Fridge & Pantry\u003c/h2>\n          \u003cdiv style={{ marginBottom: '15px' }}>\n            \u003cinput\n              type=\"text\"\n              style={sharedStyles.input}\n              placeholder=\"Add item (e.g., Milk, Eggs, Spinach)\"\n              value={newItem}\n              onChange={(e) => setNewItem(e.target.value)}\n            />\n            \u003cbutton\n              style={sharedStyles.button}\n              onClick={() => {\n                if (newItem.trim()) {\n                  setInventory([...inventory, { id: Math.random(), name: newItem, daysLeft: 7 }]);\n                  setNewItem('');\n                }\n              }}\n            >\n              + Add Item\n            \u003c/button>\n          \u003c/div>\n          {inventory.map((item) => (\n            \u003cdiv key={item.id} style={sharedStyles.card}>\n              \u003cdiv style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>\n                \u003cdiv>\n                  \u003cdiv style={{ fontWeight: '600' }}>{item.name}\u003c/div>\n                  \u003cdiv style={{ fontSize: '12px', color: colors.lightText }}>Good for {item.daysLeft} days\u003c/div>\n                \u003c/div>\n                \u003cbutton\n                  style={{ ...sharedStyles.button, backgroundColor: '#e74c3c', padding: '6px 10px', fontSize: '12px' }}\n                  onClick={() => setInventory(inventory.filter((i) => i.id !== item.id))}\n                >\n                  Remove\n                \u003c/button>\n              \u003c/div>\n            \u003c/div>\n          ))}\n        \u003c/div>\n      )}\n\n      {currentScreen === 'plan' && (\n        \u003cdiv style={sharedStyles.mainContent}>\n          \u003ch2 style={sharedStyles.sectionTitle}>7-Day Meal Plan\u003c/h2>\n          {mealPlan.map((day, idx) => (\n            \u003cdiv key={idx} style={sharedStyles.card}>\n              \u003cdiv style={{ fontWeight: '600', marginBottom: '5px' }}>{day.day}\u003c/div>\n              \u003cdiv style={{ marginBottom: '10px' }}>{day.meal}\u003c/div>\n              \u003cdiv style={{ display: 'flex', gap: '10px' }}>\n                \u003cbutton\n                  style={{\n                    ...sharedStyles.button,\n                    flex: 1,\n                    backgroundColor: day.status === 'cooked' ? colors.secondary : colors.primary,\n                  }}\n                  onClick={() => {\n                    const newPlan = [...mealPlan];\n                    newPlan[idx].status = newPlan[idx].status === 'cooked' ? 'pending' : 'cooked';\n                    setMealPlan(newPlan);\n                  }}\n                >\n                  {day.status === 'cooked' ? '✓ Cooked' : 'Mark Cooked'}\n                \u003c/button>\n                \u003cbutton\n                  style={{ ...sharedStyles.button, flex: 1 }}\n                  onClick={() => setSelectedRecipe(day.meal)}\n                >\n                  View Recipe\n                \u003c/button>\n              \u003c/div>\n            \u003c/div>\n          ))}\n        \u003c/div>\n      )}\n\n      {currentScreen === 'recipe' && selectedRecipe && (\n        \u003cdiv style={sharedStyles.mainContent}>\n          \u003cbutton style={{ ...sharedStyles.button, marginBottom: '15px' }} onClick={() => setSelectedRecipe(null)}>\n            ← Back to Plan\n          \u003c/button>\n          \u003ch2 style={sharedStyles.sectionTitle}>{selectedRecipe}\u003c/h2>\n          {recipes[selectedRecipe] && (\n            \u003cdiv>\n              \u003cdiv style={sharedStyles.card}>\n                \u003cdiv style={{ fontWeight: '600', marginBottom: '8px' }}>Ingredients:\u003c/div>\n                {recipes[selectedRecipe].ingredients.map((ing, i) => (\n                  \u003cdiv key={i} style={{ fontSize: '13px', marginBottom: '4px' }}>\n                    • {ing}\n                  \u003c/div>\n                ))}\n              \u003c/div>\n              \u003cdiv style={sharedStyles.card}>\n                \u003cdiv style={{ fontWeight: '600', marginBottom: '8px' }}>Steps:\u003c/div>\n                {recipes[selectedRecipe].steps.map((step, i) => (\n                  \u003cdiv key={i} style={{ fontSize: '13px', marginBottom: '4px' }}>\n                    {i + 1}. {step}\n                  \u003c/div>\n                ))}\n              \u003c/div>\n              \u003cdiv style={sharedStyles.card}>\n                \u003cdiv style={{ fontWeight: '600', marginBottom: '8px' }}>Substitutions:\u003c/div>\n                {recipes[selectedRecipe].substitutions.map((sub, i) => (\n                  \u003cdiv key={i} style={{ fontSize: '13px', marginBottom: '4px' }}>\n                    • {sub}\n                  \u003c/div>\n                ))}\n              \u003c/div>\n            \u003c/div>\n          )}\n        \u003c/div>\n      )}\n\n      {currentScreen === 'shopping' && (\n        \u003cdiv style={sharedStyles.mainContent}>\n          \u003ch2 style={sharedStyles.sectionTitle}>Shopping List\u003c/h2>\n          \u003cbutton style={{ ...sharedStyles.button, marginBottom: '15px', width: '100%' }}>📋 Copy to Clipboard\u003c/button>\n          {shoppingList.map((item, i) => (\n            \u003cdiv key={i} style={sharedStyles.card}>\n              \u003cdiv style={{ fontWeight: '600' }}>{item.item}\u003c/div>\n              \u003cdiv style={{ fontSize: '12px', color: colors.lightText }}>\n                Quantity: {item.quantity} • For: {item.reason}\n              \u003c/div>\n              \u003cinput type=\"checkbox\" style={{ marginTop: '8px' }} />\n              \u003clabel style={{ fontSize: '12px', marginLeft: '5px' }}>Purchased\u003c/label>\n            \u003c/div>\n          ))}\n        \u003c/div>\n      )}\n\n      {currentScreen === 'settings' && (\n        \u003cdiv style={sharedStyles.mainContent}>\n          \u003ch2 style={sharedStyles.sectionTitle}>Settings & Preferences\u003c/h2>\n          \u003cdiv style={sharedStyles.card}>\n            \u003clabel style={{ display: 'block', fontWeight: '600', marginBottom: '8px' }}>Dietary Restrictions:\u003c/label>\n            \u003cselect\n              style={sharedStyles.input}\n              value={preferences.dietaryRestrictions}\n              onChange={(e) => setPreferences({ ...preferences, dietaryRestrictions: e.target.value })}\n            >\n              \u003coption>None\u003c/option>\n              \u003coption>Vegetarian\u003c/option>\n              \u003coption>Vegan\u003c/option>\n              \u003coption>Gluten-Free\u003c/option>\n              \u003coption>Dairy-Free\u003c/option>\n            \u003c/select>\n          \u003c/div>\n          \u003cdiv style={sharedStyles.card}>\n            \u003clabel style={{ display: 'block', fontWeight: '600', marginBottom: '8px' }}>Household Size:\u003c/label>\n            \u003cinput\n              type=\"number\"\n              style={sharedStyles.input}\n              value={preferences.householdSize}\n              onChange={(e) => setPreferences({ ...preferences, householdSize: parseInt(e.target.value) })}\n              min=\"1\"\n              max=\"10\"\n            />\n          \u003c/div>\n          \u003cdiv style={sharedStyles.card}>\n            \u003clabel style={{ display: 'block', fontWeight: '600', marginBottom: '8px' }}>Cooking Time:\u003c/label>\n            \u003cselect\n              style={sharedStyles.input}\n              value={preferences.cookingTime}\n              onChange={(e) => setPreferences({ ...preferences, cookingTime: e.target.value })}\n            >\n              \u003coption>Quick (under 20 min)\u003c/option>\n              \u003coption>Medium (30-45 min)\u003c/option>\n              \u003coption>Detailed (1+ hours)\u003c/option>\n            \u003c/select>\n          \u003c/div>\n          \u003cbutton style={{ ...sharedStyles.button, width: '100%', marginTop: '15px' }}>Save Preferences\u003c/button>\n        \u003c/div>\n      )}\n\n      \u003cdiv style={sharedStyles.navBar}>\n        {['inventory', 'plan', 'shopping', 'settings'].map((screen, i) => (\n          \u003cbutton\n            key={screen}\n            style={sharedStyles.navButton(currentScreen === screen)}\n            onClick={() => {\n              setSelectedRecipe(null);\n              setCurrentScreen(screen);\n            }}\n          >\n            {screen === 'inventory' && '🥦 Inventory'}\n            {screen === 'plan' && '📅 Meal Plan'}\n            {screen === 'shopping' && '🛒 Shopping'}\n            {screen === 'settings' && '⚙️ Settings'}\n          \u003c/button>\n        ))}\n      \u003c/div>\n    \u003c/div>\n  );\n}\n"},{"label":"O","ideaId":4,"idea":"An app that plans a week of meals around what's already in the fridge.","code":"import React, { useState } from \"react\";\n\nexport default function App() {\n  const colors = {\n    primary: \"#3FA66C\",\n    primaryDark: \"#2C7A4B\",\n    bg: \"#FAF8F3\",\n    card: \"#FFFFFF\",\n    text: \"#26312B\",\n    sub: \"#7A8580\",\n    accent: \"#F2A354\",\n    border: \"#E4E0D5\",\n  };\n  const cardStyle = { background: colors.card, borderRadius: 12, padding: 16, marginBottom: 12, border: `1px solid ${colors.border}` };\n  const btn = (bg, color = \"#fff\") => ({ background: bg, color, border: \"none\", borderRadius: 8, padding: \"8px 14px\", fontWeight: 600, cursor: \"pointer\", fontSize: 14 });\n  const input = { padding: \"8px 10px\", borderRadius: 8, border: `1px solid ${colors.border}`, fontSize: 14, flex: 1 };\n  const label = { fontSize: 13, color: colors.sub, marginBottom: 4, display: \"block\" };\n\n  const [screen, setScreen] = useState(\"fridge\");\n  const [items, setItems] = useState([\n    { name: \"Eggs\", qty: \"6 ct\" },\n    { name: \"Spinach\", qty: \"1 bag\" },\n    { name: \"Chicken breast\", qty: \"1.5 lb\" },\n    { name: \"Bell peppers\", qty: \"3\" },\n    { name: \"Milk\", qty: \"half gal\" },\n  ]);\n  const [newItem, setNewItem] = useState(\"\");\n\n  const [plan, setPlan] = useState([\n    { day: \"Monday\", meal: \"Lemon Garlic Chicken & Spinach\", cooked: false },\n    { day: \"Tuesday\", meal: \"Veggie Stir-Fry with Rice\", cooked: false },\n    { day: \"Wednesday\", meal: \"Spinach & Feta Omelette\", cooked: false },\n    { day: \"Thursday\", meal: \"Chicken Fajita Bowls\", cooked: false },\n    { day: \"Friday\", meal: \"Pasta Primavera\", cooked: false },\n    { day: \"Saturday\", meal: \"Leftover Remix Bowl\", cooked: false },\n    { day: \"Sunday\", meal: \"Sheet-Pan Salmon & Veggies\", cooked: false },\n  ]);\n  const swaps = [\"Black Bean Tacos\", \"Pesto Chickpea Pasta\", \"Sheet-Pan Sausage & Peppers\"];\n\n  const recipes = {\n    \"Lemon Garlic Chicken & Spinach\": {\n      time: \"30 min\",\n      ingredients: [\"Chicken breast (1.5 lb)\", \"Spinach (2 cups)\", \"Garlic (3 cloves)\", \"Lemon (1)\", \"Olive oil\"],\n      steps: [\"Season and sear chicken 6 min per side.\", \"Add garlic, cook 1 min.\", \"Wilt in spinach and lemon juice.\", \"Rest 3 min, slice, serve.\"],\n      subs: \"No spinach? Use kale or chard instead.\",\n    },\n    \"Sheet-Pan Salmon & Veggies\": {\n      time: \"25 min\",\n      ingredients: [\"Salmon fillets (2)\", \"Bell peppers (2)\", \"Zucchini (1)\", \"Olive oil\", \"Paprika\"],\n      steps: [\"Toss veggies in oil, roast 10 min at 425°F.\", \"Add salmon, roast 12 more min.\", \"Squeeze lemon and serve.\"],\n      subs: \"Swap salmon for cod or tofu.\",\n    },\n  };\n  const [recipeName, setRecipeName] = useState(\"Lemon Garlic Chicken & Spinach\");\n  const recipe = recipes[recipeName] || { time: \"20 min\", ingredients: [\"Ingredients coming soon\"], steps: [\"Steps coming soon\"], subs: \"—\" };\n\n  const [shopping, setShopping] = useState([\n    { name: \"Salmon fillets\", qty: \"2\", bought: false },\n    { name: \"Feta cheese\", qty: \"1 block\", bought: false },\n    { name: \"Brown rice\", qty: \"2 cups\", bought: false },\n    { name: \"Garlic\", qty: \"1 bulb\", bought: false },\n    { name: \"Lemons\", qty: \"3\", bought: false },\n  ]);\n\n  const [prefs, setPrefs] = useState({ vegetarian: false, glutenFree: false, dairyFree: false, household: 3, cookTime: \"30 min or less\" });\n\n  const tabs = [\n    [\"fridge\", \"Fridge\"],\n    [\"plan\", \"Weekly Plan\"],\n    [\"recipe\", \"Recipe\"],\n    [\"shopping\", \"Shopping\"],\n    [\"settings\", \"Settings\"],\n  ];\n\n  let content;\n  if (screen === \"fridge\") {\n    content = (\n      \u003cdiv>\n        \u003cdiv style={{ display: \"flex\", gap: 8, marginBottom: 16 }}>\n          \u003cinput style={input} placeholder=\"Add item, e.g. Broccoli\" value={newItem} onChange={(e) => setNewItem(e.target.value)} />\n          \u003cbutton style={btn(colors.primary)} onClick={() => { if (newItem.trim()) { setItems([...items, { name: newItem, qty: \"1\" }]); setNewItem(\"\"); } }}>Add\u003c/button>\n          \u003cbutton style={btn(colors.accent)} onClick={() => alert(\"Camera scan simulated — item added!\")}>Scan\u003c/button>\n        \u003c/div>\n        {items.map((it, i) => (\n          \u003cdiv key={i} style={{ ...cardStyle, display: \"flex\", justifyContent: \"space-between\", alignItems: \"center\" }}>\n            \u003cdiv>\u003cstrong>{it.name}\u003c/strong>\u003cdiv style={{ color: colors.sub, fontSize: 13 }}>{it.qty}\u003c/div>\u003c/div>\n            \u003cbutton style={btn(\"#EEE\", colors.text)} onClick={() => setItems(items.filter((_, idx) => idx !== i))}>Remove\u003c/button>\n          \u003c/div>\n        ))}\n      \u003c/div>\n    );\n  } else if (screen === \"plan\") {\n    content = (\n      \u003cdiv>\n        \u003cdiv style={{ ...cardStyle, background: \"#EFF7EF\" }}>7-day plan ready! Only \u003cstrong>5 items\u003c/strong> needed from the store.\u003c/div>\n        {plan.map((p, i) => (\n          \u003cdiv key={i} style={cardStyle}>\n            \u003cdiv style={{ display: \"flex\", justifyContent: \"space-between\" }}>\n              \u003cdiv>\n                \u003cdiv style={{ color: colors.sub, fontSize: 12 }}>{p.day.toUpperCase()}\u003c/div>\n                \u003cdiv style={{ fontWeight: 700, cursor: \"pointer\" }} onClick={() => { setRecipeName(p.meal); setScreen(\"recipe\"); }}>{p.meal}\u003c/div>\n              \u003c/div>\n              \u003cdiv style={{ display: \"flex\", gap: 6, alignItems: \"center\" }}>\n                \u003cbutton style={btn(colors.accent)} onClick={() => {\n                  const alt = swaps[i % swaps.length];\n                  setPlan(plan.map((x, idx) => (idx === i ? { ...x, meal: alt } : x)));\n                }}>Swap\u003c/button>\n                \u003clabel style={{ fontSize: 13 }}>\n                  \u003cinput type=\"checkbox\" checked={p.cooked} onChange={() => setPlan(plan.map((x, idx) => (idx === i ? { ...x, cooked: !x.cooked } : x)))} /> Cooked\n                \u003c/label>\n              \u003c/div>\n            \u003c/div>\n          \u003c/div>\n        ))}\n      \u003c/div>\n    );\n  } else if (screen === \"recipe\") {\n    content = (\n      \u003cdiv>\n        \u003cselect style={{ ...input, marginBottom: 12 }} value={recipeName} onChange={(e) => setRecipeName(e.target.value)}>\n          {plan.map((p, i) => \u003coption key={i}>{p.meal}\u003c/option>)}\n        \u003c/select>\n        \u003cdiv style={cardStyle}>\n          \u003ch2 style={{ margin: \"0 0 4px\" }}>{recipeName}\u003c/h2>\n          \u003cdiv style={{ color: colors.sub, marginBottom: 12 }}>⏱ {recipe.time}\u003c/div>\n          \u003cstrong>Ingredients\u003c/strong>\n          \u003cul>{recipe.ingredients.map((ing, i) => \u003cli key={i}>{ing}\u003c/li>)}\u003c/ul>\n          \u003cstrong>Steps\u003c/strong>\n          \u003col>{recipe.steps.map((s, i) => \u003cli key={i}>{s}\u003c/li>)}\u003c/ol>\n          \u003cdiv style={{ background: \"#FFF3E4\", padding: 10, borderRadius: 8, marginTop: 10 }}>\u003cstrong>Substitution:\u003c/strong> {recipe.subs}\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    );\n  } else if (screen === \"shopping\") {\n    content = (\n      \u003cdiv>\n        \u003cdiv style={{ ...cardStyle, background: \"#EFF7EF\" }}>Consolidated from this week's plan — {shopping.length} items to buy.\u003c/div>\n        {shopping.map((s, i) => (\n          \u003cdiv key={i} style={{ ...cardStyle, display: \"flex\", justifyContent: \"space-between\", alignItems: \"center\", opacity: s.bought ? 0.5 : 1 }}>\n            \u003clabel style={{ display: \"flex\", gap: 10, alignItems: \"center\" }}>\n              \u003cinput type=\"checkbox\" checked={s.bought} onChange={() => setShopping(shopping.map((x, idx) => (idx === i ? { ...x, bought: !x.bought } : x)))} />\n              \u003cspan>\u003cstrong>{s.name}\u003c/strong> \u003cspan style={{ color: colors.sub }}>({s.qty})\u003c/span>\u003c/span>\n            \u003c/label>\n          \u003c/div>\n        ))}\n      \u003c/div>\n    );\n  } else {\n    content = (\n      \u003cdiv>\n        \u003cdiv style={cardStyle}>\n          \u003clabel style={label}>Dietary Restrictions\u003c/label>\n          {[\"vegetarian\", \"glutenFree\", \"dairyFree\"].map((k) => (\n            \u003clabel key={k} style={{ marginRight: 16 }}>\n              \u003cinput type=\"checkbox\" checked={prefs[k]} onChange={() => setPrefs({ ...prefs, [k]: !prefs[k] })} /> {k === \"glutenFree\" ? \"Gluten-Free\" : k === \"dairyFree\" ? \"Dairy-Free\" : \"Vegetarian\"}\n            \u003c/label>\n          ))}\n        \u003c/div>\n        \u003cdiv style={cardStyle}>\n          \u003clabel style={label}>Household Size\u003c/label>\n          \u003cinput style={input} type=\"number\" value={prefs.household} onChange={(e) => setPrefs({ ...prefs, household: e.target.value })} />\n        \u003c/div>\n        \u003cdiv style={cardStyle}>\n          \u003clabel style={label}>Cooking Time Preference\u003c/label>\n          \u003cselect style={input} value={prefs.cookTime} onChange={(e) => setPrefs({ ...prefs, cookTime: e.target.value })}>\n            \u003coption>15 min or less\u003c/option>\n            \u003coption>30 min or less\u003c/option>\n            \u003coption>No limit\u003c/option>\n          \u003c/select>\n        \u003c/div>\n      \u003c/div>\n    );\n  }\n\n  return (\n    \u003cdiv style={{ fontFamily: \"Helvetica, Arial, sans-serif\", background: colors.bg, minHeight: \"100vh\", color: colors.text }}>\n      \u003cdiv style={{ background: colors.primary, color: \"#fff\", padding: \"18px 20px\" }}>\n        \u003ch1 style={{ margin: 0, fontSize: 22 }}>🥕 FridgeWeek\u003c/h1>\n        \u003cdiv style={{ fontSize: 13, opacity: 0.9 }}>Eat well from what you've already got.\u003c/div>\n      \u003c/div>\n      \u003cdiv style={{ display: \"flex\", background: colors.card, borderBottom: `1px solid ${colors.border}`, overflowX: \"auto\" }}>\n        {tabs.map(([key, lbl]) => (\n          \u003cdiv key={key} onClick={() => setScreen(key)} style={{ padding: \"12px 16px\", cursor: \"pointer\", fontSize: 14, fontWeight: screen === key ? 700 : 400, color: screen === key ? colors.primaryDark : colors.sub, borderBottom: screen === key ? `3px solid ${colors.primary}` : \"3px solid transparent\" }}>\n            {lbl}\n          \u003c/div>\n        ))}\n      \u003c/div>\n      \u003cdiv style={{ maxWidth: 560, margin: \"0 auto\", padding: 20 }}>{content}\u003c/div>\n    \u003c/div>\n  );\n}\n"},{"label":"P","ideaId":4,"idea":"An app that plans a week of meals around what's already in the fridge.","code":"import React, { useState } from \"react\";\n\nconst colors = {\n  bg: \"#F4FBF4\",\n  primary: \"#2E7D32\",\n  primaryLight: \"#E8F5E9\",\n  accent: \"#FFA726\",\n  text: \"#1B3A1E\",\n  border: \"#C8E6C9\",\n  white: \"#FFFFFF\",\n};\n\nconst styles = {\n  app: { fontFamily: \"'Segoe UI', sans-serif\", background: colors.bg, minHeight: \"100vh\", color: colors.text, paddingBottom: 70, maxWidth: 480, margin: \"0 auto\" },\n  header: { background: colors.primary, color: colors.white, padding: \"18px 20px\", fontSize: 22, fontWeight: 700 },\n  section: { padding: 16 },\n  card: { background: colors.white, border: `1px solid ${colors.border}`, borderRadius: 10, padding: 12, marginBottom: 10 },\n  btn: { background: colors.primary, color: colors.white, border: \"none\", borderRadius: 8, padding: \"8px 14px\", fontWeight: 600, cursor: \"pointer\" },\n  btnOutline: { background: colors.white, color: colors.primary, border: `2px solid ${colors.primary}`, borderRadius: 8, padding: \"8px 14px\", fontWeight: 600, cursor: \"pointer\" },\n  input: { border: `1px solid ${colors.border}`, borderRadius: 8, padding: 8, fontSize: 14, width: \"100%\", boxSizing: \"border-box\" },\n  nav: { position: \"fixed\", bottom: 0, left: 0, right: 0, maxWidth: 480, margin: \"0 auto\", display: \"flex\", background: colors.white, borderTop: `1px solid ${colors.border}` },\n  navBtn: (active) => ({ flex: 1, padding: \"10px 4px\", textAlign: \"center\", background: active ? colors.primaryLight : colors.white, color: active ? colors.primary : \"#777\", fontSize: 11, fontWeight: 600, border: \"none\", cursor: \"pointer\" }),\n  chip: { display: \"inline-block\", background: colors.primaryLight, color: colors.primary, borderRadius: 20, padding: \"3px 10px\", fontSize: 12, marginRight: 6, marginBottom: 6 },\n};\n\nconst recipes = {\n  \"Lemon Garlic Chicken & Rice\": { ingredients: [\"Chicken breast (2)\", \"Rice (1 cup)\", \"Lemon\", \"Garlic\", \"Broccoli\"], steps: [\"Sear chicken 5 min/side\", \"Simmer rice 18 min\", \"Steam broccoli\", \"Toss with lemon-garlic sauce\"], sub: \"Swap chicken for tofu for a vegetarian version.\" },\n  \"Veggie Stir-Fry with Tofu\": { ingredients: [\"Tofu (1 block)\", \"Bell peppers\", \"Soy sauce\", \"Carrots\", \"Rice noodles\"], steps: [\"Press & cube tofu\", \"Stir-fry veggies 4 min\", \"Add tofu & sauce\", \"Toss with noodles\"], sub: \"Use chickpeas instead of tofu if preferred.\" },\n  \"Baked Salmon & Asparagus\": { ingredients: [\"Salmon fillets (2)\", \"Asparagus\", \"Olive oil\", \"Lemon\", \"Garlic\"], steps: [\"Preheat oven 400°F\", \"Season salmon & asparagus\", \"Bake 14 min\"], sub: \"Swap salmon for trout or chicken thighs.\" },\n  \"Black Bean Tacos\": { ingredients: [\"Black beans (1 can)\", \"Tortillas\", \"Cheddar cheese\", \"Salsa\", \"Avocado\"], steps: [\"Warm beans with spices\", \"Fill tortillas\", \"Top with cheese & salsa\"], sub: \"Add grilled chicken for extra protein.\" },\n  \"Pasta Primavera\": { ingredients: [\"Penne pasta\", \"Zucchini\", \"Cherry tomatoes\", \"Parmesan\", \"Olive oil\"], steps: [\"Boil pasta 10 min\", \"Sauté veggies\", \"Toss together with parmesan\"], sub: \"Use gluten-free pasta if needed.\" },\n};\n\nconst mealNames = Object.keys(recipes);\n\nexport default function App() {\n  const [screen, setScreen] = useState(\"Fridge\");\n  const [fridge, setFridge] = useState([\n    { id: 1, name: \"Chicken breast\", qty: \"2 pcs\" },\n    { id: 2, name: \"Rice\", qty: \"1 cup\" },\n    { id: 3, name: \"Broccoli\", qty: \"1 head\" },\n    { id: 4, name: \"Eggs\", qty: \"6\" },\n  ]);\n  const [newItem, setNewItem] = useState(\"\");\n  const [plan, setPlan] = useState([\n    { day: \"Monday\", meal: mealNames[0], cooked: false },\n    { day: \"Tuesday\", meal: mealNames[1], cooked: false },\n    { day: \"Wednesday\", meal: mealNames[2], cooked: false },\n    { day: \"Thursday\", meal: mealNames[3], cooked: false },\n    { day: \"Friday\", meal: mealNames[4], cooked: false },\n    { day: \"Saturday\", meal: mealNames[0], cooked: false },\n    { day: \"Sunday\", meal: mealNames[2], cooked: false },\n  ]);\n  const [selectedMeal, setSelectedMeal] = useState(mealNames[0]);\n  const [shopping, setShopping] = useState([\n    { name: \"Salmon fillets\", qty: \"2\", checked: false },\n    { name: \"Asparagus\", qty: \"1 bunch\", checked: false },\n    { name: \"Tofu\", qty: \"1 block\", checked: false },\n    { name: \"Cherry tomatoes\", qty: \"1 pint\", checked: false },\n  ]);\n  const [prefs, setPrefs] = useState({ diet: \"Vegetarian-friendly\", household: 2, cookTime: \"30 min or less\" });\n\n  const addFridgeItem = () => {\n    if (!newItem.trim()) return;\n    setFridge([...fridge, { id: Date.now(), name: newItem, qty: \"1\" }]);\n    setNewItem(\"\");\n  };\n  const removeFridgeItem = (id) => setFridge(fridge.filter((f) => f.id !== id));\n  const swapMeal = (i) => {\n    const next = [...plan];\n    const idx = mealNames.indexOf(next[i].meal);\n    next[i].meal = mealNames[(idx + 1) % mealNames.length];\n    setPlan(next);\n  };\n  const toggleCooked = (i) => {\n    const next = [...plan];\n    next[i].cooked = !next[i].cooked;\n    setPlan(next);\n  };\n  const toggleShop = (i) => {\n    const next = [...shopping];\n    next[i].checked = !next[i].checked;\n    setShopping(next);\n  };\n\n  const tabs = [\"Fridge\", \"Plan\", \"Recipe\", \"Shopping\", \"Settings\"];\n\n  return (\n    \u003cdiv style={styles.app}>\n      \u003cdiv style={styles.header}>🥬 FridgeWeek\u003c/div>\n      \u003cdiv style={styles.section}>\n        {screen === \"Fridge\" && (\n          \u003cdiv>\n            \u003ch3>Fridge & Pantry Inventory\u003c/h3>\n            \u003cdiv style={{ display: \"flex\", gap: 8, marginBottom: 12 }}>\n              \u003cinput style={styles.input} placeholder=\"Add item (e.g. Spinach)\" value={newItem} onChange={(e) => setNewItem(e.target.value)} />\n              \u003cbutton style={styles.btn} onClick={addFridgeItem}>Add\u003c/button>\n            \u003c/div>\n            \u003cbutton style={{ ...styles.btnOutline, marginBottom: 12 }} onClick={() => setFridge([...fridge, { id: Date.now(), name: \"Bell Pepper (scanned)\", qty: \"3\" }])}>📷 Scan Items\u003c/button>\n            {fridge.map((item) => (\n              \u003cdiv key={item.id} style={{ ...styles.card, display: \"flex\", justifyContent: \"space-between\" }}>\n                \u003cspan>{item.name} \u003cspan style={{ color: \"#888\" }}>({item.qty})\u003c/span>\u003c/span>\n                \u003cbutton style={{ ...styles.btnOutline, padding: \"2px 8px\" }} onClick={() => removeFridgeItem(item.id)}>✕\u003c/button>\n              \u003c/div>\n            ))}\n          \u003c/div>\n        )}\n        {screen === \"Plan\" && (\n          \u003cdiv>\n            \u003ch3>This Week's Meal Plan\u003c/h3>\n            \u003cp style={{ fontSize: 13, color: \"#555\" }}>2 items flagged — check Shopping List 🛒\u003c/p>\n            {plan.map((p, i) => (\n              \u003cdiv key={p.day} style={styles.card}>\n                \u003cdiv style={{ display: \"flex\", justifyContent: \"space-between\", fontWeight: 700 }}>\n                  \u003cspan>{p.day}\u003c/span>\n                  \u003cspan>{p.cooked ? \"✅ Cooked\" : \"\"}\u003c/span>\n                \u003c/div>\n                \u003cdiv onClick={() => { setSelectedMeal(p.meal); setScreen(\"Recipe\"); }} style={{ color: colors.primary, cursor: \"pointer\", margin: \"4px 0\" }}>{p.meal}\u003c/div>\n                \u003cdiv style={{ display: \"flex\", gap: 8 }}>\n                  \u003cbutton style={styles.btnOutline} onClick={() => swapMeal(i)}>🔄 Swap\u003c/button>\n                  \u003cbutton style={styles.btn} onClick={() => toggleCooked(i)}>{p.cooked ? \"Undo\" : \"Mark Cooked\"}\u003c/button>\n                \u003c/div>\n              \u003c/div>\n            ))}\n          \u003c/div>\n        )}\n        {screen === \"Recipe\" && (\n          \u003cdiv>\n            \u003ch3>Recipe Detail\u003c/h3>\n            \u003cselect style={styles.input} value={selectedMeal} onChange={(e) => setSelectedMeal(e.target.value)}>\n              {mealNames.map((m) => \u003coption key={m}>{m}\u003c/option>)}\n            \u003c/select>\n            \u003cdiv style={{ ...styles.card, marginTop: 12 }}>\n              \u003ch4>{selectedMeal}\u003c/h4>\n              \u003cb>Ingredients\u003c/b>\n              {recipes[selectedMeal].ingredients.map((i) => \u003cdiv key={i} style={styles.chip}>{i}\u003c/div>)}\n              \u003cb style={{ display: \"block\", marginTop: 10 }}>Steps\u003c/b>\n              \u003col>{recipes[selectedMeal].steps.map((s, idx) => \u003cli key={idx} style={{ marginBottom: 4 }}>{s}\u003c/li>)}\u003c/ol>\n              \u003cb>Substitution Tip\u003c/b>\n              \u003cp style={{ fontSize: 13, color: \"#555\" }}>{recipes[selectedMeal].sub}\u003c/p>\n            \u003c/div>\n          \u003c/div>\n        )}\n        {screen === \"Shopping\" && (\n          \u003cdiv>\n            \u003ch3>Shopping List\u003c/h3>\n            \u003cp style={{ fontSize: 13, color: \"#555\" }}>Consolidated from this week's plan\u003c/p>\n            {shopping.map((s, i) => (\n              \u003cdiv key={s.name} style={{ ...styles.card, display: \"flex\", alignItems: \"center\", gap: 10 }}>\n                \u003cinput type=\"checkbox\" checked={s.checked} onChange={() => toggleShop(i)} />\n                \u003cspan style={{ textDecoration: s.checked ? \"line-through\" : \"none\", flex: 1 }}>{s.name}\u003c/span>\n                \u003cspan style={{ color: \"#888\" }}>{s.qty}\u003c/span>\n              \u003c/div>\n            ))}\n          \u003c/div>\n        )}\n        {screen === \"Settings\" && (\n          \u003cdiv>\n            \u003ch3>Settings & Preferences\u003c/h3>\n            \u003cdiv style={styles.card}>\n              \u003clabel>Dietary Restrictions\u003c/label>\n              \u003cselect style={styles.input} value={prefs.diet} onChange={(e) => setPrefs({ ...prefs, diet: e.target.value })}>\n                \u003coption>None\u003c/option>\u003coption>Vegetarian-friendly\u003c/option>\u003coption>Gluten-free\u003c/option>\u003coption>Dairy-free\u003c/option>\n              \u003c/select>\n            \u003c/div>\n            \u003cdiv style={styles.card}>\n              \u003clabel>Household Size\u003c/label>\n              \u003cinput type=\"number\" style={styles.input} value={prefs.household} onChange={(e) => setPrefs({ ...prefs, household: e.target.value })} />\n            \u003c/div>\n            \u003cdiv style={styles.card}>\n              \u003clabel>Cooking Time Preference\u003c/label>\n              \u003cselect style={styles.input} value={prefs.cookTime} onChange={(e) => setPrefs({ ...prefs, cookTime: e.target.value })}>\n                \u003coption>15 min or less\u003c/option>\u003coption>30 min or less\u003c/option>\u003coption>No limit\u003c/option>\n              \u003c/select>\n            \u003c/div>\n          \u003c/div>\n        )}\n      \u003c/div>\n      \u003cdiv style={styles.nav}>\n        {tabs.map((t) => (\n          \u003cbutton key={t} style={styles.navBtn(screen === t)} onClick={() => setScreen(t)}>{t}\u003c/button>\n        ))}\n      \u003c/div>\n    \u003c/div>\n  );\n}\n"},{"label":"Q","ideaId":5,"idea":"A tool for splitting shared trip expenses without a spreadsheet.","code":"import { useState } from 'react';\n\nexport default function App() {\n  const [screen, setScreen] = useState('dashboard');\n  const [trips, setTrips] = useState([\n    { id: 1, name: 'Vegas Weekend', participants: ['Alex', 'Jordan', 'Sam'], expenses: [\n      { id: 1, description: 'Hotel', amount: 300, paidBy: 'Alex', splitBetween: ['Alex', 'Jordan', 'Sam'] },\n      { id: 2, description: 'Dinner', amount: 120, paidBy: 'Jordan', splitBetween: ['Alex', 'Jordan', 'Sam'] }\n    ], settled: {} },\n    { id: 2, name: 'Beach Trip', participants: ['Casey', 'Morgan'], expenses: [\n      { id: 1, description: 'Gas', amount: 50, paidBy: 'Casey', splitBetween: ['Casey', 'Morgan'] }\n    ], settled: {} }\n  ]);\n  const [currentTripId, setCurrentTripId] = useState(1);\n  const [newTripName, setNewTripName] = useState('');\n  const [newParticipant, setNewParticipant] = useState('');\n  const [expenseDesc, setExpenseDesc] = useState('');\n  const [expenseAmount, setExpenseAmount] = useState('');\n  const [expensePaidBy, setExpensePaidBy] = useState('');\n  const [expenseSplitBetween, setExpenseSplitBetween] = useState([]);\n\n  const colors = { primary: '#0066cc', success: '#28a745', danger: '#dc3545', light: '#f8f9fa', border: '#e0e0e0', text: '#333' };\n  const spacing = { xs: 8, sm: 12, md: 16, lg: 24, xl: 32 };\n\n  const baseButton = {\n    padding: `${spacing.sm}px ${spacing.md}px`,\n    border: 'none',\n    borderRadius: 6,\n    cursor: 'pointer',\n    fontSize: 14,\n    fontWeight: 600,\n  };\n\n  const getCurrentTrip = () => trips.find(t => t.id === currentTripId);\n  \n  const calculateBalances = (trip) => {\n    const balances = {};\n    trip.participants.forEach(p => balances[p] = 0);\n    trip.expenses.forEach(exp => {\n      const amountPerPerson = exp.amount / exp.splitBetween.length;\n      balances[exp.paidBy] += exp.amount;\n      exp.splitBetween.forEach(person => {\n        balances[person] -= amountPerPerson;\n      });\n    });\n    return balances;\n  };\n\n  const handleAddExpense = () => {\n    if (!expenseDesc || !expenseAmount || !expensePaidBy || expenseSplitBetween.length === 0) return;\n    const trip = getCurrentTrip();\n    const newExpense = {\n      id: Math.max(...trip.expenses.map(e => e.id), 0) + 1,\n      description: expenseDesc,\n      amount: parseFloat(expenseAmount),\n      paidBy: expensePaidBy,\n      splitBetween: expenseSplitBetween\n    };\n    setTrips(trips.map(t => t.id === currentTripId ? { ...t, expenses: [...t.expenses, newExpense] } : t));\n    setExpenseDesc('');\n    setExpenseAmount('');\n    setExpensePaidBy('');\n    setExpenseSplitBetween([]);\n  };\n\n  const handleAddTrip = () => {\n    if (!newTripName) return;\n    const newTrip = { id: Math.max(...trips.map(t => t.id), 0) + 1, name: newTripName, participants: [], expenses: [], settled: {} };\n    setTrips([...trips, newTrip]);\n    setCurrentTripId(newTrip.id);\n    setNewTripName('');\n    setScreen('trip-detail');\n  };\n\n  const handleAddParticipant = () => {\n    if (!newParticipant) return;\n    setTrips(trips.map(t => t.id === currentTripId && !t.participants.includes(newParticipant) ? { ...t, participants: [...t.participants, newParticipant] } : t));\n    setNewParticipant('');\n  };\n\n  const handleSettleDebt = (from, to) => {\n    const trip = getCurrentTrip();\n    const key = `${from}-${to}`;\n    setTrips(trips.map(t => t.id === currentTripId ? { ...t, settled: { ...t.settled, [key]: !t.settled[key] } } : t));\n  };\n\n  return (\n    \u003cdiv style={{ fontFamily: 'system-ui, -apple-system, sans-serif', minHeight: '100vh', backgroundColor: colors.light }}>\n      {/* Header */}\n      \u003cdiv style={{ backgroundColor: 'white', borderBottom: `1px solid ${colors.border}`, padding: spacing.md }}>\n        \u003ch1 style={{ margin: 0, color: colors.primary, fontSize: 24 }}>TripTally\u003c/h1>\n      \u003c/div>\n\n      {/* Navigation */}\n      \u003cdiv style={{ display: 'flex', gap: spacing.sm, padding: spacing.md, backgroundColor: 'white', borderBottom: `1px solid ${colors.border}` }}>\n        {['dashboard', 'trip-setup'].map(s => (\n          \u003cbutton key={s} onClick={() => setScreen(s)} style={{ ...baseButton, backgroundColor: screen === s ? colors.primary : colors.light, color: screen === s ? 'white' : colors.text }}>\n            {s === 'dashboard' ? 'Trips' : 'New Trip'}\n          \u003c/button>\n        ))}\n      \u003c/div>\n\n      \u003cdiv style={{ padding: spacing.lg, maxWidth: 1200, margin: '0 auto' }}>\n        {/* Dashboard Screen */}\n        {screen === 'dashboard' && (\n          \u003cdiv>\n            \u003ch2 style={{ color: colors.text, marginBottom: spacing.md }}>Your Trips\u003c/h2>\n            {trips.map(trip => {\n              const balances = calculateBalances(trip);\n              return (\n                \u003cdiv key={trip.id} onClick={() => { setCurrentTripId(trip.id); setScreen('trip-detail'); }} style={{ backgroundColor: 'white', padding: spacing.md, marginBottom: spacing.md, borderRadius: 8, border: `1px solid ${colors.border}`, cursor: 'pointer' }}>\n                  \u003ch3 style={{ margin: '0 0 8px 0', color: colors.text }}>{trip.name}\u003c/h3>\n                  \u003cp style={{ margin: 0, fontSize: 12, color: '#666' }}>{trip.participants.length} people • {trip.expenses.length} expenses\u003c/p>\n                  \u003cp style={{ margin: '8px 0 0 0', fontSize: 12, color: colors.primary }}>Balance: {Object.values(balances).reduce((a, b) => a + b, 0).toFixed(2)}\u003c/p>\n                \u003c/div>\n              );\n            })}\n          \u003c/div>\n        )}\n\n        {/* Trip Setup Screen */}\n        {screen === 'trip-setup' && (\n          \u003cdiv style={{ maxWidth: 500 }}>\n            \u003ch2 style={{ color: colors.text, marginBottom: spacing.md }}>Create a New Trip\u003c/h2>\n            \u003cinput type=\"text\" placeholder=\"Trip name\" value={newTripName} onChange={e => setNewTripName(e.target.value)} style={{ width: '100%', padding: spacing.sm, marginBottom: spacing.md, border: `1px solid ${colors.border}`, borderRadius: 6, boxSizing: 'border-box' }} />\n            \u003cbutton onClick={handleAddTrip} style={{ ...baseButton, backgroundColor: colors.primary, color: 'white', width: '100%' }}>Create Trip\u003c/button>\n          \u003c/div>\n        )}\n\n        {/* Trip Detail Screen */}\n        {screen === 'trip-detail' && getCurrentTrip() && (\n          \u003cdiv>\n            \u003ch2 style={{ color: colors.text, marginBottom: spacing.md }}>{getCurrentTrip().name}\u003c/h2>\n            \n            \u003cdiv style={{ marginBottom: spacing.lg }}>\n              \u003ch3 style={{ color: colors.text, marginBottom: spacing.sm }}>Participants\u003c/h3>\n              \u003cdiv style={{ display: 'flex', gap: spacing.sm, marginBottom: spacing.md }}>\n                \u003cinput type=\"text\" placeholder=\"Add participant\" value={newParticipant} onChange={e => setNewParticipant(e.target.value)} style={{ flex: 1, padding: spacing.sm, border: `1px solid ${colors.border}`, borderRadius: 6 }} />\n                \u003cbutton onClick={handleAddParticipant} style={{ ...baseButton, backgroundColor: colors.primary, color: 'white' }}>Add\u003c/button>\n              \u003c/div>\n              {getCurrentTrip().participants.map(p => \u003cspan key={p} style={{ display: 'inline-block', backgroundColor: colors.light, padding: `4px ${spacing.sm}px`, marginRight: spacing.sm, borderRadius: 4, fontSize: 12 }}>{p}\u003c/span>)}\n            \u003c/div>\n\n            \u003cdiv style={{ marginBottom: spacing.lg }}>\n              \u003ch3 style={{ color: colors.text, marginBottom: spacing.sm }}>Quick Actions\u003c/h3>\n              \u003cbutton onClick={() => setScreen('add-expense')} style={{ ...baseButton, backgroundColor: colors.primary, color: 'white', marginRight: spacing.sm }}>Add Expense\u003c/button>\n              \u003cbutton onClick={() => setScreen('settle-up')} style={{ ...baseButton, backgroundColor: colors.success, color: 'white' }}>Settle Up\u003c/button>\n            \u003c/div>\n\n            \u003cdiv>\n              \u003ch3 style={{ color: colors.text, marginBottom: spacing.sm }}>Expenses\u003c/h3>\n              {getCurrentTrip().expenses.map(exp => (\n                \u003cdiv key={exp.id} style={{ backgroundColor: 'white', padding: spacing.md, marginBottom: spacing.sm, borderRadius: 6, border: `1px solid ${colors.border}` }}>\n                  \u003cdiv style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>\n                    \u003cdiv>\n                      \u003cp style={{ margin: 0, color: colors.text, fontWeight: 600 }}>{exp.description}\u003c/p>\n                      \u003cp style={{ margin: '4px 0 0 0', fontSize: 12, color: '#666' }}>{exp.paidBy} paid • Split with {exp.splitBetween.length} people\u003c/p>\n                    \u003c/div>\n                    \u003cp style={{ margin: 0, fontSize: 18, fon
